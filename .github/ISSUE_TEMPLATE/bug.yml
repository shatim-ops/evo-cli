name: Ошибка evo
description: Команда или инструмент MCP сработали не так, как ожидалось.
title: "[bug] "
labels: ["отзыв", "ошибка"]
body:
  - type: markdown
    attributes:
      value: |
        Репозиторий публичный. Перед отправкой замените в выводе ID проектов, ВМ и ресурсов, IP-адреса, Key ID, имена ваших ресурсов и доменов на `<uuid>`, `<ip>`, `<имя>`. Ключи и секреты не вставляйте никогда.
  - type: input
    id: version
    attributes:
      label: Версия
      description: Вывод `evo version` (первая строка).
      placeholder: Cloud.ru Evolution CLI CREW edition (evo) 1.0.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Как запускали
      options:
        - CLI в терминале
        - MCP через AI-агента (Claude Code, Cursor и др.)
        - MCP в Cloud.ru AI Agents
        - Docker-образ
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Команда или запрос агенту
      description: Что именно запускали.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
      description: Вывод и код выхода (`echo $?`). Для MCP — ответ инструмента. ID и IP замените.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: evo doctor
      description: Вывод `evo doctor`. ID проекта и Key ID замените.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка
      options:
        - label: В тексте нет ключей, секретов, реальных ID, IP и имён ресурсов
          required: true
