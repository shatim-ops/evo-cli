name: Ошибка CLI
description: Команда или инструмент MCP сработали не так, как ожидалось, или облако повело себя странно.
title: "[bug] "
labels: ["отзыв", "ошибка"]
body:
  - type: markdown
    attributes:
      value: |
        Репозиторий публичный. Перед отправкой замените в выводе ID проектов, ВМ и ресурсов, IP-адреса, Key ID, имена ваших ресурсов и доменов на `<uuid>`, `<ip>`, `<имя>`. Ключи и секреты не вставляйте никогда. Одна проблема — одно issue; если такое уже есть — комментарий к нему.
  - type: input
    id: version
    attributes:
      label: Версия
      description: Вывод `evo version` (первая строка).
      placeholder: Cloud.ru Evolution CLI CREW edition (evo) 1.2.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: ОС
      options:
        - "macOS"
        - "Windows"
        - "Linux"
        - "Windows + WSL"
        - "Docker-образ evo"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Окружение
      description: Оболочка, сеть (корпоративный прокси или нет), для MCP — клиент и модель.
      placeholder: zsh; корпоративный прокси; Cursor + Claude Sonnet
  - type: dropdown
    id: surface
    attributes:
      label: Как запускали
      options:
        - CLI в терминале
        - MCP через AI-агента (Claude Code, Cursor и др.)
        - MCP в Cloud.ru AI Agents
        - Docker-образ
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      description: Раздел протокола догфуда (docs/internal/dogfood-protocol.md).
      options:
        - "Установка, configure, doctor"
        - "Развёртывание compose (deploy, status, logs, destroy)"
        - "ВМ и диски"
        - "Образы и Marketplace"
        - "Сеть: VPC, группы безопасности, floating IP, SNAT"
        - "Балансировщик NLB"
        - "DNS"
        - "Kubernetes"
        - "PostgreSQL"
        - "Kafka и Redis"
        - "Object Storage (S3)"
        - "Секреты и сертификаты"
        - "Container Apps и Artifact Registry"
        - "Мониторинг, биллинг, аудит, IAM"
        - "Стеки stack_*"
        - "MCP-агент (Cursor, Claude Code и др.)"
        - "Другое"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Где, по-вашему, проблема
      description: «Платформа» — если ошибку вернул API Cloud.ru или так же ведёт себя консоль.
      options:
        - В CLI
        - В платформе Cloud.ru
        - Не знаю
    validations:
      required: true
  - type: dropdown
    id: money
    attributes:
      label: Ресурсы и деньги
      description: Осталось ли в облаке что-то платное из-за этой ошибки. Проверьте `evo vm list`, `evo vpc fips`, `evo disk list`.
      options:
        - Ничего лишнего не создано
        - Создан лишний ресурс (дубль)
        - Ресурс остался после удаления или ошибки
        - Не знаю
    validations:
      required: true
  - type: dropdown
    id: repro
    attributes:
      label: Повторяется
      options:
        - Всегда
        - Иногда
        - Один раз
        - Не проверял
  - type: textarea
    id: command
    attributes:
      label: Команда или запрос агенту
      description: Что именно запускали или о чём просили агента.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло
      description: Вывод и код выхода (`echo $?`). Для MCP — ответ инструмента. ID и IP замените.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: evo doctor
      description: Вывод `evo doctor` (для CLI — обязательно). ID проекта замените.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка
      options:
        - label: В тексте нет ключей, секретов, реальных ID, IP и имён ресурсов
          required: true
