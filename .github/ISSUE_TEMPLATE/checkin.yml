name: "Чек-ин"
description: "Первый день, неделя, итог волны — 3 минуты. Не ошибка и не идея — для них свои формы."
title: "[чек-ин] "
# Только «отзыв»: форма не ставит метку, которой нет в репозитории, — остальные
# ставит по полям .github/scripts/issue_labels.py (workflow issue-labels).
labels: ["отзыв"]
body:
  - type: markdown
    attributes:
      value: |
        Первый чек-ин — в день получения ключа, после ядра (С0). Дальше — по пятницам и в конце волны. На чек-ин не отвечают: из них собираются покрытие, расход и уборка волны. Ошибку отсюда заведите отдельно формой «Ошибка» и дайте ссылку.

        Репозиторий публичный. Замените в тексте ID проектов, ВМ и ресурсов, IP-адреса, Key ID, имена хостов и ресурсов на `<проект>`, `<id ВМ>`, `<IP>`, `<имя>`. Ключи, секреты, токены и пароли не вставляйте никогда. Имена коллег, внутренние ссылки и номера заявок — тоже не сюда.

        Уязвимость — обход согласия, утечка секрета, доступ к чужому проекту — не сюда, а приватным отчётом: **Security → Report a vulnerability** ([SECURITY.md](https://github.com/shatim-ops/evo-cli/blob/main/SECURITY.md)). Похоже на платформу Cloud.ru, а не на evo, — отметьте это и опишите только то, что сделал evo.
  - type: dropdown
    id: wave
    attributes:
      label: Волна
      options:
        - "Догфуд 1.6"
    validations:
      required: true
  - type: dropdown
    id: period
    attributes:
      label: Период
      options:
        - "Первый день"
        - "Неделя"
        - "Итог волны"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: "Первая строка `evo version`."
      placeholder: "evo CMCP 1.6.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: ОС
      options:
        - "macOS"
        - "Windows"
        - "Linux"
        - "Windows + WSL"
        - "Docker-образ evo"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Окружение
      description: "Оболочка, сеть (корпоративный прокси или нет), клиент агента и модель."
      placeholder: "PowerShell; без прокси; Claude Code + Opus"
    validations:
      required: true
  - type: dropdown
    id: skills
    attributes:
      label: Скиллы
      options:
        - "Со скиллами"
        - "Только карточки"
        - "Только CLI"
    validations:
      required: true
  - type: dropdown
    id: sees-skills
    attributes:
      label: Видит ли агент evo-* и карточки
      options:
        - "Да"
        - "Нет"
        - "Не проверял"
        - "— (не первый день или без агента)"
    validations:
      required: true
  - type: input
    id: scenarios
    attributes:
      label: Сценарии за период
      placeholder: "С0, С1, С3"
    validations:
      required: true
  - type: input
    id: core_minutes
    attributes:
      label: Минут от скачивания до evo vm list
      description: "Только «Первый день»."
    validations:
      required: false
  - type: input
    id: spend
    attributes:
      label: Расход за период, ₽
      description: "`evo billing consumption`, поле `total_with_nds`."
    validations:
      required: true
  - type: dropdown
    id: leftovers
    attributes:
      label: Остались ли ресурсы
      options:
        - "Нет, всё убрано"
        - "Да, удаляю"
        - "Да, не удаляются (ссылка на issue «Ошибка»)"
        - "Не знаю"
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Оценка evo за период
      options:
        - "5"
        - "4"
        - "3"
        - "2"
        - "1"
    validations:
      required: true
  - type: input
    id: rating-why
    attributes:
      label: Одна фраза к оценке
    validations:
      required: false
  - type: dropdown
    id: continue
    attributes:
      label: Дальше
      options:
        - "Продолжу"
        - "Не продолжу"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка
      options:
        - label: В тексте нет ключей, секретов, реальных ID, IP и имён ресурсов
          required: true
