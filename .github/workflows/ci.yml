name: ci

# Один прогон на изменение: PR и push в main (аудит процессов 1.2.1, PR 3).
# Push в ветку PR раньше давал два прогона — по push и по pull_request.
# Ветку без PR CI не проверяет: открывайте PR (черновик — тоже PR).
on:
  push:
    # Тег гоняет этот же workflow через release.yml, второй прогон не нужен.
    branches: [main]
  pull_request:
  # Вызывается из release.yml перед сборкой релиза.
  workflow_call:
  # Ночью — полная матрица, Windows целиком: на pull request Windows гоняет
  # только пакеты с кодом Windows (go_test_ci.sh, windowsPRPackages; решение
  # владельца 29.10, аудит #578, п. 10).
  schedule:
    - cron: "23 1 * * *"
  # Вручную на ветке PR — полная матрица, Windows целиком, до слияния: PR
  # гоняет на Windows только пакеты с кодом Windows, и тесты, медленные на
  # Windows, краснели только на main (#789, #793). Запускает автор PR.
  workflow_dispatch:

# Новый push в PR отменяет его идущую проверку; main и релиз
# (workflow_call из release.yml) не отменяются никогда.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GITHUB_TOKEN только на чтение: сборке и тестам писать в репозиторий
# незачем, а код PR и зависимостей выполняется в этих job.
permissions:
  contents: read

jobs:
  # ОС матрицы test. PR, который меняет только docs/internal/*.md, — без
  # macOS (CLAUDE.md §4, решение владельца 03.11, #800): у GitHub не больше 5
  # macOS-задач одновременно, лишние снимаются без запуска, а PR плана и
  # решений — около половины потока. Решает classify.sh (строка macos=), как
  # и класс PR; push в main, ночь, выпуск и ручной запуск — полная матрица.
  # Здесь выполняется код PR, но решает он только матрицу своего же PR, и
  # main после слияния всё равно гоняет macOS.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # Нужна база PR, чтобы взять diff base...head.
          fetch-depth: 0
      # --no-renames: переименование кода в docs/internal/*.md — два пути,
      # старый не docs/internal, и macOS остаётся.
      - name: macOS нужен
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo macos=yes >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only "$BASE...HEAD" | .github/scripts/classify.sh | grep '^macos=' >> "$GITHUB_OUTPUT"

  # Обязательная проверка test (macos-latest) на PR без macOS: успех с
  # причиной, а не «ожидает» — ruleset main ждёт её по имени. Имя — только
  # когда job идёт: пропущенный, он не выдаёт себя за настоящий macOS.
  test-macos-skipped:
    needs: scope
    if: needs.scope.outputs.macos == 'no'
    name: ${{ needs.scope.outputs.macos == 'no' && 'test (macos-latest)' || 'macOS в матрице test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: macOS не нужен
        run: echo "PR меняет только docs/internal/*.md — macOS не запускается (CLAUDE.md §4); на main — полная матрица."

  test:
    needs: scope
    # Упал или не ответил scope — полная матрица, а не пропуск test:
    # пропущенная обязательная проверка считается пройденной.
    if: ${{ !cancelled() }}
    strategy:
      # Падение на одной ОС не должно скрывать результат остальных.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.macos == 'no' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    # Linux — ubuntu-24.04, не ubuntu-latest: на ubuntu-26.04 (ubuntu-latest
    # с 24.10.2026) evo_wrapper_test.sh упал 2 из 2 на теге v1.3.0-rc.2 при
    # зелёном том же коммите на ubuntu-24. Имя job прежнее — на него
    # ссылаются обязательные проверки. Переход — по итогу job
    # wrapper-ubuntu-latest ниже.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    steps:
      # Без этого checkout на Windows превращает LF в CRLF, и тесты, читающие
      # файлы из репозитория, видят не те байты, что на Linux.
      - name: git без перевода строк
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 1.26.11 закрывает GO-2026-6859 (net/http: MaxBytesReader, сбой
          # HTTP/1-сервера — сервер MCP по HTTP и loopback входа); 1.26.10 —
          # GO-2026-6809 (crypto/x509); 1.26.9 закрывал
          # GO-2026-6603/6605/6607/6608/6610 (net/http, crypto/tls,
          # net/textproto), 1.26.5 — GO-2026-5856 и GO-2026-4970. Ниже не
          # опускать без проверки govulncheck.
          go-version: "1.26.11"
          cache-dependency-path: go.sum

      - run: go build ./...
      - run: go vet ./...

      # Уборка правил «evo:» в cloud-e2e cleanup: только группы без ВМ
      # (e2e_rules_sweep.sh), на фейках evo и curl.
      - name: уборка правил evo в cloud-e2e
        if: runner.os == 'Linux'
        run: .github/scripts/e2e_rules_sweep_test.sh

      # Недельный cloud-e2e отменяет свои неодобренные прогоны и только их
      # (weekly_stale.sh), на заглушке gh.
      - name: отмена неодобренных недельных прогонов cloud-e2e
        if: runner.os == 'Linux'
        run: .github/scripts/weekly_stale_test.sh

      # Правило порта приложения в cloud-e2e e2e: провал, если deploy его не
      # открыл или оно было до deploy (e2e_port_rule.sh), на фейке evo.
      - name: правило порта deploy в cloud-e2e
        if: runner.os == 'Linux'
        run: .github/scripts/e2e_port_rule_test.sh

      # Проба фильтров списков 1.8.2 в api-probe (list_filter_probe.sh):
      # вердикты same / ignored / diff и ни одного id в выводе, на заглушке curl.
      - name: проба фильтров списков в api-probe
        if: runner.os == 'Linux'
        run: .github/scripts/list_filter_probe_test.sh

      # Форматирование от ОС не зависит — проверяем один раз. gofmt молча
      # ничего не возвращает, поэтому непустой вывод и есть провал.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "не отформатировано:"; echo "$unformatted"; exit 1
          fi

      # The race runtime sleeps 1 s at every test binary's exit
      # (atexit_sleep_ms=1000): with ~40 packages that is most of the wall time.
      # On main the tests run in a random order (the seed is in the log;
      # -shuffle=<seed> repeats it): a test that leans on another's state
      # is caught there, not in somebody's PR. PRs and the release keep the
      # fixed order (process audit 1.2.1, PR 4). The value is put in by
      # Actions, not the shell: Windows runs this step in PowerShell, where
      # "$SHUFFLE" is a PowerShell variable, empty (CI of #196).
      #
      # go_test_ci.sh (#370, вариант 1; #493): на Windows internal/tools идёт
      # один после остальных пакетов — сбой рантайма Go приходил только под
      # их нагрузкой (14 из 828 попыток, так — 0 из 300, #494); сбой
      # рантайма без падения теста — retry с упавшими пакетами и один шаг
      # повтора ниже, второй сбой — красный. Шаги повтора за неделю считает
      # weekly-race (go_runtime_crash_week.sh).
      # -timeout 20m: предел пакета задан явно. Умолчание go test — 10
      # минут — никто не выбирал, и 12.11 internal/cli на macOS под -race
      # дошёл до него: 323 с 11.11 → 588 с на зелёном main и 600,5 с
      # (panic: test timed out) на PR, менявшем только тексты (#1524).
      # Число — умолчание × 2: запас на рост до правки самих тестов (план
      # 1.9, «CI: main красный на Windows… и предел macOS», М1 и М2). Это
      # не лечение: время пакета растёт как «инструменты × миры».
      - id: gotest
        name: go test
        shell: bash
        run: .github/scripts/go_test_ci.sh go test -race -count=1 -timeout 20m -shuffle=${{ github.ref == 'refs/heads/main' && 'on' || 'off' }}
        env:
          GORACE: atexit_sleep_ms=0
      - name: "go test: повтор после сбоя рантайма Go"
        if: steps.gotest.outputs.retry != ''
        shell: bash
        run: |
          # shellcheck disable=SC2086 # the package list is split on purpose
          go test -race -count=1 -timeout 20m -shuffle=${{ github.ref == 'refs/heads/main' && 'on' || 'off' }} $RETRY
        env:
          GORACE: atexit_sleep_ms=0
          RETRY: ${{ steps.gotest.outputs.retry }}

      # Просрочка убывающих списков видна на каждом PR, а не раз в неделю
      # (решение владельца 13.11, #1590, вопрос 19; план 1.9, «Просроченные
      # убывающие списки»): строки TestMisses_HaveADeadline — в сводку
      # прогона и предупреждением. Красным просрочку делает недельный
      # прогон (weekly-misses.yml), этот шаг job не роняет. always(): красный
      # PR — тоже PR, сводка нужна и после упавших тестов.
      - name: Просроченные убывающие списки — в сводку
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          out=$(go test ./internal/testrules -run '^TestMisses_HaveADeadline$' -count=1 -v |
            grep -E 'were to be gone by|lists of misses:' | sed -E 's/^ *misses_test\.go:[0-9]+: //') || true
          {
            echo "### Убывающие списки"
            echo
            echo '```'
            echo "${out:-нет данных: TestMisses_HaveADeadline ничего не напечатал}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          overdue=$(printf '%s\n' "$out" | grep -c 'were to be gone by' || true)
          if [ "$overdue" -gt 0 ]; then
            echo "::warning title=Просроченные убывающие списки::списков с просроченными строками: $overdue — сводка прогона, шаг «Просроченные убывающие списки»"
          fi

      # Конфиг релиза проверяется на каждом PR, а не впервые на теге.
      # Бинарь — curl с повторами до 5 мин, а не goreleaser-action: её три
      # попытки скачать с GitHub releases кончались 504 и роняли job при
      # зелёных тестах (#952, #964, 05.11). Архив сверяется с sha256 из
      # checksums.txt релиза (TestWorkflows_GoreleaserCheckSurvivesReleasesOutage).
      - name: goreleaser check
        if: runner.os == 'Linux'
        env:
          # Та же версия, что в release.yml и dev-build; поднимать везде, с sha256
          # архива goreleaser_Linux_x86_64.tar.gz из checksums.txt релиза:
          # https://github.com/goreleaser/goreleaser/releases/download/v2.18.3/checksums.txt
          GORELEASER_VERSION: v2.18.3
          GORELEASER_SHA256: b8dee4728bca1aba0d71a832a17cd0a3799f75372878e7ffa36aef2343bce0bc
        run: |
          dir="$RUNNER_TEMP/goreleaser"
          mkdir -p "$dir"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 15 --retry-max-time 300 -o "$dir/goreleaser.tar.gz" \
            "https://github.com/goreleaser/goreleaser/releases/download/$GORELEASER_VERSION/goreleaser_Linux_x86_64.tar.gz"
          echo "$GORELEASER_SHA256  $dir/goreleaser.tar.gz" | sha256sum -c -
          tar -xzf "$dir/goreleaser.tar.gz" -C "$dir" goreleaser
          "$dir/goreleaser" check

      # Квота организации на образы в cloud-e2e disk (CMP-16): какой отказ
      # image_create — пропуск шага, а какой — FAIL (e2e_quota.sh).
      - name: квота образов cloud-e2e
        if: runner.os == 'Linux'
        run: .github/scripts/e2e_quota_test.sh

      # Удаление кластеров DBaaS cloud-e2e (dbaas-delete.sh) на поддельном evo:
      # ERASED — удалён, повтор — already_deleted, FAILED — сразу ошибка (D44).
      - name: dbaas-delete.sh на поддельном evo
        if: runner.os == 'Linux'
        run: timeout 300 .github/scripts/dbaas_delete_test.sh

      # Удаление кластера Kubernetes cloud-e2e (k8s-delete.sh): отказ —
      # повтор при смене состояния, остаток — поимённо; след кластера в
      # проекте (k8s-footprint.sh) — заключение «Риска» 189, У2, У3.
      - name: k8s-delete.sh и k8s-footprint.sh на поддельном evo
        if: runner.os == 'Linux'
        run: |
          timeout 120 .github/scripts/k8s_delete_test.sh
          timeout 120 .github/scripts/k8s_footprint_test.sh

      # Уборка cleanup_only рядом с живыми запусками (e2e_live_runs.sh) на
      # заглушке gh и поддельном evo: ресурсы незавершённого запуска не
      # удаляются; список запусков не прочитан — не удаляется ничего.
      - name: e2e_live_runs.sh на заглушке gh
        if: runner.os == 'Linux'
        run: timeout 120 .github/scripts/e2e_live_runs_test.sh

      # Автоповтор job без раннера (no_runner.sh, workflow no-runner) на
      # заглушке gh: повтор только первой попытки, только когда прочие исходы
      # — успех или пропуск, и только на актуальной голове PR.
      - name: no_runner.sh на заглушке gh
        if: runner.os == 'Linux'
        run: timeout 60 .github/scripts/no_runner_test.sh

      # Сторож «вне loopback» (offnet.sh, job offnet) на образце журнала
      # strace: адрес вне loopback из тестового бинарника — красный.
      - name: offnet.sh на образце strace
        if: runner.os == 'Linux'
        run: timeout 60 .github/scripts/offnet_test.sh

      # Пробы графика 1.9 (область ops cloud-live.sh) на поддельном evo и
      # заглушке curl: порядок запросов, отказ платформы, уборка своего вида.
      - name: область ops cloud-live.sh на заглушках
        if: runner.os == 'Linux'
        run: timeout 300 .github/scripts/cloud_live_ops_test.sh

      # Проба повтора создания пользователя и базы PostgreSQL
      # (pg-repeat-probe.sh) на заглушке curl: запись — только когда оба
      # есть, ответ платформы записан, шаг не падает, секретов в журнале нет.
      - name: pg-repeat-probe.sh на заглушке
        if: runner.os == 'Linux'
        run: timeout 60 .github/scripts/pg_repeat_probe_test.sh

      # D61 вживую (dbaas-passing-delete.sh) на поддельном evo: отказ USAGE —
      # 1 из 1, удаление принято — провал, кластер уже готов — не покрыто.
      - name: dbaas-passing-delete.sh на поддельном evo
        if: runner.os == 'Linux'
        run: timeout 60 .github/scripts/dbaas_passing_delete_test.sh

      # Ожидание готовности кластера DBaaS (dbaas-ready.sh) на поддельном
      # evo: при FAILED в логе причина — поля кластера и операция создания,
      # без ID и адресов (run 203).
      - name: dbaas-ready.sh на поддельном evo
        if: runner.os == 'Linux'
        run: timeout 60 .github/scripts/dbaas_ready_test.sh

      # Стенд (план 1.9, Г-50): list находит всё его содержимое и только
      # его; sweep отказывает без точного подтверждения, удаляет только
      # показанное и кончается пустым списком или перечнем остатков.
      - name: e2e_stand.sh на поддельном evo
        if: runner.os == 'Linux'
        run: timeout 60 .github/scripts/e2e_stand_test.sh

      # Проба P45 (pg-schedule-probe.sh) на поддельных evo и dbaas-delete.sh:
      # отказ — строка, принятый кластер удаляется, не удалён — код 1.
      - name: pg-schedule-probe.sh на поддельном evo
        if: runner.os == 'Linux'
        run: timeout 60 .github/scripts/pg_schedule_probe_test.sh

      # Проверка до прогона cloud-e2e (e2e-preflight.sh) на поддельном evo:
      # все причины — одним отчётом, остатки — строками, не провалом.
      - name: e2e-preflight.sh на поддельном evo
        if: runner.os == 'Linux'
        run: timeout 120 .github/scripts/e2e_preflight_test.sh

      # install.sh — установщик evo; internal/bootstrap/install.sh ставит Docker
      # на ВМ (release audit, REL-13); скрипты CI — .github/scripts.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh internal/bootstrap/install.sh .github/scripts/*.sh

      # Запись CHANGELOG каждого PR — фрагмент changelog.d/<тема>.md
      # (changelog.d/README.md); перед тегом релиз вливает их скриптом.
      - name: фрагменты CHANGELOG
        if: runner.os == 'Linux'
        run: |
          python3 scripts/changelog-test.py
          python3 scripts/changelog.py check

      # Журнал сессии (evo diag export, D46): diag-check.py на образцах —
      # схема записи, sha256 из issue, --public (догфуд 1.4.0).
      - name: diag-check.py на образцах журнала
        if: runner.os == 'Linux'
        run: python3 scripts/diag-check-test.py

      # Опись запросов живых проб (probe-requests.py) на спецификации из
      # теста: поля тела, enum, запрос, которого в спецификации нет.
      - name: probe-requests.py на образце спецификации
        if: runner.os == 'Linux'
        run: python3 scripts/probe-requests-test.py

      # Маска публичных логов cloud-e2e: имена групп и подсетей тестового проекта.
      - name: redact.sed на образцах вывода evo
        if: runner.os == 'Linux'
        run: .github/scripts/redact_test.sh

      # Храповик размера tools/list (tools-list.yml, #597, п. 12).
      - name: tools_list_growth.sh на образцах
        if: runner.os == 'Linux'
        run: .github/scripts/tools_list_growth_test.sh

      # Обёртка evo публичных логов cloud-e2e и api-probe (build_evo.sh):
      # stderr — через redact.sed, stdout, код выхода и Ctrl-C — как у evo.
      - name: обёртка evo с маской stderr
        if: runner.os == 'Linux'
        run: .github/scripts/evo_wrapper_test.sh

      # Форма ответа сервиса в публичном логе cloud-readonly (E5): JSON — ok,
      # иное — warn, тело через redact.sed, без URL.
      - name: response_shape.sh на локальном сервере
        if: runner.os == 'Linux'
        run: .github/scripts/response_shape_test.sh

      # Форма ответа калькулятора в публичном логе api-probe (P50): ключи и
      # единицы без цен, тело не JSON — одной строкой.
      - name: json_shape.sh на образцах
        if: runner.os == 'Linux'
        run: .github/scripts/json_shape_test.sh

      # deploy с обрывом посреди этапа на ВМ (cloud-e2e, job e2e, D69):
      # обрыв — 130, этап жив, повтор без «прервался на ВМ».
      - name: deploy_cut.sh с заглушками evo и ssh
        if: runner.os == 'Linux'
        run: timeout 180 .github/scripts/deploy_cut_test.sh

      # k8s_helm по MCP (cloud-e2e, job k8s-smoke, D69): deploying, затем
      # status deployed, каждый сеанс в пределе; режим pods — поды Ready.
      - name: k8s_helm_mcp.sh с заглушкой evo mcp
        if: runner.os == 'Linux'
        run: timeout 120 .github/scripts/k8s_helm_mcp_test.sh

      # Диагностика SSH cloud-e2e (e2e, область disk): адрес, floating IP,
      # правило TCP/22, ответ порта — без адресов и id в выводе.
      - name: ssh_diag.sh с заглушкой evo
        if: runner.os == 'Linux'
        run: timeout 120 .github/scripts/ssh_diag_test.sh

      # Клиент evo mcp по stdio (k8s_helm_mcp.sh, area_mcp): следование
      # next_tool до ответа не в работе, обрыв сеанса по пределу.
      - name: mcp_stdio.sh с заглушкой evo mcp
        if: runner.os == 'Linux'
        run: timeout 120 .github/scripts/mcp_stdio_test.sh

      # Отказ Foundation Models в ревью Qwen: на 401/403/404 — строка без
      # тела ответа (комментарий публичный, E7).
      - name: fm_error.sh на образцах ответов
        if: runner.os == 'Linux'
        run: .github/scripts/fm_error_test.sh

      # Начало ревью Qwen: нет refs/pull/N/head — голова PR по sha; git не
      # получил её — комментарий в PR, а не молчаливый красный job (#412).
      - name: qwen-review.sh — получение PR
        if: runner.os == 'Linux'
        run: .github/scripts/qwen_review_fetch_test.sh

      # На каких PR ревью Qwen приходит само (#485, П1 (б)): продуктовый PR и
      # PR, который меняет .github/; /qwen review — на любом.
      - name: qwen-review.sh — какие PR ревьюит
        if: runner.os == 'Linux'
        run: .github/scripts/qwen_review_scope_test.sh

      # Сбой рантайма Go на Windows (#493): сигнатуры случаев CI узнаются,
      # падение теста и стек через internal/config — нет.
      - name: go_runtime_crash.sh на образцах вывода go test
        if: runner.os == 'Linux'
        run: .github/scripts/go_runtime_crash_test.sh

      # Шаг go test (#370): split на Windows, повтор только сбоя рантайма,
      # счёт повторов за неделю — на поддельных go и gh.
      - name: go_test_ci.sh и go_runtime_crash_week.sh на поддельных go и gh
        if: runner.os == 'Linux'
        run: |
          .github/scripts/go_test_ci_test.sh
          .github/scripts/go_runtime_crash_week_test.sh

      # Проверка заголовка PR (pr-title.yml) на образцах заголовков.
      - name: pr_title.sh на образцах заголовков
        if: runner.os == 'Linux'
        run: .github/scripts/pr_title_test.sh

      # Итог readonly «удаление несуществующего»: FAIL — только дефект evo.
      - name: delete_absent_verdict.sh на образцах ответов
        if: runner.os == 'Linux'
        run: .github/scripts/delete_absent_verdict_test.sh

      # Класс PR по путям и чек-лист: таблицы скрипта на образцах путей.
      - name: classify.sh на образцах путей
        if: runner.os == 'Linux'
        run: .github/scripts/classify_test.sh

      # Шаг 6 RELEASING: передача до следующего слияния — скрипт на
      # временном репозитории.
      - name: handoff_check.sh на временном репозитории
        if: runner.os == 'Linux'
        run: .github/scripts/handoff_check_test.sh

      # Стресс замка этапа на ВМ (vmstage, #769, #777): одновременные
      # старты под нагрузкой всех CPU. Отдельным шагом после go test, а не
      # внутри него: нагрузка в go test ./... отнимала бы CPU у тестов с
      # таймингами соседних пакетов.
      - name: "go test: стресс замка этапа под нагрузкой"
        if: runner.os == 'Linux'
        run: go test -race -count=1 -run '^TestStage_ManyAtOnceNoneLostNoneUnread$' ./internal/vmstage/
        env:
          EVO_STAGE_STRESS: "1"
          GORACE: atexit_sleep_ms=0

      # Tab в zsh после install.sh (#718, T5–T6): _evo в site-functions,
      # один блок в ~/.zshrc, привязка после второго compinit — на
      # настоящем zsh macOS, временном HOME и локальном выпуске, без сети.
      - name: install.sh и Tab в zsh
        if: runner.os == 'macOS'
        run: .github/scripts/install_zsh_test.sh

      # Сигнал «main красный» (main-red.yml): красный прогон заводит или
      # дописывает issue, зелёный закрывает — на поддельном gh.
      - name: main_red.sh на поддельном gh
        if: runner.os == 'Linux'
        run: .github/scripts/main_red_test.sh

      # Автозакрытие issue «main красный» (вариант Б, план 1.9, строка «CI»):
      # main-red сравнивает красный и зелёный коммит в неглубоком checkout
      # без учётных данных и добирает коммиты по sha. Здесь то же самое на
      # раннере, на двух настоящих эпизодах ночи 12–13.11: #1576 — тест
      # прошёл сам (файл не менялся), #1579 — закрыт правкой файла теста.
      - name: main_red.sh — сравнение коммитов на раннере
        if: runner.os == 'Linux'
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          dir=$(mktemp -d)
          git clone --quiet --depth 1 "$REPO_URL" "$dir"
          t=TestDeploy_InProgressLeavesTheRecordUnfinished
          f=internal/tools/deploy_unfinished_invariant_test.go
          got=$(REPO_DIR="$dir" .github/scripts/main_red.sh changed 09475cd1fb9fb4b455cb6f140322b61a1e6c806e f63d297a5cbb036e785f447a4c112ada92c856ef "$t")
          [ "$got" = "same $f" ] || { echo "::error::эпизод #1576: «$got», ждём «same $f»"; exit 1; }
          got=$(REPO_DIR="$dir" .github/scripts/main_red.sh changed 3b4f18b749fe90a9d1a32d059e28955dbf9d3304 0f426bfa2c29af20489566f4b8f885332b49fadc "$t")
          [ "$got" = "changed $f" ] || { echo "::error::эпизод #1579: «$got», ждём «changed $f»"; exit 1; }

      # Обход открытых PR (pr-stuck.yml): PR с конфликтом и job без раннера
      # получают строку один раз на голову — на поддельном gh.
      - name: pr_stuck.sh на поддельном gh
        if: runner.os == 'Linux'
        run: .github/scripts/pr_stuck_test.sh

      # Помощник пробы P49 (api-probe): ./... не обходит каталоги на точку.
      - name: pricecard (api-probe P49)
        if: runner.os == 'Linux'
        run: go vet ./.github/scripts/pricecard && go test ./.github/scripts/pricecard

      # Метки отзывов по полям форм Issues: таблицы скрипта совпадают с формами.
      - name: issue_labels.py на образцах форм
        if: runner.os == 'Linux'
        run: .github/scripts/issue_labels_test.sh

      # Не для галочки. 12.08.2026 здесь нашлись пять достижимых уязвимостей в
      # x/crypto/ssh — тем самым коде, которым движок ходит на ВМ, включая обход
      # физического подтверждения FIDO/U2F. Все пришли обновлением зависимости,
      # а не правкой кода: поймать такое можно только регулярным прогоном.
      # Версия зафиксирована, чтобы новый релиз сканера не ломал CI внезапно;
      # поднимать вручную. Граф зависимостей один на все ОС — гоняем на Linux.
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Версия зафиксирована, как у govulncheck; поднимать вручную.
      - name: staticcheck
        if: runner.os == 'Linux'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      # Workflow: синтаксис, выражения ${{ }}, права и shellcheck каждого
      # скрипта run (shellcheck на раннере уже есть). Версия зафиксирована;
      # поднимать вручную (аудит процессов 1.2.1, PR 7).
      - name: actionlint
        if: runner.os == 'Linux'
        env:
          # SC2015 (info): «[ -n "$A" ] && [ -n "$B" ] || { echo …; exit 1; }»
          # — проверка входов во всех workflow, где ветка «или» и должна
          # срабатывать, когда любая проверка ложна. shellcheck 0.10 раннера
          # помечает её, 0.11 — нет; прочие проверки shellcheck действуют.
          SHELLCHECK_OPTS: --exclude=SC2015
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

      # Функции, недостижимые из main: deadcode печатает их и выходит с 0,
      # поэтому провал — непустой вывод. Сейчас таких нет (§2 CLAUDE.md:
      # без мёртвого кода). Пакеты-серверы тестовых миров (их импортируют
      # только тесты) — из scripts/fake-servers.json, того же перечня, что
      # у api-contract-check.py; -test не берём: он скрыл бы продуктовый
      # код, который вызывают только тесты.
      - name: deadcode
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.38.0
          fake="^($(jq -r 'del(._comment) | keys | map(. + "/") | join("|")' scripts/fake-servers.json))"
          dead="$("$(go env GOPATH)/bin/deadcode" ./... | grep -Ev "$fake" || true)"
          if [ -n "$dead" ]; then echo "недостижимый код:"; echo "$dead"; exit 1; fi

  # Сторож «тест не открывает соединений вне loopback» (строка плана 1.9 о
  # TestDeployApply_DeployKeySSHUnchanged: тест ждал «порт не ответил» от
  # 203.0.113.12:22 и падал в сети, где этот адрес принимает TCP; в CI был
  # зелёным, потому что адрес не маршрутизируется). Полный go test под
  # strace записывает каждый connect тестовых бинарников; offnet.sh
  # краснеет на адресе вне loopback (кроме OFFNET_ALLOW). Ночью и вручную:
  # на каждом PR удвоил бы время Linux-job; красная ночь доходит до issue
  # (main-red). Секретов нет, токен — только чтение.
  offnet:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      # Modules and strace before the trace: their downloads are no test's.
      - run: go mod download && go build ./... && go vet ./...
      - name: strace
        run: command -v strace >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q strace; }
      - name: go test под strace, соединения вне loopback
        run: |
          log="$RUNNER_TEMP/connect.log"
          rc=0
          strace -f --seccomp-bpf --decode-pids=comm -e trace=connect -o "$log" go test -count=1 ./... || rc=$?
          # A failed test is the test job's; this job judges the trace.
          [ "$rc" = 0 ] || echo "::warning::go test под strace: код $rc — журнал соединений разобран всё равно"
          .github/scripts/offnet.sh "$log"

  # Сборка из main для живых прогонов (строка плана B-5, #1000): goreleaser
  # snapshot после зелёных тестов, архивы шести платформ и checksums.txt —
  # артефактом на 7 дней, в имени -dev и короткий sha. Ночью и вручную на
  # main, не на каждый push: сборка — 87 МБ, слияний в main — до ~100 в
  # день (#1005, вариант А). Не выпуск: ни тега, ни релиза, ни подписи;
  # секретов нет, токен — только чтение (TestWorkflows_DevBuildIsNoRelease).
  dev-build:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Версию snapshot goreleaser берёт от последнего тега.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - name: goreleaser snapshot
        id: build
        env:
          # Те же версия и sha256, что у goreleaser check (job test).
          GORELEASER_VERSION: v2.18.3
          GORELEASER_SHA256: b8dee4728bca1aba0d71a832a17cd0a3799f75372878e7ffa36aef2343bce0bc
        run: |
          dir="$RUNNER_TEMP/goreleaser"
          mkdir -p "$dir"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 15 --retry-max-time 300 -o "$dir/goreleaser.tar.gz" \
            "https://github.com/goreleaser/goreleaser/releases/download/$GORELEASER_VERSION/goreleaser_Linux_x86_64.tar.gz"
          echo "$GORELEASER_SHA256  $dir/goreleaser.tar.gz" | sha256sum -c -
          tar -xzf "$dir/goreleaser.tar.gz" -C "$dir" goreleaser
          "$dir/goreleaser" release --snapshot --clean --skip=sign,sbom
          echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evo-dev-${{ steps.build.outputs.short }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
          if-no-files-found: error

  # Проба ubuntu-latest (с 24.10.2026 — ubuntu-26.04, другие coreutils):
  # обёртка evo, Ctrl-C через timeout -s INT. Прогон не роняет и не красит:
  # итог — ::notice в summary, по нему решают о переходе job test
  # (TestWorkflows_CILinuxImageIsPinned). Красного по замыслу нет
  # (TestWorkflows_NoRedByDesign): красный job — всегда сбой, который
  # разбирают.
  wrapper-ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: какие timeout и sed
        run: |
          timeout --version | head -1
          sed --version | head -1
          readlink -f "$(command -v timeout)"
      - name: обёртка evo с маской stderr
        run: |
          if .github/scripts/evo_wrapper_test.sh; then
            echo "::notice title=ubuntu-latest::обёртка evo проходит на $(lsb_release -ds 2>/dev/null || echo ubuntu-latest) — job test можно переводить"
          else
            echo "::notice title=ubuntu-latest::обёртка evo не проходит на $(lsb_release -ds 2>/dev/null || echo ubuntu-latest) — job test остаётся на ubuntu-24.04"
          fi

  # Класс изменения PR по путям и чек-лист проверок сверх CI в summary
  # прогона (аудит процессов 1.2.1, П5 и PR 8): политика, секреты,
  # транспорт, ломающее и области cloud-e2e до и после слияния (В5).
  # Ничего не блокирует и ничего не пишет в PR: меток нет, потому что право
  # записи в job, где лежит код PR, давать нельзя.
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Нужна база PR, чтобы взять diff base...head.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum

      # Точнее путей — то, что видит агент: tools/list сервера evo mcp на
      # базе и на голове PR (аудит процессов 1.2.1, этап 6.5).
      - name: классы по diff реестра
        id: registry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add -q "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && go build -o "$RUNNER_TEMP/evo-base" ./cmd/evo)
          go build -o "$RUNNER_TEMP/evo-head" ./cmd/evo
          .github/scripts/tools_list.sh "$RUNNER_TEMP/evo-base" > "$RUNNER_TEMP/base.json"
          .github/scripts/tools_list.sh "$RUNNER_TEMP/evo-head" > "$RUNNER_TEMP/head.json"
          echo "classes=$(.github/scripts/classify_registry.sh "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # SHA базы — не текст события, но идёт через env, как всё из события.
      # Ломающее — новый заголовок «### Миграция» в CHANGELOG.md или во
      # фрагменте changelog.d/, а не слово в тексте пункта.
      - name: классы по путям
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          REGISTRY: ${{ steps.registry.outputs.classes }}
        run: |
          MIGRATION=0
          if git diff "$BASE...HEAD" -- CHANGELOG.md changelog.d/ | grep -q '^+### Миграция'; then MIGRATION=1; fi
          git diff --name-only "$BASE...HEAD" | MIGRATION=$MIGRATION .github/scripts/classify.sh |
            .github/scripts/classify_summary.sh >> "$GITHUB_STEP_SUMMARY"

  # Шаг 6 docs/RELEASING.md: после тега до передачи дел
  # (handoff/<версия>.md) PR в main не сливается; релизный PR (новый раздел
  # выпуска в CHANGELOG.md) проходит. Ретро 1.4.1: три PR слиты до передачи.
  # Окно — 24 часа после тега (#578): тег приходит с fetch-depth: 0.
  handoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # CHANGELOG.md базы PR — из её коммита.
          fetch-depth: 0
      - name: передача последней версии есть
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/handoff_check.sh "$BASE"

  # Образ MCP-сервера для Marketplace: сборка и smoke-тест по HTTP. Кредов
  # Cloud.ru не нужно: initialize и tools/list в облако не ходят.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false

      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e < Dockerfile

      - name: docker build
        run: docker build -t evo:ci --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" .

      - name: без MCP_BEARER_TOKEN не стартует
        run: |
          set +e
          docker run --rm evo:ci
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then echo "ожидали код 2, получили $code"; exit 1; fi

      - name: smoke-тест по HTTP
        run: |
          docker run -d --name mcp -e MCP_BEARER_TOKEN=ci-token-0123456789abcdef0123456789abcdef -p 8080:8080 evo:ci
          # Второй — с --read-only (H11): смоук проверяет его отказ.
          docker run -d --name mcp-ro -e MCP_BEARER_TOKEN=ci-token-0123456789abcdef0123456789abcdef -p 8081:8080 evo:ci mcp --http :8080 --read-only
          # Тот же скрипт вызывает release.yml (релизный аудит, R-01).
          MCP_SMOKE_READONLY=http://localhost:8081 .github/scripts/mcp-smoke.sh http://localhost:8080 ci-token-0123456789abcdef0123456789abcdef

          # HEALTHCHECK образа — тем же бинарём, без shell и curl.
          docker exec mcp /usr/local/bin/evo mcp healthcheck

      - name: логи контейнера
        if: always()
        run: docker logs mcp || true; docker logs mcp-ro || true
