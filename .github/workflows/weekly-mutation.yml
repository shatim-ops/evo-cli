name: weekly-mutation

# Мутационная проверка инвариантов раз в неделю (план 1.6, решение
# владельца 29.10, #578): каждая строка .github/mutations.tsv ломает одно
# место продуктового кода — строку гейта, поле превью, ветку правила — и
# названный тест должен покраснеть. Выжившая мутация значит, что инвариант
# её не видит: issue (weekly-issue.yml), разбор — строкой бэклога «Процесса».
# Мутации живут только в дереве job, в репозиторий не попадают.
# Время — UTC, воскресенье 05:17 по Москве.

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  mutate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Та же версия, что в ci.yml; поднимать вместе.
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - run: .github/scripts/mutate.sh .github/mutations.tsv

  report:
    needs: mutate
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/weekly-issue.yml
    with:
      title: "weekly-mutation: инвариант не видит мутацию"
      what: "Мутация из .github/mutations.tsv выжила (тест зелёный) или негодна (не применилась, не собирается). Какая — в сводке job. Выжившая — строка бэклога «Процесса» с инвариантом, который её поймает."
