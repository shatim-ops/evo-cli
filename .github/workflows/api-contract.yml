name: api-contract

# Сверка запросов evo с официальными спецификациями API Cloud.ru
# (docs/internal/api-contract.md §6). Без ключей облака и без ресурсов:
# скачивает текущие спецификации со страниц справочников cloud.ru/docs и
# проверяет опись запросов scripts/api-contract.json — пути, обязательные
# параметры, максимумы, читаемые поля. Падает на error, не помеченном
# accepted. Спецификации в репозиторий не кладутся (материалы Cloud.ru).

on:
  schedule:
    - cron: "17 6 * * 1" # понедельник, 06:17 UTC
  workflow_dispatch:
  # После слияния — та же сверка, что в PR: в PR медленный сайт документации
  # её пропускает, а кэш, сохранённый на main, читают все PR (кэш PR виден
  # только ему самому). Пути — те же, что у pull_request.
  push:
    branches: [main]
    paths:
      - "scripts/api-contract*"
      - "scripts/cloudru-specs.py"
      - "scripts/cloudru-specs-test.py"
      # Сверка покрытия читает весь internal/**/*.go: новый запрос в любом
      # пакете без записи в описи валит проверку.
      - "internal/**/*.go"
  pull_request:
    paths:
      - "scripts/api-contract*"
      - "scripts/cloudru-specs.py"
      - "scripts/cloudru-specs-test.py"
      # Сверка покрытия читает весь internal/**/*.go: новый запрос в любом
      # пакете без записи в описи валит проверку.
      - "internal/**/*.go"

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Зависимости
        run: python3 -m pip install --quiet pyyaml

      # Повторы загрузки — без сети, на фейке сайта.
      - name: Тесты загрузки спецификаций
        run: python3 scripts/cloudru-specs-test.py

      # Без спецификаций: каждый путь API из internal/**/*.go есть в описи.
      # Идёт до скачивания, чтобы не пропускаться, когда cloud.ru/docs
      # недоступен.
      - name: Опись покрывает код
        run: |
          python3 scripts/api-contract-check.py --code-only > "$RUNNER_TEMP/coverage.txt" || status=$?
          grep -v '^\[ok' "$RUNNER_TEMP/coverage.txt" || true
          exit "${status:-0}"

      # В PR и на main спецификации берутся из кэша на сутки: сайт
      # документации медленный и сбоит, и каждый push в PR качал их заново
      # 4–12 минут. Изменения на стороне Cloud.ru ловит запуск по расписанию
      # (и ручной): он кэш не читает и всегда качает свежие.
      - name: День для кэша спецификаций
        id: day
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Восстановление и сохранение — отдельные шаги: actions/cache
      # сохранял и неполный каталог после неудачной загрузки, и до конца дня
      # каждый PR падал на spec-missing (#230, 22.10). Сохраняется только
      # полная загрузка (шаг «Сохранить кэш спецификаций»). v2 в ключе
      # отбрасывает кэш, сохранённый до этой правки.
      - name: Кэш спецификаций (PR и main)
        id: cache
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cloudru-specs
          key: cloudru-specs-v2-${{ hashFiles('scripts/cloudru-specs.py') }}-${{ steps.day.outputs.day }}

      - name: Спецификации Cloud.ru
        id: specs
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # Мягкое правило PR и main: не скачалось — сверка пропущена с
          # предупреждением и строкой в summary, а не красный job.
          SOFT: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        run: |
          # Сайт документации иногда рвёт соединение: скрипт сам повторяет
          # только недостающие сервисы (ROUNDS). Срок загрузки — 10 минут,
          # меньше срока job: в PR и на main медленный сайт даёт «сверка пропущена»,
          # а не отмену job (#245, #217).
          status=0
          timeout 600 python3 scripts/cloudru-specs.py .cache/cloudru-specs || status=$?
          if [ "$status" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 124 ]; then
            echo "::warning::загрузка спецификаций не уложилась в 10 минут"
          fi
          if [ "$SOFT" = true ]; then
            echo "::warning::не удалось скачать все спецификации с cloud.ru/docs — сверка пропущена"
            echo "**Сверка контракта пропущена:** спецификации с cloud.ru/docs не скачались. Следующая — на следующем слиянии в main или по расписанию." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::не удалось скачать спецификации: изменились адреса на cloud.ru/docs? (scripts/cloudru-specs.py, START_PAGES)"
          exit 1

      - name: Сохранить кэш спецификаций
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && steps.specs.outputs.complete == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cloudru-specs
          key: cloudru-specs-v2-${{ hashFiles('scripts/cloudru-specs.py') }}-${{ steps.day.outputs.day }}

      - name: Сверка контракта
        if: steps.specs.outputs.skip != 'true'
        run: |
          python3 scripts/api-contract-check.py --specs .cache/cloudru-specs --markdown >> "$GITHUB_STEP_SUMMARY" || status=$?
          python3 scripts/api-contract-check.py --specs .cache/cloudru-specs | tail -n 30
          echo "### Хэши спецификаций" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.specs[] | "- \(.service)/\(.file | split("/") | last): `\(.sha256[0:16])`"' .cache/cloudru-specs/manifest.json >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
