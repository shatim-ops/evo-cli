name: main-red

# Красный push-прогон ci на main — в issue, а не в тишину (бэклог
# «Процесса» 1.7, #796): на PR Windows гоняет только пакеты с кодом Windows
# (#578, п. 10), и main был красным 6 прогонов из 6 после #769, пока это не
# заметили вручную (#789, #793). Одно открытое issue «main красный: <workflow>» —
# красный прогон его заводит или дописывает (job и строки «--- FAIL»),
# зелёный закрывает. Ночная полная матрица ci и ночные чтения cloud-e2e
# (schedule; ручные запуски cloud-e2e не отслеживаются) — так же; так же и
# ежедневное чтение стенда (stand, план 1.9, Г-50): стенд за сроком —
# красный запуск по расписанию, и адресат у него должен быть. Красный ci
# сверх issue оставляет строку в каждом открытом PR в main (М5 строки «CI»
# плана 1.9: 12.11 issue шесть часов никто не читал). Код PR
# здесь не выполняется: workflow_run идёт на ветке по умолчанию, скрипт —
# из main; данные прогона — через env (internal/workflows).

on:
  workflow_run:
    # pr-stuck — обход открытых PR: упавший обход молчит о стоящих PR, и
    # его красный тоже должен дойти до issue. Обход запускается концом
    # прогона ci (событие workflow_run) и расписанием — оба в условии job.
    workflows: [ci, cloud-e2e, stand, pr-stuck]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: main-red
  cancel-in-progress: false

jobs:
  issue:
    if: >-
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' ||
      (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.name == 'pr-stuck')) &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      # Строка в открытые PR, когда main стал красным и когда снова зелёный
      # (план 1.9, строка «CI», М5): у issue нет адресата, а комментарий в
      # PR доходит до того, кто за ним следит.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: issue «main красный»
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: .github/scripts/main_red.sh
