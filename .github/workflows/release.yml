name: release

# Тег v* → те же проверки, что в ci, → goreleaser: 6 бинарей, архивы,
# checksums.txt, подпись cosign keyless, GitHub Release. Как выпускать —
# docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  # Запуск из tag.yml (тег, поставленный GITHUB_TOKEN, push-событие не даёт).
  # Только на теге: с ветки релиз не собирается (условие у job ci).
  workflow_dispatch:

# По умолчанию ничего; права выдаются по job.
permissions: {}

jobs:
  # Одобрение владельца в окружении release: без него ничего не собирается
  # и не подписывается — ни после tag.yml, ни после тега, запушенного
  # напрямую. Окружение заведено в настройках (Required reviewers —
  # владелец, Deployment branches and tags — только теги v*); без него
  # GitHub создал бы его сам, без защиты.
  approve:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - run: echo "выпуск ${GITHUB_REF_NAME} одобрен"

  # Тот же workflow, что на каждом push/PR: build, vet, gofmt, test -race на
  # трёх ОС, govulncheck, goreleaser check. Релиз не собирается, пока он
  # не зелёный.
  ci:
    needs: approve
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # Создать Release и загрузить в него файлы.
      contents: write
      # OIDC-токен для cosign keyless: Fulcio выдаёт по нему сертификат
      # с identity этого workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false
          # Changelog строится по коммитам от предыдущего тега.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Та же версия, что в ci.yml: ниже не опускать без govulncheck.
          go-version: "1.26.9"
          # Подписываемый релиз собирается без кэша Actions: кэш сборки
          # (GOCACHE) — готовые объектные файлы, и отравленная запись
          # попала бы в бинарь с подписью этого workflow. Модули качаются
          # заново и сверяются с go.sum.
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Зафиксирована, как govulncheck в ci.yml; поднимать вручную в обоих.
          version: v2.18.3
          args: check

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Образ MCP-сервера в Artifact Registry Cloud.ru — источник карточки
  # Marketplace. Секреты (Settings → Secrets → Actions):
  #   CLOUDRU_AR_REGISTRY  имя реестра (<имя>.cr.cloud.ru) или полный хост
  #   CLOUDRU_AR_KEY_ID    ключ доступа с правом push в реестр
  #   CLOUDRU_AR_SECRET    его секрет
  # Без них job проходит с notice: бинари выпускаются и без образа.
  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AR_REGISTRY: ${{ secrets.CLOUDRU_AR_REGISTRY }}
      AR_KEY_ID: ${{ secrets.CLOUDRU_AR_KEY_ID }}
      AR_SECRET: ${{ secrets.CLOUDRU_AR_SECRET }}
    steps:
      - name: секреты Artifact Registry
        id: ar
        run: |
          if [ -z "$AR_REGISTRY" ] || [ -z "$AR_KEY_ID" ] || [ -z "$AR_SECRET" ]; then
            echo "::notice title=Образ не опубликован::не заданы секреты CLOUDRU_AR_REGISTRY, CLOUDRU_AR_KEY_ID, CLOUDRU_AR_SECRET"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$AR_REGISTRY" in
            *.*) host="$AR_REGISTRY" ;;
            *)   host="$AR_REGISTRY.cr.cloud.ru" ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          {
            echo "enabled=true"
            echo "host=$host"
            echo "version=$version"
            # -rc.N и прочие pre-release не двигают latest.
            case "$version" in *-*) echo "latest=false" ;; *) echo "latest=true" ;; esac
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ar.outputs.enabled == 'true'
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false

      - name: docker build
        if: steps.ar.outputs.enabled == 'true'
        env:
          IMAGE: ${{ steps.ar.outputs.host }}/evo
          VERSION: ${{ steps.ar.outputs.version }}
        run: |
          docker build -t "$IMAGE:$VERSION" \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg DATE="$(git log -1 --format=%cI)" .

      - name: smoke-тест
        if: steps.ar.outputs.enabled == 'true'
        env:
          IMAGE: ${{ steps.ar.outputs.host }}/evo
          VERSION: ${{ steps.ar.outputs.version }}
        run: |
          docker run -d --name mcp -e MCP_BEARER_TOKEN=release-smoke-0123456789 -p 8080:8080 "$IMAGE:$VERSION"
          # Тот же скрипт, что в ci.yml: с Content-Type: application/json
          # (без него сервер отвечает 415 — релизный аудит, R-01).
          .github/scripts/mcp-smoke.sh http://localhost:8080 release-smoke-0123456789 "$VERSION"
          docker rm -f mcp

      - name: docker push
        if: steps.ar.outputs.enabled == 'true'
        env:
          HOST: ${{ steps.ar.outputs.host }}
          VERSION: ${{ steps.ar.outputs.version }}
          LATEST: ${{ steps.ar.outputs.latest }}
        run: |
          echo "$AR_SECRET" | docker login "$HOST" -u "$AR_KEY_ID" --password-stdin
          docker push "$HOST/evo:$VERSION"
          if [ "$LATEST" = true ]; then
            docker tag "$HOST/evo:$VERSION" "$HOST/evo:latest"
            docker push "$HOST/evo:latest"
          fi
          docker logout "$HOST"
          echo "::notice title=Образ опубликован::$HOST/evo:$VERSION"
