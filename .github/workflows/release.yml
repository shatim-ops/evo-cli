name: release

# Тег v* → те же проверки, что в ci, → goreleaser: 6 бинарей, архивы, SBOM,
# checksums.txt, подпись cosign keyless, GitHub Release, attestation
# происхождения; образ MCP-сервера — с подписью cosign по digest. Как
# выпускать и проверять — docs/RELEASING.md.
# Образ раннера — ubuntu-24.04, как у ci/test, который выпуск проходит
# (TestWorkflows_CILinuxImageIsPinned).
on:
  push:
    tags: ["v*"]
  # Запуск из tag.yml (тег, поставленный GITHUB_TOKEN, push-событие не даёт).
  # Только на теге: с ветки релиз не собирается (условие у job ci).
  workflow_dispatch:

# По умолчанию ничего; права выдаются по job.
permissions: {}

jobs:
  # Одобрение владельца в окружении release: без него ничего не собирается
  # и не подписывается — ни после tag.yml, ни после тега, запушенного
  # напрямую. Окружение заведено в настройках (Required reviewers —
  # владелец, Deployment branches and tags — только теги v*); без него
  # GitHub создал бы его сам, без защиты.
  approve:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - run: echo "выпуск ${GITHUB_REF_NAME} одобрен"

  # Тот же workflow, что на каждом push/PR: build, vet, gofmt, test -race на
  # трёх ОС, govulncheck, goreleaser check. Релиз не собирается, пока он
  # не зелёный.
  ci:
    needs: approve
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      # Создать Release и загрузить в него файлы.
      contents: write
      # OIDC-токен для cosign keyless: Fulcio выдаёт по нему сертификат
      # с identity этого workflow.
      id-token: write
      # Attestation происхождения (SLSA provenance) файлов релиза.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false
          # Changelog строится по коммитам от предыдущего тега.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Та же версия, что в ci.yml: ниже не опускать без govulncheck.
          go-version: "1.26.10"
          # Подписываемый релиз собирается без кэша Actions: кэш сборки
          # (GOCACHE) — готовые объектные файлы, и отравленная запись
          # попала бы в бинарь с подписью этого workflow. Модули качаются
          # заново и сверяются с go.sum.
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Кэш TUF (~/.sigstore) — до goreleaser. Блоки signs идут параллельно,
      # и каждый процесс cosign при старте пишет root.json в кэш и сверяет
      # прочитанное (go-tuf updater.New). На пустом кэше один записал
      # встроенный root, другой — обновлённый, и подпись checksums.txt
      # упала: «failed to persist metadata» (v1.5.0-rc.1, run 40809664915).
      # С готовым кэшем все пишут одно и то же. Остаётся гонка, если Sigstore
      # перевыпустит метаданные TUF за те ~40 с, что идут подписи; снимает её
      # только последовательная подпись (#530).
      - name: cosign initialize
        run: cosign initialize

      # syft пишет SBOM архивов (sboms в .goreleaser.yaml). go install
      # сверяет модуль с базой контрольных сумм Go, и в job, которая может
      # получить OIDC-токен этого workflow, не появляется ещё одна action.
      - name: syft
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.54.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Зафиксирована, как govulncheck в ci.yml; поднимать вручную в обоих.
          version: v2.18.3
          args: check

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Каждый файл из checksums.txt (архивы и их SBOM) получает attestation
      # происхождения: какой workflow на каком коммите его собрал. Проверка —
      # gh attestation verify (docs/RELEASING.md).
      - name: attestation происхождения
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # Образ MCP-сервера в Artifact Registry Cloud.ru. Пока действует D32
  # (образ в релизах не публикуется, только локальная установка), секретов
  # нет намеренно и job проходит с notice. Секреты, если образ вернут
  # (Settings → Secrets → Actions):
  #   CLOUDRU_AR_REGISTRY  имя реестра (<имя>.cr.cloud.ru) или полный хост
  #   CLOUDRU_AR_KEY_ID    ключ доступа с правом push в реестр
  #   CLOUDRU_AR_SECRET    его секрет
  image:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # cosign keyless подписывает опубликованный образ по digest. Токен
      # может запросить любой шаг job, а шаги — код помеченного коммита;
      # код образа (docker build, docker run) переменных job не получает.
      id-token: write
    # Ключ Artifact Registry — только в env шагов, которым он нужен (проверка
    # и push), а не всей job: сборка и smoke-тест запускают код образа, и
    # переменные job были бы видны им (аудит безопасности 19.10, SEC-5).
    steps:
      - name: секреты Artifact Registry
        id: ar
        env:
          AR_REGISTRY: ${{ secrets.CLOUDRU_AR_REGISTRY }}
          AR_KEY_ID: ${{ secrets.CLOUDRU_AR_KEY_ID }}
          AR_SECRET: ${{ secrets.CLOUDRU_AR_SECRET }}
        run: |
          if [ -z "$AR_REGISTRY" ] || [ -z "$AR_KEY_ID" ] || [ -z "$AR_SECRET" ]; then
            echo "::notice title=Образ не опубликован::не заданы секреты CLOUDRU_AR_REGISTRY, CLOUDRU_AR_KEY_ID, CLOUDRU_AR_SECRET"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Хост реестра (производное от секрета) в $GITHUB_OUTPUT не
          # пишется: Actions не передаёт выход, похожий на секрет, а в
          # выходах шага его видят все следующие шаги и логи. Хост
          # вычисляет из секрета сам шаг push (release audit, REL-18).
          version="${GITHUB_REF_NAME#v}"
          {
            echo "enabled=true"
            echo "version=$version"
            # -rc.N и прочие pre-release не двигают latest.
            case "$version" in *-*) echo "latest=false" ;; *) echo "latest=true" ;; esac
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ar.outputs.enabled == 'true'
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false

      # Сборка и smoke-тест — под локальным именем: им не нужен ни ключ, ни
      # адрес реестра; хост к образу добавляет шаг push.
      - name: docker build
        if: steps.ar.outputs.enabled == 'true'
        env:
          IMAGE: evo-release
          VERSION: ${{ steps.ar.outputs.version }}
        run: |
          docker build -t "$IMAGE:$VERSION" \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg DATE="$(git log -1 --format=%cI)" .

      - name: smoke-тест
        if: steps.ar.outputs.enabled == 'true'
        env:
          IMAGE: evo-release
          VERSION: ${{ steps.ar.outputs.version }}
        run: |
          docker run -d --name mcp -e MCP_BEARER_TOKEN=release-smoke-0123456789abcdef0123456789 -p 8080:8080 "$IMAGE:$VERSION"
          docker run -d --name mcp-ro -e MCP_BEARER_TOKEN=release-smoke-0123456789abcdef0123456789 -p 8081:8080 "$IMAGE:$VERSION" mcp --http :8080 --read-only
          # Тот же скрипт, что в ci.yml: с Content-Type: application/json
          # (без него сервер отвечает 415 — релизный аудит, R-01).
          MCP_SMOKE_READONLY=http://localhost:8081 .github/scripts/mcp-smoke.sh http://localhost:8080 release-smoke-0123456789abcdef0123456789 "$VERSION"
          docker rm -f mcp mcp-ro

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.ar.outputs.enabled == 'true'

      - name: docker push
        if: steps.ar.outputs.enabled == 'true'
        env:
          AR_REGISTRY: ${{ secrets.CLOUDRU_AR_REGISTRY }}
          VERSION: ${{ steps.ar.outputs.version }}
          LATEST: ${{ steps.ar.outputs.latest }}
          AR_KEY_ID: ${{ secrets.CLOUDRU_AR_KEY_ID }}
          AR_SECRET: ${{ secrets.CLOUDRU_AR_SECRET }}
        run: |
          case "$AR_REGISTRY" in
            *.*) HOST="$AR_REGISTRY" ;;
            *)   HOST="$AR_REGISTRY.cr.cloud.ru" ;;
          esac
          echo "$AR_SECRET" | docker login "$HOST" -u "$AR_KEY_ID" --password-stdin
          # Ключ уходит из настроек docker раннера, даже если push или
          # подпись упали.
          trap 'docker logout "$HOST"' EXIT
          docker tag "evo-release:$VERSION" "$HOST/evo:$VERSION"
          docker push "$HOST/evo:$VERSION"
          # Подпись — по digest, а не по тегу: тег можно передвинуть.
          # Подпись ложится в реестр рядом с образом (тег sha256-….sig),
          # запись — в Rekor; :latest — тот же digest.
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$HOST/evo:$VERSION")
          cosign sign --yes "$DIGEST_REF"
          if [ "$LATEST" = true ]; then
            docker tag "$HOST/evo:$VERSION" "$HOST/evo:latest"
            docker push "$HOST/evo:latest"
          fi
          echo "::notice title=Образ опубликован::$HOST/evo:$VERSION"
