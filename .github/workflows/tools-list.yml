name: tools-list

# Храповик размера tools/list (решения владельца 29.10, #597, п. 12, и
# 04.11): рост tools/list головы PR против её базы — только с причиной (D68,
# P13). Голова — merge-коммит, который выписывает событие; база — его первый
# родитель, main таким, каким его видело слияние (base.sha события бывает
# старше: на #649 — +157 байт чужого роста main). Число роста считает эта
# проверка и пишет в summary прогона; вырос — в описании PR строка
# «tools/list: рост — <причина>», без числа. Потолки — одна точка, тесты
# internal/mcp (maxToolsListBytes, пределы описаний инструмента и параметра):
# job гоняет их на голове, выход за потолок — красный при любой причине.
# Отдельный workflow, а не шаг ci.yml: правка описания (edited) перезапускает
# только эту проверку — чтобы увидеть строку причины. Код PR собирается без
# секретов; описание PR — через env, не в тексте скрипта (internal/workflows).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: tools-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Нужен первый родитель merge-коммита.
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Та же версия, что в ci.yml; поднимать вместе.
          go-version: "1.26.11"
          cache-dependency-path: go.sum

      # Потолки — в тестах internal/mcp, здесь не копируются.
      - name: потолки tools/list (internal/mcp)
        run: go test ./internal/mcp -run '^(TestToolsList_SizeBudget|TestToolsList_DescriptionLimits)$' -count=1 -v

      - name: рост tools/list против базы
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = 3 ] || { echo "::error::HEAD — не merge-коммит PR"; exit 1; }
          base=$(git rev-parse HEAD^1)
          git worktree add -q "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base" && go build -o "$RUNNER_TEMP/evo-base" ./cmd/evo)
          go build -o "$RUNNER_TEMP/evo-head" ./cmd/evo
          .github/scripts/tools_list.sh "$RUNNER_TEMP/evo-base" > "$RUNNER_TEMP/base.json"
          .github/scripts/tools_list.sh "$RUNNER_TEMP/evo-head" > "$RUNNER_TEMP/head.json"
          .github/scripts/tools_list_growth.sh "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"
