name: cloud-e2e

# Сквозная проверка на настоящем Cloud.ru: init → deploy → verify → logs -f →
# destroy → правило порта 80 удалено из группы безопасности. Создаёт платную ВМ и floating IP, поэтому запускается только
# вручную — Actions → cloud-e2e → Run workflow, ветка на выбор — и всегда
# удаляет за собой ресурсы.
# Job readonly рядом проверяет чтения API и MCP, ничего не создавая. Job
# os-smoke (вход os_smoke) создаёт ВМ из образов Astra Linux и РЕД ОС по
# имени, заходит по SSH и удаляет их. Job k8s-smoke (вход k8s_smoke) —
# кластер Managed Kubernetes с плагином, затем его удаление. Job'ы dbaas-pg,
# dbaas-kafka, dbaas-redis (вход dbaas_smoke) параллельно создают
# минимальные кластеры PostgreSQL, Kafka и Redis (evo-e2e-pg, evo-e2e-kafka,
# evo-e2e-redis), проверяют их и удаляют. Job live (входы disk_smoke,
# net_smoke, dns_smoke, s3_smoke, secrets_smoke, ca_smoke, stack_smoke,
# mcp_smoke) — по job на область, параллельно: изменяющие инструменты вживую
# с удалением за собой (.github/scripts/cloud-live.sh). Job cleanup (вход
# cleanup_only) ничего не создаёт и удаляет остатки прошлых прогонов, в том
# числе эти кластеры и ресурсы live. Проект общий: трогаются только ресурсы с
# именами evo-e2e-*.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   CLOUDRU_KEY_ID, CLOUDRU_SECRET — ключ тестового сервисного аккаунта
#   CLOUDRU_PROJECT_ID             — тестовый проект
#
# Ключи лежат в секретах окружений (Settings → Environments), а не
# репозитория. Job, которые создают и удаляют ресурсы, объявляют
# environment: cloud-e2e — оно требует одобрения владельца, и код из любой
# ветки получает ключ с правом изменений только после его клика. Job readonly
# объявляет environment: cloud-readonly — ключ только на чтение (роль
# наблюдателя), без одобрения. Пуша в e2e/** как триггера больше нет: с ним
# код из ветки запускался с ключом без чьего-либо решения.

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "Availability zone name (ru.AZ-1 зависал в creating 14.10.2026)"
        default: "ru.AZ-2"
      flavor:
        description: "Flavor name"
        default: "lowcost10-2-4"
      image:
        description: "Image name"
        default: "ubuntu-22.04"
      timeout:
        description: "Seconds deploy waits for the VM to become active (CLOUDRU_TIMEOUT; ru.AZ-1 took over 10 min on 15.10.2026)"
        default: "1200"
      os_smoke:
        description: "Also create VMs from domestic OS images by name (Astra Linux, RED OS): vm create --image → SSH → os-release → delete"
        type: boolean
        default: false
      k8s_smoke:
        description: "Also run Managed Kubernetes live (billable, ~60 min): cluster → one-node pool → evo k8s kubectl → cert-manager install with evo k8s add-addon and its pods → delete"
        type: boolean
        default: false
      dbaas_smoke:
        description: "Also run DBaaS live (billable, up to ~3 h): creates and deletes minimal PostgreSQL, Kafka and Redis clusters evo-e2e-pg, evo-e2e-kafka, evo-e2e-redis"
        type: boolean
        default: false
      disk_smoke:
        description: "Live: VM via provision, disk create/attach/resize/detach/delete, image from the boot disk (image_create/image_delete), destroy (~30 min)"
        type: boolean
        default: false
      net_smoke:
        description: "Live: VPC create/delete, private VM behind a target group and load balancer, floating IP kept and re-attached, open_ports, VPC route, SNAT if the zone has none (~40 min)"
        type: boolean
        default: false
      dns_smoke:
        description: "Live: private DNS zone, A record, delete (~5 min)"
        type: boolean
        default: false
      s3_smoke:
        description: "Live: S3 bucket, put/ls/get/rm, bucket delete (~3 min)"
        type: boolean
        default: false
      secrets_smoke:
        description: "Live: secret create/add-version/value (sha256 only)/delete; self-signed certificate import/delete, cert_renew and cert_issue_le refusals (~5 min)"
        type: boolean
        default: false
      ca_smoke:
        description: "Live: Artifact Registry create, docker push, Container App deploy/HTTP/logs/stop/start/delete, registry delete (~25 min)"
        type: boolean
        default: false
      stack_smoke:
        description: "Live: stack_plan → stack_apply (private VM, secret, internal NLB) → stack_status → stack_destroy (~25 min)"
        type: boolean
        default: false
      mcp_smoke:
        description: "Live: MCP stdio deploy_plan → deploy_apply → deploy → destroy vm_id; MCP HTTP provision → destroy; release_floating_ip (~30 min)"
        type: boolean
        default: false
      cleanup_only:
        description: "Create nothing: delete leftovers of earlier runs (VMs evo-e2e-*, their floating IPs; clusters evo-e2e-k8s, evo-e2e-pg, evo-e2e-kafka, evo-e2e-redis; every evo-e2e-* resource of the live jobs; evo: rules for e2e ports 80/8080/8081/8082/8086 when no evo-* VM is left) and print project quotas"
        type: boolean
        default: false

concurrency:
  group: cloud-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Без платных ресурсов: чтения API через CLI, все инструменты только для
  # чтения без аргументов, MCP по stdio и HTTP (гейт подтверждения,
  # --allow-project, 401 без токена). Идёт параллельно с e2e; в лог — только
  # имена, коды и счётчики (.github/scripts/cloud-readonly.sh).
  readonly:
    # Только чтение: ключ сервисного аккаунта с правами наблюдателя из окружения
    # cloud-readonly, без одобрения — job идёт и в автономной работе.
    # Окружение cloud-readonly открыто только для main: с другой ветки job
    # не запускается (иначе прогон красный без единого шага).
    environment: cloud-readonly
    if: ${{ !inputs.cleanup_only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: configure
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] && [ -n "$PROJECT" ] || { echo "::error::нет секретов CLOUDRU_*"; exit 1; }
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      - name: Чтения CLI, инструменты, MCP stdio и HTTP
        env:
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
          # Ключ Object Storage (<tenant_id>:<Key ID>, docs/auth.md): без
          # него s3_buckets — CONFIG_INVALID и только предупреждение.
          CLOUDRU_S3_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_ACCESS_KEY }}
          CLOUDRU_S3_SECRET_KEY: ${{ secrets.CLOUDRU_S3_SECRET_KEY }}
        run: .github/scripts/cloud-readonly.sh

  e2e:
    environment: cloud-e2e
    if: ${{ !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZONE: ${{ inputs.zone || 'ru.AZ-2' }}
      FLAVOR: ${{ inputs.flavor || 'lowcost10-2-4' }}
      IMAGE: ${{ inputs.image || 'ubuntu-22.04' }}
      CLOUDRU_TIMEOUT: ${{ inputs.timeout || '1200' }}
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    # Лог публичный: вывод evo идёт через .github/scripts/redact.sed (UUID →
    # <id>, IPv4 → <ip>, имена групп безопасности и подсетей → <name>),
    # найденные значения ещё и маскируются. Порядок: jq, потом маска, потом
    # обрезка — маска может съесть кавычку JSON, а обрезка до неё разрезала
    # бы UUID или IP.
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      # Входы workflow_dispatch идут в jq и sed -i: только имена, без
      # разделителей и флагов sed («|e» выполнил бы команду).
      - name: Проверка входов
        run: |
          for v in "$ZONE" "$FLAVOR" "$IMAGE"; do
            printf '%s' "$v" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' ||
              { echo "::error::недопустимое значение входа: $v"; exit 1; }
          done
          printf '%s' "$CLOUDRU_TIMEOUT" | grep -Eq '^[0-9]{2,5}$' ||
            { echo "::error::timeout — число секунд"; exit 1; }

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Проверка секретов
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$KEY_ID" ] || missing="$missing CLOUDRU_KEY_ID"
          [ -n "$SECRET" ] || missing="$missing CLOUDRU_SECRET"
          [ -n "$PROJECT" ] || missing="$missing CLOUDRU_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::нет секретов репозитория:$missing"; exit 1; fi

      - name: configure + whoami
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT"
          evo whoami

      - name: Тестовый проект
        run: |
          mkdir -p e2e-app
          printf 'services:\n  web:\n    image: nginx:alpine\n    ports:\n      - "80:80"\n' > e2e-app/docker-compose.yml

      - name: init, затем зона/образ/flavor из входов
        working-directory: e2e-app
        run: |
          evo init --non-interactive
          zone_id=$(evo list-zones --json | jq -r --arg n "$ZONE" '.[] | select(.name==$n) | .id')
          image_id=$(evo list-images --json | jq -r --arg n "$IMAGE" '[.[] | select(.name==$n)][0].id')
          [ -n "$zone_id" ] && [ "$zone_id" != null ] || { echo "::error::зона $ZONE не найдена"; exit 1; }
          [ -n "$image_id" ] && [ "$image_id" != null ] || { echo "::error::образ $IMAGE не найден"; exit 1; }
          sed -i -e "s|^region:.*|region: $zone_id|" -e "s|^image_id:.*|image_id: $image_id|" -e "s|^flavor:.*|flavor: $FLAVOR|" .evo.yaml
          grep -E '^(region|image_id|flavor):' .evo.yaml

      - name: deploy --dry-run (ничего не создаёт)
        working-directory: e2e-app
        run: |
          evo deploy --dry-run 2>&1 | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"
          [ ! -s .evo/state.json ] || ! jq -e '.deployments | length > 0' .evo/state.json

      # Группа безопасности зоны общая: правило для порта 80 могло быть в
      # ней и до deploy (его destroy не трогает). Запоминаем, что было.
      - name: Правила групп безопасности до deploy
        working-directory: e2e-app
        run: evo tools call list_security_groups --arg rules=true --json > "$RUNNER_TEMP/sg-before.json"

      - name: deploy --yes
        working-directory: e2e-app
        run: |
          evo deploy --yes 2>&1 | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"

      - name: Группа и правила deploy в state
        # и после упавшего deploy: ВМ и правила могли создаться, проверка
        # их удаления ниже опирается на SG_ID
        if: always() && hashFiles('e2e-app/.evo/state.json') != ''
        working-directory: e2e-app
        run: |
          sg=$(jq -r '.deployments[0].security_group_id // empty' .evo/state.json)
          printf '%s' "$sg" | grep -Eq '^[A-Za-z0-9-]{1,64}$' || { echo "::error::нет security_group_id в state"; exit 1; }
          echo "::add-mask::$sg"
          ip=$(jq -r '.deployments[0].vm_ip // empty' .evo/state.json)
          [ -z "$ip" ] || echo "::add-mask::$ip"
          echo "SG_ID=$sg" >> "$GITHUB_ENV"
          jq '.deployments[0] | {security_group_ports, opened_rules: (.opened_rules | length)}' .evo/state.json

      - name: verify и HTTP снаружи
        working-directory: e2e-app
        run: |
          evo verify 2>&1 | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"
          ip=$(jq -r '.deployments[0].vm_ip' .evo/state.json)
          curl -fsS --max-time 15 "http://$ip/" | grep -qi nginx

      - name: logs -f дольше 120 с, Ctrl-C → 130
        working-directory: e2e-app
        run: |
          set +e
          timeout --preserve-status -s INT 150 evo logs -f > logs.txt 2>&1
          rc=$?
          set -e
          tail -5 logs.txt | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"
          [ "$rc" = 130 ] || { echo "::error::logs -f: код $rc, ожидался 130"; exit 1; }

      - name: destroy --yes (всегда)
        if: always()
        run: |
          cd e2e-app 2>/dev/null && [ -f .evo/state.json ] || { echo "нечего удалять"; exit 0; }
          # destroy сам ждёт до 10 мин, пока ВМ в creating станет удаляемой.
          for _ in 1 2; do evo destroy --yes 2>&1 | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed" && break; sleep 30; done
          jq -e '.deployments | length == 0' .evo/state.json

      # Страховка: ВМ evo-e2e-app и её floating IP («fip-evo-e2e-app-…») не
      # должны пережить прогон, даже если state потерян (15.10.2026 ВМ
      # зависла в creating, destroy сдался, раннер унёс state — ВМ и FIP
      # остались платными). Ищет по имени в проекте, удаляет, при остатке —
      # ошибка с ID, чтобы удалить вручную.
      - name: Сирот evo-e2e-app нет (всегда)
        if: always()
        run: |
          cd e2e-app 2>/dev/null || { echo "проект не создан"; exit 0; }
          vms() { evo tools call vm_list --json | jq -r '[.vms[]? | select(.name=="evo-e2e-app") | .id] | join(" ")'; }
          for i in 1 2 3 4 5 6; do
            ids=$(vms)
            [ -z "$ids" ] && break
            for id in $ids; do echo "::add-mask::$id"; done
            echo "осталась ВМ evo-e2e-app — удаляю (попытка $i)"
            for id in $ids; do
              evo --yes tools call destroy --arg vm_id="$id" --json 2>&1 | jq -c "{status, error: ((.error // null) | tostring)}" 2>/dev/null | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed" | cut -c1-260 || true
            done
            sleep 60
          done
          for id in $(evo tools call list_floating_ips --json |
            jq -r '.floating_ips[]? | select(((.name // "") | startswith("fip-evo-e2e-app-")) and .available) | .id'); do
            echo "::add-mask::$id"
            echo "освобождаю floating IP"
            evo --yes tools call release_floating_ip --arg id="$id" --json 2>&1 | jq -c "{status, error: ((.error // null) | tostring)}" 2>/dev/null | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed" | cut -c1-260 || true
          done
          left=$(vms)
          [ -z "$left" ] || { echo "::error::после прогона осталась ВМ evo-e2e-app ($left) — удалите её в консоли Cloud.ru"; exit 1; }

      # Загрузочный диск ВМ (evo-e2e-app-boot) после destroy: DELETE ВМ идёт
      # без delete_attachments, а документация говорит, что диски можно
      # оставить и они оплачиваются (реестр CMP-11). Только чтение: диск не
      # удаляется. Диск в deleting ждём до 3 мин; ошибка API — предупреждение,
      # не провал; провал — если после destroy остался диск без ВМ.
      - name: Дисков evo-e2e-app без ВМ нет (всегда)
        if: always()
        run: |
          [ -d e2e-app ] || { echo "проект не создан"; exit 0; }
          cd e2e-app
          for i in 1 2 3 4 5 6 7; do
            if ! out=$(evo tools call disk_list --json 2>/dev/null); then
              echo "::warning::disk_list не прочитан — проверка дисков пропущена"; exit 0
            fi
            left=$(jq -c '[.disks[]? | select(((.name // "") | startswith("evo-e2e-app")) and (((.attached_to // []) | length) == 0)) | {name, state, size_gb}]' <<<"$out") ||
              { echo "::warning::ответ disk_list не разобран — проверка дисков пропущена"; exit 0; }
            [ "$left" = "[]" ] && { echo "дисков evo-e2e-app без ВМ нет"; exit 0; }
            [ "$(jq '[.[] | select(.state != "deleting")] | length' <<<"$left")" = 0 ] || break
            echo "диск ещё удаляется (попытка $i): $left"
            sleep 30
          done
          echo "диски без ВМ: $left"
          echo "::error::после destroy остался диск evo-e2e-app без ВМ — он оплачивается (CMP-11); удалите его в консоли Cloud.ru или 'evo disk delete'"
          exit 1

      # Если правила «evo:» для 80 в группе до deploy не было, его создал
      # deploy, и после destroy его быть не должно. Удаление может идти
      # асинхронно (state=deleting) — несколько попыток. Правило со старым
      # префиксом «cloudru-vm:» (его ставили версии до переименования) тоже
      # считается своим: такое в группе до deploy — проверка пропускается.
      - name: Правило порта 80 удалено после destroy
        if: always() && env.SG_ID != ''
        working-directory: e2e-app
        run: |
          # $sg is jq's variable (--arg sg), not the shell's.
          # shellcheck disable=SC2016
          rule80='[.security_groups[] | select(.id==$sg) | .rules[]? | select(.direction=="ingress" and .port_range=="80:80" and ((.description // "") | startswith("evo:") or startswith("cloudru-vm:")))] | length'
          had=$(jq --arg sg "$SG_ID" "$rule80" "$RUNNER_TEMP/sg-before.json")
          if [ "$had" != 0 ]; then echo "правило для 80 было в группе до deploy — destroy его не удаляет, проверка пропущена"; exit 0; fi
          for _ in 1 2 3 4 5 6; do
            left=$(evo tools call list_security_groups --arg rules=true --json | jq --arg sg "$SG_ID" "$rule80")
            [ "$left" = 0 ] && { echo "правило для 80 удалено"; exit 0; }
            sleep 10
          done
          echo "::error::после destroy в группе deploy осталось правило «evo:» для порта 80"
          exit 1

  # Области live, выбранные входами, — матрица job live. Без секретов и
  # окружения: только разбор входов.
  live-plan:
    if: ${{ !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
    steps:
      - id: areas
        env:
          DISK: ${{ inputs.disk_smoke }}
          NET: ${{ inputs.net_smoke }}
          DNS: ${{ inputs.dns_smoke }}
          S3: ${{ inputs.s3_smoke }}
          SECRETS: ${{ inputs.secrets_smoke }}
          CA: ${{ inputs.ca_smoke }}
          STACK: ${{ inputs.stack_smoke }}
          MCP: ${{ inputs.mcp_smoke }}
        run: |
          a=()
          [ "$DISK" != true ] || a+=(disk)
          [ "$NET" != true ] || a+=(net)
          [ "$DNS" != true ] || a+=(dns)
          [ "$S3" != true ] || a+=(s3)
          [ "$SECRETS" != true ] || a+=(secrets)
          [ "$CA" != true ] || a+=(ca)
          [ "$STACK" != true ] || a+=(stack)
          [ "$MCP" != true ] || a+=(mcp)
          echo "areas=$(printf '%s\n' "${a[@]}" | jq -Rnc '[inputs | select(. != "")]')" >> "$GITHUB_OUTPUT"

  # Изменяющие инструменты вживую, по области на job (.github/scripts/
  # cloud-live.sh): ресурсы evo-e2e-<область>-<run>, удаление в том же job и
  # проверка, что ничего не осталось. Порты в общей группе зоны у областей
  # разные (net — 18085 только с тестового адреса 198.18.255.1/32, mcp —
  # 8086), маршрут — тестовые сети 198.18.255.0/24 или 10.255.255.0/24.
  live:
    needs: live-plan
    if: ${{ !inputs.cleanup_only && needs.live-plan.outputs.areas != '[]' }}
    environment: cloud-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.live-plan.outputs.areas) }}
    env:
      ZONE: ${{ inputs.zone || 'ru.AZ-2' }}
      FLAVOR: ${{ inputs.flavor || 'lowcost10-2-4' }}
      IMAGE: ${{ inputs.image || 'ubuntu-22.04' }}
      CLOUDRU_TIMEOUT: ${{ inputs.timeout || '1200' }}
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
      RUN: ${{ github.run_id }}${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - name: Проверка входов
        run: |
          for v in "$ZONE" "$FLAVOR" "$IMAGE"; do
            printf '%s' "$v" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' ||
              { echo "::error::недопустимое значение входа: $v"; exit 1; }
          done
          printf '%s' "$CLOUDRU_TIMEOUT" | grep -Eq '^[0-9]{2,5}$' ||
            { echo "::error::timeout — число секунд"; exit 1; }

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: configure
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] && [ -n "$PROJECT" ] || { echo "::error::нет секретов CLOUDRU_*"; exit 1; }
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      # Скрипт сам удаляет свои ресурсы (trap EXIT) и проверяет остатки.
      - name: Область ${{ matrix.area }}
        env:
          AREA: ${{ matrix.area }}
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
          CLOUDRU_S3_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_ACCESS_KEY }}
          CLOUDRU_S3_SECRET_KEY: ${{ secrets.CLOUDRU_S3_SECRET_KEY }}
        run: .github/scripts/cloud-live.sh "$AREA"

      # Страховка, если скрипт оборвался до своей уборки (таймаут шага).
      - name: Остатков области нет (всегда)
        if: always()
        env:
          AREA: ${{ matrix.area }}
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_S3_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_ACCESS_KEY }}
          CLOUDRU_S3_SECRET_KEY: ${{ secrets.CLOUDRU_S3_SECRET_KEY }}
        run: |
          command -v evo >/dev/null || { echo "evo не собран — ресурсов не создавалось"; exit 0; }
          .github/scripts/cloud-live.sh sweep "evo-e2e-$AREA-$(printf '%s' "$RUN" | tr -cd 'a-z0-9' | cut -c1-16)" "$AREA"

  # Отечественные ОС по имени образа (шаг E, docs/internal/design-images.md):
  # init --image отказывает (Docker на них не ставится), vm create --image
  # создаёт ВМ, к ней заходит SSH, порт 8080 открыт и после удаления закрыт.
  # IP и ID ВМ в лог не попадают (маскируются), os-release — только ID и
  # версия.
  os-smoke:
    environment: cloud-e2e
    if: ${{ inputs.os_smoke && !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Отечественные ОС тестовому проекту 16.10.2026 недоступны (BACKLOG
          # [images]): тогда проверяется отказ evo до создания (код 4), а
          # ВМ создаётся, когда образ станет доступен.
          - image: AstraLinuxSmolensk1.8.3KES
            vm: evo-e2e-os-astra
            os_id: astra
            port: "8080"
            no_docker: true
          # обязательное поле fqdn типа hostname (BACKLOG [images])
          - image: redos_7.3_image
            vm: evo-e2e-os-redos
            os_id: redos
            port: "8081"
            no_docker: true
          # продукт маркетплейса, доступный проекту: vm create --image по имени
          - image: nginx-ubuntu-22.04
            vm: evo-e2e-os-nginx
            os_id: ubuntu
            port: "8082"
            no_docker: false
    env:
      ZONE: ${{ inputs.zone || 'ru.AZ-2' }}
      FLAVOR: ${{ inputs.flavor || 'lowcost10-2-4' }}
      IMAGE: ${{ matrix.image }}
      VM: ${{ matrix.vm }}
      OS_ID: ${{ matrix.os_id }}
      # Записи матрицы идут параллельно и открывают порт в одной общей
      # группе зоны: у каждой свой порт, иначе вторая получит already_open,
      # а проверка «правило удалено» одной увидит правило другой.
      PORT: ${{ matrix.port }}
      NO_DOCKER: ${{ matrix.no_docker }}
      CLOUDRU_TIMEOUT: ${{ inputs.timeout || '1200' }}
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - name: Проверка входов
        run: |
          for v in "$ZONE" "$FLAVOR"; do
            printf '%s' "$v" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' ||
              { echo "::error::недопустимое значение входа: $v"; exit 1; }
          done
          printf '%s' "$CLOUDRU_TIMEOUT" | grep -Eq '^[0-9]{2,5}$' ||
            { echo "::error::timeout — число секунд"; exit 1; }

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: configure
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] && [ -n "$PROJECT" ] || { echo "::error::нет секретов CLOUDRU_*"; exit 1; }
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      - name: image get по имени, init --image (ничего не создаёт)
        run: |
          evo image get "$IMAGE" --json > "$RUNNER_TEMP/card.json"
          jq '{name: .image.name, ready, available_in_project, fields_required, filled: [.fields[] | {name, filled_by}]}' "$RUNNER_TEMP/card.json"
          avail=$(jq -r 'if .available_in_project == false then "false" else "true" end' "$RUNNER_TEMP/card.json")
          echo "AVAILABLE=$avail" >> "$GITHUB_ENV"
          [ "$avail" = true ] || echo "::warning::образ $IMAGE недоступен проекту — проверяется отказ evo, ВМ не создаётся"
          if [ "$avail" = true ] && [ "$NO_DOCKER" != true ]; then exit 0; fi
          mkdir -p os-app
          printf 'services:\n  web:\n    image: nginx:alpine\n' > os-app/docker-compose.yml
          set +e
          (cd os-app && evo init --non-interactive --image "$IMAGE" > init.txt 2>&1)
          rc=$?
          set -e
          tail -3 os-app/init.txt
          if [ "$avail" != true ]; then
            [ "$rc" = 4 ] || { echo "::error::init --image $IMAGE: код $rc, ждали 4 (образ недоступен проекту)"; exit 1; }
          elif [ "$rc" = 0 ] || ! grep -q "get.docker.com" os-app/init.txt; then
            echo "::error::init --image $IMAGE: код $rc, ждали отказ про get.docker.com"; exit 1
          fi

      - name: Правила групп безопасности до создания
        run: evo tools call list_security_groups --arg rules=true --json > "$RUNNER_TEMP/sg-before.json"

      # vm create кладёт ключ SSH и state в .evo/ рабочего каталога: create,
      # SSH и delete идут из одного каталога.
      - name: vm create --image по имени и --port
        run: |
          mkdir -p os-vm && cd os-vm
          zone_id=$(evo list-zones --json | jq -r --arg n "$ZONE" '.[] | select(.name==$n) | .id')
          [ -n "$zone_id" ] && [ "$zone_id" != null ] || { echo "::error::зона $ZONE не найдена"; exit 1; }
          set +e
          evo --json --yes vm create "$VM" --image "$IMAGE" --flavor "$FLAVOR" --region "$zone_id" \
            --port "$PORT" > "$RUNNER_TEMP/vm.json" 2> "$RUNNER_TEMP/vm.err"
          rc=$?
          set -e
          # превью и ход создания — через redact.sed (ID каталога и ресурсов)
          sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed" "$RUNNER_TEMP/vm.err" | cut -c1-400
          id=$(jq -r '.vm_id // empty' "$RUNNER_TEMP/vm.json")
          ip=$(jq -r '.vm_ip // empty' "$RUNNER_TEMP/vm.json")
          if [ -n "$id" ]; then echo "::add-mask::$id"; echo "VM_ID=$id" >> "$GITHUB_ENV"; fi
          if [ -n "$ip" ]; then echo "::add-mask::$ip"; fi
          jq '{status, ssh_user, disk_gb, ports: (.ports.opened // null), warning, error}' "$RUNNER_TEMP/vm.json"
          if [ "$AVAILABLE" != true ]; then
            # отказ до создания: код 4, ВМ нет
            [ "$rc" = 4 ] && [ -z "$id" ] || { echo "::error::vm create с недоступным образом: код $rc, ждали 4 без ВМ"; exit 1; }
            echo "отказ до создания: код 4"
            exit 0
          fi
          if [ "$rc" != 0 ] || [ -z "$ip" ]; then echo "::error::vm create: код $rc"; exit 1; fi
          echo "VM_IP=$ip" >> "$GITHUB_ENV"
          echo "SSH_USER=$(jq -r .ssh_user "$RUNNER_TEMP/vm.json")" >> "$GITHUB_ENV"
          jq -e '.ports.opened | length == 1' "$RUNNER_TEMP/vm.json" >/dev/null ||
            jq -e '.ports.already_open | length == 1' "$RUNNER_TEMP/vm.json" >/dev/null ||
            { echo "::error::порт $PORT не открыт"; exit 1; }

      - name: SSH и os-release
        if: env.VM_ID != ''
        working-directory: os-vm
        run: |
          for _ in $(seq 1 40); do
            if ssh -i .evo/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=10 \
                "$SSH_USER@$VM_IP" 'cat /etc/os-release' > "$RUNNER_TEMP/os-release" 2>/dev/null; then
              grep -E '^(ID|VERSION_ID|PRETTY_NAME)=' "$RUNNER_TEMP/os-release"
              grep -Eiq "^ID=\"?$OS_ID" "$RUNNER_TEMP/os-release" ||
                { echo "::error::в os-release не $OS_ID"; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "::error::SSH к ВМ не поднялся за 10 минут"
          exit 1

      - name: vm delete (всегда)
        if: always() && env.VM_ID != ''
        working-directory: os-vm
        run: |
          # вывод — через redact.sed: в нём ID floating IP (run 39160570296)
          set -o pipefail
          for _ in 1 2; do evo --yes vm delete "$VM_ID" 2>&1 | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed" && break; sleep 30; done

      - name: Сирот нет (всегда)
        if: always()
        run: |
          vms() { evo tools call vm_list --json | jq -r --arg n "$VM" '[.vms[]? | select(.name==$n) | .id] | join(" ")'; }
          for i in 1 2 3 4 5 6; do
            ids=$(vms)
            [ -z "$ids" ] && break
            for id in $ids; do echo "::add-mask::$id"; done
            echo "осталась ВМ $VM — удаляю (попытка $i)"
            for id in $ids; do
              evo --yes tools call destroy --arg vm_id="$id" --json 2>&1 | jq -c "{status, error: ((.error // null) | tostring)}" 2>/dev/null | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed" | cut -c1-260 || true
            done
            sleep 60
          done
          for id in $(evo tools call list_floating_ips --json |
            jq -r --arg p "fip-$VM-" '.floating_ips[]? | select(((.name // "") | startswith($p)) and .available) | .id'); do
            echo "::add-mask::$id"
            echo "освобождаю floating IP"
            evo --yes tools call release_floating_ip --arg id="$id" --json 2>&1 | jq -c "{status, error: ((.error // null) | tostring)}" 2>/dev/null | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed" | cut -c1-260 || true
          done
          left=$(vms)
          [ -z "$left" ] || { echo "::error::после прогона осталась ВМ $VM — удалите её в консоли Cloud.ru"; exit 1; }

      - name: Правило порта удалено после delete
        if: always() && env.VM_ID != ''
        run: |
          # $pr — переменная jq, не shell
          # shellcheck disable=SC2016
          rule='[.security_groups[] | .rules[]? | select(.direction=="ingress" and .port_range==$pr and ((.description // "") | startswith("evo:")))] | length'
          had=$(jq --arg pr "$PORT:$PORT" "$rule" "$RUNNER_TEMP/sg-before.json")
          if [ "$had" != 0 ]; then echo "правило для $PORT было до создания — проверка пропущена"; exit 0; fi
          for _ in 1 2 3 4 5 6; do
            left=$(evo tools call list_security_groups --arg rules=true --json | jq --arg pr "$PORT:$PORT" "$rule")
            [ "$left" = 0 ] && { echo "правило для $PORT удалено"; exit 0; }
            sleep 10
          done
          echo "::error::после vm delete осталось правило «evo:» для порта $PORT"
          exit 1

  # Остатки прошлых прогонов (16.10.2026: отменённый прогон оставил ВМ
  # evo-e2e-app, её FIP и правило порта 80, следующий deploy упал на 409).
  # Ничего не создаёт. Правила «evo:» для 80/8080/8081/8082 (порты e2e)
  # удаляются, только когда в проекте нет ни одной ВМ с именем evo-*:
  # описание «evo: …» ставит любой evo deploy/vm create, и чужое правило
  # иначе не отличить. Допущение: проект тестовый, evo в нём запускает только
  # e2e. Кластеры DBaaS — только evo-e2e-pg, evo-e2e-kafka, evo-e2e-redis
  # (проект общий: у внешнего аудитора — audit-*). ID и IP маскируются.
  cleanup:
    environment: cloud-e2e
    if: ${{ inputs.cleanup_only }}
    runs-on: ubuntu-latest
    # Кластер DBaaS, который ещё создаётся, Cloud.ru удалять отказывается:
    # повтор до 120 мин и ожидание до 30 (dbaas-delete.sh) поверх ВМ и mk8s.
    timeout-minutes: 240
    env:
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: configure
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] && [ -n "$PROJECT" ] || { echo "::error::нет секретов CLOUDRU_*"; exit 1; }
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      # Квоты проекта перед прогонами live: код ресурса, лимит, использование
      # (только числа). Ключу без области организации — status unavailable.
      - name: Квоты проекта (только чтение)
        env:
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          out=$(evo tools call org_quotas --arg project_id="$PROJECT" --json 2>/dev/null) || { echo "::warning::org_quotas не прочитан"; exit 0; }
          jq -r '"status: \(.status // "ok")", (.quota_usages[]? | "\(.resource)\t\(.limit)\t\(.usage)")' <<<"$out" | sed -E -f .github/scripts/redact.sed | head -80
          echo "ВМ в проекте: $(evo tools call vm_list --json | jq '.vms | length'), floating IP: $(evo tools call list_floating_ips --json | jq '.floating_ips | length')"

      - name: ВМ evo-e2e-*
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          vms() { evo tools call vm_list --json | jq -c '[.vms[]? | select((.name // "") | startswith("evo-e2e-")) | {id, name, state: (.state // .status)}]'; }
          for i in $(seq 1 15); do
            list=$(vms)
            for id in $(jq -r '.[].id' <<<"$list"); do echo "::add-mask::$id"; done
            jq -c '[.[] | {name, state}]' <<<"$list"
            [ "$(jq length <<<"$list")" = 0 ] && { echo "ВМ evo-e2e-* нет"; exit 0; }
            for id in $(jq -r '.[].id' <<<"$list"); do
              evo --yes tools call destroy --arg vm_id="$id" --json 2>&1 |
                jq -c '{status, error: ((.error // null) | if . == null then null else tostring end), message: ((.message // null) | if . == null then null else tostring end)}' 2>/dev/null | redact | cut -c1-560 || true
            done
            echo "попытка $i: жду 60 с"
            sleep 60
          done
          echo "::error::ВМ evo-e2e-* не удалились за 15 минут"
          exit 1

      - name: Кластеры evo-e2e-k8s
        if: always()
        run: |
          ids=$(evo tools call k8s_list --json | jq -r '.clusters[]? | select(.name == "evo-e2e-k8s") | .id')
          [ -n "$ids" ] || { echo "кластеров evo-e2e-k8s нет"; exit 0; }
          for id in $ids; do
            echo "::add-mask::$id"
            evo --json --yes k8s delete "$id" | jq -c '{status}' || true
          done
          for _ in $(seq 1 30); do
            left=$(evo tools call k8s_list --json | jq '[.clusters[]? | select(.name == "evo-e2e-k8s")] | length')
            [ "$left" = 0 ] && { echo "кластеры удалены"; exit 0; }
            sleep 60
          done
          echo "::error::кластеры evo-e2e-k8s не удалились за 30 минут"
          exit 1

      # Три вида параллельно: подряд отказы «ещё создаётся» (до 120 мин на
      # каждый) не уложились бы в таймаут job. Строки лога с префиксом вида,
      # ::add-mask:: и ::error:: — без него.
      - name: Кластеры DBaaS evo-e2e-pg, evo-e2e-kafka, evo-e2e-redis
        if: always()
        run: |
          pids=()
          for k in pg kafka redis; do
            LOG_PREFIX="[$k] " .github/scripts/dbaas-delete.sh "$k" "evo-e2e-$k" &
            pids+=("$!")
          done
          rc=0
          for p in "${pids[@]}"; do wait "$p" || rc=1; done
          exit "$rc"

      - name: Floating IP fip-evo-e2e-*
        if: always()
        run: |
          for id in $(evo tools call list_floating_ips --json |
            jq -r '.floating_ips[]? | select(((.name // "") | startswith("fip-evo-e2e-")) and .available) | .id'); do
            echo "::add-mask::$id"
            echo "освобождаю floating IP"
            evo --yes tools call release_floating_ip --arg id="$id" --json | jq -c '{status}' || true
          done
          fips=$(evo tools call list_floating_ips --json)
          left=$(jq '[.floating_ips[]? | select(((.name // "") | startswith("fip-evo-e2e-")) and .state != "error_deleting")] | length' <<<"$fips")
          stuck=$(jq '[.floating_ips[]? | select(((.name // "") | startswith("fip-evo-e2e-")) and .state == "error_deleting")] | length' <<<"$fips")
          echo "FIP fip-evo-e2e-* осталось: $left, в error_deleting: $stuck"
          # error_deleting через API не снять: повторное удаление — 422 (реестр NET-7).
          [ "$stuck" = 0 ] || echo "::warning::FIP fip-evo-e2e-* в error_deleting ($stuck): через API не удаляется — уберите в консоли Cloud.ru или через поддержку"
          [ "$left" = 0 ] || { echo "::error::остались FIP fip-evo-e2e-*"; exit 1; }

      # Ресурсы job live (cloud-live.sh): все виды, имена evo-e2e-*, включая
      # диски без ВМ и собственные образы; маршрут тестовой сети
      # 198.18.255.0/24 и 10.255.255.0/24, правило порта 18085 с 198.18.255.1/32.
      - name: Ресурсы live evo-e2e-*
        if: always()
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_S3_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_ACCESS_KEY }}
          CLOUDRU_S3_SECRET_KEY: ${{ secrets.CLOUDRU_S3_SECRET_KEY }}
        run: .github/scripts/cloud-live.sh sweep evo-e2e-

      # Диски evo-* без ВМ (загрузочные после destroy, реестр CMP-11):
      # только список, ничего не удаляется и не валит job — чей диск,
      # решает человек.
      - name: Диски evo-* без ВМ (только отчёт)
        if: always()
        run: |
          if ! out=$(evo tools call disk_list --json 2>/dev/null); then
            echo "::warning::disk_list не прочитан"; exit 0
          fi
          left=$(jq -c '[.disks[]? | select(((.name // "") | startswith("evo-")) and (((.attached_to // []) | length) == 0)) | {name, state, size_gb}]' <<<"$out" 2>/dev/null) ||
            { echo "::warning::ответ disk_list не разобран"; exit 0; }
          if [ "$left" = "[]" ]; then echo "дисков evo-* без ВМ нет"; exit 0; fi
          echo "диски evo-* без ВМ: $left"
          echo "::warning::в проекте есть диски evo-* без ВМ — они оплачиваются; удалите ненужные ('evo disk delete' или консоль Cloud.ru)"

      # Правила удаляет API напрямую: в evo нет команды удаления правила.
      - name: Правила «evo:» для портов e2e
        if: always()
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
        run: |
          n=$(evo tools call vm_list --json | jq '[.vms[]? | select((.name // "") | startswith("evo-"))] | length')
          [ "$n" = 0 ] || { echo "::error::в проекте есть ВМ evo-* ($n) — правила «evo:» не трогаю"; exit 1; }
          evo tools call list_security_groups --arg rules=true --json > "$RUNNER_TEMP/sg.json"
          rules=$(jq -r '.security_groups[] | .id as $g | .rules[]? | select(.direction == "ingress" and (.port_range == "80:80" or .port_range == "8080:8080" or .port_range == "8081:8081" or .port_range == "8082:8082" or .port_range == "8086:8086") and ((.description // "") | startswith("evo:"))) | "\($g) \(.id) \(.port_range)"' "$RUNNER_TEMP/sg.json")
          [ -n "$rules" ] || { echo "правил «evo:» для 80/8080/8081/8082/8086 нет"; exit 0; }
          TOKEN=$(jq -n --arg k "$KEY_ID" --arg s "$SECRET" '{keyId:$k, secret:$s}' |
            curl -sS -X POST https://iam.api.cloud.ru/api/v1/auth/token -H 'Content-Type: application/json' --data-binary @- |
            jq -r '.access_token // .accessToken // empty')
          [ -n "$TOKEN" ] || { echo "::error::нет токена"; exit 1; }
          echo "::add-mask::$TOKEN"
          while read -r g r port; do
            echo "::add-mask::$g"; echo "::add-mask::$r"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://compute.api.cloud.ru/api/v1/security-groups/$g/rules/$r")
            echo "правило $port: DELETE http=$code"
          done <<<"$rules"

  # Managed Kubernetes вживую (до 16.10.2026 не проверялся ни разу): кластер
  # с одним мастером → пул из одного узла → плагин cert-manager → поды
  # плагина через kubectl → удаление кластера. Платно (~40–60 мин работы
  # кластера), только по входу k8s_smoke; кластер удаляется всегда, в том
  # числе по имени, если прогон потерял его ID. ID маскируются.
  k8s-smoke:
    environment: cloud-e2e
    if: ${{ inputs.k8s_smoke && !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    # Шаги ждут до 40 + 30 + 25 мин, удаление — до 30: запас, чтобы job не
    # оборвался по таймауту до удаления кластера.
    timeout-minutes: 180
    env:
      ZONE: ${{ inputs.zone || 'ru.AZ-2' }}
      CLUSTER: evo-e2e-k8s
      ADDON: cert-manager
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - name: Проверка входов
        run: |
          printf '%s' "$ZONE" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' ||
            { echo "::error::недопустимое значение входа: $ZONE"; exit 1; }

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: configure
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] && [ -n "$PROJECT" ] || { echo "::error::нет секретов CLOUDRU_*"; exit 1; }
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      - name: Кластера evo-e2e-k8s нет до прогона
        run: |
          n=$(evo tools call k8s_list --json | jq --arg n "$CLUSTER" '[.clusters[]? | select(.name == $n)] | length')
          [ "$n" = 0 ] || { echo "::error::кластер $CLUSTER уже есть — сначала cleanup_only"; exit 1; }

      - name: Каталог плагинов и версии cert-manager (только чтение)
        run: |
          evo k8s addons --json | jq '{shown: (.shown // (.addons | length)), total}'
          evo k8s addon-versions "$ADDON" --json > "$RUNNER_TEMP/versions.json"
          jq '[.releases[]? | {version, mode, kube_versions, ready_workers, namespace, latest}] | .[0:3]' "$RUNNER_TEMP/versions.json"
          # namespace релиза API отдаёт неверный (повторяет addonVersion),
          # evo его не показывает; поды ищутся по имени во всех namespace.
          jq -e '[.releases[]? | select(.latest)] | length == 1' "$RUNNER_TEMP/versions.json" >/dev/null ||
            { echo "::error::у $ADDON нет версии по умолчанию"; exit 1; }

      - name: k8s plan, затем create (1 мастер)
        run: |
          evo --json k8s plan --name "$CLUSTER" --zone "$ZONE" --master-count 1 |
            jq '{version, master_count, kube_api_internet, warnings}' || true
          evo --json --yes k8s create --name "$CLUSTER" --zone "$ZONE" --master-count 1 > "$RUNNER_TEMP/create.json"
          id=$(jq -r '.cluster_id // empty' "$RUNNER_TEMP/create.json")
          [ -n "$id" ] || { jq -c '{status, error}' "$RUNNER_TEMP/create.json" | sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; echo "::error::k8s create без cluster_id"; exit 1; }
          echo "::add-mask::$id"
          echo "CLUSTER_ID=$id" >> "$GITHUB_ENV"
          jq '{status}' "$RUNNER_TEMP/create.json"

      - name: Кластер готов (до 40 мин)
        run: |
          start=$(date +%s)
          while :; do
            st=$(evo tools call k8s_get --arg cluster_id="$CLUSTER_ID" --json | jq -r '.status // .state // "?"')
            echo "$(( ($(date +%s) - start) / 60 )) мин: $st"
            # Точные статусы (живые: OBJECT_STATUS_PENDING → PROVISIONING →
            # RUNNING): подстрока *ACTIVE* совпала бы и с INACTIVE.
            case "$st" in
              OBJECT_STATUS_RUNNING|RUNNING) break ;;
              *ERROR*|*FAIL*|*DELET*) echo "::error::кластер: $st"; exit 1 ;;
            esac
            [ $(( $(date +%s) - start )) -lt 2400 ] || { echo "::error::кластер не готов за 40 мин"; exit 1; }
            sleep 60
          done

      # Проект кластера на серверах evo mcp --allow-project (REL12-3), пока
      # кластер есть: свой проект — ответ, чужой — NOT_FOUND без проекта.
      - name: k8s_get через evo mcp --allow-project
        env:
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          .github/scripts/bound-check.sh k8s_get "$(jq -cn --arg c "$CLUSTER_ID" '{cluster_id: $c}')" "allow-project: k8s_get"

      - name: Пул из одного узла, готов (до 30 мин)
        run: |
          evo --json --yes k8s add-nodepool "$CLUSTER_ID" --name np-e2e --count 1 | jq -c '{status, count}'
          start=$(date +%s)
          while :; do
            st=$(evo k8s nodepools "$CLUSTER_ID" --json | jq -r '[.node_pools[]?.status] | first // "?"')
            echo "$(( ($(date +%s) - start) / 60 )) мин: $st"
            case "$st" in
              OBJECT_STATUS_RUNNING|RUNNING) break ;;
              *ERROR*|*FAIL*|*DELET*) echo "::error::пул: $st"; exit 1 ;;
            esac
            [ $(( $(date +%s) - start )) -lt 1800 ] || { echo "::error::пул не готов за 30 мин"; exit 1; }
            sleep 60
          done

      # kubectl пишет stdout и stderr вместе (CombinedOutput): строки
      # «Warning:» перед JSON отрезаются, разбирается JSON с первой «{».
      - name: evo k8s kubectl вживую (узлы)
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          kubectl version --client=true 2>/dev/null | head -1 || { echo "::error::нет kubectl на раннере"; exit 1; }
          evo --json k8s kubectl "$CLUSTER_ID" get nodes -o json 2>"$RUNNER_TEMP/kerr" > "$RUNNER_TEMP/nodes.json" ||
            { echo "::error::kubectl: $(redact < "$RUNNER_TEMP/kerr" | tail -c 300 | tr '\n' ' ')"; exit 1; }
          jq -r .output "$RUNNER_TEMP/nodes.json" | sed -n '/^{/,$p' |
            jq -e '{nodes: (.items | length), ready: ([.items[] | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))] | length)} | ., (.nodes > 0)' ||
            { echo "::error::kubectl get nodes -o json не разобран"; exit 1; }
          # Человеческий вывод — как у kubectl, без таблицы ПОЛЕ/ЗНАЧЕНИЕ.
          rows=$(evo k8s kubectl "$CLUSTER_ID" get nodes --no-headers | grep -c .)
          echo "evo k8s kubectl get nodes: строк $rows"
          [ "$rows" -ge 1 ] || { echo "::error::evo k8s kubectl без --json не вывел узлы"; exit 1; }

      # k8s_apply и k8s_helm без образов: ConfigMap манифестом и локальный
      # чарт из одного ConfigMap — выход в интернет кластеру не нужен (SNAT
      # для них не создаётся). helm и kubectl на раннере предустановлены.
      - name: evo k8s apply и helm install/uninstall вживую
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          # tool ИНСТРУМЕНТ АРГУМЕНТЫ... — ответ в $RUNNER_TEMP/t.json; не 0 — ::error:: и выход
          tool() {
            local t=$1 rc
            shift
            set +e
            evo --yes tools call "$t" --arg cluster_id="$CLUSTER_ID" "$@" --json > "$RUNNER_TEMP/t.json" 2>/dev/null
            rc=$?
            set -e
            [ "$rc" = 0 ] && return 0
            jq -c '{status, reason, stage}' "$RUNNER_TEMP/t.json" 2>/dev/null || true
            echo "$t: $(jq -r '.error // .output // empty' "$RUNNER_TEMP/t.json" 2>/dev/null | redact | tail -c 300 | tr '\n' ' ')"
            echo "::error::$t: код $rc"
            exit 1
          }
          cm_value() { # ИМЯ — значение data.k ConfigMap в default
            evo --json k8s kubectl "$CLUSTER_ID" get configmap "$1" -n default -o json 2>/dev/null |
              jq -r .output | sed -n '/^{/,$p' | jq -r '.data.k // empty' 2>/dev/null || true
          }
          tool k8s_apply --arg manifest="$(printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: evo-e2e-cm\n  namespace: default\ndata:\n  k: applied\n')"
          jq -c '{status}' "$RUNNER_TEMP/t.json"
          [ "$(cm_value evo-e2e-cm)" = applied ] || { echo "::error::k8s_apply: ConfigMap не появился"; exit 1; }
          echo "k8s_apply: ConfigMap создан"
          tool k8s_kubectl --arg args='delete configmap evo-e2e-cm -n default'
          mkdir -p "$RUNNER_TEMP/chart/templates"
          printf 'apiVersion: v2\nname: evo-e2e\nversion: 0.1.0\n' > "$RUNNER_TEMP/chart/Chart.yaml"
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: evo-e2e-helm\ndata:\n  k: {{ .Values.k | quote }}\n' > "$RUNNER_TEMP/chart/templates/cm.yaml"
          printf 'k: helm\n' > "$RUNNER_TEMP/chart/values.yaml"
          tool k8s_helm --arg action=install --arg release=evo-e2e --arg chart="$RUNNER_TEMP/chart" --arg namespace=default
          jq -c '{status, action}' "$RUNNER_TEMP/t.json"
          [ "$(cm_value evo-e2e-helm)" = helm ] || { echo "::error::k8s_helm install: ConfigMap релиза не появился"; exit 1; }
          tool k8s_helm --arg action=list
          jq -r .output "$RUNNER_TEMP/t.json" | grep -q evo-e2e || { echo "::error::k8s_helm list: релиза нет"; exit 1; }
          tool k8s_helm --arg action=uninstall --arg release=evo-e2e --arg namespace=default
          jq -c '{status, action}' "$RUNNER_TEMP/t.json"
          [ -z "$(cm_value evo-e2e-helm)" ] || { echo "::error::k8s_helm uninstall: ConfigMap релиза остался"; exit 1; }
          echo "k8s_helm: install → list → uninstall"

      # Поды плагина: Ready=True у подов без владельца Job (поды Job,
      # например cert-manager-startupapicheck, не учитываются).
      - name: add-addon cert-manager и его поды (до 25 мин)
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          evo --json --yes k8s add-addon "$CLUSTER_ID" "$ADDON" > "$RUNNER_TEMP/addon.json" || {
            jq -c '{status, error, reason}' "$RUNNER_TEMP/addon.json" 2>/dev/null | redact; echo "::error::add-addon"; exit 1; }
          jq -c '{status, version, namespace, operation: (.operation_id != null), cluster_addon: (.cluster_addon_id != null), addon_status, warnings}' "$RUNNER_TEMP/addon.json" | redact
          start=$(date +%s)
          while :; do
            min=$(( ($(date +%s) - start) / 60 ))
            if evo --json k8s kubectl "$CLUSTER_ID" get pods -A -o json 2>"$RUNNER_TEMP/kerr" > "$RUNNER_TEMP/pods.json" &&
               jq -r .output "$RUNNER_TEMP/pods.json" | sed -n '/^{/,$p' > "$RUNNER_TEMP/pods.items.json" &&
               jq -e .items "$RUNNER_TEMP/pods.items.json" >/dev/null 2>&1; then
              total=$(jq '.items | length' "$RUNNER_TEMP/pods.items.json")
              # waiting — причины ожидания контейнеров (ImagePullBackOff:
              # у кластера по умолчанию нет выхода в интернет, нужен SNAT-шлюз
              # в зоне узлов — документация mk8s, «Ограничения»).
              pods=$(jq -c --arg a "$ADDON" '[.items[] | select(.metadata.name | startswith($a))
                | select(all(.metadata.ownerReferences[]?; .kind != "Job"))
                | {ns: .metadata.namespace, name: .metadata.name, phase: .status.phase,
                   ready: any(.status.conditions[]?; .type == "Ready" and .status == "True"),
                   waiting: ([(.status.initContainerStatuses[]?, .status.containerStatuses[]?) | .state.waiting.reason // empty] | unique)}]' "$RUNNER_TEMP/pods.items.json")
              pull=$(jq '[.items[] | select(any((.status.initContainerStatuses[]?, .status.containerStatuses[]?); (.state.waiting.reason // "") | test("ImagePull|ErrImage")))] | length' "$RUNNER_TEMP/pods.items.json")
              echo "$min мин: подов в кластере $total, не тянут образ: $pull, $ADDON: $pods"
            else
              pods='[]'
              echo "$min мин: kubectl: $(redact < "$RUNNER_TEMP/kerr" | tail -c 300 | tr '\n' ' ')"
            fi
            if [ "$(jq 'length > 0 and all(.ready)' <<<"$pods")" = true ]; then echo "поды $ADDON готовы"; break; fi
            # Все поды плагина 8 мин не могут скачать образ — ждать дальше
            # нет смысла: кластеру, вероятно, нужен SNAT-шлюз.
            if [ "$(jq 'length > 0 and all(.waiting | any(test("ImagePull|ErrImage")))' <<<"$pods")" = true ]; then
              pullsince=${pullsince:-$(date +%s)}
              [ $(( $(date +%s) - pullsince )) -lt 480 ] || { fail="поды $ADDON 8 мин не могут скачать образ (ImagePullBackOff): у кластера нет выхода в интернет — нужен SNAT-шлюз в зоне узлов"; break; }
            else
              unset pullsince
            fi
            [ $(( $(date +%s) - start )) -lt 1500 ] || { fail="поды $ADDON не готовы за 25 мин"; break; }
            sleep 30
          done
          if [ -n "${fail:-}" ]; then
            echo "События в cert-manager и у подов $ADDON (последние):"
            evo --json k8s kubectl "$CLUSTER_ID" get events -A --sort-by=.lastTimestamp 2>/dev/null | jq -r '.output // empty' |
              redact | grep -Ei "$ADDON|pull|image" | tail -15 | cut -c1-240 || true
            echo "::error::$fail"
            exit 1
          fi

      - name: Удаление кластера (всегда)
        if: always()
        run: |
          ids=$(evo tools call k8s_list --json | jq -r --arg n "$CLUSTER" '.clusters[]? | select(.name == $n) | .id')
          [ -n "$ids" ] || { echo "кластера $CLUSTER нет"; exit 0; }
          for id in $ids; do
            echo "::add-mask::$id"
            evo --json --yes k8s delete "$id" | jq -c '{status}' || true
          done
          start=$(date +%s)
          while :; do
            left=$(evo tools call k8s_list --json | jq -c --arg n "$CLUSTER" '[.clusters[]? | select(.name == $n) | .status]')
            echo "$(( ($(date +%s) - start) / 60 )) мин: $left"
            [ "$left" = "[]" ] && { echo "кластер удалён"; exit 0; }
            [ $(( $(date +%s) - start )) -lt 1800 ] || { echo "::error::кластер $CLUSTER не удалился за 30 мин — удалите его в консоли Cloud.ru"; exit 1; }
            sleep 60
          done

  # DBaaS вживую (вход dbaas_smoke): три job'а идут параллельно — PostgreSQL,
  # Kafka, Redis. Каждый: зона открыта и кластера с нашим именем нет →
  # минимальный кластер → второе создание с тем же именем отклонено (L-32) →
  # кластер READY → проверки на живом кластере → удаление, всегда и по имени
  # (.github/scripts/dbaas-delete.sh). Платно: Kafka создаётся 37–39 мин
  # (реестр DB-10), PostgreSQL 17.10 почти 3 ч стоял в DEPLOYING (DB-20).
  # ID маскируются, в лог — статусы, счётчики и reason, текст ошибок — через
  # redact.sed.
  dbaas-pg:
    environment: cloud-e2e
    if: ${{ inputs.dbaas_smoke && !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    # Создание до 60 мин, проверки до ~20, удаление: отказы «ещё создаётся»
    # до 120 мин и ожидание до 30 — запас, чтобы job не оборвался до
    # удаления кластера.
    timeout-minutes: 300
    env:
      ZONE: ${{ inputs.zone || 'ru.AZ-2' }}
      KIND: pg
      CLUSTER: evo-e2e-pg
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - name: Проверка входов
        run: |
          printf '%s' "$ZONE" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' ||
            { echo "::error::недопустимое значение входа: $ZONE"; exit 1; }

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: configure
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] && [ -n "$PROJECT" ] || { echo "::error::нет секретов CLOUDRU_*"; exit 1; }
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      # Зона с enabled=false не принимает создание и удаление (17.10 Cloud.ru
      # закрыл ru.AZ-1 на срочные работы, реестр OPS-10): кластер завис бы.
      - name: Зона открыта, кластера evo-e2e-pg нет до прогона
        run: |
          z=$(evo tools call list_zones --json | jq -c --arg n "$ZONE" '[.zones[] | select(.name == $n)][0] // empty')
          [ -n "$z" ] || { echo "::error::зона $ZONE не найдена"; exit 1; }
          [ "$(jq -r '.enabled' <<<"$z")" != false ] ||
            { echo "::error::зона $ZONE закрыта (enabled=false): Cloud.ru в ней сейчас не создаёт и не удаляет ресурсы — запустите с другой зоной (вход zone)"; exit 1; }
          echo "ZONE_ID=$(jq -r '.id' <<<"$z")" >> "$GITHUB_ENV"
          n=$(evo tools call "${KIND}_list" --json | jq -e --arg n "$CLUSTER" '[.clusters[] | select(.name == $n)] | length')
          [ "$n" = 0 ] || { echo "::error::кластер $CLUSTER уже есть — сначала cleanup_only"; exit 1; }
          echo "зона $ZONE открыта, кластера $CLUSTER нет"

      # Самая дешёвая спецификация standard (pg_specs отдаёт дешёвые первыми),
      # 1 узел; резервные копии остаются включёнными (по умолчанию): без них
      # pg_backups отвечает 400 «backup disabled». pg_create без subnet_id
      # берёт первую подсеть проекта в любой зоне, поэтому подсеть зоны ZONE
      # выбирается здесь: Default_<зона>, иначе первая в зоне.
      - name: pg_create (минимальный кластер)
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          spec=$(evo tools call pg_specs --json |
            jq -c '[.specifications[]? | select(((.deployment_mode // "") | ascii_downcase) == "standard")][0] // .specifications[0] // empty')
          [ -n "$spec" ] || { echo "::error::pg_specs: спецификаций нет"; exit 1; }
          jq -c '{cpu, memory_gb, deployment_mode, min_storage_gb, max_hosts}' <<<"$spec"
          spec_id=$(jq -r '.id' <<<"$spec")
          subnet=$(evo tools call list_subnets --json | jq -r --arg z "$ZONE_ID" --arg n "$ZONE" '
            [.subnets[]? | select(.availability_zone_id == $z or ((.availability_zone_id // "") == "" and ((.name // "") | contains($n))))]
            | (map(select((.name // "") | startswith("Default_")))[0] // .[0]) | .id // empty')
          [ -n "$subnet" ] || { echo "::error::нет подсети проекта в зоне $ZONE"; exit 1; }
          echo "::add-mask::$spec_id"
          echo "::add-mask::$subnet"
          { echo "SPEC_ID=$spec_id"; echo "SUBNET_ID=$subnet"; } >> "$GITHUB_ENV"
          set +e
          evo --yes tools call pg_create --arg name="$CLUSTER" --arg specification_id="$spec_id" --arg subnet_id="$subnet" \
            --json > "$RUNNER_TEMP/create.json" 2>/dev/null
          rc=$?
          set -e
          id=$(jq -r '.cluster_id // empty' "$RUNNER_TEMP/create.json" 2>/dev/null || true)
          op=$(jq -r '.operation_id // empty' "$RUNNER_TEMP/create.json" 2>/dev/null || true)
          [ -z "$id" ] || echo "::add-mask::$id"
          [ -z "$op" ] || echo "::add-mask::$op"
          jq -c '{status, reason, cluster_id: ((.cluster_id // "") != ""), operation: ((.operation_id // "") != ""),
            created: ((.created // {}) | {version, cpu, memory_gb, storage_gb, instances, deployment_mode, backup_enabled})}' \
            "$RUNNER_TEMP/create.json" || true
          if [ "$rc" != 0 ]; then
            echo "pg_create: $(jq -r '.error // empty' "$RUNNER_TEMP/create.json" 2>/dev/null | redact | cut -c1-300)"
            echo "::error::pg_create: код $rc"
            exit 1
          fi
          echo "OP_ID=$op" >> "$GITHUB_ENV"
          # Без resource_id у операции cluster_id в ответе нет: ID — по имени.
          for _ in $(seq 1 10); do
            [ -z "$id" ] || break
            sleep 30
            id=$(evo tools call pg_list --json | jq -r --arg n "$CLUSTER" '[.clusters[]? | select(.name == $n) | .id][0] // empty')
            [ -z "$id" ] || echo "::add-mask::$id"
          done
          [ -n "$id" ] || { echo "::error::кластер $CLUSTER не появился в pg_list за 5 мин"; exit 1; }
          echo "CLUSTER_ID=$id" >> "$GITHUB_ENV"

      # Реестр L-32: второй кластер с тем же именем — второй счёт. Вызов без
      # --yes: имя проверяется до подтверждения, а при регрессии ответом было
      # бы confirmation_required (код 3) — второй платный кластер не
      # создаётся. Аргументы те же, что у первого: иначе USAGE мог бы прийти
      # за спецификацию, а не за имя; existing_id — наш кластер.
      - name: Второй pg_create с тем же именем отклонён (L-32)
        run: |
          set +e
          evo tools call pg_create --arg name="$CLUSTER" --arg specification_id="$SPEC_ID" --arg subnet_id="$SUBNET_ID" \
            --json 2> "$RUNNER_TEMP/dup.json" >/dev/null
          rc=$?
          set -e
          # С --json ошибка — только {"error":…} в stderr (QA-12, 1.1.0); ID
          # существующего кластера — в тексте отказа (existing_id есть в ответе MCP).
          echo "повторный pg_create: код $rc, $(jq -sc --arg id "$CLUSTER_ID" 'map(select(.error))[0] | {reason: .error.reason, existing_is_ours: (.error.message | tostring | contains($id))}' "$RUNNER_TEMP/dup.json" 2>/dev/null || echo '-')"
          jq -se --arg id "$CLUSTER_ID" 'map(select(.error))[0] | .error.reason == "USAGE" and (.error.message | tostring | contains($id))' "$RUNNER_TEMP/dup.json" >/dev/null 2>&1 ||
            { echo "::error::второй pg_create с именем $CLUSTER не отклонён как USAGE с ID нашего кластера (L-32)"; exit 1; }
          n=$(evo tools call pg_list --json | jq -e --arg n "$CLUSTER" '[.clusters[] | select(.name == $n)] | length')
          echo "кластеров $CLUSTER в pg_list: $n"
          [ "$n" = 1 ] || { echo "::error::кластеров $CLUSTER в pg_list: $n, ждали 1 (L-32)"; exit 1; }

      - name: Кластер READY (до 60 мин)
        run: |
          start=$(date +%s)
          while :; do
            st=$(evo tools call "${KIND}_get" --arg cluster_id="$CLUSTER_ID" --json 2>/dev/null |
              jq -r '(.status // .state // "?") | tostring | ascii_upcase') || st="?"
            echo "$(( ($(date +%s) - start) / 60 )) мин: $st"
            # Точные статусы: подстрока *READY* совпала бы и с NOT_READY.
            case "$st" in
              READY|RUNNING) break ;;
              *FAIL*|*ERROR*|*DELET*) echo "::error::кластер $CLUSTER: $st"; exit 1 ;;
            esac
            [ $(( $(date +%s) - start )) -lt 3600 ] || { echo "::error::кластер $CLUSTER не готов за 60 мин (реестр DB-20)"; exit 1; }
            sleep 60
          done

      # Проект кластера на серверах evo mcp --allow-project (REL12-3), пока
      # кластер есть: свой проект — ответ, чужой — NOT_FOUND без проекта.
      - name: pg_get через evo mcp --allow-project
        env:
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          .github/scripts/bound-check.sh pg_get "$(jq -cn --arg c "$CLUSTER_ID" '{cluster_id: $c}')" "allow-project: pg_get"

      # Пароль — из букв и цифр с заглавной, строчной, цифрой и спецсимволом
      # из разрешённых; маскируется до первого использования и идёт через
      # --args-file, не в аргументах командной строки.
      - name: Пользователь, база, резервные копии, операция, превью удаления
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          # call ИНСТРУМЕНТ АРГУМЕНТЫ... — ответ в $RUNNER_TEMP/r.json; ошибка —
          # status, reason и текст через redact.sed, затем ::error:: и выход.
          call() {
            local t=$1 rc
            shift
            set +e
            evo tools call "$t" "$@" --json > "$RUNNER_TEMP/r.json" 2>/dev/null
            rc=$?
            set -e
            [ "$rc" = 0 ] && return 0
            jq -c '{status, reason}' "$RUNNER_TEMP/r.json" 2>/dev/null || true
            echo "$t: $(jq -r '.error // empty' "$RUNNER_TEMP/r.json" 2>/dev/null | redact | cut -c1-300)"
            echo "::error::$t: код $rc"
            exit 1
          }
          # present ИНСТРУМЕНТ КЛЮЧ ИМЯ — ИМЯ появилось в списке за 5 мин.
          present() {
            for i in $(seq 1 10); do
              call "$1" --arg cluster_id="$CLUSTER_ID"
              if jq -e --arg k "$2" --arg n "$3" 'any(.[$k][]?; .name == $n)' "$RUNNER_TEMP/r.json" >/dev/null; then
                echo "$1: всего $(jq --arg k "$2" '.[$k] | length' "$RUNNER_TEMP/r.json"), $3 есть"
                return 0
              fi
              [ "$i" -lt 10 ] || { echo "::error::$3 нет в $1 за 5 мин"; exit 1; }
              sleep 30
            done
          }
          user=evo_e2e_user
          db=evo_e2e_db
          specials='!$%&()*+-,./:;<>=?@[]^_{|}#'
          raw=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9')
          pw="${raw:0:16}Q${specials:$((RANDOM % ${#specials})):1}z7"
          echo "::add-mask::$pw"
          umask 077
          jq -n --arg c "$CLUSTER_ID" --arg n "$user" --arg p "$pw" '{cluster_id: $c, name: $n, password: $p}' > "$RUNNER_TEMP/user.json"
          set +e
          evo --yes tools call pg_user_create --args-file "$RUNNER_TEMP/user.json" --json > "$RUNNER_TEMP/r.json" 2>/dev/null
          rc=$?
          set -e
          rm -f "$RUNNER_TEMP/user.json"
          jq -c '{status, reason}' "$RUNNER_TEMP/r.json" || true
          [ "$rc" = 0 ] || { echo "pg_user_create: $(jq -r '.error // empty' "$RUNNER_TEMP/r.json" 2>/dev/null | redact | cut -c1-300)"; echo "::error::pg_user_create: код $rc"; exit 1; }
          present pg_users users "$user"

          call pg_db_create --yes --arg cluster_id="$CLUSTER_ID" --arg name="$db" --arg owner="$user"
          jq -c '{status}' "$RUNNER_TEMP/r.json"
          present pg_databases databases "$db"

          call pg_backups --arg cluster_id="$CLUSTER_ID"
          echo "pg_backups: резервных копий $(jq '.backups // [] | length' "$RUNNER_TEMP/r.json")"

          if [ -n "${OP_ID:-}" ]; then
            call pg_operation --arg operation_id="$OP_ID" --arg wait_seconds=30
            jq -c '{done, still_running, error: (.error != null)}' "$RUNNER_TEMP/r.json"
            jq -e '.done == true or .still_running == true' "$RUNNER_TEMP/r.json" >/dev/null ||
              { echo "::error::pg_operation: в ответе ни done, ни still_running"; exit 1; }
          else
            echo "::warning::pg_create не вернул operation_id — pg_operation не проверен"
          fi

          # Превью удаления (--dry-run: без подтверждения, ничего не удаляет)
          # называет кластер (реестр R-04).
          call pg_delete --dry-run --arg cluster_id="$CLUSTER_ID"
          jq -c '{status, tool_status: .preview.details.status, target_name: .preview.details.target.name, target_status: .preview.details.target.status}' "$RUNNER_TEMP/r.json"
          jq -e --arg n "$CLUSTER" '.preview.details.status == "confirmation_required" and .preview.details.target.name == $n' "$RUNNER_TEMP/r.json" >/dev/null ||
            { echo "::error::превью pg_delete не называет кластер $CLUSTER"; exit 1; }

      # Резервная копия, затем удаление базы и пользователя (владелец базы —
      # он же: сначала база, иначе база переходит к dbadmin, реестр DB-15).
      - name: pg_backup_create, pg_db_delete, pg_user_delete
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          call() {
            local t=$1 rc
            shift
            set +e
            evo --yes tools call "$t" "$@" --json > "$RUNNER_TEMP/r.json" 2>/dev/null
            rc=$?
            set -e
            [ "$rc" = 0 ] && return 0
            jq -c '{status, reason}' "$RUNNER_TEMP/r.json" 2>/dev/null || true
            echo "$t: $(jq -r '.error // empty' "$RUNNER_TEMP/r.json" 2>/dev/null | redact | cut -c1-300)"
            echo "::error::$t: код $rc"
            exit 1
          }
          has() { # ИНСТРУМЕНТ КЛЮЧ ИМЯ — ИМЯ есть в списке
            evo tools call "$1" --arg cluster_id="$CLUSTER_ID" --json 2>/dev/null | jq -e --arg k "$2" --arg n "$3" 'any(.[$k][]?; .name == $n)' >/dev/null
          }
          call pg_backup_create --arg cluster_id="$CLUSTER_ID" --arg name=evo-e2e-backup
          jq -c '{status}' "$RUNNER_TEMP/r.json"
          op=$(jq -r '.operation_id // empty' "$RUNNER_TEMP/r.json")
          if [ -n "$op" ]; then
            echo "::add-mask::$op"
            for _ in $(seq 1 10); do
              call pg_operation --arg operation_id="$op" --arg wait_seconds=60
              [ "$(jq -r .done "$RUNNER_TEMP/r.json")" = true ] && break
            done
            jq -c '{done, error: (.error != null)}' "$RUNNER_TEMP/r.json"
            jq -e '.done == true and .error == null' "$RUNNER_TEMP/r.json" >/dev/null || { echo "::error::резервная копия не завершилась за 10 мин"; exit 1; }
          fi
          call pg_backups --arg cluster_id="$CLUSTER_ID"
          echo "pg_backups: резервных копий $(jq '.backups // [] | length' "$RUNNER_TEMP/r.json")"
          jq -e '(.backups // []) | length > 0' "$RUNNER_TEMP/r.json" >/dev/null || { echo "::error::pg_backups: копии нет после pg_backup_create"; exit 1; }
          call pg_db_delete --arg cluster_id="$CLUSTER_ID" --arg name=evo_e2e_db
          jq -c '{status}' "$RUNNER_TEMP/r.json"
          for i in $(seq 1 10); do has pg_databases databases evo_e2e_db || break; [ "$i" -lt 10 ] || { echo "::error::база осталась через 5 мин"; exit 1; }; sleep 30; done
          call pg_user_delete --arg cluster_id="$CLUSTER_ID" --arg name=evo_e2e_user
          jq -c '{status}' "$RUNNER_TEMP/r.json"
          for i in $(seq 1 10); do has pg_users users evo_e2e_user || break; [ "$i" -lt 10 ] || { echo "::error::пользователь остался через 5 мин"; exit 1; }; sleep 30; done
          echo "резервная копия, удаление базы и пользователя — ok"

      - name: Удаление кластера (всегда)
        if: always()
        run: .github/scripts/dbaas-delete.sh "$KIND" "$CLUSTER"

  dbaas-kafka:
    environment: cloud-e2e
    if: ${{ inputs.dbaas_smoke && !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    # Создание до 75 мин (живое — 37–39, DB-10), проверки — минуты,
    # удаление: отказы «ещё создаётся» до 120 мин и ожидание до 30.
    timeout-minutes: 300
    env:
      ZONE: ${{ inputs.zone || 'ru.AZ-2' }}
      KIND: kafka
      CLUSTER: evo-e2e-kafka
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - name: Проверка входов
        run: |
          printf '%s' "$ZONE" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' ||
            { echo "::error::недопустимое значение входа: $ZONE"; exit 1; }

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: configure
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] && [ -n "$PROJECT" ] || { echo "::error::нет секретов CLOUDRU_*"; exit 1; }
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      - name: Зона открыта, кластера evo-e2e-kafka нет до прогона
        run: |
          z=$(evo tools call list_zones --json | jq -c --arg n "$ZONE" '[.zones[] | select(.name == $n)][0] // empty')
          [ -n "$z" ] || { echo "::error::зона $ZONE не найдена"; exit 1; }
          [ "$(jq -r '.enabled' <<<"$z")" != false ] ||
            { echo "::error::зона $ZONE закрыта (enabled=false): Cloud.ru в ней сейчас не создаёт и не удаляет ресурсы — запустите с другой зоной (вход zone)"; exit 1; }
          echo "ZONE_ID=$(jq -r '.id' <<<"$z")" >> "$GITHUB_ENV"
          n=$(evo tools call "${KIND}_list" --json | jq -e --arg n "$CLUSTER" '[.clusters[] | select(.name == $n)] | length')
          [ "$n" = 0 ] || { echo "::error::кластер $CLUSTER уже есть — сначала cleanup_only"; exit 1; }
          echo "зона $ZONE открыта, кластера $CLUSTER нет"

      # --region: kafka_create берёт основную подсеть этой зоны и
      # спецификацию этой зоны, по умолчанию — самую дешёвую; диск —
      # минимум спецификации. Один брокер (без репликации) — минимальный
      # живой кластер (L-33).
      - name: kafka_create (1 брокер)
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          set +e
          evo --yes --region "$ZONE_ID" tools call kafka_create --arg name="$CLUSTER" --arg brokers=1 \
            --json > "$RUNNER_TEMP/create.json" 2>/dev/null
          rc=$?
          set -e
          id=$(jq -r '.cluster_id // empty' "$RUNNER_TEMP/create.json" 2>/dev/null || true)
          op=$(jq -r '.operation_id // empty' "$RUNNER_TEMP/create.json" 2>/dev/null || true)
          [ -z "$id" ] || echo "::add-mask::$id"
          [ -z "$op" ] || echo "::add-mask::$op"
          jq -c '{status, reason, cluster_id: ((.cluster_id // "") != ""), operation: ((.operation_id // "") != ""),
            created: ((.created // {}) | {cpu, memory_gb, storage_gib, brokers, availability_zone})}' \
            "$RUNNER_TEMP/create.json" || true
          if [ "$rc" != 0 ]; then
            echo "kafka_create: $(jq -r '.error // empty' "$RUNNER_TEMP/create.json" 2>/dev/null | redact | cut -c1-300)"
            echo "::error::kafka_create: код $rc"
            exit 1
          fi
          az=$(jq -r '.created.availability_zone // empty' "$RUNNER_TEMP/create.json")
          [ "$az" = "$ZONE" ] || echo "::warning::kafka_create: зона кластера $az, а не $ZONE"
          for _ in $(seq 1 10); do
            [ -z "$id" ] || break
            sleep 30
            id=$(evo tools call kafka_list --json | jq -r --arg n "$CLUSTER" '[.clusters[]? | select(.name == $n) | .id][0] // empty')
            [ -z "$id" ] || echo "::add-mask::$id"
          done
          [ -n "$id" ] || { echo "::error::кластер $CLUSTER не появился в kafka_list за 5 мин"; exit 1; }
          echo "CLUSTER_ID=$id" >> "$GITHUB_ENV"

      # L-32 (как у PostgreSQL): без --yes, с теми же аргументами.
      - name: Второй kafka_create с тем же именем отклонён (L-32)
        run: |
          set +e
          evo --region "$ZONE_ID" tools call kafka_create --arg name="$CLUSTER" --arg brokers=1 \
            --json 2> "$RUNNER_TEMP/dup.json" >/dev/null
          rc=$?
          set -e
          # С --json ошибка — только {"error":…} в stderr (QA-12, 1.1.0); ID
          # существующего кластера — в тексте отказа (existing_id есть в ответе MCP).
          echo "повторный kafka_create: код $rc, $(jq -sc --arg id "$CLUSTER_ID" 'map(select(.error))[0] | {reason: .error.reason, existing_is_ours: (.error.message | tostring | contains($id))}' "$RUNNER_TEMP/dup.json" 2>/dev/null || echo '-')"
          jq -se --arg id "$CLUSTER_ID" 'map(select(.error))[0] | .error.reason == "USAGE" and (.error.message | tostring | contains($id))' "$RUNNER_TEMP/dup.json" >/dev/null 2>&1 ||
            { echo "::error::второй kafka_create с именем $CLUSTER не отклонён как USAGE с ID нашего кластера (L-32)"; exit 1; }
          n=$(evo tools call kafka_list --json | jq -e --arg n "$CLUSTER" '[.clusters[] | select(.name == $n)] | length')
          echo "кластеров $CLUSTER в kafka_list: $n"
          [ "$n" = 1 ] || { echo "::error::кластеров $CLUSTER в kafka_list: $n, ждали 1 (L-32)"; exit 1; }

      - name: Кластер READY (до 75 мин)
        run: |
          start=$(date +%s)
          while :; do
            st=$(evo tools call "${KIND}_get" --arg cluster_id="$CLUSTER_ID" --json 2>/dev/null |
              jq -r '(.status // .state // "?") | tostring | ascii_upcase') || st="?"
            echo "$(( ($(date +%s) - start) / 60 )) мин: $st"
            case "$st" in
              READY|RUNNING) break ;;
              *FAIL*|*ERROR*|*DELET*) echo "::error::кластер $CLUSTER: $st"; exit 1 ;;
            esac
            [ $(( $(date +%s) - start )) -lt 4500 ] || { echo "::error::кластер $CLUSTER не готов за 75 мин"; exit 1; }
            sleep 60
          done

      # Проект кластера на серверах evo mcp --allow-project (REL12-3), пока
      # кластер есть: свой проект — ответ, чужой — NOT_FOUND без проекта.
      - name: kafka_get через evo mcp --allow-project
        env:
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          .github/scripts/bound-check.sh kafka_get "$(jq -cn --arg c "$CLUSTER_ID" '{cluster_id: $c}')" "allow-project: kafka_get" own

      - name: kafka_get и превью удаления
        run: |
          evo tools call kafka_get --arg cluster_id="$CLUSTER_ID" --json > "$RUNNER_TEMP/get.json" 2>/dev/null ||
            { jq -c '{status, reason}' "$RUNNER_TEMP/get.json" 2>/dev/null || true; echo "::error::kafka_get"; exit 1; }
          jq -c '{status, brokers, kafka_hosts: ((.kafka_hosts // []) | length)}' "$RUNNER_TEMP/get.json"
          b=$(jq -r 'if (.brokers | type) == "number" then .brokers else empty end' "$RUNNER_TEMP/get.json")
          if [ -z "$b" ]; then
            echo "::warning::kafka_get: brokers — не число, число брокеров не сверено"
          elif [ "$b" != 1 ]; then
            echo "::error::kafka_get: брокеров $b, создавали 1"; exit 1
          fi
          evo --dry-run tools call kafka_delete --arg cluster_id="$CLUSTER_ID" --json > "$RUNNER_TEMP/pv.json" 2>/dev/null ||
            { jq -c '{status, reason}' "$RUNNER_TEMP/pv.json" 2>/dev/null || true; echo "::error::превью kafka_delete"; exit 1; }
          jq -c '{status, tool_status: .preview.details.status, target_name: .preview.details.target.name, target_status: .preview.details.target.status}' "$RUNNER_TEMP/pv.json"
          jq -e --arg n "$CLUSTER" '.preview.details.status == "confirmation_required" and .preview.details.target.name == $n' "$RUNNER_TEMP/pv.json" >/dev/null ||
            { echo "::error::превью kafka_delete не называет кластер $CLUSTER"; exit 1; }

      - name: Удаление кластера (всегда)
        if: always()
        run: .github/scripts/dbaas-delete.sh "$KIND" "$CLUSTER"

  dbaas-redis:
    environment: cloud-e2e
    if: ${{ inputs.dbaas_smoke && !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    # Создание до 50 мин (живое — ~27, DB-12), удаление: отказы «ещё
    # создаётся» до 120 мин и ожидание до 30.
    timeout-minutes: 300
    env:
      ZONE: ${{ inputs.zone || 'ru.AZ-2' }}
      KIND: redis
      CLUSTER: evo-e2e-redis
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - name: Проверка входов
        run: |
          printf '%s' "$ZONE" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' ||
            { echo "::error::недопустимое значение входа: $ZONE"; exit 1; }

      - name: Сборка
        run: go build -o "$RUNNER_TEMP/evo" ./cmd/evo && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: configure
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$SECRET" ] && [ -n "$PROJECT" ] || { echo "::error::нет секретов CLOUDRU_*"; exit 1; }
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      - name: Зона открыта, кластера evo-e2e-redis нет до прогона
        run: |
          z=$(evo tools call list_zones --json | jq -c --arg n "$ZONE" '[.zones[] | select(.name == $n)][0] // empty')
          [ -n "$z" ] || { echo "::error::зона $ZONE не найдена"; exit 1; }
          [ "$(jq -r '.enabled' <<<"$z")" != false ] ||
            { echo "::error::зона $ZONE закрыта (enabled=false): Cloud.ru в ней сейчас не создаёт и не удаляет ресурсы — запустите с другой зоной (вход zone)"; exit 1; }
          echo "ZONE_ID=$(jq -r '.id' <<<"$z")" >> "$GITHUB_ENV"
          n=$(evo tools call "${KIND}_list" --json | jq -e --arg n "$CLUSTER" '[.clusters[] | select(.name == $n)] | length')
          [ "$n" = 0 ] || { echo "::error::кластер $CLUSTER уже есть — сначала cleanup_only"; exit 1; }
          echo "зона $ZONE открыта, кластера $CLUSTER нет"

      # MASTER_REPLICA, 1 шард, replicas=2 — реплики без мастера, как в
      # запросе API (реестр DB-11; 1 и 3 API отвергает); --region — основная
      # подсеть и спецификации этой зоны, по умолчанию самая дешёвая.
      - name: redis_create (MASTER_REPLICA, 1 шард)
        run: |
          redact() { sed -E -f "$GITHUB_WORKSPACE/.github/scripts/redact.sed"; }
          set +e
          evo --yes --region "$ZONE_ID" tools call redis_create --arg name="$CLUSTER" --arg type=MASTER_REPLICA \
            --arg shards=1 --arg replicas=2 --json > "$RUNNER_TEMP/create.json" 2>/dev/null
          rc=$?
          set -e
          id=$(jq -r '.cluster_id // empty' "$RUNNER_TEMP/create.json" 2>/dev/null || true)
          op=$(jq -r '.operation_id // empty' "$RUNNER_TEMP/create.json" 2>/dev/null || true)
          [ -z "$id" ] || echo "::add-mask::$id"
          [ -z "$op" ] || echo "::add-mask::$op"
          jq -c '{status, reason, cluster_id: ((.cluster_id // "") != ""), operation: ((.operation_id // "") != ""),
            created: ((.created // {}) | {cpu, memory_gb, storage_gb, type, shards, replicas, hosts_per_shard, availability_zone})}' \
            "$RUNNER_TEMP/create.json" || true
          if [ "$rc" != 0 ]; then
            echo "redis_create: $(jq -r '.error // empty' "$RUNNER_TEMP/create.json" 2>/dev/null | redact | cut -c1-300)"
            echo "::error::redis_create: код $rc"
            exit 1
          fi
          az=$(jq -r '.created.availability_zone // empty' "$RUNNER_TEMP/create.json")
          [ "$az" = "$ZONE" ] || echo "::warning::redis_create: зона кластера $az, а не $ZONE"
          for _ in $(seq 1 10); do
            [ -z "$id" ] || break
            sleep 30
            id=$(evo tools call redis_list --json | jq -r --arg n "$CLUSTER" '[.clusters[]? | select(.name == $n) | .id][0] // empty')
            [ -z "$id" ] || echo "::add-mask::$id"
          done
          [ -n "$id" ] || { echo "::error::кластер $CLUSTER не появился в redis_list за 5 мин"; exit 1; }
          echo "CLUSTER_ID=$id" >> "$GITHUB_ENV"

      # L-32 (как у PostgreSQL): без --yes, с теми же аргументами.
      - name: Второй redis_create с тем же именем отклонён (L-32)
        run: |
          set +e
          evo --region "$ZONE_ID" tools call redis_create --arg name="$CLUSTER" --arg type=MASTER_REPLICA \
            --arg shards=1 --arg replicas=2 --json 2> "$RUNNER_TEMP/dup.json" >/dev/null
          rc=$?
          set -e
          # С --json ошибка — только {"error":…} в stderr (QA-12, 1.1.0); ID
          # существующего кластера — в тексте отказа (existing_id есть в ответе MCP).
          echo "повторный redis_create: код $rc, $(jq -sc --arg id "$CLUSTER_ID" 'map(select(.error))[0] | {reason: .error.reason, existing_is_ours: (.error.message | tostring | contains($id))}' "$RUNNER_TEMP/dup.json" 2>/dev/null || echo '-')"
          jq -se --arg id "$CLUSTER_ID" 'map(select(.error))[0] | .error.reason == "USAGE" and (.error.message | tostring | contains($id))' "$RUNNER_TEMP/dup.json" >/dev/null 2>&1 ||
            { echo "::error::второй redis_create с именем $CLUSTER не отклонён как USAGE с ID нашего кластера (L-32)"; exit 1; }
          n=$(evo tools call redis_list --json | jq -e --arg n "$CLUSTER" '[.clusters[] | select(.name == $n)] | length')
          echo "кластеров $CLUSTER в redis_list: $n"
          [ "$n" = 1 ] || { echo "::error::кластеров $CLUSTER в redis_list: $n, ждали 1 (L-32)"; exit 1; }

      - name: Кластер READY (до 50 мин)
        run: |
          start=$(date +%s)
          while :; do
            st=$(evo tools call "${KIND}_get" --arg cluster_id="$CLUSTER_ID" --json 2>/dev/null |
              jq -r '(.status // .state // "?") | tostring | ascii_upcase') || st="?"
            echo "$(( ($(date +%s) - start) / 60 )) мин: $st"
            case "$st" in
              READY|RUNNING) break ;;
              *FAIL*|*ERROR*|*DELET*) echo "::error::кластер $CLUSTER: $st"; exit 1 ;;
            esac
            [ $(( $(date +%s) - start )) -lt 3000 ] || { echo "::error::кластер $CLUSTER не готов за 50 мин"; exit 1; }
            sleep 60
          done

      # Проект кластера на серверах evo mcp --allow-project (REL12-3), пока
      # кластер есть: свой проект — ответ, чужой — NOT_FOUND без проекта.
      - name: redis_get через evo mcp --allow-project
        env:
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          .github/scripts/bound-check.sh redis_get "$(jq -cn --arg c "$CLUSTER_ID" '{cluster_id: $c}')" "allow-project: redis_get" own

      # replicas в GET — хосты шарда вместе с мастером (живое: 3 при
      # replicas=2 в запросе, реестр DB-11): только печатается.
      - name: redis_get и превью удаления
        run: |
          evo tools call redis_get --arg cluster_id="$CLUSTER_ID" --json > "$RUNNER_TEMP/get.json" 2>/dev/null ||
            { jq -c '{status, reason}' "$RUNNER_TEMP/get.json" 2>/dev/null || true; echo "::error::redis_get"; exit 1; }
          jq -c '{status, type, shards, replicas, redis_hosts: ((.redis_hosts // []) | length)}' "$RUNNER_TEMP/get.json"
          echo "replicas в redis_get: $(jq -r '.replicas // "-"' "$RUNNER_TEMP/get.json") (создан с replicas=2; GET считает хосты шарда с мастером — DB-11)"
          [ "$(jq -r '.type // empty' "$RUNNER_TEMP/get.json")" = MASTER_REPLICA ] ||
            { echo "::error::redis_get: type не MASTER_REPLICA"; exit 1; }
          evo --dry-run tools call redis_delete --arg cluster_id="$CLUSTER_ID" --json > "$RUNNER_TEMP/pv.json" 2>/dev/null ||
            { jq -c '{status, reason}' "$RUNNER_TEMP/pv.json" 2>/dev/null || true; echo "::error::превью redis_delete"; exit 1; }
          jq -c '{status, tool_status: .preview.details.status, target_name: .preview.details.target.name, target_status: .preview.details.target.status}' "$RUNNER_TEMP/pv.json"
          jq -e --arg n "$CLUSTER" '.preview.details.status == "confirmation_required" and .preview.details.target.name == $n' "$RUNNER_TEMP/pv.json" >/dev/null ||
            { echo "::error::превью redis_delete не называет кластер $CLUSTER"; exit 1; }

      - name: Удаление кластера (всегда)
        if: always()
        run: .github/scripts/dbaas-delete.sh "$KIND" "$CLUSTER"
