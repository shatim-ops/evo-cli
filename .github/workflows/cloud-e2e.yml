# П-74. Одно ручное задание для кандидата 1.9.1.
name: cloud-e2e
run-name: П-74 · net_ports · 623e1c4b

on: workflow_dispatch

permissions:
  contents: read

jobs:
  net_ports:
    if: github.ref == 'refs/heads/claude/live-runs-191-net-ports-p74' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    environment: cloud-e2e
    timeout-minutes: 30
    env:
      CANDIDATE: 623e1c4b36e6f1b59b8ea30d1c9c4114e82eb39d
      CLOUDRU_CONFIG_DIR: ${{ github.workspace }}/.e2e-config
      RUN: r${{ github.run_number }}a${{ github.run_attempt }}
      ZONE: ru.AZ-2
    steps:
      - name: Получить исходники кандидата
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 623e1c4b36e6f1b59b8ea30d1c9c4114e82eb39d
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache: false

      - name: Сверить SHA, собрать CLI и подготовить адресный вызов
        shell: bash
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$CANDIDATE" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          printf 'Кандидат: %s\nWorkflow: %s\n' "$CANDIDATE" "$GITHUB_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/build_evo.sh
          # Функции из точного SHA кандидата. Общая уборка по EXIT и диспетчер областей здесь не вызываются.
          runner=.github/scripts/.p74-net-ports.sh
          awk '
            $0 == "trap finish EXIT" { traps++; next }
            $0 == "case \"$area\" in" { dispatch++; exit }
            { print }
            END { if (traps != 1 || dispatch != 1) exit 1 }
          ' .github/scripts/cloud-live.sh > "$runner"
          cat >> "$runner" <<'P74'
          trap 'rm -rf -- "$tmp"' EXIT
          [[ $area == net ]]
          case "${2:?}" in
            check)
              zid=$(zone_id)
              [[ -n $zid ]] || { bad "зона" "не найдена"; exit 1; }
              net_ports "$zid" || exit 1
              [[ $failed == 0 && "${covered[*]}" == "open_ports close_ports" ]] || exit 1
              sg=$(jq -er '.group | strings' "$net_sg_receipt")
              rule=$(jq -er '.rule | strings' "$net_sg_receipt")
              net_group_detached || { bad "после закрытия" "группа не подтверждена"; exit 1; }
              rules=$(net_group_rules) || { bad "после закрытия" "список правил не подтверждён"; exit 1; }
              jq -e --arg r "$rule" 'all(.[]; .id != $r)' <<< "$rules" >/dev/null ||
                { bad "после закрытия" "правило из квитанции ещё присутствует"; exit 1; }
              ok "после закрытия" "группа доступна, полный список прочитан, ID правила отсутствует"
              ;;
            cleanup)
              if [[ ! -e $net_sg_receipt ]]; then
                bad "уборка группы" "квитанции нет, запрос создания с этой попытки не начинался"
                exit 1
              fi
              sg=$(jq -er '.group | strings | select(test("^[A-Za-z0-9-]{1,64}$"))' "$net_sg_receipt") ||
                { bad "уборка группы" "попытка создания записана без ID, возможен остаток"; exit 1; }
              mask "$sg"
              cleanup_rc=0
              cleanup_net_group || cleanup_rc=$?
              iam_fresh || { bad "конечный GET группы по ID" "нет доступа для подтверждения"; exit 1; }
              api GET "$C1/security-groups/$sg"
              case "$code" in
                404) ok "конечный GET группы по ID из квитанции" "HTTP 404, группы нет" ;;
                200) bad "конечный GET группы по ID из квитанции" "HTTP 200, группа осталась"; exit 1 ;;
                *) bad "конечный GET группы по ID из квитанции" "HTTP $code, исход неизвестен"; exit 1 ;;
              esac
              exit "$cleanup_rc"
              ;;
            *) exit 2 ;;
          esac
          P74
          bash -n "$runner"

      - name: Настроить профиль проекта
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          set -euo pipefail
          [[ -n $KEY_ID && -n $SECRET && -n $PROJECT ]]
          printf '%s' "$SECRET" | evo configure --key-id "$KEY_ID" --secret-stdin --project-id "$PROJECT" >/dev/null

      - name: Проверить открытие, повтор, ID и закрытие правила
        id: ports
        timeout-minutes: 10
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: bash .github/scripts/.p74-net-ports.sh net check

      - name: Убрать свою группу и записать конечный HTTP по её ID
        if: always() && steps.ports.outcome != 'skipped' && steps.ports.outcome != ''
        timeout-minutes: 6
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          PROJECT: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: bash .github/scripts/.p74-net-ports.sh net cleanup
