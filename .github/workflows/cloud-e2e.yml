# Draft for G. Proposed path on the dedicated dispatch ref: .github/workflows/cloud-e2e.yml.
# Review this workflow, .github/scripts/a1/ and the shared dispatch-once scripts.
# This source does not grant permission to dispatch or approve the deployment.
name: cloud-e2e
run-name: А-1 · одна группа и одно правило · d7645da5

on:
  workflow_dispatch:
    inputs:
      reviewed_workflow_sha:
        description: Full job SHA reviewed by G and explicitly approved by the owner, including the final group check/delete interval
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-e2e-191-a1
  cancel-in-progress: false

jobs:
  a1:
    if: >-
      github.repository == 'shatim-ops/evo-cli' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/claude/live-runs-191-a1' &&
      github.run_attempt == '1' &&
      inputs.reviewed_workflow_sha == github.sha
    environment: cloud-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      CANDIDATE: d7645da5efea04122f984cfd8cb9a28408d08177
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - name: Получить рассмотренное задание и родительский коммит
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Проверить защиту от повторного запуска
        shell: bash
        run: python3 -B .github/scripts/dispatch-once-test.py

      - name: Сверить первый ручной запуск этого задания
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 -B .github/scripts/dispatch-once.py

      - name: Подготовить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 4
        with:
          go-version: '1.26.11'
          cache: false

      - name: Сверить исходники, проверить и собрать пробу
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" == "$CANDIDATE" ]]
          paths=(.github/scripts/a1/main.go .github/scripts/a1/main_test.go .github/scripts/dispatch-once-test.py .github/scripts/dispatch-once.py .github/workflows/cloud-e2e.yml)
          diff -u <(printf '%s\n' "${paths[@]}") <(git diff --no-renames --name-only "$CANDIDATE" HEAD | LC_ALL=C sort)
          for path in "${paths[@]}"; do
            [[ "$(git ls-tree --format='%(objectmode)' HEAD -- "$path")" == 100644 ]]
          done
          src="$RUNNER_TEMP/a1-candidate"
          private="$RUNNER_TEMP/a1-private"
          mkdir -m 700 -- "$src" "$private"
          git archive "$CANDIDATE" | tar -x -C "$src"
          mkdir -- "$src/cmd/a1probe"
          for file in main.go main_test.go; do
            git show "HEAD:.github/scripts/a1/$file" > "$src/cmd/a1probe/$file"
          done
          cd "$src"
          go test -mod=readonly -count=1 ./cmd/a1probe
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/a1probe" ./cmd/a1probe
          printf 'Кандидат `%s`. Исходник задания `%s`.\n' "$CANDIDATE" "$GITHUB_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Создать свою группу и одно правило, пройти штатный destroy
        id: probe
        shell: bash
        timeout-minutes: 5
        env:
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          timeout --kill-after=5s 260s "$RUNNER_TEMP/a1probe" probe >"$RUNNER_TEMP/a1-private/probe.out" 2>/dev/null

      - name: Завершить уборку только по квитанции
        id: cleanup
        if: ${{ always() && steps.probe.outcome != 'skipped' && steps.probe.outcome != '' }}
        shell: bash
        timeout-minutes: 5
        env:
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          timeout --kill-after=5s 260s "$RUNNER_TEMP/a1probe" cleanup >"$RUNNER_TEMP/a1-private/cleanup.out" 2>/dev/null

      - name: Опубликовать проверенные признаки завершения
        if: ${{ always() && steps.probe.outcome != 'skipped' && steps.probe.outcome != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          text = ""
          path = Path(os.environ["RUNNER_TEMP"], "a1-private", "cleanup.out")
          if path.is_file() and path.stat().st_size < 256:
              text = path.read_text(encoding="ascii", errors="replace").strip()
          pattern = r"candidate_confirmed=(true|false) rule_deleted=(true|false) group_deleted=(true|false) possible_residue=(true|false)"
          result = re.fullmatch(pattern, text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              if result:
                  print(text, file=summary)
              else:
                  print("Исход уборки не подтверждён. Возможен остаток.", file=summary)
          sys.exit(0 if result and result.groups() == ("true", "true", "true", "false") else 1)
          PY
