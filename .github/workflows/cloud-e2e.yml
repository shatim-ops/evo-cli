# P-85 B-3. A process commit on the candidate; dispatch once after G's review
# and the owner's separate approval. One IAM exchange; 0-2 database GETs per
# service, 0-6 GETs total. No resource creation and no cleanup.
name: cloud-e2e
run-name: B-3 · исходные страницы PostgreSQL, Kafka и Redis

on:
  workflow_dispatch:
    inputs:
      reviewed_workflow_sha:
        description: Полный SHA задания, проверенный G
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cloud-e2e-191-b3-lists
  cancel-in-progress: false

env:
  CANDIDATE: d7645da5efea04122f984cfd8cb9a28408d08177
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Проверить ветку, оба SHA и состав задания перед выдачей доступа
        shell: bash
        env:
          REVIEWED: ${{ inputs.reviewed_workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == shatim-ops/evo-cli && "$GITHUB_REF" == refs/heads/claude/live-runs-191-b3-lists ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          # P-85 explicitly stops these checks on the previous audit head.
          [[ "$CANDIDATE" != c88fe63f3307855fdaddccc98b32034abbcfa7ce ]]
          [[ "$REVIEWED" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$(git show -s --format=%P HEAD)" == "$CANDIDATE" ]]
          paths=(.github/scripts/b3lists/main.go .github/scripts/b3lists/probe_test.go .github/scripts/dispatch-once-test.py .github/scripts/dispatch-once.py .github/workflows/cloud-e2e.yml)
          diff -u <(printf '%s\n' "${paths[@]}") <(git diff --no-renames --name-only "$CANDIDATE" HEAD | LC_ALL=C sort)
          for path in "${paths[@]}"; do
            [[ "$(git ls-tree --format='%(objectmode)' HEAD -- "$path")" == 100644 ]]
          done
          python3 -B .github/scripts/dispatch-once-test.py

      - name: Проверить первый ручной запуск на этой ветке и SHA задания
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/dispatch-once.py

  b3:
    needs: guard
    environment: cloud-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false

      - name: Собрать пробу с кодом кандидата и проверить её без доступа к проекту
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$(git show -s --format=%P HEAD)" == "$CANDIDATE" ]]
          src="$RUNNER_TEMP/b3-candidate"
          mkdir -m 700 "$src"
          git archive "$CANDIDATE" | tar -x -C "$src"
          mkdir "$src/cmd/b3lists"
          for file in main.go probe_test.go; do
            git show "HEAD:.github/scripts/b3lists/$file" > "$src/cmd/b3lists/$file"
          done
          cd "$src"
          go test -mod=readonly -count=1 ./cmd/b3lists
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/b3lists" ./cmd/b3lists

      - name: Снять только формы страниц и проверить чтение сохранённых ответов кандидатом
        shell: bash
        timeout-minutes: 3
        env:
          GODEBUG: 'http2client=0'
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          timeout --kill-after=3s 120s "$RUNNER_TEMP/b3lists" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
