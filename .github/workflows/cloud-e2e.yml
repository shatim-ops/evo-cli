name: cloud-e2e
run-name: P90 ${{ inputs.mode }} · d7645da5

on:
  workflow_dispatch:
    inputs:
      reviewed_workflow_sha:
        description: Full process commit reviewed for this invocation
        required: true
        type: string
      mode:
        description: Full patch test or ID-only recovery of the original attempt
        required: true
        type: choice
        options: [full, recover]
      original_run_id:
        description: Recovery only. Numeric ID of the finished original full run
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: cloud-e2e-p90-d7645da5
  cancel-in-progress: false

env:
  CANDIDATE: d7645da5efea04122f984cfd8cb9a28408d08177
  P90_MODE: ${{ inputs.mode }}
  GOWORK: 'off'
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  guard:
    if: github.ref == 'refs/heads/claude/live-runs-191-p90-d7645da5'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      source: ${{ steps.bound.outputs.source_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - id: bound
        name: Check branch, reviewed history, candidate, written scope and previous attempts
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED: ${{ inputs.reviewed_workflow_sha }}
          ORIGINAL_RUN: ${{ inputs.original_run_id }}
        run: python3 .github/scripts/patch-e2e/dispatch.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: false
      - name: Verify policies and scenario logic with local fixtures
        run: python3 -m unittest discover -s .github/scripts/patch-e2e -p 'test_*.py'

  cloud:
    name: P90 / ${{ matrix.suite }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        suite: [reads, apps, core, misc, cluster, pg]
    needs: guard
    runs-on: ubuntu-24.04
    environment: cloud-e2e
    timeout-minutes: 360
    env:
      P90_SUITE: ${{ matrix.suite }}
      P90_SOURCE_RUN: ${{ needs.guard.outputs.source }}
      P90_RUNNER_CIDR: ${{ vars.P90_RUNNER_CIDR }}
      CLOUDRU_REGION: ru.AZ-2
      CLOUDRU_TIMEOUT: '1200'
      P90_RECEIPT_REPOSITORY: ${{ vars.P90_RECEIPT_REPOSITORY }}
      P90_RECEIPT_BRANCH: ${{ vars.P90_RECEIPT_BRANCH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build the product from the pinned candidate tree and separate protected entry points
        run: |
          set -euo pipefail
          umask 077
          for dep in openssl docker ssh curl kubectl helm; do command -v "$dep" > /dev/null; done
          kubectl version --client=true --output=json > /dev/null
          helm version --short
          docker version --format '{{.Server.Version}}'
          PYTHONPATH=.github/scripts/patch-e2e python3 -c 'import os, dispatch; dispatch.validate_source(os.environ["GITHUB_SHA"])'
          src="$RUNNER_TEMP/p90-product"
          mkdir -p "$src"
          git archive "$CANDIDATE" | tar -x -C "$src"
          runner="$GITHUB_WORKSPACE/.github/scripts/patch-e2e"
          cd "$src"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/evo" ./cmd/evo
          for pair in core:coremain ca:appmain net:netmain; do
            name=${pair%%:*}
            mkdir "cmd/p90$name"
            cp "$runner/${pair##*:}/"*.go "cmd/p90$name/"
            go test -mod=readonly -count=1 "./cmd/p90$name"
            go build -mod=readonly -trimpath -o "$RUNNER_TEMP/p90$name" "./cmd/p90$name"
          done
          {
            echo "P90_DRIVER=$runner/driver.py"
            echo "EVO_BIN=$RUNNER_TEMP/evo"
            echo "P90_CORE_BIN=$RUNNER_TEMP/p90core"
            echo "P90_NET_BIN=$RUNNER_TEMP/p90net"
            echo "P90_CA_BIN=$RUNNER_TEMP/p90ca"
            echo "CLOUDRU_CONFIG_DIR=$RUNNER_TEMP/p90-config"
          } >> "$GITHUB_ENV"
      - name: Establish the source of inbound VM test traffic
        if: inputs.mode == 'full' && matrix.suite == 'core'
        run: python3 .github/scripts/patch-e2e/egress.py
      - id: start
        name: Open or verify the signed private receipt outside the runner
        env:
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
          P90_RECEIPT_TOKEN: ${{ secrets.P90_RECEIPT_TOKEN }}
          P90_RECEIPT_HMAC_KEY: ${{ secrets.P90_RECEIPT_HMAC_KEY }}
        run: python3 "$P90_DRIVER" begin
      - id: preflight
        if: inputs.mode == 'full'
        name: Verify ownership protections and bounds before the first paid operation
        env:
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          P90_RECEIPT_TOKEN: ${{ secrets.P90_RECEIPT_TOKEN }}
          P90_RECEIPT_HMAC_KEY: ${{ secrets.P90_RECEIPT_HMAC_KEY }}
        run: python3 "$P90_DRIVER" preflight
      - if: inputs.mode == 'full'
        name: Run reviewed areas using this candidate
        timeout-minutes: 285
        env:
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          P90_RECEIPT_TOKEN: ${{ secrets.P90_RECEIPT_TOKEN }}
          P90_RECEIPT_HMAC_KEY: ${{ secrets.P90_RECEIPT_HMAC_KEY }}
        run: python3 "$P90_DRIVER" full
      - if: always() && steps.start.outcome == 'success' && (inputs.mode == 'recover' || steps.preflight.outcome == 'success')
        name: Read back owned IDs and reconcile outstanding receipts
        timeout-minutes: 55
        env:
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          P90_RECEIPT_TOKEN: ${{ secrets.P90_RECEIPT_TOKEN }}
          P90_RECEIPT_HMAC_KEY: ${{ secrets.P90_RECEIPT_HMAC_KEY }}
        run: python3 "$P90_DRIVER" cleanup
