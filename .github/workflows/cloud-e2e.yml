# P-79: dedicated process ref with a single parent at the reviewed 1.9.1 candidate.
name: cloud-e2e
run-name: G-11 · каталог образов · d7645da5

on:
  workflow_dispatch:
    inputs:
      reviewed_workflow_sha:
        description: Полный SHA задания, проверенного G
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-e2e-191-g11-images
  cancel-in-progress: false

jobs:
  g11:
    if: >-
      github.repository == 'shatim-ops/evo-cli' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/claude/live-runs-g11-d7645da5' &&
      github.run_attempt == '1' &&
      inputs.reviewed_workflow_sha == github.sha
    runs-on: ubuntu-24.04
    environment: cloud-e2e
    timeout-minutes: 12
    env:
      CANDIDATE: d7645da5efea04122f984cfd8cb9a28408d08177
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Получить задание и родительский коммит
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Проверить единственность запуска по истории Actions
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/dispatch-once-test.py
          python3 .github/scripts/dispatch-once.py

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false

      - name: Сверить оба SHA, собрать пробу и выполнить автономные тесты
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" == "$CANDIDATE" ]]
          paths=(.github/scripts/dispatch-once-test.py .github/scripts/dispatch-once.py .github/scripts/g11/main.go .github/scripts/g11/probe_test.go .github/workflows/cloud-e2e.yml)
          diff -u <(printf '%s\n' "${paths[@]}") <(git diff --no-renames --name-only "$CANDIDATE" HEAD | LC_ALL=C sort)
          for path in "${paths[@]}"; do
            [[ "$(git ls-tree --format='%(objectmode)' HEAD -- "$path")" == 100644 ]]
          done
          src="$RUNNER_TEMP/g11-candidate"
          mkdir -m 700 "$src"
          git archive "$CANDIDATE" | tar -x -C "$src"
          mkdir "$src/cmd/g11probe"
          for file in main.go probe_test.go; do
            git show "HEAD:.github/scripts/g11/$file" > "$src/cmd/g11probe/$file"
          done
          cd "$src"
          go test -mod=readonly -count=1 ./cmd/g11probe
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/g11probe" ./cmd/g11probe
          printf 'Кандидат %s · задание %s\n' "$CANDIDATE" "$GITHUB_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Проверить форму каталога и записать обезличенный итог
        shell: bash
        timeout-minutes: 3
        env:
          # A fresh HTTP/1.1 connection per request prevents HTTP/2 stream retries.
          GODEBUG: 'http2client=0'
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          printf 'G-11 · облачная стоимость 0 ₽ · создано 0 · к уборке 0\n\n' >> "$GITHUB_STEP_SUMMARY"
          timeout --kill-after=5s 145s "$RUNNER_TEMP/g11probe" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
