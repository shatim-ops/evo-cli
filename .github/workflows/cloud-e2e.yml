# Draft for G. Proposed path on the dedicated dispatch ref: .github/workflows/cloud-e2e.yml.
# Review both this workflow and .github/scripts/g10probe/{main.go,probe_test.go}.
# This source does not grant permission to dispatch or approve the deployment.
name: cloud-e2e
run-name: G-10 · one floating IP · 7677f6a5

on:
  workflow_dispatch:
    inputs:
      reviewed_workflow_sha:
        description: Full SHA of the process commit reviewed by G and approved by the owner
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cloud-e2e-191-g10-fip
  cancel-in-progress: false

jobs:
  g10:
    if: >-
      github.repository == 'shatim-ops/evo-cli' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/claude/live-runs-191-g10-fip' &&
      github.run_attempt == '1' &&
      inputs.reviewed_workflow_sha == github.sha
    environment: cloud-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      CANDIDATE: 7677f6a5e26778d8dfce0035674570ba89b0b7b7
      G10_ZONE: ru.AZ-2
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - name: Получить рассмотренное задание и родительский коммит
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Подготовить Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 4
        with:
          go-version: '1.26.11'
          cache: false

      - name: Сверить исходники, проверить и собрать пробу
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git show -s --format=%P HEAD)" == "$CANDIDATE" ]]
          paths=(.github/scripts/g10probe/main.go .github/scripts/g10probe/probe_test.go .github/workflows/cloud-e2e.yml)
          diff -u <(printf '%s\n' "${paths[@]}") <(git diff --no-renames --name-only "$CANDIDATE" HEAD | LC_ALL=C sort)
          for path in "${paths[@]}"; do
            [[ "$(git ls-tree --format='%(objectmode)' HEAD -- "$path")" == 100644 ]]
          done
          src="$RUNNER_TEMP/g10-candidate"
          private="$RUNNER_TEMP/g10-private"
          mkdir -m 700 -- "$src" "$private"
          printf 'G10_RECEIPT=%s/receipt.json\n' "$private" >> "$GITHUB_ENV"
          git archive "$CANDIDATE" | tar -x -C "$src"
          mkdir -- "$src/cmd/g10probe"
          for file in main.go probe_test.go; do
            git show "HEAD:.github/scripts/g10probe/$file" > "$src/cmd/g10probe/$file"
          done
          cd "$src"
          go test -mod=readonly -count=1 ./cmd/g10probe
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/g10probe" ./cmd/g10probe
          printf 'Кандидат `%s`. Исходник задания `%s`.\n' "$CANDIDATE" "$GITHUB_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Один запрос резервирования и проверка поля description
        id: probe
        timeout-minutes: 5
        env:
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          [[ -n "$CLOUDRU_KEY_ID" && -n "$CLOUDRU_SECRET" && -n "$CLOUDRU_PROJECT_ID" ]]
          private="$RUNNER_TEMP/g10-private"
          date +%s > "$private/start"
          timeout --kill-after=5s 220s "$RUNNER_TEMP/g10probe" probe > "$private/probe.out" 2>/dev/null

      - name: Уборка только по квитанции и конечный GET по ID
        if: ${{ always() && steps.probe.outcome != 'skipped' && steps.probe.outcome != '' }}
        id: cleanup
        timeout-minutes: 5
        env:
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          private="$RUNNER_TEMP/g10-private"
          now=$(date +%s)
          rc=0
          # The probe has persisted its own pre-POST/returned-ID receipt; this mode never creates.
          timeout --kill-after=5s 260s "$RUNNER_TEMP/g10probe" cleanup > "$private/cleanup.out" 2>/dev/null || rc=$?
          elapsed=$(( $(date +%s) - now ))
          printf 'Проверка уборки заняла %s с.\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$private/start" ]]; then
            delay=$(( now - $(cat "$private/start") ))
            printf 'Начало уборки через %s с от старта пробы (до POST).\n' "$delay" >> "$GITHUB_STEP_SUMMARY"
            (( delay <= 300 && elapsed <= 300 )) || rc=1
          fi
          exit "$rc"

      - name: Обезличенный итог попытки
        if: ${{ always() && steps.probe.outcome != 'skipped' && steps.probe.outcome != '' }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import sys
          from pathlib import Path

          state = Path(os.environ["RUNNER_TEMP"]) / "g10-private"
          fields = (
              "post_dispatched post_id_received post_marker_present post_marker_exact "
              "card_marker_present card_marker_exact list_marker_present list_marker_exact "
              "delete_dispatched service_404_confirmed"
          ).split()
          flags = " ".join(key + "=(?:true|false)" for key in fields)
          complete = True
          gone = False
          no_post = False
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              for stage in ("probe", "cleanup"):
                  report = state / (stage + ".out")
                  text = report.read_text(encoding="ascii", errors="replace").strip() if report.is_file() else ""
                  if re.fullmatch(f"stage={stage} " + flags, text):
                      print(text, file=out)
                      if stage == "cleanup":
                          gone = text.endswith(" service_404_confirmed=true")
                          no_post = " post_dispatched=false " in text
                  elif stage == "cleanup" and re.fullmatch(
                      r"cleanup: post_dispatched=(?:true|false) service_404_confirmed=(?:true|false)", text
                  ):
                      print(text, file=out)
                      gone = text.endswith(" service_404_confirmed=true")
                      no_post = " post_dispatched=false " in text
                  else:
                      print(f"{stage}: нет подтверждённого результата", file=out)
                      complete = False
              receipt = state / "receipt.json"
              if receipt.is_file():
                  print("SHA-256 квитанции:", hashlib.sha256(receipt.read_bytes()).hexdigest(), file=out)
              if no_post and not gone:
                  print("Квитанция подтверждает, что POST не отправлен. Остаток этого прогона: 0.", file=out)
              elif not gone:
                  print("Конечный сервисный 404 не подтверждён. Возможен остаток, сообщить владельцу.", file=out)
              else:
                  print("Конечный сервисный 404 подтверждён. Остаток этого прогона: 0.", file=out)
          sys.exit(0 if complete and gone else 1)
          PY
