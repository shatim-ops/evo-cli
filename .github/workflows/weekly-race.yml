name: weekly-race

# Детектор нестабильных тестов (аудит процессов 1.2.1, PR 10, П2): раз в
# неделю весь go test на main трижды подряд в случайном порядке и с -race
# на трёх ОС. CI гоняет каждый тест один раз; гонка или зависимость от
# порядка, которая проявляется раз из нескольких прогонов, видна здесь, а не
# в чужом PR. Красный прогон открывает issue (или дописывает в открытый) со
# ссылкой на прогон: зерно -shuffle — в логе, -shuffle=<зерно> его повторяет.
# «Flaky» — не причина: тест чинится в тот же день, без карантина.
# Время — UTC, воскресенье 06:29 по Москве.

on:
  schedule:
    - cron: "29 3 * * 0"
  workflow_dispatch:
    inputs:
      # Диагностика падений рантайма Go под -race на Windows
      # (process-handoff.md, бэклог; #331): только job gc-probe ниже.
      windows_gc_probe:
        description: "Только проба GC на Windows (матрица осей, tools)"
        type: boolean
        default: false

permissions: {}

jobs:
  race:
    if: github.ref == 'refs/heads/main' && !inputs.windows_gc_probe
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # Как в ci.yml: без этого checkout на Windows превращает LF в CRLF.
      - name: git без перевода строк
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Та же версия, что в ci.yml; поднимать вместе.
          go-version: "1.26.10"
          cache-dependency-path: go.sum

      - run: go test -race -count=3 -shuffle=on ./...
        env:
          GORACE: atexit_sleep_ms=0

      # Ожидание, которое тест задаёт в миллисекундах, а успеха ждёт после
      # N опросов, решает таймер: на Windows его тик — 15,6 мс (#277,
      # случайно пойман на #283). Миры engine и tools — 20 раз подряд на
      # Windows, без -race: рантайм Go под -race там падает сам
      # (process-handoff.md, «CI не от diff») и заслонил бы такие тесты.
      - name: миры engine и tools ×20 (тик таймера Windows)
        if: runner.os == 'Windows'
        run: go test -count=20 -shuffle=on ./internal/engine/ ./internal/tools/

  # Падения рантайма Go на Windows (#226, #219, #267, #278, #293, #331).
  # Первые два запуска (run 40135541445, 40163378381): ACL в
  # internal/config — не причина (config ×200 ok); internal/tools с
  # GODEBUG=invalidptr=1,gccheckmark=1 падает на первом прогоне и под -race,
  # и без, на Linux — чисто. Третий запуск (решение владельца 25.10) ищет
  # ось, которая убирает падение: Go (1.26.10 как в ci.yml, 1.27.x, tip из
  # исходников) и сборщик (Green Tea или нет) — матрица job; -race,
  # проверки сборщика и асинхронное вытеснение — восемь прогонов
  # gc-probe-matrix.sh. Итог — таблица в сводке каждого job. Запуск —
  # вручную, с любой ветки: секретов и записи нет.
  gc-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_gc_probe
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.10"]
        gc: ["greenteagc"]
    runs-on: windows-latest
    # tip собирается ~10 мин; 8 прогонов по -count=3 с запасом.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      GOEXPERIMENT: ${{ matrix.gc == 'nogreenteagc' && 'nogreenteagc' || '' }}
    steps:
      - name: git без перевода строк
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # tip собирается этой версией.
          go-version: ${{ matrix.go == 'tip' && '1.26.10' || matrix.go }}
          cache-dependency-path: go.sum

      - name: Go tip из исходников
        if: matrix.go == 'tip'
        shell: bash
        run: |
          git clone --depth 1 https://go.googlesource.com/go "$RUNNER_TEMP/gotip"
          git -C "$RUNNER_TEMP/gotip" log -1 --format='tip: %H %cs' >> "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP/gotip/src"
          GOROOT_BOOTSTRAP="$(go env GOROOT)" GOEXPERIMENT='' cmd //c make.bat
          echo "$RUNNER_TEMP/gotip/bin" >> "$GITHUB_PATH"
        env:
          GOTOOLCHAIN: local

      - name: восемь прогонов tools
        shell: bash
        run: bash .github/scripts/gc-probe-matrix.sh ./internal/tools/
        env:
          GOTOOLCHAIN: local

  # Красное — в issue (weekly-issue.yml).
  report:
    needs: race
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/weekly-issue.yml
    with:
      title: "weekly-race: нестабильный тест на main"
      what: "go test -race -count=3 -shuffle=on или прогон миров ×20 на Windows упал. Зерно -shuffle — в логе job; -shuffle=<зерно> повторяет порядок."
