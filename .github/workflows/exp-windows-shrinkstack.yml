# Эксперимент «Процесса · 1.3» (не сливать): цена GODEBUG=gcshrinkstackoff=1
# на Windows под -race — задержки как в #262 и время пакета internal/tools.
# Гипотеза падений рантайма: порча стека при shrinkstack (#226, #219, #267).
name: exp-windows-shrinkstack
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/exp-windows-shrinkstack.yml"]
permissions:
  contents: read
jobs:
  exp:
    strategy:
      fail-fast: false
      matrix:
        godebug: ["", "gcshrinkstackoff=1"]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: git без перевода строк
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: go.sum
      - name: state.Update на диске раннера
        env:
          EVO_EXP: "1"
          GODEBUG: ${{ matrix.godebug }}
        run: go test -race -count=1 -run TestExp_WriteTiming -v ./internal/state/
      - name: TestFault_Matrix/provision ×5
        env:
          GORACE: atexit_sleep_ms=0
          GODEBUG: ${{ matrix.godebug }}
        shell: bash
        run: |
          go test -race -count=5 -run 'TestFault_Matrix/provision$' -v ./internal/tools/ > out.txt 2>&1 || true
          grep -E -- '--- (PASS|FAIL): TestFault_Matrix/provision/' out.txt | sed -E 's/.*provision\/([^ ]+) \(([0-9.]+)s\)/\2 \1/' | sort -rn | head -15
          grep -c -- '--- FAIL' out.txt || true
          grep 'waited' out.txt || true
      - name: internal/tools целиком ×3
        env:
          GORACE: atexit_sleep_ms=0
          GODEBUG: ${{ matrix.godebug }}
        shell: bash
        run: |
          for i in 1 2 3; do
            s=$(date +%s); rc=0; go test -race -count=1 ./internal/tools/ > t.txt 2>&1 || rc=$?
            echo "прогон $i: код $rc, $(( $(date +%s) - s )) с"; tail -3 t.txt
          done
