# Экшены закреплены по SHA коммита, базовые образы — по digest: тег у
# стороннего репозитория можно переписать, SHA и digest — нет. Dependabot
# поднимает их PR-ами (с версией в комментарии), а не молча.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pflag 1.1.0 печатает каждый булев флаг в справке как
      # `--флаг[=true|false]`, выключателя нет: справка всех команд evo
      # меняется, четыре теста справки краснеют (#1299). Остаёмся на
      # 1.0.x (docs/internal/release-plan.md, строка 1.9 о pflag).
      # Правило глушит все минорные версии: когда в pflag появится
      # выключатель или выйдет бюллетень безопасности — снять его вручную.
      # Проходят ли обновления безопасности поверх `ignore`, не проверено.
      - dependency-name: github.com/spf13/pflag
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
