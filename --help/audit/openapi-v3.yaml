openapi: 3.0.0
info:
    title: API сервиса "Аудит-логирование"
    description: '[Документация сервиса "Аудит-логирование"](https://cloud.ru/docs/audit-logging/ug/index.html)'
    contact:
        email: support@cloud.ru
    version: v.1
servers:
    - url: https://audit.api.cloud.ru
tags:
- name: Audit Logs
paths:
  /events/list/{projectId}:
    get:
      tags:
      - Audit Logs
      summary: Получение списка аудит-логов проекта
      description: Метод для получения списка аудит-логов для указанного проекта. Поддерживает фильтрацию, сортировку и пагинацию результатов. Доступ к методу ограничен — чтобы получать аудит-логи проекта, [обратитесь в техническую поддержку](https://cloud.ru/docs/audit-logging/ug/contacts/technical-support). 
      operationId: AuditGisAdapter_ListAuditLogs
      parameters:
      - name: projectId
        in: path
        description: Уникальный идентификатор проекта в формате UUID.
        required: true
        schema:
          type: string
      - name: eventType
        in: query
        description: >- 
          Тип события для фильтрации, например: `user.login`, `resource.create`.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_-]{0,55}$
      - name: eventSource
        in: query
        description: >-
          Источник события для фильтрации, например: `auth-service`, `api-gateway`.
        schema:
          type: string
          pattern: ^[\w\W]{0,255}$
      - name: start
        in: query
        description: >-
          Начало временного диапазона для фильтрации. 
          Заполняется в формате RFC3339, например: `2026-01-15T10:30:00Z`.
        schema:
          type: string
          format: date-time
      - name: end
        in: query
        description: >-
          Конец временного диапазона для фильтрации. 
          Заполняется в формате RFC3339, например: `2026-01-15T23:59:59Z`.
        schema:
          type: string
          format: date-time
      - name: sort.field
        in: query
        description: >-
          Поле для сортировки результатов, например: `eventTime`, `eventType`.
        schema:
          type: string
      - name: sort.direction
        in: query
        description: >-
          Направление сортировки:
           - SORT_DIRECTION_UNSPECIFIED — по умолчанию;
           - SORT_DIRECTION_ASCENDING — по возрастанию;
           - SORT_DIRECTION_DESCENDING — по убыванию.
        schema:
          type: string
          default: SORT_DIRECTION_UNSPECIFIED
          enum:
          - SORT_DIRECTION_UNSPECIFIED
          - SORT_DIRECTION_ASCENDING
          - SORT_DIRECTION_DESCENDING
      - name: nextPageToken
        in: query
        description: Токен для получения следующей страницы результатов. Используется для пагинации. Максимальное значение — 1024 символа. 
        schema:
          type: string
      - name: limit
        in: query
        description: >-
          Максимальное количество записей в ответе. Максимальное значение — `500`.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Успешное выполнение запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListAuditLogsResponse'
        '400':
          description: Некорректный запрос.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: Необходима авторизация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: Доступ запрещен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
  /events/list/console/{customerId}:
    get:
      tags:
        - Audit Logs
      summary: Получение списка сокращенных аудит-логов организации
      description: >-
        Метод для получения списка сокращенных аудит-логов для указанной
        организации. Поддерживает фильтрацию, сортировку и пагинацию результатов.
        Доступ к методу ограничен — чтобы получать аудит-логи,
        [обратитесь в техническую
        поддержку](https://cloud.ru/docs/audit-logging/ug/contacts/technical-support).
      operationId: AuditGisAdapter_GetAuditLogs
      parameters:
        - name: customerId
          in: path
          description: Идентификатор организации в формате UUID.
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          description: >-
            Идентификатор проекта в формате UUID. Если у вас роль администратора организации, указывать идентификатор проекта не нужно.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: eventId
          in: query
          description: Идентификатор события в формате UUID.
          required: false
          schema:
            type: string
        - name: eventSource
          in: query
          description: >-
            Источник события для фильтрации, например: `auth-service`,
            `api-gateway`.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 255
        - name: eventType
          in: query
          description: >-
            Тип события для фильтрации, например: `user.login`,
            `resource.create`.
          required: false
          schema:
            type: array
            items:
              type: string
              pattern: ^[a-zA-Z_-]{0,55}$
        - name: eventLevel
          in: query
          description: Уровень события, например `INFO`, `WARN`, `ERROR` или другие.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 255
        - name: start
          in: query
          description: >-
            Начало временного диапазона для фильтрации. 
            Заполняется в формате RFC3339, например: ``2026-01-14T00:00:00Z``.
          required: false
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: >-
            Конец временного диапазона для фильтрации. 
            Заполняется в формате RFC3339, например: ``2026-01-15T23:59:59Z``.
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: >-
            Максимальное количество записей в ответе. Максимальное значение —
            `500`.
          required: false
          schema:
            type: integer
            format: int32
        - name: cursor.after
          in: query
          description: Курсор для перехода на следующую страницу.
          required: false
          schema:
            type: string
        - name: cursor.before
          in: query
          description: Курсор для перехода на предыдущую страницу.
          required: false
          schema:
            type: string
        - name: sort.field
          in: query
          description: 'Поле для сортировки результатов, например: `eventTime`, `eventType`.'
          required: false
          schema:
            type: string
        - name: sort.direction
          in: query
          description: |-
            Направление сортировки результатов:
              - `SORT_DIRECTION_UNSPECIFIED` — по умолчанию;
              - `SORT_DIRECTION_ASCENDING` — по возрастанию;
              - `SORT_DIRECTION_DESCENDING` — по убыванию.
          required: false
          schema:
            type: string
            default: SORT_DIRECTION_UNSPECIFIED
            enum:
              - SORT_DIRECTION_UNSPECIFIED
              - SORT_DIRECTION_ASCENDING
              - SORT_DIRECTION_DESCENDING
        - name: tags
          in: query
          description: Фильтрация по тегам события.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: logSources
          in: query
          description: |-
            Источники лога:
              - `LOG_SOURCE_PLATFORM` — облачная платформа;
              - `SORT_DIRECTION_ASCENDING` — клиентские приложения.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - LOG_SOURCE_PLATFORM
                - LOG_SOURCE_CLIENT
        - name: filter
          in: query
          description: >-
            Дополнительный фильтрующий запрос [на языке фильтрующих
            выражений](https://cloud.ru/docs/audit-logging/ug/topics/concepts__filter). Максимальный размер — 65535 байтов.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Успешное выполнение запроса.
          content:
            application/json:
              schema:
                $ref:  '#/components/schemas/v1GetAuditLogsResponse'
        '400':
          description: Некорректный запрос.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: Необходима авторизация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: Доступ запрещен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '404':
          description: События не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'   
        '500':
          description: Внутренняя ошибка сервиса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'                    
  /events/{customerId}/{eventId}:
    get:
      tags:
      - Audit Logs
      summary: Получение аудит-лога по его ID
      description: >-
        Метод для получения полного лога по его ID. Поддерживает фильтрацию,
        сортировку и пагинацию результатов. Доступ к методу ограничен — чтобы
        получить аудит-логи, [обратитесь в техническую
        поддержку](https://cloud.ru/docs/audit-logging/ug/contacts/technical-support).
      operationId: AuditGisAdapter_GetAuditLog
      responses:
        '200':
          description: Успешное выполнение запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetAuditLogResponse'
        '400':
          description: Некорректный запрос.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '401':
          description: Необходима авторизация.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '403':
          description: Доступ запрещен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
        '404':
          description: Событие не найдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'   
        '500':
          description: Внутренняя ошибка сервиса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
        - name: customerId
          in: path
          description: Идентификатор организации в формате UUID.
          required: true
          schema:
            type: string
        - name: eventId
          in: path
          description: Идентификатор события в формате UUID.
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          description: >-
            Идентификатор проекта в формате UUID. 
            Если у вас роль администратора организации, указывать идентификатор проекта не нужно.
          required: false
          schema:
            type: string
  /events/{customer_id}:
    post:
      tags:
      - Audit Logs
      summary: Получение клиентских аудит-логов ГИС
      description: >-
        Метод для получения клиентских аудит-логов ГИС, отправленных в сервис аудит-логирования. Поддерживает фильтрацию,
        сортировку и пагинацию результатов. Доступ к методу ограничен — чтобы
        получить аудит-логи, [обратитесь в техническую
        поддержку](https://cloud.ru/docs/audit-logging/ug/contacts/technical-support).    
      operationId: AuditGisAdapter_List
      responses:
        "200":
          description: "Успешное выполнение запроса."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListResponse'
        default:
          description: "Ошибка выполнения запроса."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
        - name: customer_id
          description: Идентификатор организации в формате UUID.
          in: path
          required: true
          schema:
            type: string
        - name: body
          description: Запрос для получения аудит-логов ГИС.
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AuditGisAdapterListBody'
components:
  schemas:
    protobufAny:
      type: object
      properties:
        '@type':
          type: string
          description: |-
            A URL/resource name that uniquely identifies the type of the serialized
            protocol buffer message. This string must contain at least
            one "/" character. The last segment of the URL's path must represent
            the fully qualified name of the type (as in
            `path/google.protobuf.Duration`). The name should be in a canonical form
            (e.g., leading "." is not accepted).

            In practice, teams usually precompile into the binary all types that they
            expect it to use in the context of Any. However, for URLs which use the
            scheme `http`, `https`, or no scheme, one can optionally set up a type
            server that maps type URLs to message definitions as follows:

            * If no scheme is provided, `https` is assumed.
            * An HTTP GET on the URL must yield a [google.protobuf.Type][]
              value in binary format, or produce an error.
            * Applications are allowed to cache lookup results based on the
              URL, or have them precompiled into a binary to avoid any
              lookup. Therefore, binary compatibility needs to be preserved
              on changes to types. (Use versioned type names to manage
              breaking changes.)

            Note: this functionality is not currently available in the official
            protobuf release, and it is not used for type URLs beginning with
            type.googleapis.com. As of May 2023, there are no widely used type server
            implementations and no plans to implement one.

            Schemes other than `http`, `https` (or the empty scheme) might be
            used with implementation specific semantics.
      additionalProperties:
        type: object
      description: |-
        `Any` contains an arbitrary serialized protocol buffer message along with a
        URL that describes the type of the serialized message.

        Protobuf library provides support to pack/unpack Any values in the form
        of utility functions or additional generated methods of the Any type.

        Example 1: Pack and unpack a message in C++.

            Foo foo = ...;
            Any any;
            any.PackFrom(foo);
            ...
            if (any.UnpackTo(&foo)) {
              ...
            }

        Example 2: Pack and unpack a message in Java.

            Foo foo = ...;
            Any any = Any.pack(foo);
            ...
            if (any.is(Foo.class)) {
              foo = any.unpack(Foo.class);
            }
            // or ...
            if (any.isSameTypeAs(Foo.getDefaultInstance())) {
              foo = any.unpack(Foo.getDefaultInstance());
            }

         Example 3: Pack and unpack a message in Python.

            foo = Foo(...)
            any = Any()
            any.Pack(foo)
            ...
            if any.Is(Foo.DESCRIPTOR):
              any.Unpack(foo)
              ...

         Example 4: Pack and unpack a message in Go

             foo := &pb.Foo{...}
             any, err := anypb.New(foo)
             if err != nil {
               ...
             }
             ...
             foo := &pb.Foo{}
             if err := any.UnmarshalTo(foo); err != nil {
               ...
             }

        The pack methods provided by protobuf library will by default use
        'type.googleapis.com/full.type.name' as the type URL and the unpack
        methods only use the fully qualified type name after the last '/'
        in the type URL, for example "foo.bar.com/x/y.z" will yield type
        name "y.z".

        JSON
        ====
        The JSON representation of an `Any` value uses the regular
        representation of the deserialized, embedded message, with an
        additional field `@type` which contains the type URL. Example:

            package google.profile;
            message Person {
              string first_name = 1;
              string last_name = 2;
            }

            {
              "@type": "type.googleapis.com/google.profile.Person",
              "firstName": <string>,
              "lastName": <string>
            }

        If the embedded message type is well-known and has a custom JSON
        representation, that representation will be embedded adding a field
        `value` which holds the custom JSON in addition to the `@type`
        field. Example (for message [google.protobuf.Duration][]):

            {
              "@type": "type.googleapis.com/google.protobuf.Duration",
              "value": "1.212s"
            }
    rpcStatus:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/protobufAny'
    v1AuditLog:
      type: object
      description: Данные аудит-лога.
      properties:
        eventSource:
          type: string
          description: Источник события.
        eventLevel:
          type: string
          description: Уровень события, например `INFO`, `WARN`, `ERROR` или другие.
        eventType:
          type: string
          description: Тип события.
        eventStatus:
          type: string
          description: Статус события, например `SUCCESS`, `FAILURE` или другие.
        eventId:
          type: string
          description: Уникальный идентификатор события.
        eventTime:
          type: string
          format: date-time
          description: Время события в формате RFC3339.
        authorization:
          $ref: '#/components/schemas/v1Authorization'
        resourceMetadata:
          type: array
          description: Метаданные ресурсов, связанных с событием.
          items:
            $ref: '#/components/schemas/v1ResourceMetadata'
        requestMetadata:
          $ref: '#/components/schemas/v1RequestMetadata'
        requestMethod:
          type: string
          description: Метод запроса.
        requestEndpoint:
          type: string
          description: Эндпоинт запроса.
        request:
          type: string
          description: Тело запроса.
        response:
          type: string
          description: Тело ответа.
        authentication:
          $ref: '#/components/schemas/v1Authentication'
        xRequestId:
          type: string
          description: ID запроса.
        error:
          type: string
          description: Сообщение об ошибке, если есть.
        details:
          type: string
          description: Дополнительные детали.
        tags:
          type: array
          description: Массив тегов.
          items:
            type: string
    v1Authentication:
      type: object
      description: Информация об аутентификации.
      properties:
        authenticated:
          type: boolean
          description: Результат аутентификации.
        subjectType:
          type: string
          description: >-
            Тип субъекта события из списка: `USER_ACCOUNT`,
            `FEDERATED_USER_ACCOUNT`, `SERVICE_ACCOUNT`.
        subjectId:
          type: string
          description: ID субъекта события.
        subjectName:
          type: string
          description: Имя субъекта события.
    v1Authorization:
      type: object
      description: Информация об авторизации.
      properties:
        authorized:
          type: boolean
          description: Результат авторизации субъекта события в формате `true` или `false`.
    v1ListAuditLogsResponse:
      type: object
      description: Ответ на запрос получения списка аудит-логов для указанного проекта.
      properties:
        logs:
          type: array
          description: Список аудит-логов.
          items:
            $ref: '#/components/schemas/v1AuditLog'
        nextPageToken:
          type: string
          description: Токен для получения следующей страницы результатов.
        limit:
          type: integer
          description: Максимальное количество записей в ответе.
          format: int32
    v1RequestMetadata:
      type: object
      description: Метаданные запроса.
      properties:
        remoteAddress:
          type: string
          description: IP-адрес субъекта события.
        userAgent:
          type: string
          description: User-Agent субъекта события.
        requestId:
          type: string
          description: Идентификатор запроса.
    v1ResourceMetadata:
      type: object
      description: Метаданные ресурсов, связанных с событием.
      properties:
        resourceType:
          type: string
          description: >-
            Тип ресурса, над которым было произведено действие: `customer`,
            `project` или `object`. 
        resourceId:
          type: string
          description: ID ресурса, над которым было произведено действие.
        resourceName:
          type: string
          description: Имя ресурса, над которым было произведено действие.
    v1GetAuditLogsResponse:
      type: object
      description: Список событий.
      properties:
       logs:
         type: array
         description: Список аудит-логов.
         items:
           $ref: '#/components/schemas/v1ShortLog'
       limit:
         type: integer
         description: Фактическое число записей на странице.
         format: int32
       cursor:
          $ref: '#/components/schemas/v1Cursor'
    v1ShortLog:
      type: object
      description: Краткие записи аудит-логов.
      properties:
        eventSource:
          type: string
          description: Источник события.
        eventLevel:
          type: string
          description: Уровень события, например `INFO`, `WARN`, `ERROR` или другие.
        eventType:
          type: string
          description: Тип события.
        eventStatus:
          type: string
          description: Статус события, например `SUCCESS`, `FAILURE` или другие.
        eventId:
          type: string
          description: >-
            Идентификатор события. Используйте его, чтобы 
            [получить полную запись аудит-лога](https://cloud.ru/docs/audit-logging/ug/topics/guides__logs__get-log-details).
        eventTime:
          type: string
          description: Время события в формате ISO 8601.
          format: date-time
        requestMethod:
          type: string
          description: Метод запроса.
        requestEndpoint:
          type: string
          description: Эндпоинт запроса.
        xRequestId:
          type: string
          description: ID запроса.
        authenticationSubjectName:
          type: string
          description: Имя субъекта аутентификации.
        tags:
          type: array
          description: Массив тегов события.
          items:
            type: string
        logSource:
          type: string
          description: |-
            Источник лога:
              - `LOG_SOURCE_PLATFORM` — облачная платформа;
              - `LOG_SOURCE_CLIENT` — клиентские приложения.
        customerId:
          type: string
          description: Идентификатор организации в формате UUID.
        projectId:
          type: string
          description: Идентификатор проекта в формате UUID.
    v1GetAuditLogResponse:
      type: object
      properties:
        log:
          $ref: '#/components/schemas/v1AuditLog'
    v1Cursor:
      type: object
      description: Токены для навигации по страницам.
      properties:
        after:
          type: string
          description: Курсор для перехода на следующую страницу.
        before:
          type: string
          description: Курсор для перехода на предыдущую страницу.
    v1ListResponse:
      type: object
      properties:
        logs:
          type: array
          description: Список аудит-логов ГИС.
          items:
            $ref: '#/components/schemas/v1GisLog'
        next_page_token:
          type: string
          description: Токен следующей страницы с результатами.
    v1GisLog:
      type: object
      description: Список аудит-логов.
      properties:
        tags:
          type: array
          description: Метки события.
          items:
            type: string
        datetime:
          type: string
          description: Время события в формате Unix timestamp.
          format: int64
        service_name:
          type: string
          description: Имя сервиса-источника события.
        service_version:
          type: string
          description: Версия сервиса-источника события.
        name:
          type: string
          description: Имя события.
        session_id:
          type: string
          description: Идентификатор сессии.
        user_login:
          type: string
          description: Логин пользователя.
        user_name:
          type: string
          description: Отображаемое имя пользователя.
        user_node:
          type: string
          description: IP или узел пользователя.
        params:
          type: array
          description: Дополнительне метки в формате ключ-значение.
          items:
            type: object
            items:
              $ref: '#/components/schemas/v1ParamsObject'
        projects_id:
          type: array
          description: Идентификаторы связанных объектов.
          items:
            type: string
        customer_id:
          type: string
          description: Идентификатор клиента в формате UUID.
    v1ParamsObject:
      type: object
      properties:
        name:
          type: string
          description: Ключ — имя параметра.
        value:
          type: string  
          description: Значение параметра.
    AuditGisAdapterListBody:
      type: object
      description: Запрос для получения аудит-логов.
      properties:
        project_id: 
          type: array
          description: Идентификатор проекта в формате UUID.
          items:
            type: string
        service_name:
          type: array
          description: Имя сервиса. 
          items:
            type: string
        name:
          type: array
          description: Имя события. Выбирается из [Справочника событий](https://cloud.ru/docs/audit-logging/ug/topics/event-reference).
          items:
            type: string
        tags:
          type: array
          description: Метки для фильтрации.
          items:
            type: string
        start:
          type: string
          description: >-
            Начало временного диапазона для фильтрации.
            Заполняется в формате RFC3339, например: ``2026-01-14T00:00:00Z``.
          format: date-time
        end:
          type: string
          description: >-
            Конец временного диапазона для фильтрации. 
            Заполняется в формате RFC3339, например: `2024-01-15T23:59:59Z`.
          format: date-time
        sort:
          $ref: '#/components/schemas/v1Sort'
        page_token:
          type: string
          description: Токен страницы с результатами.
        page_size:
          type: integer
          description: |-
            Количество записей в ответе на запрос. Значение по умолчанию — 10, максимальное значение — 500.
          format: int32 
    v1Sort:
      type: object
      description: Параметры сортировки.
      properties:
        field:
          $ref: '#/components/schemas/v1SortField'
        direction:
          $ref: '#/components/schemas/v1Directions' 
    v1SortField:
      type: string
      description: |-
        Параметр, по которому проводится сортировка:
          - SORT_FIELD_UNSPECIFIED — не указано;
          - SORT_FIELD_SERVICE_NAME — название сервиса;
          - SORT_FIELD_NAME — имя объекта;
          - SORT_FIELD_SESSION_ID — идентификатор сессии;
          - SORT_FIELD_USERNAME — имя пользователя.         
      enum:
        - SORT_FIELD_UNSPECIFIED
        - SORT_FIELD_SERVICE_NAME
        - SORT_FIELD_NAME
        - SORT_FIELD_SESSION_ID
        - SORT_FIELD_USERNAME
      default: SORT_FIELD_UNSPECIFIED  
    v1Directions:
      type: string
      description: |-
        Направление сортировки:
          - SORT_DIRECTION_UNSPECIFIED — по умолчанию;
          - SORT_DIRECTION_ASCENDING — по возрастанию;
          - SORT_DIRECTION_DESCENDING — по убыванию.
      enum:
        - SORT_DIRECTION_UNSPECIFIED
        - SORT_DIRECTION_ASCENDING
        - SORT_DIRECTION_DESCENDING
      default: SORT_DIRECTION_UNSPECIFIED    
