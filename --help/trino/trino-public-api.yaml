swagger: '2.0'
info:
  title: Cloud.ru Managed Trino
  description: '[Документация Managed Trino](https://cloud.ru/docs/trino/ug/index.html)'
  version: "1.0"
servers:
  - url: https://dataplatform.api.cloud.ru
tags:
  - name: FlavorService
  - name: CatalogService
  - name: TrinoService
  - name: TrinoVersionService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/trinoCatalogs:
    get:
      summary: Получение информации о каталогах Trino
      description: Возвращает список каталогов Trino по заданым параметрам.
      operationId: CatalogService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListCatalogResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListTrinoResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListCatalogResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Фильтр списка кластеров.
            Фильтрацию можно произвести по полю [Catalog.name].
            Пример: name=trinocatalog1
          in: query
          required: false
          type: string
      tags:
        - CatalogService
    post:
      summary: Создание каталога Trino
      description: |-
        Создание каталога Trino.
        Возвращает экземпляр каталога Trino.
      operationId: CatalogService_Create
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Catalog'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: Описание параметров запроса для создания каталога Trino.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateCatalogRequest'
      tags:
        - CatalogService
  /v1/trinoCatalogs/{catalogId}:
    get:
      summary: Получение информации о каталоге Trino
      description: Возвращает каталог Trino по заданному идентификатору.
      operationId: CatalogService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Catalog'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: catalogId
          description: Идентификатор каталога Trino.
          in: path
          required: true
          type: string
      tags:
        - CatalogService
    delete:
      summary: Удаление каталога Trino
      description: Удаление каталога Trino.
      operationId: CatalogService_Delete
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties: {}
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: catalogId
          description: Идентификатор каталога.
          in: path
          required: true
          type: string
      tags:
        - CatalogService
    put:
      summary: Обновление каталога Trino
      description: |-
        Обновление каталога Trino .
        Возвращает новую версию каталога Trino.
      operationId: CatalogService_Update
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Catalog'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: catalogId
          description: Идентификатор каталога.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CatalogServiceUpdateBody'
      tags:
        - CatalogService
  /v1/trinoFlavors:
    get:
      summary: Получение списка флейворов
      description: Возвращает список доступных флейворов по проекту.
      operationId: FlavorService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFlavorsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListFlavorsResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListFlavorsResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - FlavorService
  /v1/trinoVersions:
    get:
      summary: Получение списка версий Trino
      description: Возвращает список версий Trino.
      operationId: TrinoVersionService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTrinoVersionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
      tags:
        - TrinoVersionService
  /v1/trinos:
    get:
      summary: Получение информации об объектах Trino
      description: Возвращает список объектов Trino по заданым параметрам.
      operationId: TrinoService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTrinoResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListTrinoResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListTrinoResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Фильтр списка кластеров.
            Фильтрацию можно произвести по полю [Trino.name,Trino.cluster_id].
            Пример: cluster_id=20354d7a-e4fe-47af-8ff6-187bca92f3f9
          in: query
          required: false
          type: string
      tags:
        - TrinoService
    post:
      summary: Создание Trino
      description: |-
        Запускает процесс создания Trino.
        Возвращает объект Operation.
      operationId: TrinoService_Create
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: Описание параметров запроса для создания Trino.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateTrinoRequest'
      tags:
        - TrinoService
  /v1/trinos/{trinoId}:
    get:
      summary: Получение информации об объекте Trino
      description: Возвращает объект Trino по заданному идентификатору.
      operationId: TrinoService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Trino'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: trinoId
          description: Идентификатор Trino.
          in: path
          required: true
          type: string
      tags:
        - TrinoService
    delete:
      summary: Удаление объекта Trino
      description: |-
        Запускает процесс удаления объекта Trino по заданному идентификатору.
        Возвращает объект Operation.
      operationId: TrinoService_Delete
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: trinoId
          description: Идентификатор Trino.
          in: path
          required: true
          type: string
      tags:
        - TrinoService
    put:
      summary: Обновление Trino
      description: |-
        Запускает процесс обновления Trino.
        Возвращает объект Operation.
      operationId: TrinoService_Update
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: trinoId
          description: Идентификатор Trino.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1TrinoServiceUpdateBody'
      tags:
        - TrinoService
  /v1/trinos/{trinoId}/catalogs:
    get:
      summary: Получение списка каталогов Trino
      description: Возвращает список каталогов инстанса Trino.
      operationId: TrinoService_ListCatalogs
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTrinoCatalogResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: trinoId
          description: Идентификатор Trino.
          in: path
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListTrinoCatalogResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListTrinoCatalogResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Фильтр для фильтриции списка кластеров.
            Фильтрацию можно произвести по полю [Catalog.name].
            Пример: name=trinocatalog1
          in: query
          required: false
          type: string
      tags:
        - TrinoService
  /v1/trinos/{trinoId}/operations:
    get:
      summary: Получение списка операций
      description: Возвращает список операций над инстансом Trino.
      operationId: TrinoService_ListOperations
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTrinoOperationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: trinoId
          description: Идентификатор Trino.
          in: path
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListTrinoResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListTrinoResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - TrinoService
definitions:
  operationOperation:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор операции.
      resourceName:
        type: string
        title: >-
          Информация о ресурсе, над которым производится операция.

          Строится следующим образом:
          urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT.

          Пример 1:
          urn:cloud:dataplatform::54295782-7aef-43e6-b33b-c9735938677a:metastore_server
        readOnly: true
      resourceId:
        type: string
        title: |-
          Уникальный идентификатор ресурса, над которым производится операция.
          Пример: 54295782-7aef-43e6-b33b-c9735938677a
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: Время создания операции.
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        description: Время последнего изменения операции.
        readOnly: true
      done:
        type: boolean
        description: >-
          Флаг завершенности операции.

          Если значение `false`, то операция в процессе выполнения.

          Если значение `true`, то операция завершена и поле `error` может быть
          заполнено.
        readOnly: true
      description:
        type: string
        description: Описание операции. От 0 до 255 символов.
        readOnly: true
      error:
        $ref: '#/definitions/rpcStatus'
        description: Результат операции в случае ошибки.
        readOnly: true
    required:
      - id
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
        description: >-
          A URL/resource name that uniquely identifies the type of the
          serialized

          protocol buffer message. This string must contain at least

          one "/" character. The last segment of the URL's path must represent

          the fully qualified name of the type (as in

          `path/google.protobuf.Duration`). The name should be in a canonical
          form

          (e.g., leading "." is not accepted).


          In practice, teams usually precompile into the binary all types that
          they

          expect it to use in the context of Any. However, for URLs which use
          the

          scheme `http`, `https`, or no scheme, one can optionally set up a type

          server that maps type URLs to message definitions as follows:


          * If no scheme is provided, `https` is assumed.

          * An HTTP GET on the URL must yield a [google.protobuf.Type][]
            value in binary format, or produce an error.
          * Applications are allowed to cache lookup results based on the
            URL, or have them precompiled into a binary to avoid any
            lookup. Therefore, binary compatibility needs to be preserved
            on changes to types. (Use versioned type names to manage
            breaking changes.)

          Note: this functionality is not currently available in the official

          protobuf release, and it is not used for type URLs beginning with

          type.googleapis.com. As of May 2023, there are no widely used type
          server

          implementations and no plans to implement one.


          Schemes other than `http`, `https` (or the empty scheme) might be

          used with implementation specific semantics.
    additionalProperties: {}
    description: >-
      `Any` contains an arbitrary serialized protocol buffer message along with
      a

      URL that describes the type of the serialized message.


      Protobuf library provides support to pack/unpack Any values in the form

      of utility functions or additional generated methods of the Any type.


      Example 1: Pack and unpack a message in C++.

          Foo foo = ...;
          Any any;
          any.PackFrom(foo);
          ...
          if (any.UnpackTo(&foo)) {
            ...
          }

      Example 2: Pack and unpack a message in Java.

          Foo foo = ...;
          Any any = Any.pack(foo);
          ...
          if (any.is(Foo.class)) {
            foo = any.unpack(Foo.class);
          }
          // or ...
          if (any.isSameTypeAs(Foo.getDefaultInstance())) {
            foo = any.unpack(Foo.getDefaultInstance());
          }

       Example 3: Pack and unpack a message in Python.

          foo = Foo(...)
          any = Any()
          any.Pack(foo)
          ...
          if any.Is(Foo.DESCRIPTOR):
            any.Unpack(foo)
            ...

       Example 4: Pack and unpack a message in Go

           foo := &pb.Foo{...}
           any, err := anypb.New(foo)
           if err != nil {
             ...
           }
           ...
           foo := &pb.Foo{}
           if err := any.UnmarshalTo(foo); err != nil {
             ...
           }

      The pack methods provided by protobuf library will by default use

      'type.googleapis.com/full.type.name' as the type URL and the unpack

      methods only use the fully qualified type name after the last '/'

      in the type URL, for example "foo.bar.com/x/y.z" will yield type

      name "y.z".


      JSON

      ====

      The JSON representation of an `Any` value uses the regular

      representation of the deserialized, embedded message, with an

      additional field `@type` which contains the type URL. Example:

          package google.profile;
          message Person {
            string first_name = 1;
            string last_name = 2;
          }

          {
            "@type": "type.googleapis.com/google.profile.Person",
            "firstName": <string>,
            "lastName": <string>
          }

      If the embedded message type is well-known and has a custom JSON

      representation, that representation will be embedded adding a field

      `value` which holds the custom JSON in addition to the `@type`

      field. Example (for message [google.protobuf.Duration][]):

          {
            "@type": "type.googleapis.com/google.protobuf.Duration",
            "value": "1.212s"
          }
  protobufNullValue:
    type: string
    enum:
      - NULL_VALUE
    default: NULL_VALUE
    description: |-
      `NullValue` is a singleton enumeration to represent the null value for the
      `Value` type union.

      The JSON representation for `NullValue` is JSON `null`.

       - NULL_VALUE: Null value.
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: |-
          The status code, which should be an enum value of
          [google.rpc.Code][google.rpc.Code].
      message:
        type: string
        description: >-
          A developer-facing error message, which should be in English. Any

          user-facing error message should be localized and sent in the

          [google.rpc.Status.details][google.rpc.Status.details] field, or
          localized

          by the client.
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
        description: >-
          A list of messages that carry the error details.  There is a common
          set of

          message types for APIs to use.
    description: >-
      The `Status` type defines a logical error model that is suitable for

      different programming environments, including REST APIs and RPC APIs. It
      is

      used by [gRPC](https://github.com/grpc). Each `Status` message contains

      three pieces of data: error code, error message, and error details.


      You can find out more about this error model and how to work with it in
      the

      [API Design Guide](https://cloud.google.com/apis/design/errors).
  v1BasicAuthConfiguration:
    type: object
    properties:
      users:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1BasicAuthUser'
        description: Basic auth пользователи.
    description: Конфигурация basic auth.
  v1BasicAuthUser:
    type: object
    properties:
      username:
        type: string
        description: Имя пользователя.
      passwordSecretId:
        type: string
        description: Идентификатор секрета пароля пользователя из сервиса Secret Management.
    description: Basic auth пользователь.
    required:
      - username
      - passwordSecretId
  v1Catalog:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор каталога Trino.
      projectId:
        type: string
        description: Идентификатор проекта.
      version:
        type: integer
        format: int32
        description: Версия каталога Trino.
        readOnly: true
      connectorName:
        type: string
        description: Имя коннектора.
        readOnly: true
      name:
        type: string
        description: Название каталога Trino.
      description:
        type: string
        description: Описание каталога Trino.
      createdBy:
        type: string
        description: Идентификатор пользователя, создавшего каталог Trino.
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: Время создания каталога  Trino.
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        description: Время последнего обновления каталога Trino.
        readOnly: true
      updatedBy:
        type: string
        description: Идентификатор пользователя, обновившего каталог последним.
        readOnly: true
      postgresql:
        $ref: '#/definitions/v1PostgreSQLConnectorConfiguration'
        description: Конфигурация для PostgreSQL.
      mysql:
        $ref: '#/definitions/v1MySQLConnectorConfiguration'
        description: Конфигурация для MySQL.
      oracle:
        $ref: '#/definitions/v1OracleConnectorConfiguration'
        description: Конфигурация для Oracle.
      mariadb:
        $ref: '#/definitions/v1MariaDBConnectorConfiguration'
        description: Конфигурация для MariaDB.
      mssql:
        $ref: '#/definitions/v1MSSQLConnectorConfiguration'
        description: Конфигурация для MSSQL.
      clickhouse:
        $ref: '#/definitions/v1ClickhouseConnectorConfiguration'
        description: Конфигурация для Clickhouse.
      mongodb:
        $ref: '#/definitions/v1MongoDBConnectorConfiguration'
