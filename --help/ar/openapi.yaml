swagger: '2.0'
info:
  title: Cloud.ru Artifact Registry OpenAPI 2.0
  description: |-
    [Документация Artifact Registry](https://cloud.ru/docs/artifact-registry-evolution/ug/index.html)

    Для методов POST и PATCH необходимо передавать [идентификатор проекта](https://cloud.ru/docs/artifact-registry-evolution/ug/topics/api-ref__project-id) в теле запроса.
  version: '2.0'
tags:
  - name: OperationService
    description: Просмотр операций пользователя в Artifact Registry.
  - name: RegistriesService
    description: Управление реестрами и артефактами Artifact Registry.
consumes:
  - application/json
produces:
  - application/json
servers:
    - url: https://ar.api.cloud.ru
paths:
  /v1/operations:
    get:
      summary: Получение списка операций.
      operationId: RegistriesService_ListOperations
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v1ListExternalRegistryOperationsResponse'
        default:
          description: Непредвиденная ошибка.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: resourceId
          description: Идентификатор ресурса, по которому нужно получить список операций.
          in: query
          required: false
          type: string
        - name: resourceName
          description: Тип ресурса ресурса, по которому нужно получить список операций.
          in: query
          required: false
          type: string
        - name: pageSize
          description: Максимальное количество результатов на странице ответа.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: Токен запрашиваемой страницы с результатами.
          in: query
          required: false
          type: string
      tags:
        - RegistriesService
  /v1/operations/{operationId}:
    get:
      summary: Получение операции.
      operationId: Идентификатор операции.
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: Непредвиденная ошибка.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: operationId
          description: Идентификатор операции.
          in: path
          required: true
          type: string
      tags:
        - OperationService
  /v1/registries:
    get:
      summary: Получение списка реестров.
      operationId: RegistriesService_List
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v1ListRegistriesResponse'
        default:
          description: Непредвиденная ошибка.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта (UUID).
          in: query
          required: true
          type: string
        - name: pageSize
          description: Максимальное количество результатов на странице ответа.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: Токен запрашиваемой страницы с результатами.
          in: query
          required: false
          type: string
        - name: filter
          description: Выражение фильтрующее ответ.
          in: query
          required: false
          type: string
        - name: orderBy
          description: Имя поля по которому производится сортировка.
          in: query
          required: false
          type: string
      tags:
        - RegistriesService
    post:
      summary: Создание реестра.
      operationId: RegistriesService_Create
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: Непредвиденная ошибка.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: Запрос на создание реестра.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateRegistryRequest'
      tags:
        - RegistriesService
  /v1/registries/{registryId}:
    get:
      summary: Получение информации по реестру.
      operationId: RegistriesService_Get
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v1Registry'
        default:
          description: Непредвиденная ошибка.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: registryId
          description: Идентификатор реестра (UUID).
          in: path
          required: true
          type: string
        - name: projectId
          description: Идентификатор проекта (UUID).
          in: query
          required: true
          type: string
      tags:
        - RegistriesService
    delete:
      summary: Удаление реестра.
      operationId: RegistriesService_Delete
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: Непредвиденная ошибка.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: registryId
          description: Идентификатор реестра (UUID).
          in: path
          required: true
          type: string
        - name: projectId
          description: Идентификатор проекта (UUID).
          in: query
          required: true
          type: string
      tags:
        - RegistriesService
    patch:
      summary: Изменение параметров реестра.
      operationId: RegistriesService_Update
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v1Registry'
        default:
          description: Непредвиденная ошибка.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: registryId
          description: Идентификатор реестра (UUID).
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/RegistriesServiceUpdateBody'
      tags:
        - RegistriesService
definitions:
  RegistriesServiceUpdateBody:
    type: object
    properties:
      projectId:
        type: string
        description: Идентификатор проекта (UUID).
      isPublic:
        type: boolean
        description: Параметр типа доступа к реестру.
      retentionPolicyIsEnabled:
        type: boolean
        description: Флаг включения политики удаления артефактов для реестра.
      retentionPolicy:
        $ref: '#/definitions/v1RetentionPolicy'
        description: Настройки политики удаления артефактов для реестра.
      quarantineMode:
        $ref: '#/definitions/v1QuarantineMode'
        description: Настройки карантина артефактов реестра.
      tariff:
        $ref: '#/definitions/v1RegistryTariffType'
        description: Тип тарификации.
      upstream:
        $ref: '#/definitions/v1Upstream'
        description: Параметры настройки кеширующих реестров.
    description: Запрос на изменение параметров реестра.
    required:
      - projectId
  cloudruoperationOperation:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор операции.
        readOnly: true
      resourceName:
        type: string
        title: >-
          Информация о ресурсе, над которым производится операция.

          Строится следующим образом:
          urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT.

          Пример: urn:cloud:lbaas::54295782-7aef-43e6-b33b-c9735938677a:backend
        readOnly: true
      resourceId:
        type: string
        title: |-
          Уникальный идентификатор ресурса, над которым производится операция.
          Пример: 54295782-7aef-43e6-b33b-c9735938677a
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: Время создания операции.
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        description: Время последнего изменения операции.
        readOnly: true
      done:
        type: boolean
        description: >-
          Флаг завершенности операции.

          Если значение `false`, то операция в процессе выполнения.

          Если значение `true`, то операция завершена и поле `error` может быть
          заполнено.
        readOnly: true
      description:
        type: string
        description: Описание операции. От 0 до 255 символов.
        readOnly: true
      error:
        $ref: '#/definitions/rpcStatus'
        description: Результат операции в случае ошибки.
        readOnly: true
  googleprotobufAny:
    type: object
    properties:
      '@type':
        type: string
        description: >-
          A URL/resource name that uniquely identifies the type of the
          serialized

          protocol buffer message. This string must contain at least

          one "/" character. The last segment of the URL's path must represent

          the fully qualified name of the type (as in

          `path/google.protobuf.Duration`). The name should be in a canonical
          form

          (e.g., leading "." is not accepted).


          In practice, teams usually precompile into the binary all types that
          they

          expect it to use in the context of Any. However, for URLs which use
          the

          scheme `http`, `https`, or no scheme, one can optionally set up a type

          server that maps type URLs to message definitions as follows:


          * If no scheme is provided, `https` is assumed.

          * An HTTP GET on the URL must yield a [google.protobuf.Type][]
            value in binary format, or produce an error.
          * Applications are allowed to cache lookup results based on the
            URL, or have them precompiled into a binary to avoid any
            lookup. Therefore, binary compatibility needs to be preserved
            on changes to types. (Use versioned type names to manage
            breaking changes.)

          Note: this functionality is not currently available in the official

          protobuf release, and it is not used for type URLs beginning with

          type.googleapis.com. As of May 2023, there are no widely used type
          server

          implementations and no plans to implement one.


          Schemes other than `http`, `https` (or the empty scheme) might be

          used with implementation specific semantics.
    additionalProperties: {}
    description: >-
      `Any` contains an arbitrary serialized protocol buffer message along with
      a

      URL that describes the type of the serialized message.


      Protobuf library provides support to pack/unpack Any values in the form

      of utility functions or additional generated methods of the Any type.


      Example 1: Pack and unpack a message in C++.

          Foo foo = ...;
          Any any;
          any.PackFrom(foo);
          ...
          if (any.UnpackTo(&foo)) {
            ...
          }

      Example 2: Pack and unpack a message in Java.

          Foo foo = ...;
          Any any = Any.pack(foo);
          ...
          if (any.is(Foo.class)) {
            foo = any.unpack(Foo.class);
          }
          // or ...
          if (any.isSameTypeAs(Foo.getDefaultInstance())) {
            foo = any.unpack(Foo.getDefaultInstance());
          }

       Example 3: Pack and unpack a message in Python.

          foo = Foo(...)
          any = Any()
          any.Pack(foo)
          ...
          if any.Is(Foo.DESCRIPTOR):
            any.Unpack(foo)
            ...

       Example 4: Pack and unpack a message in Go

           foo := &pb.Foo{...}
           any, err := anypb.New(foo)
           if err != nil {
             ...
           }
           ...
           foo := &pb.Foo{}
           if err := any.UnmarshalTo(foo); err != nil {
             ...
           }

      The pack methods provided by protobuf library will by default use

      'type.googleapis.com/full.type.name' as the type URL and the unpack

      methods only use the fully qualified type name after the last '/'

      in the type URL, for example "foo.bar.com/x/y.z" will yield type

      name "y.z".


      JSON

      ====

      The JSON representation of an `Any` value uses the regular

      representation of the deserialized, embedded message, with an

      additional field `@type` which contains the type URL. Example:

          package google.profile;
          message Person {
            string first_name = 1;
            string last_name = 2;
          }

          {
            "@type": "type.googleapis.com/google.profile.Person",
            "firstName": <string>,
            "lastName": <string>
          }

      If the embedded message type is well-known and has a custom JSON

      representation, that representation will be embedded adding a field

      `value` which holds the custom JSON in addition to the `@type`

      field. Example (for message [google.protobuf.Duration][]):

          {
            "@type": "type.googleapis.com/google.protobuf.Duration",
            "value": "1.212s"
          }
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: |-
          The status code, which should be an enum value of
          [google.rpc.Code][google.rpc.Code].
      message:
        type: string
        description: >-
          A developer-facing error message, which should be in English. Any

          user-facing error message should be localized and sent in the

          [google.rpc.Status.details][google.rpc.Status.details] field, or
          localized

          by the client.
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/googleprotobufAny'
        description: >-
          A list of messages that carry the error details.  There is a common
          set of

          message types for APIs to use.
    description: >-
      The `Status` type defines a logical error model that is suitable for

      different programming environments, including REST APIs and RPC APIs. It
      is

      used by [gRPC](https://github.com/grpc). Each `Status` message contains

      three pieces of data: error code, error message, and error details.


      You can find out more about this error model and how to work with it in
      the

      [API Design Guide](https://cloud.google.com/apis/design/errors).
  v1CreateRegistryRequest:
    type: object
    properties:
      projectId:
        type: string
        description: Идентификатор проекта (UUID).
      name:
        type: string
        description: Название реестра.
      isPublic:
        type: boolean
        description: Флаг публичности реестра.
      registryType:
        $ref: '#/definitions/v1RegistryType'
        description: Тип реестра.
      tariff:
        $ref: '#/definitions/v1RegistryTariffType'
        description: Тип тарификации.
      retentionPolicyIsEnabled:
        type: boolean
        description: Флаг включения политики удаления артефактов для реестра.
      retentionPolicy:
        $ref: '#/definitions/v1RetentionPolicy'
        description: Настройки политики удаления артефактов для реестра.
      quarantineMode:
        $ref: '#/definitions/v1QuarantineMode'
        description: Настройки карантина артефактов реестра.
      registryMode:
        $ref: '#/definitions/v1RegistryMode'
        description: Режим реестра.
      upstream:
        $ref: '#/definitions/v1Upstream'
        description: Параметры настройки кеширующих реестров.
    description: Запрос на создание реестра.
    required:
      - projectId
      - name
  v1ListExternalRegistryOperationsResponse:
    type: object
    properties:
      operations:
        type: array
        items:
          type: object
          $ref: '#/definitions/cloudruoperationOperation'
        description: Список операций.
      nextPageToken:
        type: string
        description: Токен следующей страницы.
  v1ListRegistriesResponse:
    type: object
    properties:
      registries:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Registry'
        description: Список реестров.
      nextPageToken:
        type: string
        description: Токен следующей страницы.
    description: Ответ на запрос списка реестров.
  v1QuarantineMode:
    type: string
    enum:
      - DISABLED
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    default: DISABLED
    description: |-
      Справочник уровней карантина артефактов реестра.

       - DISABLED: Карантин выключен.
       - LOW: Карантин для уязвимостей от LOW и выше.
       - MEDIUM: Карантин для уязвимостей от MEDIUM и выше.
       - HIGH: Карантин для уязвимостей от HIGH и выше.
       - CRITICAL: Карантин для уязвимостей от CRITICAL и выше.
  v1Registry:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор реестра (UUID).
      name:
        type: string
        description: Название реестра.
      createdAt:
        type: string
        format: date-time
        description: Время создания реестра.
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        description: Время последнего обновления реестра.
        readOnly: true
      registryType:
        $ref: '#/definitions/v1RegistryType'
        description: Тип реестра.
      retentionPolicyIsEnabled:
        type: boolean
        description: Флаг включения политики удаления артефактов для реестра.
      retentionPolicy:
        $ref: '#/definitions/v1RetentionPolicy'
        description: Настройки политики удаления артефактов для реестра.
      status:
        $ref: '#/definitions/v1RegistryStatus'
        description: Статус реестра.
        readOnly: true
      isPublic:
        type: boolean
        description: Флаг публичности реестра.
      quarantineMode:
        $ref: '#/definitions/v1QuarantineMode'
        description: Настройки карантина артефактов реестра.
      tariff:
        $ref: '#/definitions/v1RegistryTariffType'
        description: Тип тарифа для реестра.
      registryMode:
        $ref: '#/definitions/v1RegistryMode'
        description: Режим реестра.
      upstream:
        $ref: '#/definitions/v1Upstream'
        description: Параметры настройки кеширующих реестров.
    description: Информация о реестре.
    required:
      - name
  v1RegistryMode:
    type: string
    enum:
      - REGISTRY_MODE_UNSPECIFIED
      - REGISTRY_MODE_LOCAL
      - REGISTRY_MODE_REMOTE
    default: REGISTRY_MODE_UNSPECIFIED
    description: |-
      Справочник режимов реестров.

       - REGISTRY_MODE_UNSPECIFIED: Режим не указан.
       - REGISTRY_MODE_LOCAL: Локальный реестр.
       - REGISTRY_MODE_REMOTE: Кеширующий реестр.
  v1RegistryStatus:
    type: string
    enum:
      - CREATING
      - ACTIVE
      - ERROR
    default: CREATING
    description: |-
      Справочник статусов реестра.

       - CREATING: Реестр создаётся.
       - ACTIVE: Реестр создался и работает.
       - ERROR: Реестр содержит ошибку и не работает.
  v1RegistryTariffType:
    type: string
    enum:
      - BASIC
      - PREMIUM
    default: BASIC
    description: |-
      Справочник тарификации реестров.

       - BASIC: Базовый тариф.
       - PREMIUM: Премиум тариф.
  v1RegistryType:
    type: string
    enum:
      - DOCKER
      - DEBIAN
      - RPM
      - GENERIC
      - PYPI
      - NPM
    default: DOCKER
    description: |-
      Справочник типов реестров.

       - DOCKER: Реестр Docker-образов и Нelm-чартов.
       - DEBIAN: Реестр Debian-пакетов.
       - RPM: Реестр RPM-пакетов.
       - GENERIC: Реестр Generic-пакетов.
       - PYPI: Реестр PyPI-пакетов.
       - NPM: Реестр NPM-пакетов.
  v1RetentionPolicy:
    type: object
    properties:
      onlyUntagged:
        type: boolean
        description: Флаг для учитывания только образов без тэга.
      action:
        $ref: '#/definitions/v1RetentionPolicyActionType'
        description: Действие для политики удалений.
      constraint:
        $ref: '#/definitions/v1TimeConstraintType'
        description: Временные ограничения.
      value:
        type: integer
        format: int64
        description: Значение времени.
      unit:
        $ref: '#/definitions/v1TimeConstraintUnitType'
        description: Тип ограничения времени.
      'on':
        $ref: '#/definitions/v1TimeConstraintFieldType'
        description: Тип поля, на которое завязывается политика удалений.
    description: Параметры политики удалений.
  v1RetentionPolicyActionType:
    type: string
    enum:
      - DELETE
      - PROTECT
    default: DELETE
    description: |-
      Удаляем или оставляем для политики удалений.

       - DELETE: Удаляем образа.
       - PROTECT: Оставляем образа.
  v1TimeConstraintFieldType:
    type: string
    enum:
      - PUSHED_AT
      - LAST_PULLED_AT
    default: PUSHED_AT
    description: |-
      Тип поля, на которое завязывается политика удалений.

       - PUSHED_AT: Поле pushed_at.
       - LAST_PULLED_AT: Поле last_pulled_at.
  v1TimeConstraintType:
    type: string
    enum:
      - OLDER_THAN
      - NEWER_THAN
    default: OLDER_THAN
    description: |-
      Тип ограничений по времени в политике удалений.

       - OLDER_THAN: Старше, чем.
       - NEWER_THAN: Новее, чем.
  v1TimeConstraintUnitType:
    type: string
    enum:
      - s
      - m
      - h
      - d
      - w
      - 'y'
    default: s
    description: |-
      Типы ограничений времени для политики удалений.

       - s: Секунды.
       - m: Минуты.
       - h: Часы.
       - d: Дни.
       - w: Недели.
       - y: Месяцы.
  v1Upstream:
    type: object
    properties:
      url:
        type: string
        description: Адрес, откуда берутся артефакты.
      loginId:
        type: string
        description: UUID логина для доступа к кешируемому адресу из SCM.
      passwordId:
        type: string
        description: UUID пароля для доступа к кешируемому адресу из SCM.
      metadataTtl:
        type: integer
        format: int64
        description: Время хранения метаданных артефактов, сек.
      artifactTtl:
        type: integer
        format: int64
        description: Время хранения артефактов, сек.
      mirror:
        type: boolean
        description: Флаг режима зеркалирования.
      softDelete:
        type: boolean
        description: Флаг "мягкого" удаления артефактов.
    description: Параметры настройки кеширующих реестров.
