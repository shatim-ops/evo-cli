      description: >-
        Экспорт дашбордов по их ID.
        Дашборды, экспортированные за один раз, сохраняются в одном ZIP-архиве.
        Для каждого дашборда в архиве будет создан отдельный JSON-файл с конфигурацией дашборда. 
        Название файла совпадает с названием дашборда.
      parameters:
      - name: projectId
        in: path
        description: Идентификатор проекта.
        required: true
        schema:
          type: string
      - name: dashboardIds
        in: query
        description: Идентификаторы экспортируемых дашбордов.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      responses:
        '200':
          description: Успешное выполнение запроса
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportUserDashboardResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'  
