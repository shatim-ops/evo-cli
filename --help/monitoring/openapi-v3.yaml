    get:
      tags:
      - Recording Rules
      summary: Получение списка правил вычисляемых метрик проекта
      description: Метод для получения списка правил вычисляемых метрик проекта.
      parameters:  
      - name: projectId
        in: path
        description: Идентификатор проекта.
        required: true
        schema:
          type: string  
      - name: interval
        in: query
        description: >-
          Интервал выполнения запроса в секундах: 
            
            - `60` — 1 минута;
            - `300` — 5 минут;
            - `900` — 15 минут.
        schema:
          type: array
          items:
            type: integer
            enum:
              - 60
              - 300
              - 900
        style: form
        explode: false
      - name: limit
        in: query
        description: Количество записей на странице. Значение по умолчанию — `20`.
        schema:
          type: integer
          minimum: 0
          default: 20
      - name: nextPage
        in: query
        description: Токен следующей страницы результатов.
        schema:
          type: string
      - name: query
        in: query
        description: Запрос для фильтрации правил вычисляемых метрик.
        schema:
          type: string
      - name: sort.field
        in: query
        description: >-
          Поле для сортировки результатов:
            - `name` — название правила;
            - `state` — статус правила;
            - `func` — функция, используемая в запросе для создания вычисляемой метрики, например `sum`, `rate`, `avg` или другие;
            - `interval` — интервал выполнения запроса;
            - `metric` — название вычисляемой метрики.
        schema:
          type: string
          enum:
            - name
            - state
            - func
            - interval
            - metric
      - name: sort.value
        in: query
        description: >-
          Направление сортировки результатов:
            - `asc` — по возрастанию;
            - `desc` — по убыванию.
        schema:
          type: string
          enum:
            - asc
            - desc
      - name: state
        in: query
        description: >-
          Статус правила:
            - `active` — «Включено»;
            - `inactive` — «Выключено».
        schema:
          type: array
          items:
            type: string
            enum:
              - active
              - inactive
        style: form
        explode: false
      responses: 
        '200':
          description: Успешное выполнение запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingListResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
    patch:
      tags:
      - Recording Rules
      summary: Включение или выключение одного или нескольких правил вычисляемых метрик
      description: Метод для изменения статуса правил вычисляемых метрик.
      parameters:  
      - name: projectId
        in: path
        description: Идентификатор проекта.
