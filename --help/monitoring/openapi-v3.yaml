              schema:
                $ref: '#/components/schemas/metaschemas.HTTPError'
  /v1/{project_id}/export_metrics:
    get:
      tags:
      - Metric Export
      summary: Получение истории метрик
      description: >-
        Метод для получения исторических данных о метриках.
        Количество таймсерий и точек значений метрик, которые вернутся в результате одного запроса, не может превышать [установленные лимиты](https://cloud.ru/docs/service-monitoring/ug/topics/overview__limitations#id2).
        Если эти лимиты будут превышены, ответ на запрос вернется, но полученные данные будут ограничены установленным лимитом.
        В конце ответа появится сообщение о превышении лимита: "No more than *n* timeseries/samples are allowed to be returned in one response".
        В этом случае попробуйте уменьшить заданный временной интервал и повторить запрос.
      parameters:
      - name: project_id
        in: path
        description: Идентификатор проекта.
        required: true
        schema:
          type: string
      - name: match
        in: query
        description: Правила выборки метрик — селектор временных рядов Prometheus.
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: start
        in: query
        description: Начало временного интервала, за который необходимо получить данные о метриках.
        required: true
        schema:
          type: integer
      - name: end
        in: query
        description: Конец временного интервала, за который необходимо получить данные о метриках.
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Успешное выполнение запроса
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
        "401":
          description: Необходима авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
        "403":
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
        "404":
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse' 
  /v2/{project_id}/scrape_metrics:
    get:
      tags:
      - Metric Export    
      summary: Получение метрик в формате Prometheus text-based exposition
      description: >-
        Метод для получения актуальных данных о метриках.
        Количество таймсерий и точек значений метрик, которые вернутся в результате одного запроса, не может превышать [установленные лимиты](https://cloud.ru/docs/service-monitoring/ug/topics/overview__limitations#id2).
        Если эти лимиты будут превышены, запрос завершится с ошибкой.
        В этом случае попробуйте уменьшить заданный временной интервал и повторить запрос.
      parameters:
      - name: project_id
        in: path
        description: Идентификатор проекта
        required: true
        schema:
          type: string
      - name: match
        in: query
        description: Правила выборки метрик — селектор временных рядов Prometheus
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: start
        in: query
        description: Начало временного интервала, за который необходимо получить данные о метриках.
        schema:
          type: integer
      - name: end
        in: query
        description: Конец временного интервала, за который необходимо получить данные о метриках.
        schema:
          type: integer
      responses:
        "200":
          description: Успешное выполнение запроса
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
        "401":
          description: Необходима авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
        "403":
          description: Доступ запрещен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
        "404":
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
        "413":
          description: Превышен лимит таймсерий или точек значения метрик, которые могут вернуться в ответе на запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrTimeseriesLimits'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/models.ErrResponse'
  /api/monaas-dashboards/v1/projects/{projectId}/dashboards:
    get:
      operationId: ListUserDashboardsV2
      tags:
        - Dashboards    
      summary: Получение списка пользовательских дашбордов в проекте
      description: >-
        Метод для получения списка пользовательских дашбордов в указанном проекте.
        Поддерживается постраничная навигация, поиск по названию или описанию и сортировка списка дашбордов.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: page
          description: >-
            Номер страницы с результатами запроса. Значение по умолчанию — 1.
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: query
          description: >-
            Запрос для фильтрации списка дашбордов. Поиск выполняется по названию или описанию дашборда. Если оставить поле пустым, вернется список всех дашбордов без выборки.
          in: query
          required: false
          allowEmptyValue: true
          schema:
            type: string
        - name: sort
          description: >-
            Параметры сортировки списка дашбордов в формате `direction`:`field`, где:
              - `direction` — порядок сортировки: `asc` (по возрастанию) или `desc` (по убыванию);  
              - `field` — имя параметра, по которому проводится сортировка, например `title`.
          in: query
          required: false
          allowEmptyValue: true
          schema:
            type: array
            nullable: true
            items:
              type: string
          example:
            - asc:title
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDashboardResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    post:
      operationId: CreateUserDashboardV2
      tags:
        - Dashboards    
      summary: Создание пользовательского дашборда
      description: >-
        Метод для создания пользовательского дашборда в указанном проекте.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        description: Запрос на создание дашборда.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateDashboardRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUpdateDashboardResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /api/monaas-dashboards/v1/projects/{projectId}/dashboards/{dashboardId}:
    get:
      operationId: GetUserDashboardV2
      tags:
        - Dashboards    
      summary: Получение конфигурации дашборда
      description: >-
        Метод для получения конфигурации дашборда по его идентификатору.
      responses:
        '200':
          description: Успешное выполнение запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    post:
      operationId: UpdateUserDashboardV2
      tags:
        - Dashboards    
      summary: Обновление конфигурации дашборда
      description: >-
        Метод для обновления конфигурации дашборда по его идентификатору.
      requestBody:
        description: Запрос на обновление дашборда.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateDashboardRequest'
      responses:
        '200':
          description: Успешное выполнение запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUpdateDashboardResponse'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      operationId: DeleteUserDashboardV2
      tags:
        - Dashboards    
      summary: Удаление дашборда
      description: >-
