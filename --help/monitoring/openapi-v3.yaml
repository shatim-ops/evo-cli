          description: Идентификатор правила.
        state:
          type: string
          description: Статус правила.
    recordingschemas.LabelSelection:
      type: object
      description: Параметры меток, назначаемых вычисляемой метрике на основе запроса.
      properties:
        labels:
          items:
            type: string
          type: array
          description: >-
            Список меток, которые нужно назначить вычисляемой метрике. 
            Заполняется, если для параметра `mode` выбрана опция `manual`.
        mode:
          $ref: '#/components/schemas/recordingschemas.LabelSelectionMode'
