    RecordingListResponse:
      type: object
      description: Список правил вычисляемых метрик.
      properties:
        nextPage:
          type: string
          description: Токен следующей страницы результатов.
        rules:
          items:
            $ref: '#/components/schemas/RecordingRule'
          type: array
          description: Список правил вычисляемых метрик проекта.
    RecordingRule:   
      type: object
      description: Параметры правила вычисляемых метрик.
      properties:
        customLabels:
          type: object
          description: Метки, которые применяются к новой вычисляемой метрике.
          additionalProperties:
            type: string
        expr:
          type: string
          description: PromQL-запрос для вычисления новой метрики.
        interval:
          type: integer
          description: Интервал выполнения запроса в секундах.
        metric:
          type: string
          description: Название вычисляемой метрики.
        name:
          type: string
          description: Название правила.
        productInstanceId:
          type: string
