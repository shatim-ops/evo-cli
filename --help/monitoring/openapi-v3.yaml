              - `active` — «Включено»;
              - `inactive` — «Выключено».
    CreateUpdateRecordingRuleRequestBody:
      type: object
      description: Параметры правила вычисляемых метрик.
      properties:
        customLabels:
          type: object
          description: Дополнительные метки, которые применяются к новой вычисляемой метрике.
          additionalProperties:
            type: string
            description: Метка в формате `ключ-значение`.
        expr:
          type: string
          description: PromQL-запрос для вычисления новой метрики.
        interval:
          type: integer
          description: >-
            Интервал выполнения запроса в секундах: 
              - `60` — 1 минута;
              - `300` — 5 минут;
              - `900` — 15 минут.
          enum:
            - 60
            - 300
            - 900
        metric:
          type: string
          description: >-
            Название вычисляемой метрики. Максимальная длина — 64 символа.
          maxLength: 64
        name:
