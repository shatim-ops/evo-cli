                  description: >-
                    ZIP-архив с JSON-файлами, содержащими конфигурацию дашбордов. Конфигурация каждого дашборда должна быть в отдельном JSON-файле. Максимальный размер архива — 5 МБ.
      responses:
        '200':
          description: Успешное выполнение запроса
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
