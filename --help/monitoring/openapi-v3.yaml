      description: >-
        Выбор меток, назначаемых вычисляемой метрике на основе запроса:
        
          - `all` — все метки;
          - `none` — никакие метки;
          - `manual` — метки, выбранные вручную.
      enum:
        - all
        - none
        - manual
      type: string
      x-enum-varnames:
        - LabelSelectionModeAll
        - LabelSelectionModeNone
        - LabelSelectionModeManual      
    BulkPatchRecordingRuleRequestBody:
      type: object
