components:
  parameters:
    projectId:
      name: projectId
      description: Идентификатор проекта.
      in: path
      required: true
      schema:
        type: string
        format: uuid  
    dashboardId:
      name: dashboardId
      description: Идентификатор дашборда.
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ExportUserDashboardResponse:
      type: object
      required:
        - description
        - title
      properties:
        description:
          type: string
          description: Описание дашборда.
        panels:
          type: array
          description: >-
            Конфигурация виджетов в зависимости от их типа:
              - `timeseries` — временной ряд;
              - `text` — текстовый;
              - `stat` — статистика;
              - `table` — таблица;
              - `state-timeline` — история состояний;
              - `host-map` — состояние объектов.
          items:
            $ref: '#/components/schemas/Panel'
        title:
          type: string
          description: Название дашборда.
        variables:
          type: array
          description: Параметры переменных дашборда.
          items:
            $ref: '#/components/schemas/Variable'
    metaschemas.GetMetricLabelValuesResponse:
      type: object
      properties:
        values:
          type: array
          description: Список значений метки
          items:
            type: string
    metaschemas.GetMetricLabelsResponse:
      type: object
      properties:
        labels:
          type: array
          description: Список названий меток
          items:
            type: string
    metaschemas.GetMetricNamesResponse:
      type: object
      properties:
        names:
          type: array
          description: Список названий метрик
          items:
            type: string
    metaschemas.GetMetricsResponse:
      type: object
      properties:
        metrics:
          type: array
          description: Список объектов, содержащих пары ключ-значение меток, которые идентифицируют каждую таймсерию
          items:
            type: object
            additionalProperties:
              type: string
    metaschemas.HTTPError:
      type: object
      properties:
        error:
          type: string
    models.ErrResponse:
      type: object
      properties:
        error:
          type: string
    models.ErrTimeseriesLimits:
      type: object
      properties:
        error:
          type: string
      example:
        error: No more than 30 000 timeseries/samples are allowed to be returned in one response
    Panel:
      type: object
      description: Конфигурация виджетов.
      discriminator:
        propertyName: type
        mapping:
          timeseries: '#/components/schemas/TimeSeriesPanel'
          text: '#/components/schemas/TextPanel'
          stat: '#/components/schemas/StatPanel'
          table: '#/components/schemas/TablePanel'
          state-timeline: '#/components/schemas/StateTimelinePanel'
          host-map: '#/components/schemas/HostMapPanel'
      oneOf:
        - $ref: '#/components/schemas/TextPanel'
        - $ref: '#/components/schemas/TimeSeriesPanel'
        - $ref: '#/components/schemas/StatPanel'
        - $ref: '#/components/schemas/TablePanel'
        - $ref: '#/components/schemas/StateTimelinePanel'
        - $ref: '#/components/schemas/HostMapPanel'
    TimeSeriesQuery:
      type: object
      description: Параметры запросов к данным.
      required:
        - refId
        - legendAlias
        - displayResults
        - query
      properties:
        refId:
          x-oapi-codegen-extra-tags:
            bson: ref_id
          type: string
          description: Уникальный идентификатор запроса.
        legendAlias:
          type: string
          description: Обозначение порога в легенде виджета.
          x-oapi-codegen-extra-tags:
            bson: legend_alias
        displayResults:
          type: boolean
          description: >-
            Отображение результатов запроса на виджете:
              - `true` — показ результатов запроса на виджете;
              - `false` — скрытие результатов запроса на виджете.
          x-oapi-codegen-extra-tags:
            bson: display_results
        query:
          type: string
          description: Запрос к данным для порога.
        formula:
          type: string
          description: Формула, применяемая к метрике в конструкторе запросов.
        metric:
          type: object
          description: Метаданные метрики в конструкторе запросов.
          nullable: true
          properties:
            productType:
              type: string
              description: Продукт, к которому относится метрика.
              nullable: true
              x-oapi-codegen-extra-tags:
                bson: productType
            groupId:
              type: string
              description: Группа, к которой относится метрика.
              format: uuid
              nullable: true
              x-oapi-codegen-extra-tags:
                bson: groupId
    TimeSeriesThreshold:
      type: object
      description: Параметры порогов.
      required:
        - refId
        - legendAlias
        - legendColor
        - displayResults
        - query
      properties:
        refId:
          x-oapi-codegen-extra-tags:
            bson: ref_id
          type: string
          description: Уникальный идентификатор запроса.
        legendAlias:
          type: string
          description: Обозначение порога в легенде виджета.
          x-oapi-codegen-extra-tags:
            bson: legend_alias
        legendColor:
          allOf:
            - $ref: '#/components/schemas/Color'
          x-oapi-codegen-extra-tags:
            bson: legend_color
        displayResults:
          type: boolean
          description: >-
            Отображение результатов запроса на виджете:
              - `true` — показ результатов запроса на виджете;
              - `false` — скрытие результатов запроса на виджете.
          x-oapi-codegen-extra-tags:
            bson: display_results
        query:
          type: string
          description: Запрос к данным.
        formula:
          type: string
          description: Формула, применяемая к метрике в конструкторе запросов.
    TableQuery:
      allOf:
        - $ref: '#/components/schemas/TimeSeriesQuery'
        - required:
            - type
          properties:
            type:
              type: string
              description: >-
                Тип значений:
                  - `range` — значения за период;
                  - `instant` — текущие значения.
              enum:
                - range
                - instant
    TableFieldConfig:
      type: object
      description: Параметры таблицы.
      required:
        - defaults
        - overrides
      x-oapi-codegen-extra-tags:
        bson: field_config
      properties:
        defaults:
          type: object
          description: Параметры по умолчанию.
          required:
            - mappings
          properties:
            decimals:
              type: integer
              description: Число десятичных знаков.
              minimum: 0
              maximum: 5
            mappings:
              type: array
              description: Настройка переопределения значений.
              items:
                $ref: '#/components/schemas/Mapping'
        overrides:
          type: array
          description: Переопределение значений.
          items:
            $ref: '#/components/schemas/Override'
    StatPanel:
      type: object
      description: Параметры виджета "Статистика".
      required:
        - type
        - title
        - description
        - position
        - properties
      properties:
        type:
          type: string
          description: Тип виджета — "Статистика".
        title:
          type: string
          description: Название виджета.
        description:
          type: string
          description: Описание виджета.
          default: ''
        position:
          $ref: '#/components/schemas/Position'
        properties:
          type: object
          description: Параметры настройки виджета.
          required:
            - queries
            - graphMode
            - decimals
          properties:
            queries:
              type: array
              description: Параметры запросов к данным.
              items:
                $ref: '#/components/schemas/TimeSeriesQuery'
            graphMode:
              x-oapi-codegen-extra-tags:
                bson: graph_mode
              type: string
              description: Вид графика.
              enum:
                - area
                - none
              default: area
            decimals:
              type: integer
              description: Число десятичных знаков.
              minimum: 0
              maximum: 5
              default: 2
            thresholds:
              type: object
              description: Настройка добавления порогов на виджет.
              nullable: true
              required:
                - show
                - display
                - items
              properties:
                show:
                  type: boolean
                  description: >-
                    Отображение порогов на виджете:
                       - `true` — показ порогов включен;
                       - `false` — показ порогов выключен.
                  default: false
                display:
                  type: string
                  description: >-
                    Формат показа порога на графике:
                       - `withColor` — цвет;
                       - `withIcon` — иконка;
                       - `withTextColor` — текст.
                  enum:
                    - withColor
                    - withIcon
                    - withTextColor
                  default: withColor
                items:
                  type: array
                  description: Параметры порогов.
                  maxItems: 3
                  items:
                    type: object
                    required:
                      - value
                      - color
                      - direction
                    properties:
                      value:
                        type: number
                        description: Числовое значение порога.
                        format: float
                      color:
                        type: string
                        description: >-
                          HEX-код цвета порога:
                            - `A8D1A2` — зеленый;
                            - `E6C878` — желтый;
                            - `FBAB99` — красный.
                        x-go-name: ThresholdColor
                        enum:
                          - A8D1A2
                          - E6C878
                          - FBAB99
                      direction:
                        type: string
                        description: >-
                          Направление сравнения:
                            - `lt` — меньше;
                            - `gt` — больше;
                            - `lte` — меньше или равно;
                            - `gte` — больше или равно;
                            - `eq` — равно.
                        enum:
                          - lt
                          - gt
                          - lte
                          - gte
                          - eq
    TextPanel:
      type: object
      description: Параметры виджета "Текстовый".
      required:
        - type
        - title
        - description
        - position
        - properties
      properties:
        type:
          type: string
          description: Тип виджета — "Текстовый".
        title:
          type: string
          description: Название виджета.
        description:
          type: string
          description: Описание виджета.
          default: ''
        position:
          $ref: '#/components/schemas/Position'
        properties:
          type: object
          description: Параметры настройки виджета.
          required:
            - content
          properties:
            content:
              type: string
              description: Текст виджета.
    TimeSeriesPanel:
      type: object
      description: Параметры виджета "Временной ряд".
      required:
        - type
        - title
        - description
        - position
        - properties
      properties:
        type:
          type: string
          description: Тип виджета — "Временной ряд".
        title:
          type: string
