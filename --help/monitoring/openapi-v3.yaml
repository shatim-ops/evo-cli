    post:
      tags:
      - Dashboards    
      summary: Импорт пользовательских дашбордов
      parameters:
      - name: projectId
        in: path
        description: Идентификатор проекта.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
