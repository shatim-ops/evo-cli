      properties:
        description:
          type: string
          description: Описание дашборда.
        panels:
          type: array
          description: Параметры виджетов дашборда.
          items:
            $ref: '#/components/schemas/Panel'
        title:
          type: string
          description: Название дашборда.
        variables:
          type: array
          description: Параметры переменных дашборда.
          items:
            $ref: '#/components/schemas/Variable'      
    CreateUpdateDashboardResponse:
      type: object
      description: Ответ на запрос создания или обновления дашборда. 
      required:
        - dashboardId
