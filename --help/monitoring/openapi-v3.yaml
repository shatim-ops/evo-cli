openapi: 3.0.1
info:
    title: Cloud Monitoring API
    description: '[Документация сервиса Cloud Monitoring](https://cloud.ru/docs/service-monitoring/ug/index.html)'
    contact:
        email: support@cloud.ru
    version: 1.0.1
servers:
    - url: https://monitoring.api.cloud.ru
tags:
    - name: Metric Export
      description: Получение метрик.
    - name: Metric Meta
      description: Получение метаданных метрик.   
    - name: Dashboards
      description: Управление дашбордами.  
    - name: Recording Rules
      description: Управление правилами вычисляемых метрик.        
paths:
  /v2/{project_id}/metrics_meta:
    get:
      tags:
      - Metric Meta
      summary: Получение списка метрик
      description: >-
        Если вы указываете большой запрос, который может превышать ограничения на символы в URL на стороне 
        сервера, вы можете закодировать параметры непосредственно в теле запроса, 
        используя метод `POST` и заголовок `Content-Type: application/x-www-form-urlencoded`. 
          
        Опциональные временные параметры `start` и `end` поддерживают следующие форматы:
          - Unix-время в секундах, с опциональным указанием миллисекунд после запятой. Например: `1562529662.678`.
          - Unix-время в миллисекундах. Например: `1562529662678`.
          - Unix-время в микросекундах. Например: `1562529662678901`.
          - Unix-время в наносекундах. Например: `1562529662678901234`.
          - Формат RFC3339. Например: `2022-03-29T01:02:03Z` или `2022-03-29T01:02:03+02:30`.
          - Частичный формат RFC3339. Например: `2022`, `2022-03`, `2022-03-29`, `2022-03-29T01`,
           `2022-03-29T01:02`, `2022-03-29T01:02:03`.
          - Относительная продолжительность по сравнению с текущим временем. 
            Например: `1h5m`, `-1h5m` или `now-1h5m` означает "один час и пять минут назад", а `now` — "сейчас".
      parameters:
      - name: project_id
        in: path
        description: Идентификатор проекта.
        required: true
        schema:
          type: string
      - name: selector
        in: query
        description: >-
          Селектор таймсерий в формате Prometheus.
          Например: `http_requests_total` или `http_requests_total{method=~"(GET|POST)"}`.

          Селектор должен быть закодирован по URL-адресу.
        required: true
        schema:
          type: string
          x-order: "0"
        x-order: "0"
      - name: start
        in: query
        description: Конечная временная метка.
        schema:
          type: string
          x-order: "1"
        x-order: "1"
      - name: end
        in: query
        description: Начальная временная метка.
        schema:
          type: string
          x-order: "2"
        x-order: "2"
      - name: limit
        in: query
        description: Максимальное количество возвращенных таймсерий.
        schema:
          type: integer
          x-order: "3"
        x-order: "3"
      responses:
        "200":
          description: Успешное выполнение запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/metaschemas.GetMetricsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/metaschemas.HTTPError'
  /v2/{project_id}/metrics_meta/labels:
    get:
      tags:
      - Metric Meta
      summary: Получение списка ключей меток
      description: >-
        Если вы указываете большой запрос, который может превышать ограничения на символы в URL на стороне 
        сервера, вы можете закодировать параметры непосредственно в теле запроса, 
        используя метод `POST` и заголовок `Content-Type: application/x-www-form-urlencoded`. 
          
        Опциональные временные параметры `start` и `end` поддерживают следующие форматы:
          - Unix-время в секундах, с опциональным указанием миллисекунд после запятой. Например: `1562529662.678`.
          - Unix-время в миллисекундах. Например: `1562529662678`.
          - Unix-время в микросекундах. Например: `1562529662678901`.
          - Unix-время в наносекундах. Например: `1562529662678901234`.
          - Формат RFC3339. Например: `2022-03-29T01:02:03Z` или `2022-03-29T01:02:03+02:30`.
          - Частичный формат RFC3339. Например: `2022`, `2022-03`, `2022-03-29`, `2022-03-29T01`,
           `2022-03-29T01:02`, `2022-03-29T01:02:03`.
          - Относительная продолжительность по сравнению с текущим временем. 
            Например: `1h5m`, `-1h5m` или `now-1h5m` означает "один час и пять минут назад", а `now` — "сейчас".
      parameters:
      - name: project_id
        in: path
        description: Идентификатор проекта.
        required: true
        schema:
          type: string
      - name: selector
        in: query
        description: >-
          Селектор таймсерий в формате Prometheus.
          Например: `http_requests_total` или `http_requests_total{method=~"(GET|POST)"}`.

          Селектор должен быть закодирован по URL-адресу.
        schema:
          type: string
          x-order: "0"
        x-order: "0"
      - name: start
        in: query
        description: Начальная временная метка.
        schema:
          type: string
          x-order: "1"
        x-order: "1"
      - name: end
        in: query
        description: Конечная временная метка.
        schema:
          type: string
          x-order: "2"
        x-order: "2"
      - name: limit
        in: query
        description: Максимальное количество возвращенных таймсерий.
        schema:
          type: integer
          x-order: "3"
        x-order: "3"
      responses:
        "200":
          description: Успешное выполнение запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/metaschemas.GetMetricLabelsResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/metaschemas.HTTPError'
  /v2/{project_id}/metrics_meta/labels/{label}/values:
    get:
      tags:
      - Metric Meta
      summary: Получение списка значений для указанного ключа метки
      description: >-
        Если вы указываете большой запрос, который может превышать ограничения на символы в URL на стороне 
        сервера, вы можете закодировать параметры непосредственно в теле запроса, 
        используя метод `POST` и заголовок `Content-Type: application/x-www-form-urlencoded`. 
          
        Опциональные временные параметры `start` и `end` поддерживают следующие форматы:
          - Unix-время в секундах, с опциональным указанием миллисекунд после запятой. Например: `1562529662.678`.
          - Unix-время в миллисекундах. Например: `1562529662678`.
          - Unix-время в микросекундах. Например: `1562529662678901`.
          - Unix-время в наносекундах. Например: `1562529662678901234`.
          - Формат RFC3339. Например: `2022-03-29T01:02:03Z` или `2022-03-29T01:02:03+02:30`.
          - Частичный формат RFC3339. Например: `2022`, `2022-03`, `2022-03-29`, `2022-03-29T01`,
           `2022-03-29T01:02`, `2022-03-29T01:02:03`.
          - Относительная продолжительность по сравнению с текущим временем. 
            Например: `1h5m`, `-1h5m` или `now-1h5m` означает "один час и пять минут назад", а `now` — "сейчас".
      parameters:
      - name: label
        in: path
        description: Название метки
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: Идентификатор проекта.
        required: true
        schema:
          type: string
      - name: selector
        in: query
        description: |-
          Селектор таймсерий в формате Prometheus.
          Например: `http_requests_total` или `http_requests_total{method=~"(GET|POST)"}`.

          Селектор должен быть закодирован по URL-адресу.
        schema:
          type: string
          x-order: "0"
        x-order: "0"
      - name: start
        in: query
        description: Начальная временная метка.
        schema:
          type: string
          x-order: "1"
        x-order: "1"
      - name: end
        in: query
        description: Конечная временная метка.
        schema:
          type: string
          x-order: "2"
        x-order: "2"
      - name: limit
        in: query
        description: Максимальное количество возвращенных таймсерий.
        schema:
          type: integer
          x-order: "3"
        x-order: "3"
      responses:
        "200":
          description: Успешное выполнение запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/metaschemas.GetMetricLabelValuesResponse'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/metaschemas.HTTPError'
  /v2/{project_id}/metrics_meta/names:
    get:
      tags:
      - Metric Meta
      summary: Получение списка имен метрик
      description: >-
        Если вы указываете большой запрос, который может превышать ограничения на символы в URL на стороне 
        сервера, вы можете закодировать параметры непосредственно в теле запроса, 
        используя метод `POST` и заголовок `Content-Type: application/x-www-form-urlencoded`. 
          
        Опциональные временные параметры `start` и `end` поддерживают следующие форматы:
          - Unix-время в секундах, с опциональным указанием миллисекунд после запятой. Например: `1562529662.678`.
          - Unix-время в миллисекундах. Например: `1562529662678`.
          - Unix-время в микросекундах. Например: `1562529662678901`.
          - Unix-время в наносекундах. Например: `1562529662678901234`.
          - Формат RFC3339. Например: `2022-03-29T01:02:03Z` или `2022-03-29T01:02:03+02:30`.
          - Частичный формат RFC3339. Например: `2022`, `2022-03`, `2022-03-29`, `2022-03-29T01`,
           `2022-03-29T01:02`, `2022-03-29T01:02:03`.
          - Относительная продолжительность по сравнению с текущим временем. 
            Например: `1h5m`, `-1h5m` или `now-1h5m` означает "один час и пять минут назад", а `now` — "сейчас".
      parameters:
