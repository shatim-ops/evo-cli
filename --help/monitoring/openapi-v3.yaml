          enum: [regex]
        options:
          type: object
          description: Параметры переопределения.
          required:
            - pattern
            - result
          properties:
            pattern:
              type: string
              description: Регулярное выражение.
              format: regex
            result:
              type: object
              description: Параметры отображения переопределения.
              required:
                - index
                - text
                - color
              properties:
                index:
                  type: integer
                  description: Порядковый номер в списке вариантов.
                  minimum: 0
                text:
                  type: string
                  description: Новое значение, которое нужно отображать в таблице вместо заданного регулярного выражения.
                color:
                  $ref: '#/components/schemas/Color'
    Position:
      type: object
      description: Параметры расположения виджета на дашборде.
      required:
        - h
        - w
        - x
        - 'y'
        - i
      properties:
        h:
          type: integer
          description: Высота виджета.
        w:
          type: integer
          description: Ширина виджета.
        x:
          type: integer
          description: Горизонтальная координата виджета.
        'y':
          type: integer
          description: Вертикальная координата виджета.
        i:
          type: string
          description: Идентификатор виджета на дашборде.
        moved:
          type: boolean
          description: Параметр, показывающий, менялось ли расположение виджета на дашборде.
    Variable:
      type: object
      required:
        - name
        - query
        - includeAll
        - multi
        - show
      properties:
        allValue:
          type: string
          description: Возможность множественного выбора значений переменной.
          minLength: 1
          nullable: true
        description:
          type: string
          description: Описание переменной.
        includeAll:
          type: boolean
          description: >-
            Выбор всех значений переменной:
              - `true` — выбор всех значений включен;
              - `false` — выбор всех значений выключен.
        multi:
          type: boolean
          description: >-
            Выбор нескольких значений переменной:
              - `true` — выбор нескольких значений включен;
              - `false` — выбор нескольких значений выключен.
        name:
          type: string
          description: Уникальное название переменной на дашборде, которое будет показываться в таблице со списком переменных этого дашборда.
        query:
          $ref: '#/components/schemas/VariableQuery'
        show:
          type: boolean
          description: >-
            Отображение переменной на дашборде:
              - `true` — показывать переменную;
              - `false` — не показывать переменную.
    VariableQuery:
      type: object
      description: Параметры переменных.
      required:
        - type
      properties:
        label:
          type: string
          description: Наименование лейбла, значения которого используются в запросах для получения значений металейбла.
        match:
          type: string
          description: Оператор для фильтрации значений переменной, например `=`. 
        metaLabel:
          type: string
          description: Наименование металейбла, значения которого нужно получить и показать в выпадающем списке в фильтре переменной на дашборде.
        options:
          type: array
          description: Значения переменной для типа "Список".
          items:
            $ref: '#/components/schemas/QueryOption'
        type:
          type: string
          description: >- 
            Параметр, определяющий тип переменной:
              - `label_values_meta` — запрос с металейблом;
              - `label_values` — запрос;
              - `custom` — список.
          
          enum:
            - label_values_meta
            - label_values
            - custom
    QueryOption:
      type: object
      description: Значения переменной для типа "Список".
      required:
        - value
      properties:
        value:
          type: string
          description: Список значений переменной.
    Color:
      type: string
      description: >-
        HEX-код цветовой индикации:
          - `A8D1A2` — зеленый;
          - `BEC2CF` — серый;
          - `AAC4EA` — синий;
          - `E6C878` — желтый;
          - `99D7BA` — бирюзовый;
          - `8B8E9B` — темно-серый;
          - `F5B27B` — оранжевый;
          - `DBB3DB` — сиреневый;
          - `A0D3DE` — голубой;
          - `E8B1C1` — розовый;
          - `B4D28E` — ярко-зеленый;
          - `FBAB99` — красный;
          - `B88F3C` — коричневый.
      enum:
        - A8D1A2
        - BEC2CF
        - AAC4EA
        - E6C878
        - 99D7BA
        - 8B8E9B
        - F5B27B
        - DBB3DB
        - A0D3DE
        - E8B1C1
        - B4D28E
        - FBAB99
        - B88F3C
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    ListDashboardResponse:
