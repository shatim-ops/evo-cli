          description: >-
            Название правила. Максимальная длина — 64 символа.
          maxLength: 64
        queryLabels:
          $ref: '#/components/schemas/recordingschemas.LabelSelection'
        state:
          type: string
          description: >-
            Статус правила:
              - `active` — «Включено»;
              - `inactive` — «Выключено». 
          enum:
            - active
            - inactive    
