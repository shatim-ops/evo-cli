swagger: '2.0'
info:
  title: Cloud.ru Evolution Load Balancer API
  description: '[Документация Load Balancer](https://cloud.ru/docs/nlb/ug/index.html)'
  contact:
      email: support@cloud.ru
  version: '1.0'
servers:
    - url: https://nlb.api.cloud.ru 
tags:
  - name: NetworkLoadBalancerService
  - name: OperationService
  - name: TargetGroupService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v2/networkLoadBalancers:
    get:
      summary: Получение списка балансировщиков по заданным фильтрам
      operationId: NetworkLoadBalancerService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v2ListNLBResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: project_id
          description: >-
            Идентификатор проекта, список балансировщиков которого требуется
            получить.
          in: query
          required: true
          type: string
        - name: page_size
          description: Максимальное количество балансировщиков на странице.
          in: query
          required: false
          type: string
          format: int64
        - name: page_token
          description: Токен запрашиваемой страницы для пагинации курсором.
          in: query
          required: false
          type: string
      tags:
        - NetworkLoadBalancerService
    post:
      summary: Создание балансировщика
      operationId: NetworkLoadBalancerService_Create
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: Параметры запроса для создания балансировщика.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v2CreateNLBRequest'
      tags:
        - NetworkLoadBalancerService
  /v2/networkLoadBalancers/{id}:
    get:
      summary: Получение информации о балансировщике
      operationId: NetworkLoadBalancerService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v2NetworkLoadBalancer'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор балансировщика.
          in: path
          required: true
          type: string
      tags:
        - NetworkLoadBalancerService
    delete:
      summary: Удаление балансировщика
      operationId: NetworkLoadBalancerService_Delete
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор балансировщика.
          in: path
          required: true
          type: string
      tags:
        - NetworkLoadBalancerService
    patch:
      summary: Обновление балансировщика
      operationId: NetworkLoadBalancerService_Update
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор балансировщика.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v2NetworkLoadBalancerServiceUpdateBody'
      tags:
        - NetworkLoadBalancerService
  /v2/operations/{operation_id}:
    get:
      summary: Получение информации по заданному идентификатору
      operationId: OperationService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: operation_id
          description: >-
            Идентификатор операции.

            Переопределяет `id`.

            Хотя бы один из параметров [`id`, `operation_id`] должен быть
            указан.
          in: path
          required: true
          type: string
        - name: id
          description: >-
            Идентификатор операции.

            Игнорируется, если указан `operation_id`.

            Хотя бы один из параметров [`id`, `operation_id`] должен быть
            указан.
          in: query
          required: false
          type: string
      tags:
        - OperationService
  /v2/targetGroups:
    get:
      summary: Получение списка целевых групп по заданным фильтрам
      operationId: TargetGroupService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v2ListTargetGroupResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: project_id
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: page_size
          description: Максимальное количество целевых групп на странице.
          in: query
          required: false
          type: string
          format: int64
        - name: page_token
          description: Токен запрашиваемой страницы для пагинации курсором.
          in: query
          required: false
          type: string
      tags:
        - TargetGroupService
    post:
      summary: Создание целевой группы
      operationId: TargetGroupService_Create
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: Параметры запроса для создания целевой группы.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v2CreateTargetGroupRequest'
      tags:
        - TargetGroupService
  /v2/targetGroups/{id}:
    get:
      summary: Получение информации о целевой группе
      operationId: TargetGroupService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v2TargetGroup'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор целевой группы.
          in: path
          required: true
          type: string
      tags:
        - TargetGroupService
    delete:
      summary: Удаление целевой группы
      operationId: TargetGroupService_Delete
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор целевой группы.
          in: path
          required: true
          type: string
      tags:
        - TargetGroupService
    patch:
      summary: Обновление целевой группы
      operationId: TargetGroupService_Update
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/operationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор целевой группы.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v2TargetGroupServiceUpdateBody'
      tags:
        - TargetGroupService
definitions:
  operationOperation:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор операции.
      resource_name:
        type: string
        description: >-
          Информация о ресурсе, над которым производится операция.

          Строится следующим образом:
          urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT.

          Пример: urn:cloud:lbaas::54295782-7aef-43e6-b33b-c9735938677a:backend
        readOnly: true
      resource_id:
        type: string
        description: >-
          Уникальный идентификатор ресурса, над которым производится операция.
          Пример: 54295782-7aef-43e6-b33b-c9735938677a
        readOnly: true
      created_at:
        type: string
        format: date-time
        description: Время создания операции.
        readOnly: true
      updated_at:
        type: string
        format: date-time
        description: Время последнего изменения операции.
        readOnly: true
      done:
        type: boolean
        description: >-
          Флаг завершенности операции.

          Если значение `false`, то операция в процессе выполнения.

          Если значение `true`, то операция завершена и поле `error` может быть
          заполнено.
        readOnly: true
      description:
        type: string
        description: Описание операции. От 0 до 255 символов.
        readOnly: true
      error:
        $ref: '#/definitions/rpcStatus'
        description: Результат операции в случае ошибки.
        readOnly: true
    required:
      - id
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
        description: >-
          A URL/resource name that uniquely identifies the type of the
          serialized

          protocol buffer message. This string must contain at least

          one "/" character. The last segment of the URL's path must represent

          the fully qualified name of the type (as in

          `path/google.protobuf.Duration`). The name should be in a canonical
          form

          (e.g., leading "." is not accepted).


          In practice, teams usually precompile into the binary all types that
          they

          expect it to use in the context of Any. However, for URLs which use
          the

          scheme `http`, `https`, or no scheme, one can optionally set up a type

          server that maps type URLs to message definitions as follows:


          * If no scheme is provided, `https` is assumed.

          * An HTTP GET on the URL must yield a [google.protobuf.Type][]
            value in binary format, or produce an error.
          * Applications are allowed to cache lookup results based on the
            URL, or have them precompiled into a binary to avoid any
            lookup. Therefore, binary compatibility needs to be preserved
            on changes to types. (Use versioned type names to manage
            breaking changes.)

          Note: this functionality is not currently available in the official

          protobuf release, and it is not used for type URLs beginning with

          type.googleapis.com. As of May 2023, there are no widely used type
          server

          implementations and no plans to implement one.


          Schemes other than `http`, `https` (or the empty scheme) might be

          used with implementation specific semantics.
    additionalProperties: {}
    description: >-
      `Any` contains an arbitrary serialized protocol buffer message along with
      a

      URL that describes the type of the serialized message.


      Protobuf library provides support to pack/unpack Any values in the form

      of utility functions or additional generated methods of the Any type.


      Example 1: Pack and unpack a message in C++.

          Foo foo = ...;
          Any any;
          any.PackFrom(foo);
          ...
          if (any.UnpackTo(&foo)) {
            ...
          }

      Example 2: Pack and unpack a message in Java.

          Foo foo = ...;
          Any any = Any.pack(foo);
          ...
          if (any.is(Foo.class)) {
            foo = any.unpack(Foo.class);
          }
          // or ...
          if (any.isSameTypeAs(Foo.getDefaultInstance())) {
            foo = any.unpack(Foo.getDefaultInstance());
          }

       Example 3: Pack and unpack a message in Python.

          foo = Foo(...)
          any = Any()
          any.Pack(foo)
          ...
          if any.Is(Foo.DESCRIPTOR):
            any.Unpack(foo)
            ...

       Example 4: Pack and unpack a message in Go

           foo := &pb.Foo{...}
           any, err := anypb.New(foo)
           if err != nil {
             ...
           }
           ...
           foo := &pb.Foo{}
           if err := any.UnmarshalTo(foo); err != nil {
             ...
           }

      The pack methods provided by protobuf library will by default use

      'type.googleapis.com/full.type.name' as the type URL and the unpack

      methods only use the fully qualified type name after the last '/'

      in the type URL, for example "foo.bar.com/x/y.z" will yield type

      name "y.z".


      JSON

      ====

      The JSON representation of an `Any` value uses the regular

      representation of the deserialized, embedded message, with an

      additional field `@type` which contains the type URL. Example:

          package google.profile;
          message Person {
            string first_name = 1;
            string last_name = 2;
          }

          {
            "@type": "type.googleapis.com/google.profile.Person",
            "firstName": <string>,
            "lastName": <string>
          }

      If the embedded message type is well-known and has a custom JSON

      representation, that representation will be embedded adding a field

      `value` which holds the custom JSON in addition to the `@type`

      field. Example (for message [google.protobuf.Duration][]):

          {
            "@type": "type.googleapis.com/google.protobuf.Duration",
            "value": "1.212s"
          }
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: |-
          The status code, which should be an enum value of
          google.rpc.Code.
      message:
        type: string
        description: >-
          A developer-facing error message, which should be in English. Any

          user-facing error message should be localized and sent in the

          google.rpc.Status.details field, or
          localized

          by the client.
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
        description: >-
          A list of messages that carry the error details.  There is a common
          set of

          message types for APIs to use.
    description: >-
      The `Status` type defines a logical error model that is suitable for

      different programming environments, including REST APIs and RPC APIs. It
      is

      used by [gRPC](https://github.com/grpc). Each `Status` message contains

      three pieces of data: error code, error message, and error details.


      You can find out more about this error model and how to work with it in
      the

      [API Design Guide](https://cloud.google.com/apis/design/errors).
  v2Algorithm:
    type: string
    enum:
      - ALG_UNSPECIFIED
      - ALG_ROUND_ROBIN
      - ALG_MAGLEV
      - ALG_LEAST_REQUEST
    default: ALG_UNSPECIFIED
    description: Алгоритм балансировки нагрузки.
  v2AvailabilityZone:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор зоны доступности.
        readOnly: true
      name:
        type: string
        description: Название зоны доступности.
        readOnly: true
      subnets:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2Subnet'
        description: >-
          Список внутренних подсетей в зоне доступности, из которых будут
          выделены

          IP-адреса для реплик балансировщика. Именно с этих IP-адресов сетевой
          трафик

          будет доставляться к целям.
        readOnly: true
    description: Настройки зоны доступности.
  v2AvailabilityZoneSpec:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор зоны доступности.
      name:
        type: string
        description: Название зоны доступности.
      subnet_ids:
        type: array
        items:
          type: string
        description: >-
          Список внутренних подсетей в зоне доступности, из которых будут
          выделены

          IP-адреса для реплик балансировщика. Именно с этих IP-адресов сетевой
          трафик

          будет доставляться к целям.
    description: Настройки зоны доступности.
    required:
      - subnet_ids
  v2CreateNLBRequest:
    type: object
    properties:
      project_id:
        type: string
        description: Идентификатор проекта, в котором требуется создать балансировщик.
      name:
        type: string
        description: Название балансировщика.
      vpc_id:
        type: string
        description: Идентификатор VPC, в которой находится балансировщик.
      internal_address_spec:
        $ref: '#/definitions/v2InternalAddressSpec'
        description: Параметры внутреннего IP-адреса. Хотя бы один IP-адрес должен быть сконфигурирован.
      external_address_spec:
        $ref: '#/definitions/v2ExternalAddressSpec'
        description: Параметры внешнего (публичного) IP-адреса. Хотя бы один IP-адрес должен быть сконфигурирован.
      rules:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2Rule'
        description: Список правил балансировки.
      availability_zone_specs:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2AvailabilityZoneSpec'
        description: Список зон доступности, которые обслуживает балансировщик.
      description:
        type: string
        description: Описание балансировщика.
    description: Параметры запроса для создания балансировщика.
    required:
      - project_id
      - name
      - vpc_id
      - rules
      - availability_zone_specs
  v2CreateTargetGroupRequest:
    type: object
    properties:
      project_id:
        type: string
        description: Идентификатор проекта, в котором требуется создать целевую группу.
      name:
        type: string
        description: Название целевой группы.
      target_vm_specs:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2TargetVMSpec'
        description: Список виртуальных машин, входящих в целевую группу.
    description: Параметры запроса для создания целевой группы.
    required:
      - project_id
      - name
      - target_vm_specs
  v2ExternalAddress:
    type: object
    properties:
      ipv4:
        type: string
        description: IP-адрес.
        readOnly: true
    description: Внешний (публичный) IP-адрес балансировщика.
  v2ExternalAddressSpec:
    type: object
    properties:
      allocate:
        type: boolean
        description: Флаг, указывающий на необходимость выделения IP-адреса.
    description: Параметры внешнего (публичного) IP-адреса. Хотя бы один IP-адрес должен быть сконфигурирован.
  v2HealthCheck:
    type: object
    properties:
      disabled:
        type: boolean
        description: >-
          Флаг отключения проверки доступности.

          Позволяет отключить проверку, сохранив ее параметры.

          По умолчанию: `false` (проверка включена, если объект
          инициализирован).
      tcp:
        $ref: '#/definitions/v2HealthCheckTCP'
        description: Метод проверки доступности путем установки TCP-соединения.
      http:
        $ref: '#/definitions/v2HealthCheckHTTP'
        description: Метод проверки доступности путем отправки HTTP-запроса.
      port:
        type: integer
        format: int64
        description: >-
          Номер порта цели, на который будут отправляться запросы проверки
          доступности.
      timeout:
        type: string
        description: |-
          Время ожидания ответа на запрос проверки доступности.
          Если время истекло, проверка считается проваленной.
      interval:
        type: string
        description: Временной интервал между проверками доступности.
      unhealthy_threshold:
        type: integer
        format: int64
        description: >-
          Порог проваленных проверок доступности.

          Если количество проваленных подряд проверок превысило порог, цель
          считается недоступной.

          Если проверка производится путем отправки HTTP-запросов, то при
          получении ответа

          с кодом 503 цель считается недоступной сразу же (порог игнорируется).
      healthy_threshold:
        type: integer
        format: int64
        description: |-
          Количество успешных последовательных проверок, необходимых для того,
          чтобы считать ранее недоступный хост доступным.
    description: Настройки проверки доступности целей.
    required:
      - port
      - timeout
      - interval
      - unhealthy_threshold
      - healthy_threshold
  v2HealthCheckHTTP:
    type: object
    properties:
      path:
        type: string
        description: Путь (часть URL), который будет использован для отправки запроса.
    description: Параметры для проверки доступности путем отправки HTTP-запроса.
    required:
      - path
  v2HealthCheckTCP:
    type: object
    description: Параметры для проверки доступности путем установки TCP-соединения.
  v2InternalAddress:
    type: object
    properties:
      ipv4:
        type: string
        description: IP-адрес.
        readOnly: true
      subnet_id:
        type: string
        description: Идентификатор подсети, в которой находится IP-адрес.
        readOnly: true
    description: Внутренний IP-адрес балансировщика.
  v2InternalAddressSpec:
    type: object
    properties:
      allocate:
        type: boolean
        description: |-
          Флаг, указывающий на необходимость выделения IP-адреса.
          При значении false все остальные параметры игнорируются.
      subnet_id:
        type: string
        description: |-
          Идентификатор подсети, из которой будет выделен IP-адрес.
          Обязательный параметр, если IP-адрес необходим.
      ipv4:
        type: string
        description: >-
          IP-адрес из указанной подсети, который должен быть назначен
          балансировщику.
    description: Параметры внутреннего IP-адреса. Хотя бы один IP-адрес должен быть сконфигурирован.
  v2ListNLBResponse:
    type: object
    properties:
      balancers:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2NetworkLoadBalancer'
        description: Содержимое запрашиваемой страницы.
      next_page_token:
        type: string
        description: Токен следующей страницы для пагинации курсором.
    description: Ответ на запрос получения списка балансировщиков.
  v2ListTargetGroupResponse:
    type: object
    properties:
      target_groups:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2TargetGroup'
        description: Содержимое запрашиваемой страницы (список целевых групп).
      next_page_token:
        type: string
        description: Токен следующей страницы для пагинации курсором.
    description: Ответ на запрос получения списка целевых групп.
  v2Listener:
    type: object
    properties:
      name:
        type: string
        description: Название порта, уникальное относительно всех портов балансировщика.
      port:
        type: integer
        format: int64
        description: Номер порт балансировщика для входящего трафика.
      target_port:
        type: integer
        format: int64
        description: >-
          Номер порта назначения, куда следует доставлять трафик (одинаковый для
          всех целей).
    description: Настройки портов балансировщика.
    required:
      - name
      - port
      - target_port
  v2NLBStatus:
    type: string
    enum:
      - NLB_STATUS_UNSPECIFIED
      - NLB_STATUS_CREATING
      - NLB_STATUS_ERROR_CREATING
      - NLB_STATUS_RUNNING
      - NLB_STATUS_UPDATING
      - NLB_STATUS_ERROR_UPDATING
      - NLB_STATUS_DELETING
      - NLB_STATUS_ERROR_DELETING
      - NLB_STATUS_DELETED
      - NLB_STATUS_SUSPENDING
      - NLB_STATUS_SUSPENDED
      - NLB_STATUS_ERROR_SUSPENDING
      - NLB_STATUS_RESUMING
      - NLB_STATUS_ERROR_RESUMING
    default: NLB_STATUS_UNSPECIFIED
    description: |-
      Оперативный статус балансировщика.

       - NLB_STATUS_CREATING: Балансировщик в процессе создания.
       - NLB_STATUS_ERROR_CREATING: Создание балансировщика завершилось ошибкой.
       - NLB_STATUS_RUNNING: Балансировщик готов к работе (активен).
       - NLB_STATUS_UPDATING: Балансировщик в процессе обновления.
       - NLB_STATUS_ERROR_UPDATING: Обновление балансировщика завершилось ошибкой.
       - NLB_STATUS_DELETING: Балансировщик в процессе удаления.
       - NLB_STATUS_ERROR_DELETING: Удаление балансировщика завершилось ошибкой.
       - NLB_STATUS_DELETED: Балансировщик удален.
       - NLB_STATUS_SUSPENDING: Балансировщик в процессе остановки работы.
       - NLB_STATUS_SUSPENDED: Работа балансировщика остановлена.
       - NLB_STATUS_ERROR_SUSPENDING: Остановка работы балансировщика завершилась ошибкой.
       - NLB_STATUS_RESUMING: Балансировщик в процессе возобновления работы после остановки.
       - NLB_STATUS_ERROR_RESUMING: Возобновление работы балансировщика завершилось ошибкой.
  v2NetworkLoadBalancer:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор балансировщика.
      name:
        type: string
        description: Название балансировщика.
      project_id:
        type: string
        description: Идентификатор проекта, которому принадлежит балансировщик.
      vpc_id:
        type: string
        description: Идентификатор VPC, в которой находится балансировщик.
      internal_address:
        $ref: '#/definitions/v2InternalAddress'
        description: Внутренний IP-адрес балансировщика.
        readOnly: true
      external_address:
        $ref: '#/definitions/v2ExternalAddress'
        description: Внешний (публичный) IP-адрес балансировщика.
        readOnly: true
      rules:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2Rule'
        description: Список правил балансировки.
      availability_zones:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2AvailabilityZone'
        description: Список зон доступности, которые обслуживает балансировщик.
        readOnly: true
      description:
        type: string
        description: Описание балансировщика.
      status:
        $ref: '#/definitions/v2NLBStatus'
        description: Оперативный статус балансировщика.
        readOnly: true
      created_at:
        type: string
        format: date-time
        description: Время создания балансировщика.
        readOnly: true
      updated_at:
        type: string
        format: date-time
        description: Время последнего обновления балансировщика.
        readOnly: true
      revision:
        type: string
        format: int64
        description: |-
          Номер ревизии ресурса.
          Увеличивается при каждом изменении ресурса
          (именно увеличивается, а не инкрементируется).
          Может быть использован для условного обновления ресурса.
        readOnly: true
    description: Балансировщик нагрузки L4 (транспортного уровня модели OSI).
    required:
      - name
      - project_id
      - vpc_id
      - rules
  v2NetworkLoadBalancerServiceUpdateBody:
    type: object
    properties:
      revision:
        type: string
        format: int64
        description: >-
          Последний известный клиенту номер ревизии.

          Если указан, то запрос будет выполнен только в том случае, если номер
          ревизии

          ресурса на сервере совпадает с указанным. Если сервер содержит более
          свежую

          версию ресурса, то запрос завершится ошибкой.

          Если не указан, обновление выполняется безусловно.
      name:
        type: string
        description: Название балансировщика.
      rules:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2Rule'
        description: |-
          Список правил балансировки.
          Если список пустой, параметр не будет изменен.
      availability_zone_specs:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2AvailabilityZoneSpec'
        description: |-
          Список зон доступности, которые обслуживает балансировщик.
          Если список пустой, параметр не будет изменен.
      description:
        type: string
        description: Описание балансировщика.
    description: Параметры запроса для обновления балансировщика.
  v2ReturnAddress:
    type: object
    properties:
      ipv4:
        type: string
        description: IP-адрес.
        readOnly: true
    description: Информация об IP-адресе обратного трафика.
  v2Rule:
    type: object
    properties:
      name:
        type: string
        description: Название правила.
      target_group_id:
        type: string
        description: Идентификатор целевой группы, для которой действует правило.
      listeners:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2Listener'
        description: |-
          Настройки портов балансировщика.
          Должны быть уникальными относительно всех портов балансировщика.
      health_check:
        $ref: '#/definitions/v2HealthCheck'
        description: Настройки проверки доступности целей.
      algorithm:
        $ref: '#/definitions/v2Algorithm'
        description: Алгоритм балансировки.
        readOnly: true
    description: Правило балансировки.
    required:
      - name
      - target_group_id
      - listeners
  v2Subnet:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор подсети.
        readOnly: true
      return_addrs:
        type: array
        items:
          type: object
          $ref: '#/definitions/v2ReturnAddress'
        description: |-
          Список IP-адресов обратного трафика балансировщика.
          Именно с этих IP-адресов трафик поступает на цели.
        readOnly: true
    description: Информация об используемой подсети.
  v2TargetGroup:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор целевой группы.
      name:
        type: string
        description: Название целевой группы, уникальное в пределах проекта.
      project_id:
        type: string
        description: Идентификатор проекта, в котором создана целевая группа.
      target_vms:
        type: array
