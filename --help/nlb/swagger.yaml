        description: Оперативный статус целевой группы.
        readOnly: true
      created_at:
        type: string
        format: date-time
        description: Время создания целевой группы.
        readOnly: true
      updated_at:
        type: string
        format: date-time
        description: Время последнего обновления целевой группы.
        readOnly: true
      revision:
        type: string
        format: int64
        description: |-
          Номер ревизии ресурса.
          Увеличивается при каждом изменении ресурса
          (именно увеличивается, а не инкрементируется).
          Может быть использован для условного обновления ресурса.
        readOnly: true
    description: Целевая группа — группа целей, между которыми балансировщик распределяет трафик.
    required:
      - name
      - project_id
  v2TargetGroupServiceUpdateBody:
    type: object
    properties:
      revision:
        type: string
        format: int64
        description: >-
          Последний известный клиенту номер ревизии.

          Если указан, то запрос будет выполнен только в том случае, если номер
          ревизии

          ресурса на сервере совпадает с указанным. Если сервер содержит более
          свежую

          версию ресурса, то запрос завершится ошибкой.

          Если не указан, обновление выполняется безусловно.
      name:
        type: string
        description: Название целевой группы.
      target_vm_specs:
