          type: object
          $ref: '#/definitions/v2TargetVM'
        description: Список виртуальных машин целевой группы.
        readOnly: true
      vpc_id:
        type: string
        description: |-
          Идентификатор VPC, в которой находится целевая группа.
          Все цели в целевой группе, а также балансировщики, использующие ее,
          должны находиться в одной VPC.
