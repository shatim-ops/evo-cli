  v2TargetGroupStatus:
    type: string
    enum:
      - TARGET_GROUP_STATUS_UNSPECIFIED
      - TARGET_GROUP_STATUS_CREATING
      - TARGET_GROUP_STATUS_ERROR_CREATING
      - TARGET_GROUP_STATUS_CREATED
      - TARGET_GROUP_STATUS_UPDATING
      - TARGET_GROUP_STATUS_ERROR_UPDATING
      - TARGET_GROUP_STATUS_DELETING
      - TARGET_GROUP_STATUS_ERROR_DELETING
      - TARGET_GROUP_STATUS_DELETED
    default: TARGET_GROUP_STATUS_UNSPECIFIED
    description: |-
      Оперативный статус целевой группы.

       - TARGET_GROUP_STATUS_CREATING: Целевая группа находится в процессе создания.
       - TARGET_GROUP_STATUS_ERROR_CREATING: Создание целевой группы завершилось ошибкой.
       - TARGET_GROUP_STATUS_CREATED: Целевая группа успешно создана и готова к использованию.
       - TARGET_GROUP_STATUS_UPDATING: Целевая группа находится в процессе обновления.
       - TARGET_GROUP_STATUS_ERROR_UPDATING: Обновление целевой группы завершилось ошибкой.
       - TARGET_GROUP_STATUS_DELETING: Целевая группа находится в процессе удаления.
       - TARGET_GROUP_STATUS_ERROR_DELETING: Удаление целевой группы завершилось ошибкой.
       - TARGET_GROUP_STATUS_DELETED: Целевая группа успешно удалена.
  v2TargetVM:
