swagger: '2.0'
info:
  title: Public API Контроль затрат
  version: '2.0'
  description: '[Контроль затрат - документация](https://cloud.ru/docs/billing/ug/index.html)'
tags:
  - name: ConsumptionService
host: organization.api.cloud.ru
basePath: /
consumes:
  - application/json
produces:
  - application/json
paths:
  /v2/consumption:
    get:
      summary: Получение потребления по ресурсам
      operationId: ConsumptionService_GetConsumption
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v2GetConsumptionResponse'
        '400':
          description: Некорректный запрос
          schema: {}
        '401':
          description: Необходима авторизация
          schema: {}
        '403':
          description: Доступ запрещен
          schema: {}
        '404':
          description: Ресурс не найден
          schema: {}
        '500':
          description: Внутренняя ошибка сервера
          schema: {}
      parameters:
        - name: agreement_id
          description: Фильтр по идентификатору договора. [Где найти ID договора](https://cloud.ru/docs/billing/ug/topics/faq__api_id_agreement.html)
          in: query
          required: false
          type: string
        - name: project_ids
          description: Фильтр по идентификаторам проектов.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: service_names
          description: Фильтр по названиям облачных сервисов в продуктовом каталоге.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: sku_ids
          description: Фильтр по идентификаторам SKU.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: start_date
          description: Фильтр по дате начала периода потребления.
          in: query
          required: true
          type: string
          format: date-time
        - name: end_date
          description: Фильтр по дате окончания периода потребления.
          in: query
          required: true
          type: string
          format: date-time
        - name: start_updated_dt
          description: Фильтр по времени обновления записи.
          in: query
          required: false
          type: string
          format: date-time
        - name: end_updated_dt
          description: Фильтр по времени обновления записи.
          in: query
          required: false
          type: string
          format: date-time
        - name: page_filter.page_size
          in: query
          required: true
          type: integer
          format: int64
        - name: page_filter.page_token
          in: query
          required: false
          type: string
        - name: show_advanced_tags
          description: Признак возвращения набора тегов по платформе Advanced.
          in: query
          required: false
          type: boolean
      tags:
        - ConsumptionService
definitions:
  GetConsumptionResponseAdvancedMeta:
    type: object
    properties:
      iam_project_id:
        type: string
      iam_project_name:
        type: string
      enterprise_project_id:
        type: string
      enterprise_project_name:
        type: string
      tenant_id:
        type: string
      tenant_name:
        type: string
      az_code:
        type: string
      extended_params:
        type: string
  GetConsumptionResponseConsumption:
    type: object
    properties:
      product_instance_id:
        type: string
        description: Идентификатор подключения к платформе в ОП.
      sku:
        type: string
        description: Идентификатор облачного сервиса в продуктовом каталоге.
      servname:
        type: string
        description: Название облачного сервиса в продуктовом каталоге.
      resource_id:
        type: string
        description: Идентификатор экземпляра ресурса.
      resource_name:
        type: string
        description: Название экземпляра ресурса.
      usedate:
        type: string
        format: date-time
        description: Дата потребления.
      amount:
        type: number
        format: double
        description: Стоимость потребления без НДС.
      amount_nds:
        type: number
        format: double
        description: Стоимость потребления с НДС.
      cost:
        type: number
        format: double
        description: Тариф потребления облачного сервиса без НДС.
      unit:
        type: string
        description: Единица измерения для тарифа облачного сервиса.
      usefact:
        type: number
        format: double
        description: Объем потребления облачного сервиса.
      platform:
        type: string
        description: Платформа облачного сервиса.
      advanced_meta:
        $ref: '#/definitions/GetConsumptionResponseAdvancedMeta'
      ml_space_meta:
        $ref: '#/definitions/GetConsumptionResponseMLSpaceMeta'
      vmware_meta:
        $ref: '#/definitions/GetConsumptionResponseVMWareMeta'
      updated_dt:
        type: string
        format: date-time
        description: Время обновления записи.
      encode_id:
        type: string
        description: Ключ-идентификатор записи.
      is_delete:
        type: boolean
        title: Признак удаления строки.
      id:
        type: string
        title: pk строки
  GetConsumptionResponseMLSpaceMeta:
    type: object
    properties:
      product_instance_name:
        type: string
  GetConsumptionResponseResourceTags:
    type: object
    properties:
      resource_id:
        type: string
        description: Идентификатор экземпляра ресурса.
      resource_name:
        type: string
        description: Название экземпляра ресурса.
      platform:
        type: string
        description: Платформа облачного сервиса.
      raw_tags:
        type: string
        title: Теги ресурса в виде строки
      tags:
        type: object
        additionalProperties:
          type: string
        title: Теги ресурса в виде словаря
  GetConsumptionResponseVMWareMeta:
    type: object
    properties:
      tenant:
        type: string
      vdc:
        type: string
  v2GetConsumptionResponse:
    type: object
    properties:
      consumptions:
        type: array
        items:
          type: object
          $ref: '#/definitions/GetConsumptionResponseConsumption'
        title: Массив строк с потреблением
      next_page_token:
        type: string
        title: Токен следующей страницы
      resource_tags:
        type: array
        items:
          type: object
          $ref: '#/definitions/GetConsumptionResponseResourceTags'
        title: Массив тегов ресурсов
    title: Ответ на запрос потребления по ресурсам
  v2PageFilter:
    type: object
    properties:
      page_size:
        type: integer
        format: int64
      page_token:
        type: string
    required:
      - page_size


