swagger: '2.0'
info:
  title: Public API Контроль затрат
  version: '1.0'
  description: '[Контроль затрат - документация](https://cloud.ru/docs/billing/ug/index.html)'
tags:
  - name: ConsumptionService
host: organization.api.cloud.ru
basePath: /
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/consumption:
    get:
      summary: Получение потребления по ресурсам
      operationId: ConsumptionService_GetConsumption
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetConsumptionResponse'
        '400':
          description: Некорректный запрос
          schema: {}
        '401':
          description: Необходима авторизация
          schema: {}
        '403':
          description: Доступ запрещен
          schema: {}
        '404':
          description: Ресурс не найден
          schema: {}
        '500':
          description: Внутренняя ошибка сервера
          schema: {}
      parameters:
        - name: agreement_id
          description: Фильтр по идентификатору договора. [Где найти ID договора](https://cloud.ru/docs/billing/ug/topics/faq__api_id_agreement.html)
          in: query
          required: false
          type: string
        - name: project_ids
          description: Фильтр по идентификаторам проектов.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: service_names
          description: Фильтр по названиям облачных сервисов.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: start_date
          description: Фильтр по дате начала периода потребления.
          in: query
          required: true
          type: string
          format: date-time
        - name: end_date
          description: Фильтр по дате окончания периода потребления.
          in: query
          required: true
          type: string
          format: date-time
        - name: page_filter.limit
          description: Количество сущностей на странице.
          in: query
          required: false
          type: integer
          format: int64
        - name: page_filter.page
          description: |-
            Номер страницы.
            Нумерация начинается с 1.
          in: query
          required: false
          type: integer
          format: int64
        - name: start_updated_dt
          description: Фильтр по времени обновления записи.
          in: query
          required: false
          type: string
          format: date-time
        - name: end_updated_dt
          description: Фильтр по времени обновления записи.
          in: query
          required: false
          type: string
          format: date-time
        - name: sku_ids
          description: Фильтр по идентификаторам SKU.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - ConsumptionService
  /v1/consumption/resource_tags:
    get:
      summary: Получение тегов из сервиса потребления
      operationId: ConsumptionService_ListResourceTags
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListResourceTagsResponse'
        '400':
          description: Некорректный запрос
          schema: {}
        '401':
          description: Необходима авторизация
          schema: {}
        '403':
          description: Доступ запрещен
          schema: {}
        '404':
          description: Ресурс не найден
          schema: {}
        '500':
          description: Внутренняя ошибка сервера
          schema: {}
      parameters:
        - name: agreement_id
          description: Фильтр по идентификатору договора. [Где найти ID договора](https://cloud.ru/docs/billing/ug/topics/faq__api_id_agreement.html)
          in: query
          required: false
          type: string
        - name: project_ids
          description: Фильтр по идентификаторам проектов.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: page_filter.limit
          description: Количество сущностей на странице.
          in: query
          required: false
          type: integer
          format: int64
        - name: page_filter.page
          description: |-
            Номер страницы.
            Нумерация начинается с 1.
          in: query
          required: false
          type: integer
          format: int64
      tags:
        - ConsumptionService
  /v1/consumption/static:
    get:
      summary: Получение статического потребления и корректировок
      operationId: ConsumptionService_GetStaticConsumption
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetStaticConsumptionResponse'
        '400':
          description: Некорректный запрос
          schema: {}
        '401':
          description: Необходима авторизация
          schema: {}
        '403':
          description: Доступ запрещен
          schema: {}
        '404':
          description: Ресурс не найден
          schema: {}
        '500':
          description: Внутренняя ошибка сервера
          schema: {}
      parameters:
        - name: agreement_id
          description: Фильтр по идентификатору договора. [Где найти ID договора](https://cloud.ru/docs/billing/ug/topics/faq__api_id_agreement.html)
          in: query
          required: false
          type: string
        - name: project_ids
          description: Фильтр по идентификаторам проектов.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: start_date
          description: Фильтр по дате начала периода потребления.
          in: query
          required: true
          type: string
          format: date-time
        - name: end_date
          description: Фильтр по дате окончания периода потребления.
          in: query
          required: true
          type: string
          format: date-time
      tags:
        - ConsumptionService
definitions:
  GetConsumptionResponseConsumption:
    type: object
    properties:
      dog_id:
        type: string
        description: Идентификатор договора.
      dmid:
        type: integer
        format: int32
        description: Идентификатор подключения к платформе.
      sku:
        type: string
        description: Идентификатор облачного сервиса.
      servname:
        type: string
        description: Название облачного сервиса.
      resource_id:
        type: string
        description: Идентификатор экземпляра ресурса.
      resource_name:
        type: string
        description: Название экземпляра ресурса.
      usedate:
        type: string
        format: date-time
        description: Дата потребления.
      amount:
        type: number
        format: double
        description: Стоимость потребления без НДС.
      amount_nds:
        type: number
        format: double
        description: Стоимость потребления с НДС.
      cost:
        type: number
        format: double
        description: Тариф потребления облачного сервиса без НДС.
      unit:
        type: string
        description: Единица измерения для тарифа облачного сервиса.
      usefact:
        type: number
        format: double
        description: Объем потребления облачного сервиса.
      platform:
        type: string
        description: Платформа облачного сервиса.
      meta:
        type: object
        additionalProperties:
          type: string
        description: Дополнительная метаинформация об экземпляре ресурса.
      updated_dt:
        type: string
        format: date-time
        description: Время обновления записи.
      encode_id:
        type: string
        title: Ключ-идентификатор записи. deprecated!
      is_delete:
        type: boolean
        title: Признак удаления строчки
      id:
        type: string
        title: pk строки
  ListResourceTagsResponseResourceTags:
    type: object
    properties:
      resource_id:
        type: string
        description: Идентификатор экземпляра ресурса.
      resource_name:
        type: string
        description: Название экземпляра ресурса.
      platform:
        type: string
        description: Платформа облачного сервиса.
      raw_tags:
        type: string
        title: Теги ресурса в виде строки
      tags:
        type: object
        additionalProperties:
          type: string
        title: Теги ресурса в виде словаря
  v1GetConsumptionResponse:
    type: object
    properties:
      consumptions:
        type: array
        items:
          type: object
          $ref: '#/definitions/GetConsumptionResponseConsumption'
        title: Массив строк с потреблением
    title: Ответ на запрос потребления по ресурсам
  v1ListResourceTagsResponse:
    type: object
    properties:
      resource_tags:
        type: array
        items:
          type: object
          $ref: '#/definitions/ListResourceTagsResponseResourceTags'
        title: Массив тегов ресурсов
    title: Ответ на запрос получения тегов из сервиса потребления
  v1PageFilter:
    type: object
    properties:
      limit:
        type: integer
        format: int64
        description: Количество сущностей на странице.
      page:
        type: integer
        format: int64
        description: |-
          Номер страницы.
          Нумерация начинается с 1.
    description: Фильтр для постраничного вывода сущностей.
    title: PageFilter
  v1GetStaticConsumptionResponse:
    type: object
    properties:
      consumptions:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1GetStaticConsumptionResponseConsumption'
        title: Массив строк с потреблением
    title: Ответ на запрос получения статического потребления и корректировок
  v1GetStaticConsumptionResponseConsumption:
    type: object
    properties:
      dog_id:
        type: string
        description: Идентификатор договора в биллинге.
      dmid:
        type: integer
        format: int32
        description: Идентификатор подключения к платформе в биллинге.
      sku:
        type: string
        description: Идентификатор облачного сервиса в продуктовом каталоге.
      servname:
        type: string
        description: Название облачного сервиса в продуктовом каталоге.
      usedate:
        type: string
        format: date-time
        description: Дата потребления.
      amount:
        type: number
        format: double
        description: Стоимость потребления без НДС.
      amount_nds:
        type: number
        format: double
        description: Стоимость потребления с НДС.
      usefact:
        type: number
        format: double
        description: Объем потребления облачного сервиса.
      cost:
        type: number
        format: double
        description: Тариф потребления облачного сервиса без НДС.
      unit:
        type: string
        description: Единица измерения для тарифа облачного сервиса.
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
