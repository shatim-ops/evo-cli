swagger: '2.0'
info:
  title: Secret Management API
  description: '[Документация Secret Management](https://cloud.ru/docs/scsm/ug/index.html)'
  contact:
    email: support@cloud.ru  
  version: 1.0.13
servers:
  - url: https://secretmanager.api.cloud.ru
tags:
  - name: SecretManagerService
  - name: FolderService
  - name: SecretService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/secrets:
    get:
      operationId: Просмотр списка секретов
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v1ListSecretsResponse'
      parameters:
        - name: parentId
          description: Идентификатор родительского сервис-инстанса. Обязательное поле. 
          in: query
          required: false
          type: string
        - name: page.limit
          description: >-
            Максимальное количество записей в одном запросе.
            Макс: 1000, по умолчанию: 100. Обязательное поле. 
          in: query
          required: false
          type: integer
          format: int32
        - name: page.offset
          description: Сдвиг записей. Обязательное поле. 
          in: query
          required: false
          type: integer
          format: int32
        - name: labels
          description: >-
            Фильтр по тегам секрета, вернет секреты, у которых есть все
            указанные теги.
          in: query
          required: false
          type: string
        - name: regex
          in: query
          required: false
          type: string
        - name: exact
          in: query
          required: false
          type: string
      tags:
        - SecretManagerService
    post:
      operationId: Создание секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/secretmanagerv1Secret'
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/secretmanagerv1CreateSecretRequest'
      tags:
        - SecretManagerService
  /v1/secrets/{secret.id}:
    patch:
      operationId: Обновление секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/secretmanagerv1Secret'
      parameters:
        - name: secret.id
          description: Идентификатор секрета.
          in: path
          required: true
          type: string
        - name: secret
          description: Обновленный секрет. Обязательное поле. 
          in: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
                description: Наименование секрета.
              description:
                type: string
                description: Описание секрета.
              labels:
                type: object
                additionalProperties:
                  type: string
                description: Лейблы секрета.
              owner:
                type: string
                description: Идентификатор владельца секрета.
              kmsKeyId:
                type: string
                description: Идентификатор ключа шифрования.
              createdAt:
                type: string
                format: date-time
                description: Дата создания секрета.
              path:
                type: string
                description: Путь к секрету, включающий папки и имя секрета.
            title: Обновленный секрет. Обязательное поле. 
      tags:
        - SecretManagerService
  /v1/secrets/{secretId}:
    get:
      operationId: Просмотр секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/secretmanagerv1Secret'
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
      tags:
        - SecretManagerService
    delete:
      operationId: Удаление секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            type: object
            properties: {}
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
        - name: force
          description: >-
            Force влияет на то, что если секрет используется

            в других ресурсах или имеет активные версии, то удаление

            будет запрещено. Force разрешает удаление ключей, которые
            используются.
          in: query
          required: false
          type: boolean
      tags:
        - SecretManagerService
  /v1/secrets/{secretId}/usage:
    get:
      operationId: Изменение секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v1GetUsageResponse'
      parameters:
        - name: secretId
          in: path
          required: true
          type: string
      tags:
        - SecretManagerService
  /v1/secrets/{secretId}/versions:
    get:
      operationId: Просмотр списка версий секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v1ListSecretVersionsResponse'
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
        - name: page.limit
          description: >-
            Максимальное количество записей в одном запросе.
            Макс: 1000, по умолчанию: 100. Обязательное поле. 
          in: query
          required: false
          type: integer
          format: int32
        - name: page.offset
          description: Сдвиг записей. Обязательное поле. 
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - SecretManagerService
    post:
      operationId: Создание версии секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/secretmanagerv1SecretVersion'
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/SecretManagerServiceCreateSecretVersionBody'
      tags:
        - SecretManagerService
  /v1/secrets/{secretId}/versions/{secretVersionId}:
    get:
      operationId: Просмотр версии секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/secretmanagerv1SecretVersion'
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
        - name: secretVersionId
          description: Идентификатор версии секрета. Обязательное поле. 
          in: path
          required: true
          type: string
      tags:
        - SecretManagerService
    delete:
      operationId: Удаление версии секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/secretmanagerv1SecretVersion'
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
        - name: secretVersionId
          description: Идентификатор версии секрета. Обязательное поле. 
          in: path
          required: true
          type: string
      tags:
        - SecretManagerService
  /v1/secrets/{secretId}/versions/{secretVersionId}/disable:
    patch:
      operationId: Выключение версии секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/secretmanagerv1SecretVersion'
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
        - name: secretVersionId
          description: Идентификатор версии секрета. Обязательное поле. 
          in: path
          required: true
          type: string
      tags:
        - SecretManagerService
  /v1/secrets/{secretId}/versions/{secretVersionId}/enable:
    patch:
      operationId: Включение версии секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/secretmanagerv1SecretVersion'
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
        - name: secretVersionId
          description: Идентификатор версии секрета. Обязательное поле. 
          in: path
          required: true
          type: string
      tags:
        - SecretManagerService
  /v1/secrets/{secretId}/versions/{secretVersionId}/payload:
    get:
      operationId: Доступ к версиям секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v1SecretPayload'
      parameters:
        - name: secretId
          description: Идентификатор секрета. Обязательное поле. 
          in: path
          required: true
          type: string
        - name: secretVersionId
          description: Идентификатор версии секрета. Обязательное поле. 
          in: path
          required: true
          type: string
      tags:
        - SecretManagerService
  /v2/folder:
    post:
      operationId: Создание папки
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2CreateFolderResponse'
      parameters:
        - name: body
          description: >-
            Запрос на создание папки.
            method.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v2CreateFolderRequest'
      tags:
        - FolderService
  /v2/folder/{path}:
    get:
      operationId: Просмотр содержимого папки
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2GetEntriesResponse'
      parameters:
        - name: path
          description: |-
            Абсолютный путь к папке.
            Например, папка/вложенная папка.
            Если путь пуст, метод возвращает корневую папку.
          in: path
          required: true
          type: string
          pattern: .+
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: false
          type: string
      tags:
        - FolderService
    delete:
      operationId: Удаление папки
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            type: object
            properties: {}
      parameters:
        - name: path
          description: Абсолютный путь к папке, например, к папке/подпапке-вложению.
          in: path
          required: true
          type: string
          pattern: .+
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: false
          type: string
        - name: force
          description: >-
            Force влияет на то, что если секрет используется

            в других ресурсах или имеет активные версии, то удаление

            будет запрещено. Force разрешает удаление ключей, которые
            используются.
          in: query
          required: false
          type: boolean
      tags:
        - FolderService
    put:
      operationId: Обновление папки
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2UpdateFolderResponse'
      parameters:
        - name: path
          description: Путь к родительским папкам.
          in: path
          required: true
          type: string
          pattern: .+
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v2FolderServiceUpdateBody'
      tags:
        - FolderService
  /v2/secret:
    get:
      summary: >-
        Получение списка секретов с помощью фильтров. 
      operationId: SecretService_Search
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2SearchSecretResponse'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: false
          type: string
        - name: folderPath
          description: >-
            Путь к папке, в которой находятся секреты.

            Если не указано иное, будут возвращены все секреты в корневой папке и ее подпапках.
          in: query
          required: false
          type: string
        - name: depth
          description: >-
            Глубина поиска.

            Кколичество папок, в которых выполняется рекурсивный поиск.

            Если не указана глубина, поиск будет выполняться только в текущей папке.
            
            Если установлено значение -1, поиск будет выполняться рекурсивно во всех папках по указанному пути.
          in: query
          required: false
          type: integer
          format: int32
        - name: labels
          description: >-
            Фильтр по тегам секрета, вернет секреты, у которых есть все
            указанные теги.
          in: query
          required: false
          type: string
        - name: regex
          in: query
          required: false
          type: string
        - name: exact
          in: query
          required: false
          type: string
      tags:
        - SecretService
    post:
      operationId: Создание секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2CreateSecretResponse'
      parameters:
        - name: body
          description: Запрос на создание секрета.
          in: body
          required: true
          schema:
            $ref: '#/definitions/corev2CreateSecretRequest'
      tags:
        - SecretService
  /v2/secret/{path}:
    get:
      operationId: Просмотр списка секретов
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2GetSecretResponse'
      parameters:
        - name: path
          description: >-
            Путь к папке, в которой находятся секреты.
          in: path
          required: true
          type: string
          pattern: .+
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: false
          type: string
      tags:
        - SecretService
    delete:
      summary: Удаление секрета по заданному пути.
      operationId: SecretService_Delete
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            type: object
            properties: {}
      parameters:
        - name: path
          description: >-
            Путь к папке, в которой находятся секреты.
          in: path
          required: true
          type: string
          pattern: .+
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: false
          type: string
        - name: force
          description: >-
            Force влияет на то, что если секрет используется

            в других ресурсах или имеет активные версии, то удаление

            будет запрещено. Force разрешает удаление ключей, которые используются.
          in: query
          required: false
          type: boolean
      tags:
        - SecretService
    put:
      operationId: Обновление секрета
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2UpdateSecretResponse'
      parameters:
        - name: path
          description: >-
            Путь к папке, в которой находятся секреты.
          in: path
          required: true
          type: string
          pattern: .+
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v2SecretServiceUpdateBody'
      tags:
        - SecretService
  /v2/version:
    post:
      summary: Добавление новой версии секрета.
      operationId: SecretService_AddVersion
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2AddVersionResponse'
      parameters:
        - name: body
          description: Запрос на добавление версии.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v2AddVersionRequest'
      tags:
        - SecretService
  /v2/version/{path}:
    get:
      summary: Доступ для получения значения секрета.
      operationId: SecretService_Access
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2AccessSecretResponse'
      parameters:
        - name: path
          description: >-
            Путь к папке, в которой находятся секретыe.
          in: path
          required: true
          type: string
          pattern: .+
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: false
          type: string
        - name: version
          description: Версия секрета.
          in: query
          required: false
          type: integer
          format: int32
        - name: jsonPath
          description: >-
            JSON-путь к секрету.
          in: query
          required: false
          type: string
      tags:
        - SecretService
    delete:
      summary: Удаление версии секрета.
      operationId: SecretService_DestroyVersion
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2DestroyVersionResponse'
      parameters:
        - name: path
          description: >-
            Путь к папке, в которой находятся секреты.
          in: path
          required: true
          type: string
          pattern: .+
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: false
          type: string
        - name: version
          description: Версия секрета.
          in: query
          required: false
          type: integer
          format: int32
      tags:
        - SecretService
    put:
      summary: Обновление версии секрета.
      operationId: SecretService_UpdateVersion
      responses:
        '200':
          description: Успешное выполнение запроса.
          schema:
            $ref: '#/definitions/v2UpdateVersionResponse'
      parameters:
        - name: path
          description: >-
            Путь к папке, в которой находятся секреты.
          in: path
          required: true
          type: string
          pattern: .+
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/SecretServiceUpdateVersionBody'
      tags:
        - SecretService
definitions:
  SecretManagerServiceCreateSecretVersionBody:
    type: object
    properties:
      payload:
        $ref: '#/definitions/v1SecretPayload'
        description: Секретные данные. Обязательное поле. 
  SecretServiceUpdateVersionBody:
    type: object
    properties:
      projectId:
        type: string
        description: Идентификатор проекта.
      version:
        type: integer
        format: int32
        description: Версия секрета.
      enabled:
        type: boolean
        description: Включено - состояние версии.
    description: Запрос на обновление версии.
  corev2CreateSecretRequest:
    type: object
    properties:
      projectId:
        type: string
        description: Идентификатор проекта.
      path:
        type: string
        title: >-
          Путь до секрета.

          Если секрет создается на корневом уровне, путь должен содержать только имя секрета.

          Например, folder/my_secret
      description:
        type: string
        description: Описание секрета.
      labels:
        type: object
        additionalProperties:
          type: string
        description: Метки, пары ключ-значение, которые позволяют систематизировать секреты.
      kmsKeyId:
        type: string
        description: |-
          Идентификатор ключа.
      payload:
        type: string
        format: byte
        description: Текст секретных данных в кодировке Base64.
    description: Запрос на создание секрета.
  corev2Secret:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор секрета.
      name:
        type: string
        description: Имя секрета.
      path:
        type: string
        description: |-
          Путь к папке, в которой находятся секреты.
      folderId:
        type: string
        description: Идентификатор папки, в которой находится секрет.
      description:
        type: string
        description: Описание секрета.
      labels:
        type: object
        additionalProperties:
          type: string
        description: Метки, пары ключ-значение, которые позволяют систематизировать секреты.
      serviceInstanceId:
        type: string
        description: Идентификатор экземпляра.
      projectId:
        type: string
        description: Идентификатор проекта.
      kmsKeyId:
        type: string
        description: Идентификатор ключа.
      versions:
        type: array
        items:
          type: object
          $ref: '#/definitions/corev2SecretVersion'
        description: |-
          Список версий секрета.
      createdAt:
        type: string
        format: date-time
        description: Дата создания секрета.
      primary:
        $ref: '#/definitions/corev2SecretVersion'
        description: Основная включенная версия.
    description: Секрет — это глобальный объект, который содержит метаданные.
  corev2SecretVersion:
    type: object
    properties:
      id:
        type: integer
        format: int32
        description: Идентификатор версии.
      state:
        $ref: '#/definitions/v2VersionState'
        description: Состояние версии.
      createdAt:
        type: string
        format: date-time
        description: Дата создания версии.
    description: Версия секрета.
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: {}
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  secretmanagerv1CreateSecretRequest:
    type: object
    properties:
      parentId:
        type: string
        description: Идентификатор родительского сервис-инстанса. Обязательное поле. 
      name:
        type: string
