swagger: '2.0'
info:
  title: Cloud.ru Managed Metastore
  description: '[Документация Managed Metastore](https://cloud.ru/docs/metastore/ug/index.html)'
  version: "1.0"
servers:
  - url: https://dataplatform.api.cloud.ru  
tags:
  - name: MetastoreService
  - name: FlavorService
consumes:
  - application/json
produces:
  - application/json
paths:

  /v1/metastoreFlavors:
    get:
      summary: Список флейворов
      description: Возвращает список доступных флейворов по проекту.
      operationId: FlavorService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFlavorsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListFlavorsResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListFlavorsResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - FlavorService

  /v1/metastoreVersions:
    get:
      summary: Cписок версий Metastore
      description: Возвращает список версий Metastore.
      operationId: MetastoreService_Versions
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListMetastoreVersionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
      tags:
        - MetastoreService

  /v1/metastores:
    get:
      summary: Список объектов Metastore
      description: Возвращает список объектов Metastore по заданым параметрам.
      operationId: MetastoreService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListMetastoreResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: clusterId
          description: Идентификатор кластера.
          in: query
          required: true
          type: string
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListMetastoreResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListMetastoreResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
        - name: filter
          description: >-
            Фильтр списка кластеров.

            Фильтрацию можно произвести по полям [Metastore.name],
            [Metastore.project_id].

            Пример:
            name=metastore123,project_id=26d37ffe-1077-4f4f-bd77-de538276b29a
          in: query
          required: false
          type: string
      tags:
        - MetastoreService
    post:
      summary: Создание объекта Metastore
      description: |-
        Запускает операцию по созданию объекта Metastore.
        Возвращает объект Operation.
      operationId: MetastoreService_Create
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: Описание параметров запроса для создания Metastore.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateMetastoreRequest'
      tags:
        - MetastoreService

  /v1/metastores/{metastoreId}:
    get:
      summary: Получение информациии об объекте Metastore
      description: Возвращает объект Metastore по заданному идентификатору.
      operationId: MetastoreService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Metastore'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: metastoreId
          description: Идентификатор Metastore.
          in: path
          required: true
          type: string
      tags:
        - MetastoreService
    delete:
      summary: Удаление объекта Metastore
      description: >-
        Запускает процесс удаления объекта Metastore по заданному
        идентификатору.

        Возвращает объект Operation.
      operationId: MetastoreService_Delete
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: metastoreId
          description: Идентификатор Metastore.
          in: path
          required: true
          type: string
      tags:
        - MetastoreService
    put:
      summary: Обновление объекта Metastore
      description: |-
        Запускает операцию по обновлению объекта Metastore.
        Возвращает объект Operation.
      operationId: MetastoreService_Update
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: metastoreId
          description: Идентификатор Metastore.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: >-
              #/definitions/cloudrudataplatformmetastorev1MetastoreServiceUpdateBody
      tags:
        - MetastoreService
        
  /v1/metastores/{metastoreId}/operations:
    get:
      summary: Список объектов Operation
      description: Возвращает список объектов Operation по заданым параметрам.
      operationId: MetastoreService_ListOperations
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListMetastoreOperationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: metastoreId
          description: Идентификатор Metastore.
          in: path
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListMetastoreResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListMetastoreResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - MetastoreService

definitions:
  cloudrudataplatformmetastorev1MetastoreServiceUpdateBody:
    type: object
    properties:
      name:
        type: string
        description: Название Metastore.
      description:
        type: string
        description: Описание Metastore.
      fsInternalS3:
        $ref: '#/definitions/v1FSInternalS3'
        description: Параметры файловой системы. Внутреннее объектное хранилище s3.
      fsExternalS3:
        $ref: '#/definitions/v1FSExternalS3'
        description: Параметры файловой системы. Внешний пользователький s3.
    description: Описание параметров запроса для обновления Metastore.
  
  cloudruoperationOperation:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор операции.
      resourceName:
        type: string
        title: >-
          Информация о ресурсе, над которым производится операция.

          Строится следующим образом:
          urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT.

          Пример 1:
          urn:cloud:dataplatform::54295782-7aef-43e6-b33b-c9735938677a:metastore_server
        readOnly: true
      resourceId:
        type: string
        title: |-
          Уникальный идентификатор ресурса, над которым производится операция.
          Пример: 54295782-7aef-43e6-b33b-c9735938677a
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: Время создания операции.
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        description: Время последнего изменения операции.
        readOnly: true
      done:
        type: boolean
        description: >-
          Флаг завершенности операции.

          Если значение `false`, то операция в процессе выполнения.

          Если значение `true`, то операция завершена и поле `error` может быть
          заполнено.
        readOnly: true
      description:
        type: string
        description: Описание операции. От 0 до 255 символов.
        readOnly: true
      error:
        $ref: '#/definitions/rpcStatus'
        description: Результат операции в случае ошибки.
        readOnly: true
    required:
      - id
 
  operationv1Operation:
    type: object
    properties:
      id:
        type: string
        description: ID of the operation.
      description:
        type: string
        description: |-
          Description of the operation. 0-256 characters long.

          ex: Create VM, Stop VM, Delete Disk, Snapshot Disk, etc
      createdAt:
        type: string
        format: date-time
        description: Creation timestamp.
      createdBy:
        type: string
        description: ID of the user or service account who initiated the operation.
      modifiedAt:
        type: string
        format: date-time
        description: The time when the Operation resource was last modified.
      done:
        type: boolean
        description: >-
          If the value is `false`, it means the operation is still in progress.

          If `true`, the operation is completed, and either `error` or
          `response` is available.
      metadata:
        $ref: '#/definitions/protobufAny'
        description: >-
          Service-specific metadata associated with the operation.

          It typically contains the ID of the target resource that the operation
          is performed on.

          Any method that returns a long-running operation should document the
          metadata type, if any.
      error:
        $ref: '#/definitions/rpcStatus'
        description: The error result of the operation in case of failure or cancellation.
      response:
        $ref: '#/definitions/protobufAny'
        description: >-
          The normal response of the operation in case of success.

          If the original method returns no data on success, such as Delete,

          the response is [google.protobuf.Empty].

          If the original method is the standard Create/Update,

          the response should be the target resource of the operation.

          Any method that returns a long-running operation should document the
          response type, if any.
      percent:
        type: integer
        format: int32
        title: Percent for check progress of operation
      objectId:
        type: string
        title: Specify object id for data platform values
      objectType:
        type: string
        title: Object type for data platform objects
      workflow:
        $ref: '#/definitions/v1TemporalWorkflow'
        title: Special temporal workflow optional field
    description: >-
      An Operation resource. For more information, see
      [Operation](/docs/api-design-guide/concepts/operation).
  
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
        description: >-
          A URL/resource name that uniquely identifies the type of the
          serialized

          protocol buffer message. This string must contain at least

          one "/" character. The last segment of the URL's path must represent

          the fully qualified name of the type (as in

          `path/google.protobuf.Duration`). The name should be in a canonical
          form

          (e.g., leading "." is not accepted).


          In practice, teams usually precompile into the binary all types that
          they

          expect it to use in the context of Any. However, for URLs which use
          the

          scheme `http`, `https`, or no scheme, one can optionally set up a type

          server that maps type URLs to message definitions as follows:


          * If no scheme is provided, `https` is assumed.

          * An HTTP GET on the URL must yield a [google.protobuf.Type][]
            value in binary format, or produce an error.
          * Applications are allowed to cache lookup results based on the
            URL, or have them precompiled into a binary to avoid any
            lookup. Therefore, binary compatibility needs to be preserved
            on changes to types. (Use versioned type names to manage
            breaking changes.)

          Note: this functionality is not currently available in the official

          protobuf release, and it is not used for type URLs beginning with

          type.googleapis.com. As of May 2023, there are no widely used type
          server

          implementations and no plans to implement one.


          Schemes other than `http`, `https` (or the empty scheme) might be

          used with implementation specific semantics.
    additionalProperties: {}
    description: >-
      `Any` contains an arbitrary serialized protocol buffer message along with
      a

      URL that describes the type of the serialized message.


      Protobuf library provides support to pack/unpack Any values in the form

      of utility functions or additional generated methods of the Any type.


      Example 1: Pack and unpack a message in C++.

          Foo foo = ...;
          Any any;
          any.PackFrom(foo);
          ...
          if (any.UnpackTo(&foo)) {
            ...
          }

      Example 2: Pack and unpack a message in Java.

          Foo foo = ...;
          Any any = Any.pack(foo);
          ...
          if (any.is(Foo.class)) {
            foo = any.unpack(Foo.class);
          }
          // or ...
          if (any.isSameTypeAs(Foo.getDefaultInstance())) {
            foo = any.unpack(Foo.getDefaultInstance());
          }

       Example 3: Pack and unpack a message in Python.

          foo = Foo(...)
          any = Any()
          any.Pack(foo)
          ...
          if any.Is(Foo.DESCRIPTOR):
            any.Unpack(foo)
            ...

       Example 4: Pack and unpack a message in Go

           foo := &pb.Foo{...}
           any, err := anypb.New(foo)
           if err != nil {
             ...
           }
           ...
           foo := &pb.Foo{}
           if err := any.UnmarshalTo(foo); err != nil {
             ...
           }

      The pack methods provided by protobuf library will by default use

      'type.googleapis.com/full.type.name' as the type URL and the unpack

      methods only use the fully qualified type name after the last '/'

      in the type URL, for example "foo.bar.com/x/y.z" will yield type

      name "y.z".


      JSON

      ====

      The JSON representation of an `Any` value uses the regular

      representation of the deserialized, embedded message, with an

      additional field `@type` which contains the type URL. Example:

          package google.profile;
          message Person {
            string first_name = 1;
            string last_name = 2;
          }

          {
            "@type": "type.googleapis.com/google.profile.Person",
            "firstName": <string>,
            "lastName": <string>
          }

      If the embedded message type is well-known and has a custom JSON

      representation, that representation will be embedded adding a field

      `value` which holds the custom JSON in addition to the `@type`

      field. Example (for message [google.protobuf.Duration][]):

          {
            "@type": "type.googleapis.com/google.protobuf.Duration",
            "value": "1.212s"
          }
  
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: |-
          The status code, which should be an enum value of
          [google.rpc.Code][google.rpc.Code].
      message:
        type: string
        description: >-
          A developer-facing error message, which should be in English. Any

          user-facing error message should be localized and sent in the

          [google.rpc.Status.details][google.rpc.Status.details] field, or
          localized

          by the client.
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
        description: >-
          A list of messages that carry the error details.  There is a common
          set of

          message types for APIs to use.
    description: >-
      The `Status` type defines a logical error model that is suitable for

      different programming environments, including REST APIs and RPC APIs. It
      is

      used by [gRPC](https://github.com/grpc). Each `Status` message contains

      three pieces of data: error code, error message, and error details.


      You can find out more about this error model and how to work with it in
      the

      [API Design Guide](https://cloud.google.com/apis/design/errors).

  v1ComputeConfiguration:
    type: object
    properties:
      flavorId:
        type: string
        description: Идентификатор флейвора.
      minNodes:
        type: integer
        format: int64
        description: Минимальное количество узлов.
      maxNodes:
        type: integer
        format: int64
        title: Максимальное количество узлов
    description: Параметры конфигурации вычислительных ресурсов.
    required:
      - flavorId
      - minNodes
      - maxNodes

  v1CreateMetastoreRequest:
    type: object
    properties:
      clusterId:
        type: string
        description: Идентификатор кластера.
      projectId:
        type: string
        description: Идентификатор проекта.
      name:
        type: string
        description: Название Metastore.
      description:
        type: string
        description: Описание Metastore.
      logGroupId:
        type: string
        description: Идентификатор группы логирования.
      networkConfiguration:
        $ref: '#/definitions/v1NetworkConfiguration'
        description: Конфигурация сети.
      computeConfiguration:
        $ref: '#/definitions/v1ComputeConfiguration'
        description: Параметры конфигурации вычислительных ресурсов.
      fsInternalS3:
        $ref: '#/definitions/v1FSInternalS3'
        description: Параметры файловой системы. Внутреннее объектное хранилище s3.
      fsExternalS3:
        $ref: '#/definitions/v1FSExternalS3'
        description: Параметры файловой системы. Внешний пользователький s3.
      versionId:
        type: string
    description: Описание параметров запроса для создания Metastore.
    required:
      - clusterId
      - projectId
      - name
      - logGroupId
      - networkConfiguration
      - computeConfiguration

  v1FSExternalS3:
    type: object
    properties:
      accessKeySecretId:
        type: string
        description: >-
          Идентификатор секрета из сервиса Secret Manager, в котором хранится
          значение access_key для внешнего хранилища S3.
      secretKeySecretId:
        type: string
        description: >-
          Идентификатор секрета из сервиса Secret Manager, в котором хранится
          значение secret_key для внешнего хранилища S3.
      s3aEndpoint:
        type: string
        description: S3 эндпоинт.
      s3Region:
        type: string
        description: S3 регион.
      warehouseDir:
        type: string
        description: >-
          Путь до хранилища, в котором будут храниться метаданные.

          Пример: s3a://dev-bucket/test-data-sample.

          Если значение не указано, то будет использоваться корень переданного
          s3 бакета `bucket`.
    description: Конфигурация файловой системы до внешнего хранилища S3.
    required:
      - accessKeySecretId
      - secretKeySecretId
      - s3aEndpoint
      - s3Region
  
  v1FSInternalS3:
    type: object
    properties:
      tenantId:
        type: string
        description: Идентификатор арендатора.
      bucket:
        type: string
        description: Название бакета S3.
      bucketDir:
        type: string
        description: Директория внутри бакета (по умолчанию /).
      s3Region:
        type: string
        description: S3 регион.
    description: >-
      Конфигурация файловой системы до внутреннего хранилища Evolution Object
      Storage.
    required:
      - tenantId
      - bucket
      - bucketDir
  
  v1Flavor:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор флейвора.
        readOnly: true
      name:
        type: string
        description: Название флейвора.
        readOnly: true
      cpu:
        type: string
        format: int64
        description: Количество ядер CPU для данного флейвора.
      memory:
        type: string
        format: int64
        description: Объем памяти для данного флейвора.
      minNodeCount:
        type: string
        format: int64
        description: Минимальное количество узлов, разрешенное для данного флейвора.
      maxNodeCount:
        type: string
        format: int64
        description: Максимальное количество узлов, разрешенное для данного флейвора.
    description: Флейвор Metastore.
    required:
      - cpu
      - memory
      - minNodeCount
      - maxNodeCount
  
  v1ListFlavorsResponse:
    type: object
    properties:
      flavors:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Flavor'
        description: Список доступных флейворов.
      nextPageToken:
        type: string
        description: Токен следующей страницы с результатами.
    description: >-
      Описание параметров ответа на запрос списка флейворов.
      Metastore.
  
  v1ListMetastoreOperationsResponse:
    type: object
    properties:
      operations:
        type: array
        items:
          type: object
          $ref: '#/definitions/cloudruoperationOperation'
        description: Список операций.
      nextPageToken:
        type: string
        description: Токен следующей страницы с результатами.
    description: Описание параметров ответа на запрос списка операций.
  
  v1ListMetastoreResponse:
    type: object
    properties:
      metastores:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Metastore'
        description: Список инстансов Metastore.
      nextPageToken:
        type: string
        description: Токен следующей страницы с результатами.
    description: >-
      Описание параметров ответа на запрос списка инстансов Metastore.
  
  v1ListMetastoreVersionResponse:
    type: object
    properties:
      versions:
        type: array
        items:
