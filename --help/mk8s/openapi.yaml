openapi: 3.0.3
info:
    title: Cloud.ru Managed Kubernetes API
    description: |-
      Deprecated: [Используйте API v3](https://cloud.ru/docs/kubernetes-evolution/ug/topics/api-ref__managed-kubernetes-v3).

      [Документация Managed Kubernetes](https://cloud.ru/docs/kubernetes-evolution/ug/index.html).
    contact:
        email: support@cloud.ru
    version: 2.1.1
servers:
    - url: https://mk8s.api.cloud.ru
paths:
    /v2/addons:
        get:
            tags:
                - PluginsInfo
            summary: Получение списка доступных плагинов
            operationId: AddonService_ListAddons
            parameters:
                - name: limit
                  in: query
                  description: Количество плагинов в ответе.
                  schema:
                    type: integer
                    format: uint32
                - name: offset
                  in: query
                  description: Плагин, с которого начинается выборка.
                  schema:
                    type: integer
                    format: uint32
                - name: sort
                  in: query
                  description: |-
                    Параметры сортировки списка плагинов в виде "field direction".
                     Возможные значения для field: name, createdAt.
                     Возможные значения для direction: asc, desc.
                  schema:
                    type: string
                - name: filters
                  in: query
                  description: |-
                    Параметры фильтрации списка плагинов в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: name.
                     Возможные значения для condition: =, :.
                  schema:
                    type: array
                    items:
                        type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAddonsResponse'
            deprecated: true
    /v2/addons/{addonName}:
        get:
            tags:
                - PluginsInfo
            summary: Получение списка версий плагина
            operationId: AddonService_ListAddonReleases
            parameters:
                - name: addonName
                  in: path
                  description: Название плагина.
                  required: true
                  schema:
                    type: string
                - name: sort
                  in: query
                  description: "Параметры сортировки списка версий плагина в виде \"field direction\". \n Возможные значения для field: addonVersion, appVersion, createdAt, updatedAt.\n Возможные значения для direction: asc, desc."
                  schema:
                    type: string
                - name: filters
                  in: query
                  description: |-
                    Параметры фильтрации списка версий плагина в виде "field:value"(include) или "filter condition value" (=, :).
                     Возможные значения для field: addonVersion, appVersion, supportMode, kubeVersion.
                  schema:
                    type: array
                    items:
                        type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAddonReleasesResponse'
            deprecated: true
    /v2/availability:
        get:
            tags:
                - Availability
            summary: Получение списка доступных зон и конфигураций
            description: |-
                Получение списка доступных зон и шаблонов конфигураций виртуальных машин.
                Используйте /v2/product-configuration.
            operationId: AvailabilityService_ListAvailableZonesWithFlavors
            parameters:
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
                - name: cpu
                  in: query
                  description: |-
                    Количество ядер виртуального процессора.
                     Если указано, возвращаемые шаблоны конфигураций будут с таким CPU.
                  schema:
                    type: integer
                    format: uint32
                - name: ram
                  in: query
                  description: |-
                    Оперативная память в ГБ.
                     Если указано, возвращаемые шаблоны конфигураций будут с таким RAM.
                  schema:
                    type: integer
                    format: uint32
                - name: oversubscription
                  in: query
                  description: |-
                    Коэффициент переподписки.
                     Если указано, будут возвращены шаблоны конфигураций с этим коэффициентом переподписки.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAvailableZonesWithFlavorsResponse'
            deprecated: true
    /v2/billing/calculate-price:
        post:
            tags:
                - Billing
            summary: Получение расчета по предоставленным ресурсам
            operationId: BillingService_CalculatePrice
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CalculatePriceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalculatePriceResponse'
            deprecated: true
    /v2/billing/calculate-price-ext:
        post:
            tags:
                - Billing
            summary: Получение детального расчета по предоставленным ресурсам
            operationId: BillingService_CalculatePriceExtended
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CalculatePriceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalculatePriceExtendedResponse'
            deprecated: true
    /v2/clusters:
        get:
            tags:
                - Cluster
            summary: Получение списка кластеров
            operationId: ClusterService_List
            parameters:
                - name: limit
                  in: query
                  description: Количество кластеров в ответе.
                  schema:
                    type: integer
                    format: uint32
                - name: offset
                  in: query
                  description: Количество пропущенных кластеров.
                  schema:
                    type: integer
                    format: uint32
                - name: sort
                  in: query
                  description: |-
                    Сортировка списка кластеров в виде "field direction".
                     Возможные значения для field: displayName, masterCount, nodePoolCount, createdAt.
                     Возможные значения для direction: asc, desc.
                  schema:
                    type: string
                - name: filters
                  in: query
                  description: |-
                    Параметры фильтрации списка кластеров в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: displayName, state, kubeAPIInternet, masterCount, nodePoolCount, createdAt.
                     Возможные значения для condition: =, !=, >, >=, <, <=.
                  schema:
                    type: array
                    items:
                        type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListClustersResponse'
            deprecated: true
        post:
            tags:
                - Cluster
            summary: Создание нового кластера
            operationId: ClusterService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateClusterResponse'
            deprecated: true
    /v2/clusters/{clusterId}:
        get:
            tags:
                - Cluster
            summary: Получение информации о кластере
            operationId: ClusterService_Get
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetClusterResponse'
            deprecated: true
        delete:
            tags:
                - Cluster
            summary: Удаление кластера
            operationId: ClusterService_Delete
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteClusterResponse'
            deprecated: true
        patch:
            tags:
                - Cluster
            summary: Редактирование существующего кластера
            operationId: ClusterService_Edit
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EditClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EditClusterResponse'
            deprecated: true
    /v2/clusters/{clusterId}/addons:
        get:
            tags:
                - Plugins
            summary: Получение списка плагинов кластера
            operationId: ClusterAddonService_ListClusterAddons
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: all
                  in: query
                  description: Получить все активные и ранее удаленные плагинов кластера.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListClusterAddonsResponse'
            deprecated: true
        post:
            tags:
                - Plugins
            summary: Добавление нового плагина в кластер
            operationId: ClusterAddonService_AddClusterAddon
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddClusterAddonRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddClusterAddonResponse'
            deprecated: true
    /v2/clusters/{clusterId}/addons/get:
        get:
            tags:
                - Plugins
            summary: Получение информации по плагинам кластера
            operationId: ClusterAddonService_GetClusterAddon
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: addonId
                  in: query
                  description: Идентификатор плагина.
                  schema:
                    type: string
                - name: addonName
                  in: query
                  description: |-
                    Название плагина, например cilium.
                     Поиск по названию выполняется только среди активных плагинов.
                     Для получения информации по удаленному плагину указывайте идентификатор плагина.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetClusterAddonResponse'
            deprecated: true
    /v2/clusters/{clusterId}/addons/{addonName}:
        delete:
            tags:
                - Plugins
            summary: Удаление плагина из кластера
            operationId: ClusterAddonService_DeleteClusterAddon
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: addonName
                  in: path
                  description: Название плагина, например cilium.
                  required: true
                  schema:
                    type: string
                - name: preserve
                  in: query
                  description: |-
                    Если флаг установлен, то сервис не будет управлять плагином,
                     но плагин не будет удален из кластера.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteClusterAddonResponse'
            deprecated: true
        patch:
            tags:
                - Plugins
            summary: Обновление существующего плагина на новую версию или применение новой конфигурации
            operationId: ClusterAddonService_UpdateClusterAddon
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: addonName
                  in: path
                  description: Название плагина, например cilium.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateClusterAddonRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateClusterAddonResponse'
            deprecated: true
    /v2/clusters/{clusterId}/kubeconfig:
        get:
            tags:
                - Cluster
            summary: Получение kubeconfig для кластера
            operationId: ClusterService_KubeConfig
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: network
                  in: query
                  description: |-
                    Тип сети, для которой запрашивается kubeconfig.
                     Если не указано, используется сеть по умолчанию.
                  schema:
                    enum:
                        - NETWORK_TYPE_PRIVATE
                        - NETWORK_TYPE_PUBLIC
                    type: string
                    format: enum
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetKubeConfigResponse'
            deprecated: true
    /v2/clusters/{clusterId}/node-pools:
        post:
            tags:
                - NodePool
            summary: Создание новой группы узлов
            operationId: NodePoolService_CreateNodePool
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера, в котором будет создана группа узлов.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateNodePoolRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateNodePoolResponse'
            deprecated: true
    /v2/clusters/{clusterId}/resume:
        post:
            tags:
                - Cluster
            summary: Возобновление работы кластера
            operationId: ClusterService_Resume
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResumeClusterResponse'
            deprecated: true
    /v2/clusters/{clusterId}/stop:
        post:
            tags:
                - Cluster
            summary: Приостановка кластера
            operationId: ClusterService_StopCluster
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StopClusterResponse'
            deprecated: true
    /v2/clusters/{clusterId}/upgrade:
        post:
            tags:
                - Cluster
            summary: Обновление плоскости управления кластера
            operationId: ClusterService_UpgradeControlPlane
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
                - name: version
                  in: query
                  description: |-
                    Версия Kubernetes, на которую выполняется обновление.

                     Пользователь может указать определенную версию или специальную метку:

                     - "latest": выбор наиболее актуальной версии Kubernetes.
                     - "1.X": выбор наивысшей патчевой версии среди 1.X версий.
                     - "1.X.Y": выбор конкретной версии Kubernetes.

                     Если версия не указана, то будет выполнено обновление
                     системных компонентов платформы Managed Kubernetes в кластере без обновления версии Kubernetes.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpgradeControlPlaneResponse'
            deprecated: true
    /v2/k8sversions:
        get:
            tags:
                - MetaInfo
            summary: |-
                Получение списка доступных для установки версии Kubernetes
                Используйте /v2/product-configuration.
            operationId: MetaService_ListK8SVersions
            parameters:
                - name: limit
                  in: query
                  description: Количество версий Kubernetes в ответе.
                  schema:
                    type: integer
                    format: uint32
                - name: offset
                  in: query
                  description: Количество пропущенных версий.
                  schema:
                    type: integer
                    format: uint32
                - name: sort
                  in: query
                  description: |-
                    Параметры сортировки списка версий Kubernetes в виде "field direction".
                     Возможные значения для field: version.
                     Возможные значения для direction: asc, desc.
                  schema:
                    type: string
                - name: filters
                  in: query
                  description: |-
                    Параметры фильтрации списка версий Kubernetes в виде "field:value"(include) или "filter condition value".
                     Возможные значения для field: version, releaseChannel, osFamily, supportMode
                     Возможные значения для condition: =, >=.
                  schema:
                    type: array
                    items:
                        type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListK8SVersionsResponse'
            deprecated: true
    /v2/node-pools:
        get:
            tags:
                - NodePool
            summary: Получение списка групп узлов
            operationId: NodePoolService_ListNodePools
            parameters:
                - name: clusterId
                  in: query
                  description: Идентификатор кластера.
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Количество групп узлов в ответе.
                  schema:
                    type: integer
                    format: uint32
                - name: offset
                  in: query
                  description: Количество пропущенных групп узлов.
                  schema:
                    type: integer
                    format: uint32
                - name: sort
                  in: query
                  description: "Параметры сортировки списка кластеров.\n Имеют вид \"field direction\". \n Возможные значения для field: displayName, nodeCount, cpu, ram, disk, createdAt.\n Возможные значения для direction: asc, desc."
                  schema:
                    type: string
                - name: filters
                  in: query
                  description: |-
                    Параметры фильтрации списка групп узлов.
                     Имеют вид  "field condition value" или "field:value"(include).
                     Возможные значения для field: displayName, state, nodeCount, cpu, ram, disk, createdAt.
                     Возможные значения для condition: =, !=, >, >=, <, <=.
                  schema:
                    type: array
                    items:
                        type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListNodePoolsResponse'
            deprecated: true
    /v2/node-pools/calc-kube-reserved:
        get:
            tags:
                - NodePool
            summary: Планирование ресурсов под системные компоненты    
            description: "Планирование количества зарезервированных ресурсов под системные компоненты \n на узле для указанной конфигурации виртуальной машины."
            operationId: NodePoolService_CalcKubeReserved
            parameters:
                - name: cpu
                  in: query
                  description: Количество ядер процессора виртуальной машины.
                  schema:
                    type: integer
                    format: uint32
                - name: ramGb
                  in: query
                  description: Оперативная память виртуальной машины, ГБ.
                  schema:
                    type: integer
                    format: uint32
                - name: diskSizeGb
                  in: query
                  description: Размер подключаемого диска, ГБ.
                  schema:
                    type: integer
                    format: uint32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/KubeReserved'
            deprecated: true
    /v2/node-pools/{nodePoolId}:
        get:
            tags:
                - NodePool
            summary: Получение информации по конкретной группе узлов
            operationId: NodePoolService_GetNodePool
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetNodePoolResponse'
            deprecated: true
        delete:
            tags:
                - NodePool
            summary: Удаление группы узлов
            operationId: NodePoolService_DeleteNodePool
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteNodePoolResponse'
            deprecated: true
        patch:
            tags:
                - NodePool
            summary: Редактирование группы узлов
            operationId: NodePoolService_EditNodePool
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EditNodePoolRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EditNodePoolResponse'
            deprecated: true
    /v2/node-pools/{nodePoolId}/kube-reserved:
        get:
            tags:
                - NodePool
            summary: Получение размера зарезервированных ресурсов    
            description: Получение количества зарезервированных ресурсов под системные компоненты на узле для указанной группы узлов.
            operationId: NodePoolService_GetKubeReserved
            parameters:
                - name: nodePoolId
                  in: path
                  description: "Идентификатор группы узлов, \n для которой возвращается количество зарезервированных ресурсов на узле."
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/KubeReserved'
            deprecated: true
    /v2/node-pools/{nodePoolId}/nodes:
        get:
            tags:
                - NodePool
            summary: Получение списка узлов
            operationId: NodePoolService_ListNodes
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Количество узлов в ответе.
                  schema:
                    type: integer
                    format: uint32
                - name: offset
                  in: query
                  description: Количество пропущенных узлов.
                  schema:
                    type: integer
                    format: uint32
                - name: filters
                  in: query
                  description: |-
                    Параметры фильтрации списка узлов в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: state, hostname, ipaddress, vmname.
                     Возможные значения для condition: =, :.
                  schema:
                    type: array
                    items:
                        type: string
                - name: sort
                  in: query
                  description: "Параметры сортировки списка узлов.\n Имеют вид \"field direction\". \n Возможные значения для field: createdAt, updatedAt, vmname, hostname.\n Возможные значения для direction: asc, desc."
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListNodesResponse'
            deprecated: true
    /v2/node-pools/{nodePoolId}/upgrade:
        post:
            tags:
                - NodePool
            summary: Обновление группы узлов кластера
            operationId: NodePoolService_UpgradeNodePool
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
                - name: version
                  in: query
                  description: |-
                    Версия Kubernetes, на которую выполняется обновление.

                     Пользователь может указать определенную версию или специальную метку:

                     - "latest": выбор наиболее актуальной версии Kubernetes.
                     - "1.X": выбор наивысшей патчевой версии среди 1.X версий.
                     - "1.X.Y": выбор конкретной версии Kubernetes.

                     Если версия не указана, то будет выполнено обновление
                     системных компонентов платформы Managed Kubernetes в группе узлов без обновления версии Kubernetes.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpgradeNodePoolResponse'
            deprecated: true
    /v2/product-configuration:
        get:
            tags:
                - MetaInfo
            summary: Получение конфигурации продукта Managed Kubernetes
            operationId: MetaService_GetProductConfiguration
            parameters:
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductConfiguration'
            deprecated: true
    /v2/quotas/cluster/{clusterId}:
        get:
            tags:
                - Quota
            summary: Получение информации о квотах и их потребление в кластере
            operationId: QuotaService_GetClusterQuotaUsage
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetClusterQuotaUsageResponse'
            deprecated: true
    /v2/quotas/project/{projectId}:
        get:
            tags:
                - Quota
            summary: Получение информации о квотах и их потребление в проекте
            operationId: QuotaService_GetProjectQuotaUsage
            parameters:
                - name: projectId
                  in: path
                  description: Идентификатор проекта.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetProjectQuotaUsageResponse'
            deprecated: true
    /v2/tasks:
        get:
            tags:
                - Task
            summary: Получение списка задач
            operationId: TaskService_ListTasks
            parameters:
                - name: limit
                  in: query
                  description: Количество задач в ответе.
                  schema:
                    type: integer
                    format: uint32
                - name: offset
                  in: query
                  description: Количество пропущенных задач.
                  schema:
                    type: integer
                    format: uint32
                - name: sort
                  in: query
                  description: "Параметры сортировки списка задач в виде \"field direction\". \n Возможные значения для field: updatedAt, createdAt.\n Возможные значения для direction: asc, desc."
                  schema:
                    type: string
                - name: filters
                  in: query
                  description: |-
                    Параметры фильтрации списка задач в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: action, objectType, status.
                     Возможные значения для condition: =.
                  schema:
                    type: array
                    items:
                        type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTasksResponse'
            deprecated: true
    /v2/tasks/{taskId}:
        get:
            tags:
                - Task
            summary: Получение задачи
            operationId: TaskService_GetTask
            parameters:
                - name: taskId
                  in: path
                  description: Идентификатор задачи.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetTaskResponse'
            deprecated: true
components:
    schemas:
        AddClusterAddonRequest:
            required:
                - clusterId
                - addonName
                - resolveMode
            type: object
            properties:
                clusterId:
                    type: string
                    description: Идентификатор кластера.
                addonName:
                    type: string
                    description: Название плагина, например cilium.
                addonVersion:
                    type: string
                    description: Версия плагина в формате SemVer.
                appVersion:
                    type: string
                    description: Версия приложения в формате SemVer.
                addonConfiguration:
                    type: string
                    description: |-
                        Пользовательская конфигурация плагина в JSON-формате согласно схеме.
                         Поддерживает переменные автоподстановки, заключенные в символы {{ и }}:
                         {{clusterID}} — уникальный идентификатор кластера;
                         {{clusterName}} — программное имя кластера;
                         {{productInstanceID}} — идентификатор экземпляра продукта;
                         {{nodeCIDR}} — CIDR сети узлов;
                         {{serviceCIDR}} — CIDR сервисной сети.
                resolveMode:
                    enum:
                        - RESOLVE_CONFLICTS_MODE_NONE
                        - RESOLVE_CONFLICTS_MODE_OVERWRITE
                        - RESOLVE_CONFLICTS_MODE_PRESERVE
                    type: string
                    description: Режим разрешения конфликтов.
                    format: enum
            description: Контракт для запроса на добавление нового плагина в кластер.
        AddClusterAddonResponse:
            required:
                - addon
            type: object
            properties:
                addon:
                    allOf:
                        - $ref: '#/components/schemas/ClusterAddon'
                    description: Информация о добавляемом плагине.
            description: Контракт для ответа на добавление нового плагина в кластер.
        Addon:
            required:
                - name
                - displayName
                - description
                - categories
                - createdAt
                - updatedAt
                - isBillable
            type: object
            properties:
                name:
                    type: string
                    description: Название плагина.
                displayName:
                    type: string
                    description: Название плагина в удобочитаемом виде.
                description:
                    type: string
                    description: Описание плагина для пользователя.
                categories:
                    type: array
                    items:
                        type: string
                    description: Категории плагина.
                createdAt:
                    type: string
                    description: Дата и время создания плагина.
                    format: date-time
                updatedAt:
                    type: string
                    description: Дата и время последнего обновления плагина.
                    format: date-time
                isBillable:
                    type: boolean
                    description: Признак предоставления плагина на платной основе.
            description: Описание плагина.
        AddonAction:
            required:
                - type
                - status
                - params
                - addonNamespace
                - addonConfiguration
                - createdAt
                - createdBy
            type: object
            properties:
                type:
                    enum:
                        - ADDON_ACTION_TYPE_ADD
                        - ADDON_ACTION_TYPE_UPDATE
                        - ADDON_ACTION_TYPE_DELETE
                    type: string
                    description: Тип действия над плагином.
                    format: enum
                status:
                    enum:
                        - ADDON_ACTION_STATUS_IN_PROGRESS
                        - ADDON_ACTION_STATUS_COMPLETED
                        - ADDON_ACTION_STATUS_FAILED
                        - ADDON_ACTION_STATUS_PENDING
                    type: string
                    description: Статус действия.
                    format: enum
                issues:
                    type: array
                    items:
                        $ref: '#/components/schemas/AddonIssue'
                    description: Список проблем, возникших при выполнении действия.
                params:
                    type: array
                    items:
                        $ref: '#/components/schemas/AddonActionParam'
                    description: Список параметров, используемых при выполнении действия над плагином.
                addonNamespace:
                    type: string
                    description: Пространство имен, в пределах которого выполняется действие над плагином.
                addonConfiguration:
                    type: string
                    description: Пользовательская конфигурация плагина.
                createdAt:
                    type: string
                    description: Дата и время действия.
                    format: date-time
                createdBy:
                    type: string
                    description: Идентификатор пользователя, который инициировал действие над плагином.
            description: Информация о действии над плагином.
        AddonActionParam:
            required:
                - name
                - value
            type: object
            properties:
                name:
                    type: string
                    description: Имя параметра.
                value:
                    type: string
                    description: Значение параметра.
            description: Параметры, используемые при выполнении действия над плагином.
        AddonIssue:
            required:
                - code
                - message
            type: object
            properties:
                code:
                    enum:
                        - ADDON_ISSUE_CODE_CONFLICT
                        - ADDON_ISSUE_CODE_REMOTE
                        - ADDON_ISSUE_CODE_INTERNAL
                    type: string
                    description: Код возможных проблем.
                    format: enum
                message:
                    type: string
                    description: Содержание проблемы.
            description: Информация о проблемах при управлении плагинами в кластере.
        AddonRelease:
            required:
                - addonVersion
                - addonNamespace
                - createdAt
                - updatedAt
                - mode
                - requirements
                - appVersion
            type: object
            properties:
                addonVersion:
                    type: string
                    description: Версия плагина в формате SemVer.
                addonNamespace:
                    type: string
                    description: Пространство имен, в которое должен устанавливаться плагин.
                kubeVersions:
                    deprecated: true
                    type: string
                    description: |-
                        [Deprecated] Диапазон поддерживаемых версий Kubernetes в формате SemVer.
                         Используйте значение Requirements.kube_versions.
                configurationSchema:
                    type: string
                    description: JSON схема, относительно которой валидируется конфигурация плагина.
                createdAt:
                    type: string
                    description: Дата и время создания версии плагина.
                    format: date-time
                updatedAt:
                    type: string
                    description: Дата и время обновления версии плагина.
                    format: date-time
                mode:
                    enum:
                        - SUPPORT_MODE_ACTIVE
                        - SUPPORT_MODE_EXPERIMENTAL
                        - SUPPORT_MODE_END_OF_SUPPORT
                        - SUPPORT_MODE_END_OF_LIFE
                        - SUPPORT_MODE_INACTIVE
                    type: string
                    description: Режим поддержки версии.
                    format: enum
                requirements:
                    allOf:
                        - $ref: '#/components/schemas/AddonRelease_Requirements'
                    description: Требования к кластеру для установки плагина.
                appVersion:
                    type: string
                    description: Версия приложения в формате SemVer.
            description: Описание версии плагина.
        AddonRelease_Requirements:
            required:
                - kubeVersions
                - readyWorkers
            type: object
            properties:
                kubeVersions:
                    type: string
                    description: Диапазон поддерживаемых версий Kubernetes в формате SemVer.
                readyWorkers:
                    type: integer
                    description: Минимальное количество доступных рабочих узлов в кластере.
                    format: uint32
            description: Требования к кластеру для установки плагина.
        AuditService:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: |-
                        Включение/выключение аудит-логирования событий компонентов кластера.
                         Возможные значения: true — аудит-логирование включено, false — аудит-логирование выключено.
                         По умолчанию аудит-логирование включено.
            description: Аудит-логирование событий компонентов кластера.
        AvailabilityZone:
            required:
                - zoneId
                - name
            type: object
            properties:
                zoneId:
                    type: string
                    description: Идентификатор зоны доступности.
                name:
                    type: string
                    description: Название зоны доступности.
            description: Информация о зоне доступности.
        BootstrapManagedAddons:
            type: object
            properties:
                horizontalPodAutoscaling:
                    allOf:
                        - $ref: '#/components/schemas/HorizontalPodAutoscaling'
                    description: "Конфигурация плагина горизонтального масштабирования подов в кластере.\n Увеличивает или уменьшает количество реплик подов \n в зависимости от потребления ресурсов уже работающих подов."
                persistentDiskCsiDriver:
                    allOf:
                        - $ref: '#/components/schemas/PersistentDiskCSIDriver'
                    description: "Конфигурация плагина CSI Driver для работы \n с постоянными томами для  хранения данных."
                kubeProxy:
                    allOf:
                        - $ref: '#/components/schemas/KubeProxy'
                    description: Конфигурация плагина kube-proxy.
                coredns:
                    allOf:
                        - $ref: '#/components/schemas/CoreDNS'
                    description: Конфигурация плагина CoreDNS.
            description: Информация о добавленных плагинов в процессе инициализации кластера.
        CalculatePriceExtendedResponse:
            type: object
            properties:
                promoTag:
                    type: string
                    description: Тег промо-акции.
                masterPrice:
                    allOf:
                        - $ref: '#/components/schemas/SkuPrice'
                    description: Стоимость мастер-узлов.
                nodePoolPrices:
                    type: array
                    items:
                        $ref: '#/components/schemas/CalculatePriceExtendedResponse_NodePoolPrice'
                    description: Стоимость групп узлов в разбивке по каждой группе.
                volumePrices:
                    type: array
                    items:
                        $ref: '#/components/schemas/SkuPrice'
                    description: Стоимость использования хранилища в разбивке по каждой группе.
                clusterAttributes:
                    type: array
                    items:
                        $ref: '#/components/schemas/SkuPrice'
                    description: Стоимость аттрибутов кластера.
                addonPrice:
                    allOf:
                        - $ref: '#/components/schemas/CalculatePriceExtendedResponse_AddonPrice'
                    description: Стоимость использования плагина.
                totalStreetPriceWithVatPerHour:
                    type: number
                    description: Итоговая стоимость ресурсов.
                    format: double
                totalDiscountPerHour:
                    type: number
                    description: |-
                        Итоговая скидка на ресурсы.
                         Может быть равна 0.00.
                    format: double
                totalPrivatePriceWithVatPerHour:
                    type: number
                    description: Итоговая стоимость всех ресурсов по индивидуальной цене.
                    format: double
            description: Детальный расчет по предоставленным ресурсам.
        CalculatePriceExtendedResponse_AddonPrice:
            type: object
            properties:
                addonPrice:
                    allOf:
                        - $ref: '#/components/schemas/SkuPrice'
                    description: Название плагина.
            description: Стоимость использования плагина.
        CalculatePriceExtendedResponse_NodePoolPrice:
            type: object
            properties:
                nodePrice:
                    allOf:
                        - $ref: '#/components/schemas/SkuPrice'
                    description: Стоимость рабочих узлов.
                diskPrice:
                    allOf:
                        - $ref: '#/components/schemas/SkuPrice'
                    description: Стоимость дискового пространства для рабочих узлов.
                totalStreetPriceWithVatPerHour:
                    type: number
                    description: Общая стоимость ресурсов в группе узлов.
                    format: double
                totalDiscountPerHour:
                    type: number
                    description: |-
                        Общая скидка на ресурсы в группе узлов.
                         Может быть равна 0.00.
                    format: double
                totalPrivatePriceWithVatPerHour:
                    type: number
                    description: Общая стоимость ресурсов в группе узлов по индивидуальной цене.
                    format: double
            description: Стоимость группы узлов.
        CalculatePriceRequest:
            required:
                - projectId
            type: object
            properties:
                projectId:
                    type: string
                    description: Идентификатор проекта.
                master:
                    allOf:
                        - $ref: '#/components/schemas/CalculatePriceRequest_Master'
                    description: Описание мастер-узла.
                nodePools:
                    type: array
                    items:
                        $ref: '#/components/schemas/CalculatePriceRequest_NodePool'
                    description: Описание групп узлов.
                disks:
                    type: array
                    items:
                        $ref: '#/components/schemas/CalculatePriceRequest_Disk'
                    description: Описание дисков.
                rentPublicIpCount:
                    type: integer
                    description: Количество привязанных публичных IP-адресов в шт.
                    format: uint32
                addon:
                    allOf:
                        - $ref: '#/components/schemas/CalculatePriceRequest_Addon'
                    description: Описание плагина.
                clusterAttributes:
                    type: array
                    items:
                        $ref: '#/components/schemas/CalculatePriceRequest_ClusterAttribute'
                    description: Описание аттрибутов кластера.
            description: Запрос на получение расчета по проекту.
        CalculatePriceRequest_Addon:
            type: object
            properties:
                addonName:
                    type: string
                    description: Название плагина.
            description: Информация о плагине.
        CalculatePriceRequest_ClusterAttribute:
            type: object
            properties:
                name:
                    enum:
                        - NAME_PUBLIC_IP
                    type: string
                    format: enum
                count:
                    type: integer
                    format: uint32
        CalculatePriceRequest_Disk:
            type: object
            properties:
                size:
                    type: string
                    description: Размер хранилища в ГБ.
                    format: uint64
                type:
                    deprecated: true
                    enum:
                        - DISK_TYPE_SSD_NVME
                    type: string
                    description: Тип диска.
                    format: enum
                typeId:
                    type: string
                    description: Идентификатор типа диска.
            description: Информация о хранилище.
        CalculatePriceRequest_Master:
            type: object
            properties:
                count:
                    type: integer
                    description: Количество мастер-узлов.
                    format: uint32
                type:
                    deprecated: true
                    enum:
                        - MASTER_TYPE_SMALL
                        - MASTER_TYPE_MEDIUM
                        - MASTER_TYPE_LARGE
                        - MASTER_TYPE_EXTRALARGE
                    type: string
                    description: Тип мастер-узлов.
                    format: enum
                flavorId:
                    type: string
                    description: Идентификатор типа
            description: Информация о мастер-узлах.
        CalculatePriceRequest_NodePool:
            required:
                - count
                - disk
            type: object
            properties:
                count:
                    type: integer
                    description: Количество рабочих узлов в группе.
                    format: uint32
                cpu:
                    deprecated: true
                    type: integer
                    description: Количество виртуальных ядер процессора рабочего узла.
                    format: uint32
                ram:
                    deprecated: true
                    type: integer
                    description: Размер оперативной памяти в ГБ.
                    format: uint32
                disk:
                    allOf:
                        - $ref: '#/components/schemas/CalculatePriceRequest_Disk'
                    description: Информация о хранилище для группы узлов.
                oversubscription:
                    deprecated: true
                    enum:
                        - OVERSUBSCRIPTION_3
                        - OVERSUBSCRIPTION_10
                    type: string
                    description: Коэффициент переподписки.
                    format: enum
                gpu:
                    deprecated: true
                    type: integer
                    description: Количество графических процессоров.
                    format: uint32
                type:
                    deprecated: true
                    enum:
                        - FLAVOR_TYPE_GENERAL
                        - FLAVOR_TYPE_MEMORY_OPTIMIZED
                        - FLAVOR_TYPE_GPU_V100
                        - FLAVOR_TYPE_GPU_H100
                        - FLAVOR_TYPE_GPU_A100
                        - FLAVOR_TYPE_GPU_H100_HGX
                    type: string
                    description: Тип шаблона конфигурации.
                    format: enum
                flavorId:
                    type: string
                    description: Идентификатор типа
            description: Информация о группе узлов.
        CalculatePriceResponse:
            required:
                - masterPrice
                - nodePoolPrices
                - diskPrices
                - rentPublicIpPrice
                - totalPricePerMonth
                - totalPricePerHour
                - addonPrice
            type: object
            properties:
                masterPrice:
                    type: number
                    description: Стоимость мастер-узлов.
                    format: double
                nodePoolPrices:
                    type: array
                    items:
