                        Идентификатор группы безопасности.
                         Опциональное поле.
            description: Описание желаемой сетевой инфраструктуры группы узлов.
        NodesNetworkConfigurationResponse:
            required:
                - nodesSubnetCidr
                - nodesSubnetId
            type: object
            properties:
                nodesSubnetCidr:
                    type: string
                    description: Адрес сети узлов группы.
                nodesSubnetId:
                    type: string
                    description: Идентификатор сети узлов группы.
                securityGroupId:
                    type: string
                    description: |-
                        Идентификатор группы безопасности.
                         Опциональное поле.
            description: Описание актуальной сетевой инфраструктуры группы узлов.
        PersistentDiskCSIDriver:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: |-
                        Опция подключения плагина
                         По умолчанию плагин включен.
            description: "Конфигурация плагина CSI Driver для работы \n с постоянными томами для хранения данных."
        Price:
            type: object
            properties:
                streetPriceWithVatPerHour:
                    type: number
                    description: Цена единицы ресурса за час использования.
                    format: double
                discountPerHour:
                    type: number
                    description: "Размер скидки для единицы ресурса. \n Может быть равна 0.00."
                    format: double
                privatePriceWithVatPerHour:
                    type: number
                    description: Индивидуальная цена единицы ресурса за час использования.
                    format: double
            description: Цена единицы ресурса.
        ProductConfiguration:
            required:
                - channels
                - zones
                - flavors
                - defaultZone
                - defaultChannel
                - defaultDiskType
                - diskTypes
            type: object
            properties:
                channels:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProductConfiguration_ReleaseChannelConfiguration'
                    description: Список конфигураций релизных каналов.
                zones:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProductConfiguration_AvailabilityZoneConfiguration'
                    description: Список конфигураций зон доступности.
                flavors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProductConfiguration_FlavorConfiguration'
                    description: Список конфигураций шаблонов виртуальной машины.
                defaultZone:
                    type: string
                    description: Зона доступности по умолчанию, которая будет выбрана при создании кластера или группы узлов, если не указано иное.
                defaultChannel:
                    enum:
                        - RELEASE_CHANNEL_RAPID
                        - RELEASE_CHANNEL_REGULAR
                        - RELEASE_CHANNEL_STABLE
                    type: string
                    description: Релизный канал по умолчанию.
                    format: enum
                defaultDiskType:
                    type: string
                    description: Название типа диска по умолчанию.
                diskTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/ProductConfiguration_DiskTypeConfiguration'
                    description: Список конфигураций типов дисков.
            description: Конфигурация продукта Managed Kubernetes.
        ProductConfiguration_AvailabilityZoneConfiguration:
            required:
                - id
                - name
                - availableFlavors
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор зоны доступности.
                name:
                    type: string
                    description: Название зоны доступности.
                availableFlavors:
                    type: array
                    items:
                        type: string
                    description: Список доступных шаблонов конфигураций виртуальной машины в зоне доступности.
            description: Конфигурация зоны доступности.
        ProductConfiguration_DiskTypeConfiguration:
            required:
                - id
                - name
                - zones
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор типа диска.
                name:
                    type: string
                    description: Название типа диска.
                zones:
                    type: array
                    items:
                        type: string
                    description: Список зон доступности, для которых предоставляется этот тип диска.
            description: Конфигурация типа диска виртуальной машины.
        ProductConfiguration_FlavorConfiguration:
            required:
                - id
                - name
                - zones
                - cpu
                - ram
                - oversubscription
                - gpu
                - purpose
                - infraType
                - infraTypeDisplayName
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор шаблона конфигурации.
                name:
                    type: string
                    description: Название шаблона конфигурации.
                zones:
                    type: array
                    items:
                        type: string
                    description: Список зон доступности, в которых существует указанный шаблон конфигурации.
                cpu:
                    type: integer
                    description: Количество ядер процессора виртуальной машины.
                    format: uint32
                ram:
                    type: integer
                    description: Оперативная память виртуальной машины в ГБ.
                    format: uint32
                oversubscription:
                    type: string
                    description: Коэффициент переподписки.
                gpu:
                    type: integer
                    description: Количество графических процессоров, выделенных виртуальной машине.
                    format: uint32
                type:
                    deprecated: true
                    enum:
                        - FLAVOR_TYPE_GENERAL
                        - FLAVOR_TYPE_MEMORY_OPTIMIZED
                        - FLAVOR_TYPE_GPU_V100
                        - FLAVOR_TYPE_GPU_H100
                        - FLAVOR_TYPE_GPU_A100
                        - FLAVOR_TYPE_GPU_H100_HGX
                    type: string
                    description: Тип шаблона конфигурации.
                    format: enum
                purpose:
                    enum:
                        - FLAVOR_PURPOSE_CONTROLPLANE
                        - FLAVOR_PURPOSE_DATAPLANE
                    type: string
                    description: Тип шаблона конфигурации ВМ.
                    format: enum
                infraType:
                    type: string
                    description: Тип шаблона конфигурации.
                infraTypeDisplayName:
                    type: string
                    description: Название типа инфраструктуры шаблона конфигурации.
            description: Конфигурация шаблона виртуальной машины.
        ProductConfiguration_ReleaseChannelConfiguration:
            required:
                - channel
