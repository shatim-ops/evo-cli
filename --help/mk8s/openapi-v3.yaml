openapi: 3.0.3
info:
    title: Cloud.ru Managed Kubernetes API
    description: '[Документация Managed Kubernetes](https://cloud.ru/docs/kubernetes-evolution/ug/index.html)'
    contact:
        email: support@cloud.ru
    version: 3.0.1
servers:
    - url: https://mk8s.api.cloud.ru
paths:
    /v3/addons:
        get:
            tags:
                - PluginsInfo
            summary: Получение списка доступных плагинов
            operationId: AddonService_List
            parameters:
                - name: pageSize
                  in: query
                  description: Максимальное количество результатов на странице.
                  schema:
                    example: 10
                    type: integer
                    format: int64
                - name: pageToken
                  in: query
                  description: Токен запрашиваемой страницы с результатами.
                  schema:
                    example: token17d9f...01cf4bd36c
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Параметры фильтрации списка плагинов в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: name, displayName, categories, isBillable, createdAt.
                     Возможные значения для condition: =, <=, >=, :.
                  schema:
                    example: isBillable = true
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Параметры сортировки списка плагинов в виде "field direction".
                     Возможные значения для field: name, displayName, createdAt, updatedAt.
                     Возможные значения для direction: asc, desc.
                  schema:
                    example: createdAt desc
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  required: true
                  schema:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ListAddonsResponse'
    /v3/addons/{addonName}:
        get:
            tags:
                - PluginsInfo
            summary: Получение списка версий плагина
            operationId: AddonService_ListReleases
            parameters:
                - name: addonName
                  in: path
                  description: Название плагина.
                  required: true
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Параметры сортировки списка версий плагина в виде "field direction".
                     Возможные значения для field: addonVersion, appVersion, createdAt, updatedAt.
                     Возможные значения для direction: asc, desc.
                  schema:
                    example: addonVersion asc
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Параметры фильтрации списка версий плагина в виде "field:value"(include) или "filter condition value" (=, :).
                     Возможные значения для field: addonVersion, appVersion, supportMode, kubeVersion.
                  schema:
                    example: supportMode = SUPPORT_MODE_ACTIVE
                    type: string
                - name: pageSize
                  in: query
                  description: Максимальное количество результатов на странице.
                  schema:
                    example: 10
                    type: integer
                    format: int64
                - name: pageToken
                  in: query
                  description: Токен запрашиваемой страницы с результатами.
                  schema:
                    example: token17d9f...01cf4bd36c
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  required: true
                  schema:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ListAddonReleasesResponse'
    /v3/clusterAddons:
        get:
            tags:
                - Plugins
            summary: Получение списка плагинов кластера
            operationId: ClusterAddonService_List
            parameters:
                - name: clusterId
                  in: query
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                - name: pageSize
                  in: query
                  description: Максимальное количество результатов на странице.
                  schema:
                    example: 10
                    type: integer
                    format: int64
                - name: pageToken
                  in: query
                  description: Токен запрашиваемой страницы с результатами.
                  schema:
                    example: token17d9f...01cf4bd36c
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Параметры фильтрации списка плагинов в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: addonName.
                     Возможные значения для condition: :.
                  schema:
                    example: addonName = evocs
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Сортировка списка плагинов кластера в виде "field direction".
                     Возможные значения для field: addonName
                     Возможные значения для direction: asc, desc.
                  schema:
                    example: displayName desc
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ListClusterAddonsResponse'
        post:
            tags:
                - Plugins
            summary: Добавление нового плагина в кластер
            operationId: ClusterAddonService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.CreateClusterAddonRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/clusterAddons/{clusterAddonId}:
        get:
            tags:
                - Plugins
            summary: Получение информации об определенном плагине
            operationId: ClusterAddonService_Get
            parameters:
                - name: clusterAddonId
                  in: path
                  description: Идентификатор плагина.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ClusterAddon'
        delete:
            tags:
                - Plugins
            summary: Удаление плагина из кластера
            operationId: ClusterAddonService_Delete
            parameters:
                - name: clusterAddonId
                  in: path
                  description: Идентификатор плагина.
                  required: true
                  schema:
                    type: string
                - name: preserve
                  in: query
                  description: |-
                    Признак сохранения ресурсов плагина в кластере.
                     Если true — все манифесты и связанные ресурсы плагина останутся в кластере,
                     но управление плагином через Managed Kubernetes будет недоступно.
                     Опция подходит в случаях, когда важно сохранить текущее состояние и настройки плагина,
                     но больше не требуется централизованное управление через Managed Kubernetes.
                  schema:
                    example: true
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
        patch:
            tags:
                - Plugins
            summary: Обновление плагина на новую версию или применение новой конфигурации
            operationId: ClusterAddonService_Update
            parameters:
                - name: clusterAddonId
                  in: path
                  description: Идентификатор плагина.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.UpdateClusterAddonRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/clusters:
        get:
            tags:
                - Cluster
            summary: Получение списка кластеров
            operationId: ClusterService_List
            parameters:
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  required: true
                  schema:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                - name: pageSize
                  in: query
                  description: Максимальное количество результатов на странице.
                  schema:
                    example: 10
                    type: integer
                    format: int64
                - name: pageToken
                  in: query
                  description: Токен запрашиваемой страницы с результатами.
                  schema:
                    example: token17d9f...01cf4bd36c
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Параметры фильтрации списка кластеров в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: displayName, status, kubeAPIInternet, masterCount, nodePoolCount, createdAt.
                     Возможные значения для condition: =, !=, >, >=, <, <=.
                  schema:
                    example: masterCount = 1
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Сортировка списка кластеров в виде "field direction".
                     Возможные значения для field: displayName, masterCount, nodePoolCount, createdAt.
                     Возможные значения для direction: asc, desc.
                  schema:
                    example: displayName desc
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ListClustersResponse'
        post:
            tags:
                - Cluster
            summary: Создание нового кластера
            operationId: ClusterService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.CreateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/clusters/{clusterId}:
        get:
            tags:
                - Cluster
            summary: Получение информации о кластере
            operationId: ClusterService_Get
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Cluster'
        delete:
            tags:
                - Cluster
            summary: Удаление кластера
            operationId: ClusterService_Delete
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
        patch:
            tags:
                - Cluster
            summary: Редактирование существующего кластера
            operationId: ClusterService_Update
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.UpdateClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/clusters/{clusterId}:getKubeConfig:
        post:
            tags:
                - Cluster
            summary: Получение kubeconfig для кластера
            operationId: ClusterService_GetKubeConfig
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.GetKubeConfigRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.KubeConfig'
    /v3/clusters/{clusterId}:resume:
        post:
            tags:
                - Cluster
            summary: Возобновление работы кластера
            operationId: ClusterService_Resume
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ResumeClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/clusters/{clusterId}:stop:
        post:
            tags:
                - Cluster
            summary: Приостановка кластера
            operationId: ClusterService_Stop
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.StopClusterRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/clusters/{clusterId}:upgrade:
        post:
            tags:
                - Cluster
            summary: Обновление плоскости управления кластера
            operationId: ClusterService_UpgradeControlPlane
            parameters:
                - name: clusterId
                  in: path
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.UpgradeControlPlaneRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/nodePools:
        get:
            tags:
                - NodePool
            summary: Получение списка групп узлов
            operationId: NodePoolService_List
            parameters:
                - name: clusterId
                  in: query
                  description: Идентификатор кластера.
                  required: true
                  schema:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Параметры сортировки списка групп узлов в виде "field direction".
                     Возможные значения для field: name, nodeCount, cpu, ram, disk, createdAt.
                     Возможные значения для direction: asc, desc.
                  schema:
                    example: cpu desc
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Параметры фильтрации списка групп узлов
                     в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: name, status, nodeCount, cpu, ram, disk, createdAt.
                     Возможные значения для condition: =, !=, >, >=, <, <=.
                  schema:
                    example: cpu = 4
                    type: string
                - name: pageSize
                  in: query
                  description: Максимальное количество результатов на странице.
                  schema:
                    example: 10
                    type: integer
                    format: int64
                - name: pageToken
                  in: query
                  description: Токен запрашиваемой страницы с результатами.
                  schema:
                    example: token17d9f...01cf4bd36c
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ListNodePoolsResponse'
        post:
            tags:
                - NodePool
            summary: Создание новой группы узлов
            operationId: NodePoolService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.CreateNodePoolRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/nodePools/{nodePoolId}:
        get:
            tags:
                - NodePool
            summary: Получение ресурса группы узлов по идентификатору
            operationId: NodePoolService_Get
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodePool'
        delete:
            tags:
                - NodePool
            summary: Удаление группы узлов
            operationId: NodePoolService_Delete
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
        patch:
            tags:
                - NodePool
            summary: Редактирование группы узлов
            operationId: NodePoolService_Update
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.UpdateNodePoolRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/nodePools/{nodePoolId}:getKubeReserved:
        post:
            tags:
                - NodePool
            summary: Получение количества зарезервированных ресурсов
            description: Получение количества зарезервированных ресурсов под системные компоненты на узле для указанной группы узлов.
            operationId: NodePoolService_GetKubeReserved
            parameters:
                - name: nodePoolId
                  in: path
                  description: |-
                    Идентификатор группы узлов,
                     для которой возвращается количество зарезервированных ресурсов на узле.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.GetKubeReservedRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.KubeReserved'
    /v3/nodePools/{nodePoolId}:listNodes:
        get:
            tags:
                - NodePool
            summary: Получение списка узлов
            operationId: NodePoolService_ListNodes
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Параметры фильтрации списка узлов в виде "field condition value" или "field:value"(include).
                     Возможные значения для field: nodeStatus, health, kubernetesVersion, name, providerId,
                     machineName, addresses, а также устаревшие status, hostname, ipaddress, vmname.
                     Возможные значения для condition: =, :.
                  schema:
                    example: nodeStatus = NODE_STATUS_RUNNING
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Параметры сортировки списка узлов в виде "field direction".
                     Возможные значения для field: createdAt, updatedAt, name, kubernetesVersion,
                     machineName, а также устаревшие hostname, vmname.
                     Возможные значения для direction: asc, desc.
                  schema:
                    example: createdAt desc
                    type: string
                - name: pageSize
                  in: query
                  description: Максимальное количество результатов на странице.
                  schema:
                    example: 10
                    type: integer
                    format: int64
                - name: pageToken
                  in: query
                  description: Токен запрашиваемой страницы с результатами.
                  schema:
                    example: token17d9f...01cf4bd36c
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ListNodesResponse'
    /v3/nodePools/{nodePoolId}:upgrade:
        post:
            tags:
                - NodePool
            summary: Обновление группы узлов кластера
            operationId: NodePoolService_Upgrade
            parameters:
                - name: nodePoolId
                  in: path
                  description: Идентификатор группы узлов.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/cloudru.containers.mk8s.v3.UpgradeNodePoolRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/nodePools:calcKubeReserved:
        get:
            tags:
                - NodePool
            summary: Планирование зарезервированных ресурсов под системные компоненты
            operationId: NodePoolService_CalcKubeReserved
            parameters:
                - name: cpu
                  in: query
                  description: Количество ядер процессора виртуальной машины.
                  schema:
                    example: 2
                    type: integer
                    format: int32
                - name: ramGb
                  in: query
                  description: Оперативная память виртуальной машины, ГБ.
                  schema:
                    example: 4
                    type: integer
                    format: int32
                - name: diskSizeGb
                  in: query
                  description: Размер подключаемого диска, ГБ.
                  schema:
                    example: 40
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.KubeReserved'
    /v3/operations/{operationId}:
        get:
            tags:
                - Operation
            summary: Получение операции
            description: Метод позволяет получить данные по операции.
            operationId: OperationService_Get
            parameters:
                - name: operationId
                  in: path
                  description: Идентификатор операции.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.operation.Operation'
    /v3/productConfiguration:
        get:
            tags:
                - ProductConfiguration
            summary: Получение конфигурации продукта Managed Kubernetes
            operationId: ProductConfigurationService_Get
            parameters:
                - name: projectId
                  in: query
                  description: Идентификатор проекта.
                  required: true
                  schema:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ProductConfiguration'
components:
    schemas:
        cloudru.containers.mk8s.v3.Addon:
            type: object
            properties:
                name:
                    readOnly: true
                    example: s3-csi-driver
                    type: string
                    description: Название плагина.
                displayName:
                    readOnly: true
                    example: S3 CSI Driver
                    type: string
                    description: Название плагина в удобочитаемом виде.
                description:
                    readOnly: true
                    example: Работа с постоянными хранилищами Evolution Object Storage
                    type: string
                    description: Описание плагина для пользователя.
                categories:
                    readOnly: true
                    example: [Хранение, Данные]
                    type: array
                    items:
                        type: string
                    description: Категории плагина.
                createdAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время создания плагина.
                    format: date-time
                updatedAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время последнего обновления плагина.
                    format: date-time
                isBillable:
                    readOnly: true
                    example: false
                    type: boolean
                    description: Признак предоставления плагина на платной основе.
            description: Описание плагина.
        cloudru.containers.mk8s.v3.AddonRelease:
            type: object
            properties:
                addonVersion:
                    readOnly: true
                    example: 1.0.7
                    type: string
                    description: Версия плагина в формате SemVer.
                appVersion:
                    readOnly: true
                    example: 1.0.7
                    type: string
                    description: Версия приложения в формате SemVer.
                addonNamespace:
                    readOnly: true
                    example: kube-system
                    type: string
                    description: Пространство имен, в которое должен устанавливаться плагин.
                configurationSchema:
                    readOnly: true
                    example: {"type": "object", "$schema": "https://json-schema.org/draft/2020-12/schema", "properties": {}, "additionalProperties": false}
                    type: string
                    description: JSON-схема, относительно которой валидируется конфигурация плагина.
                createdAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время создания версии плагина.
                    format: date-time
                updatedAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время обновления версии плагина.
                    format: date-time
                mode:
                    readOnly: true
                    example: SUPPORT_MODE_ACTIVE
                    enum:
                        - SUPPORT_MODE_ACTIVE
                        - SUPPORT_MODE_EXPERIMENTAL
                        - SUPPORT_MODE_END_OF_SUPPORT
                        - SUPPORT_MODE_END_OF_LIFE
                        - SUPPORT_MODE_INACTIVE
                    type: string
                    description: |-
                        Режим поддержки версии.

                         Возможные значения:

                         * `SUPPORT_MODE_ACTIVE` — версия активно поддерживается, выпускаются обновления и исправления.
                         * `SUPPORT_MODE_EXPERIMENTAL` — версия находится в экспериментальном режиме, возможны изменения.
                         * `SUPPORT_MODE_END_OF_SUPPORT` — завершен период основной поддержки, поддерживаются обновления безопасности.
                         * `SUPPORT_MODE_END_OF_LIFE` — версия больше не поддерживается, рекомендуется переходить на более новую версию.
                         * `SUPPORT_MODE_INACTIVE` — поддержка версии отключена, выпуск любых обновлений прекращен.
                    format: enum
                requirements:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Requirements'
                    description: Требования к кластеру для установки плагина.
            description: Описание версии плагина.
        cloudru.containers.mk8s.v3.AuditService:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    default: true
                    description: |-
                        Включение/выключение аудит-логирования событий компонентов кластера.
                         Возможные значения: true — аудит-логирование включено, false — аудит-логирование выключено.
                         По умолчанию аудит-логирование включено.
            description: Аудит-логирование событий компонентов кластера.
        cloudru.containers.mk8s.v3.AutoRepair:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    default: true
                    description: |-
                        Включение автоматического восстановления группы узлов.
                         Возможные значения: true — автоматическое восстановление включено, false — автоматическое восстановление выключено.
                         По умолчанию восстановление группы узлов включено.
            description: Автоматическое восстановление группы узлов.
        cloudru.containers.mk8s.v3.AutoScale:
            required:
                - minCount
                - maxCount
            type: object
            properties:
                minCount:
                    example: 1
                    type: integer
                    description: Минимальное количество узлов в группе узлов.
                    format: int32
                maxCount:
                    example: 3
                    type: integer
                    description: Максимальное количество узлов в группе узлов.
                    format: int32
                initialCount:
                    example: 1
                    type: integer
                    description: |-
                        Начальное количество узлов.
                         Обязателен при создании группы узлов.
                         При редактировании группы узлов является опциональным.
                    format: int32
            description: Группа узлов с поддержкой автоматического масштабирования.
        cloudru.containers.mk8s.v3.AvailabilityZoneConfiguration:
            type: object
            properties:
                zoneId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор зоны доступности.
                name:
                    readOnly: true
                    example: ru.AZ-2
                    type: string
                    description: Название зоны доступности.
                availableFlavors:
                    readOnly: true
                    example: [00000000-0000-0000-0000-000000000000]
                    type: array
                    items:
                        type: string
                    description: Список доступных шаблонов конфигураций виртуальной машины в зоне доступности.
            description: Конфигурация зоны доступности.
        cloudru.containers.mk8s.v3.BootstrapManagedAddons:
            type: object
            properties:
                horizontalPodAutoscaling:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.HorizontalPodAutoscaling'
                    description: |-
                        Конфигурация плагина горизонтального масштабирования подов в кластере.
                         Увеличивает или уменьшает количество реплик подов
                         в зависимости от потребления ресурсов уже работающих подов.
                persistentDiskCsiDriver:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.PersistentDiskCSIDriver'
                    description: |-
                        Конфигурация плагина CSI Driver для работы
                         с постоянными томами для  хранения данных.
                kubeProxy:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.KubeProxy'
                    description: Конфигурация плагина kube-proxy.
                coredns:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.CoreDNS'
                    description: Конфигурация плагина CoreDNS.
            description: Информация о добавленных плагинах в процессе инициализации кластера.
        cloudru.containers.mk8s.v3.Calico:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: Опция использования Calico в качестве CNI-плагина кластера.
                version:
                    example: 3.29.3-sbc.1
                    type: string
                    description: Версия плагина в формате SemVer согласно версионированию Managed Kubernetes.
                appVersion:
                    example: v3.29.3
                    type: string
                    description: Версия приложения в формате SemVer согласно версионированию поставщика.
                enableEbpfReplacement:
                    example: false
                    type: boolean
                    description: |-
                        Опция использования eBPF replacement.
                         По умолчанию: false.
            description: Конфигурация сетевого плагина Calico.
        cloudru.containers.mk8s.v3.Cilium:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: Опция использования Cilium в качестве CNI-плагина кластера.
                version:
                    example: 1.16.7-sbc.3
                    type: string
                    description: Версия плагина в формате SemVer согласно версионированию Managed Kubernetes.
                appVersion:
                    example: v1.16.7
                    type: string
                    description: Версия приложения в формате SemVer согласно версионированию поставщика.
                enableEbpfReplacement:
                    example: false
                    type: boolean
                    description: |-
                        Опция использования eBPF replacement.
                         По умолчанию: false.
            description: Конфигурация сетевого плагина Cilium.
        cloudru.containers.mk8s.v3.Cluster:
            required:
                - name
                - projectId
                - identityConfiguration
            type: object
            properties:
                id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера, присваивается автоматически при создании кластера.
                name:
                    example: cloudru-example-cluster
                    type: string
                    description: |-
                        Название кластера, которое ввел пользователь.
                         Допустимое количество символов от 3 до 60.
                projectId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор проекта.
                createdBy:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор пользователя, создавшего кластер.
                updatedBy:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор последнего пользователя, редактировавшего кластер.
                createdAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время создания кластера, присваивается автоматически при создании кластера.
                    format: date-time
                updatedAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время последнего редактирования кластера.
                    format: date-time
                nodePools:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodePoolsInfo'
                    description: Информация о группах узлов.
                controlPlane:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ControlPlane'
                    description: Конфигурация плоскости управления.
                networkConfiguration:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NetworkConfiguration'
                    description: Сетевая конфигурация кластера.
                status:
                    readOnly: true
                    example: OBJECT_STATUS_PROVISIONING
                    enum:
                        - OBJECT_STATUS_PENDING
                        - OBJECT_STATUS_PROVISIONING
                        - OBJECT_STATUS_RUNNING
                        - OBJECT_STATUS_RESUMING
                        - OBJECT_STATUS_DELETING
                        - OBJECT_STATUS_ERROR
                        - OBJECT_STATUS_SCALING_UP
                        - OBJECT_STATUS_SCALING_DOWN
                        - OBJECT_STATUS_STOPPING
                        - OBJECT_STATUS_STOPPED
                        - OBJECT_STATUS_SUSPENDING
                        - OBJECT_STATUS_SUSPENDED
                        - OBJECT_STATUS_UPGRADING
                        - OBJECT_STATUS_EDITING
                        - OBJECT_STATUS_ADDING
                        - OBJECT_STATUS_DELETED
                    type: string
                    description: |-
                        Состояние кластера (мастер-узлов).

                         Возможные значения:

                         * `OBJECT_STATUS_PENDING` — кластер в ожидании подготовки к запуску.
                         * `OBJECT_STATUS_PROVISIONING` — подготовка кластера к запуску.
                         * `OBJECT_STATUS_RUNNING` — кластер запущен.
                         * `OBJECT_STATUS_RESUMING` — работа кластера возобновляется.
                         * `OBJECT_STATUS_DELETING` — кластер удаляется.
                         * `OBJECT_STATUS_ERROR` — операция с группой узлов закончилась ошибкой.
                         * `OBJECT_STATUS_SCALING_UP` — размер кластера увеличивается.
                         * `OBJECT_STATUS_SCALING_DOWN` — размер кластера уменьшается.
                         * `OBJECT_STATUS_STOPPING` — работа кластера останавливается.
                         * `OBJECT_STATUS_STOPPED` — работа кластера остановлена.
                         * `OBJECT_STATUS_SUSPENDING` — работа кластера приостанавливается из-за отсутствия средств.
                         * `OBJECT_STATUS_SUSPENDED` — работа кластера приостановлена из-за отсутствия средств.
                         * `OBJECT_STATUS_UPGRADING` — версия кластера обновляется.
                         * `OBJECT_STATUS_EDITING` — параметры кластера редактируются.
                    format: enum
                loggingService:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.LoggingService'
                    description: Параметры логирования событий компонентов кластера.
                monitoringService:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.MonitoringService'
                    description: Параметры мониторинга компонентов кластера.
                releaseChannel:
                    example: RELEASE_CHANNEL_RAPID
                    enum:
                        - RELEASE_CHANNEL_RAPID
                        - RELEASE_CHANNEL_REGULAR
                        - RELEASE_CHANNEL_STABLE
                    type: string
                    description: Релизный канал, на который подписан кластер.
                    format: enum
                auditService:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.AuditService'
                    description: Параметры аудит-логирования событий компонентов кластера.
                versionUpgrade:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.VersionUpgrade'
                    description: Информация о доступных версиях Kubernetes для обновления плоскости управления кластера.
                identityConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.IdentityConfiguration'
                    description: |-
                        Конфигурация сервисного аккаунта кластера, который используется для
                         доступа к Artifact Registry, доставке логов и метрик.
                keyManagementService:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.KeyManagementService'
                    description: Параметры шифрования ресурсов кластера.
            description: Информация о кластере.
        cloudru.containers.mk8s.v3.ClusterAddon:
            required:
                - clusterId
                - name
                - appVersion
            type: object
            properties:
                id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор плагина.
                clusterId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера, в котором установлен плагин.
                name:
                    example: evocs
                    type: string
                    description: Машинное имя плагина.
                displayName:
                    readOnly: true
                    example: EvoCS
                    type: string
                    description: Название плагина.
                appVersion:
                    example: v0.0.6
                    type: string
                    description: Версия приложения в формате SemVer.
                status:
                    readOnly: true
                    example: OBJECT_STATUS_RUNNING
                    enum:
                        - OBJECT_STATUS_PENDING
                        - OBJECT_STATUS_PROVISIONING
                        - OBJECT_STATUS_RUNNING
                        - OBJECT_STATUS_RESUMING
                        - OBJECT_STATUS_DELETING
                        - OBJECT_STATUS_ERROR
                        - OBJECT_STATUS_SCALING_UP
                        - OBJECT_STATUS_SCALING_DOWN
                        - OBJECT_STATUS_STOPPING
                        - OBJECT_STATUS_STOPPED
                        - OBJECT_STATUS_SUSPENDING
                        - OBJECT_STATUS_SUSPENDED
                        - OBJECT_STATUS_UPGRADING
                        - OBJECT_STATUS_EDITING
                        - OBJECT_STATUS_ADDING
                        - OBJECT_STATUS_DELETED
                    type: string
                    description: |-
                        Состояние плагина в кластере.

                         Возможные значения:

                         * `OBJECT_STATUS_PENDING` — плагин находится в ожидании установки.
                         * `OBJECT_STATUS_ADDING` — плагин устанавливается.
                         * `OBJECT_STATUS_EDITING` — плагин обновляется.
                         * `OBJECT_STATUS_DELETING` — плагин удаляется.
                         * `OBJECT_STATUS_RUNNING` — плагин успешно установлен или обновлен.
                         * `OBJECT_STATUS_DELETED` — плагин успешно удален.
                         * `OBJECT_STATUS_ERROR` — операция установки, обновления или удаления плагина завершилась ошибкой.
                    format: enum
                createdAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время добавления плагина в кластер.
                    format: date-time
                updatedAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время последнего изменения плагина.
                    format: date-time
                createdBy:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор пользователя, который добавил плагин в кластер.
                updatedBy:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор пользователя, который обновил плагин.
            description: Информация о плагине.
        cloudru.containers.mk8s.v3.ControlPlane:
            type: object
            properties:
                zones:
                    readOnly: true
                    example: [00000000-0000-0000-0000-000000000000]
                    type: array
                    items:
                        type: string
                    description: |-
                        Идентификаторы зон доступности, в которых будут размещены узлы плоскости управления.
                         Для зонального кластера указывается идентификатор одной зоны, для регионального — три и более.
                count:
                    readOnly: true
                    example: 1
                    maximum: 5
                    type: integer
                    description: Количество узлов плоскости управления.
                    format: int32
                version:
                    readOnly: true
                    example: v1.34.1
                    type: string
                    description: Версия Kubernetes.
                upgradeInfo:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ControlPlaneUpgradeInfo'
                    description: Информация о процессе обновления плоскости управления кластера.
                machineConfiguration:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.MachineConfiguration'
                    description: Описание инфраструктуры мастер-узлов.
            description: Информация о конфигурации плоскости управления.
        cloudru.containers.mk8s.v3.ControlPlaneEndpoint:
            type: object
            properties:
                network:
                    readOnly: true
                    example: NETWORK_TYPE_PRIVATE
                    enum:
                        - NETWORK_TYPE_PRIVATE
                        - NETWORK_TYPE_PUBLIC
                    type: string
                    description: |-
                        Тип сети, которой принадлежит адрес.

                         Возможные значения:

                         * `NETWORK_TYPE_PRIVATE` — приватная пользовательская сеть (RFC1918).
                         * `NETWORK_TYPE_PUBLIC` — публичная пользовательская сеть (интернет).
                    format: enum
                address:
                    readOnly: true
                    example: https://172.16.0.0:6443
                    type: string
                    description: Адрес плоскости управления кластера в формате "https://domain:port".
            description: Адрес плоскости управления кластера.
        cloudru.containers.mk8s.v3.ControlPlaneRequest:
            required:
                - version
                - sizingConfiguration
            type: object
            properties:
                zones:
                    example: [00000000-0000-0000-0000-000000000000]
                    type: array
                    items:
                        type: string
                    description: |-
                        Идентификаторы зон доступности, в которых будут размещены узлы плоскости управления.
                         Для зонального кластера указывается идентификатор одной зоны, для регионального — три и более.
                version:
                    example: v1.34.1
                    type: string
                    description: Версия Kubernetes.
                sizingConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ControlPlaneSizingConfigurationRequest'
                    description: Конфигурация размерности плоскости управления кластера и мастер-узлов.
            description: Конфигурация плоскости управления кластера.
        cloudru.containers.mk8s.v3.ControlPlaneSizingConfigurationRequest:
            required:
                - masterCount
                - flavorId
            type: object
            properties:
                masterCount:
                    example: 1
                    type: integer
                    description: Количество узлов плоскости управления.
                    format: int64
                flavorId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор шаблона конфигурации.
            description: Конфигурация размерности плоскости управления кластера и мастер-узлов.
        cloudru.containers.mk8s.v3.ControlPlaneUpgradeInfo:
            type: object
            properties:
                desiredVersion:
                    readOnly: true
                    example: v1.34.2
                    type: string
                    description: Версия Kubernetes, на которую выполняется обновление.
                phase:
                    readOnly: true
                    example: CONTROL_PLANE_UPGRADE_PHASE_RUNNING
                    enum:
                        - CONTROL_PLANE_UPGRADE_PHASE_RUNNING
                        - CONTROL_PLANE_UPGRADE_PHASE_ROLLBACK
                    type: string
                    description: |-
                        Стадия обновления.

                         Возможные значения:

                         * `CONTROL_PLANE_UPGRADE_PHASE_RUNNING` — обновление выполняется.
                         * `CONTROL_PLANE_UPGRADE_PHASE_ROLLBACK` — откат обновления.
                    format: enum
            description: Информация об обновлении плоскости управления.
        cloudru.containers.mk8s.v3.CoreDNS:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: |-
                        Опция подключения плагина.
                         По умолчанию плагин включен.
            description: Конфигурация плагина CoreDNS.
        cloudru.containers.mk8s.v3.CreateClusterAddonRequest:
            required:
                - clusterId
                - name
                - appVersion
                - resolveMode
            type: object
            properties:
                clusterId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: evocs
                    type: string
                    description: Машинное имя плагина.
                appVersion:
                    example: v0.0.6
                    type: string
                    description: Версия приложения в формате SemVer.
                addonConfiguration:
                    example: {}
                    type: string
                    description: |-
                        Пользовательская конфигурация плагина в JSON-формате согласно схеме в виде экранированной строки.
                         Например, `{\"config\": {\"logaas\": {\"logGroupId\": \"a1s8***sd7t\"}}}`.

                         Поддерживает переменные автоподстановки, заключенные в {{ }}:

                         * `{{clusterID}}` — уникальный идентификатор кластера.
                         * `{{clusterName}}` — программное имя кластера.
                         * `{{productInstanceID}}` — идентификатор экземпляра продукта.
                         * `{{nodeCIDR}}` — CIDR сети узлов.
                         * `{{serviceCIDR}}` — CIDR сервисной сети.

                         Если поле не указано, то переиспользуется последняя конфигурация.
                resolveMode:
                    example: RESOLVE_CONFLICTS_MODE_OVERWRITE
                    enum:
                        - RESOLVE_CONFLICTS_MODE_NONE
                        - RESOLVE_CONFLICTS_MODE_OVERWRITE
                        - RESOLVE_CONFLICTS_MODE_PRESERVE
                    type: string
                    description: |-
                        Режим разрешения конфликтов.

                         Возможные значения:

                         * `RESOLVE_CONFLICTS_MODE_NONE` — если пользователь ранее самостоятельно установил плагин в кластере, то существующие манифесты не перезапишутся.
                           Добавление плагина может завершиться неудачно.
                         * `RESOLVE_CONFLICTS_MODE_OVERWRITE` — если пользователь самостоятельно установил плагин в кластере или внес изменения в его конфигурацию, то все пользовательские изменения откатятся до рекомендуемых значений.
                         * `RESOLVE_CONFLICTS_MODE_PRESERVE` — выполнится сохранение пользовательских изменений при обновлении плагина.
                           Для операции добавления плагина значение неприменимо.
                    format: enum
        cloudru.containers.mk8s.v3.CreateClusterRequest:
            required:
                - name
                - projectId
                - controlPlaneConfiguration
                - networkConfiguration
                - identityConfiguration
            type: object
            properties:
                name:
                    example: cloudru-example-cluster
                    type: string
                    description: |-
                        Название кластера.
                         Может содержать буквы, цифры, дефис, подчеркивание.
                         Допустимое количество символов от 3 до 60.
                projectId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор проекта.
                controlPlaneConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ControlPlaneRequest'
                    description: Конфигурация плоскости управления кластера.
                networkConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NetworkConfigurationRequest'
                    description: Сетевая конфигурация кластера и плоскости управления.
                releaseChannel:
                    example: RELEASE_CHANNEL_STABLE
                    enum:
                        - RELEASE_CHANNEL_RAPID
                        - RELEASE_CHANNEL_REGULAR
                        - RELEASE_CHANNEL_STABLE
                    type: string
                    description: Релизный канал, на который подписан кластер.
                    format: enum
                loggingService:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.LoggingService'
                    description: Параметры логирования событий компонентов кластера.
                monitoringService:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.MonitoringService'
                    description: Параметры мониторинга компонентов кластера.
                auditService:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.AuditService'
                    description: Параметры аудит-логирования событий компонентов кластера.
                bootstrapManagedAddons:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.BootstrapManagedAddons'
                    description: |-
                        Конфигурация плагинов, которые будут установлены автоматически при создании кластера.
                         Плагины можно отключить, если вы планируете использовать сторонние решения или установить их позже.
                identityConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.IdentityConfiguration'
                    description: |-
                        Конфигурация сервисного аккаунта кластера, который используется для
                         доступа к Artifact Registry, доставке логов и метрик.
                keyManagementService:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.KeyManagementService'
                    description: Параметры шифрования ресурсов кластера.
            description: Создание нового кластера.
        cloudru.containers.mk8s.v3.CreateNodePoolRequest:
            required:
                - clusterId
                - name
                - scalePolicy
                - machineConfiguration
                - networkConfiguration
                - updateConfiguration
            type: object
            properties:
                clusterId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: cloudru-example-nodepool
                    type: string
                    description: |-
                        Название группы узлов. Должно быть уникальным.
                         Может содержать буквы, цифры, подчеркивание.
                         Допустимое количество символов от 4 до 60.
                scalePolicy:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ScalePolicy'
                    description: Политика масштабирования группы узлов.
                machineConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.MachineConfigurationRequest'
                    description: Параметры конфигурации виртуальной машины.
                networkConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodePoolNetworkConfigurationRequest'
                    description: Конфигурация сети группы узлов.
                updateConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodePoolUpdateConfiguration'
                    description: Политика обновления группы узлов.
                taints:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Taints'
                    description: |-
                        Список ограничений ([taints](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/)),
                         применяемых к узлам в группе.
                labels:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Labels'
                    description: |-
                        Набор меток ([labels](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/)), которые будут применены к узлам в группе.
                         Метки добавляются в дополнение к стандартным меткам, которые может устанавливать Kubernetes.
                         При возникновении конфликтов поведение неопределенно и может меняться в зависимости от версии Kubernetes.
                         Рекомендуется избегать их.
                remoteAccess:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.RemoteAccess'
                    description: Конфигурация удаленного доступа к виртуальной машине в группе.
                autoRepair:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.AutoRepair'
                    description: Параметры автоматического восстановления узлов.
            description: Создание новой группы узлов.
        cloudru.containers.mk8s.v3.Disk:
            type: object
            properties:
                typeName:
                    readOnly: true
                    example: SSD
                    type: string
                    description: Название типа диска.
                size:
                    readOnly: true
                    example: 40
                    type: integer
                    description: Размер подключенного диска в ГБ.
                    format: int32
            description: Конфигурация диска.
        cloudru.containers.mk8s.v3.DiskRequest:
            type: object
