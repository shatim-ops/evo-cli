            description: |-
                Набор меток ([labels](https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/)), которые будут применены к узлам в группе.
                 Метки добавляются в дополнение к стандартным меткам, которые может устанавливать Kubernetes.
                 При возникновении конфликтов поведение неопределенно и может меняться в зависимости от версии Kubernetes.
                 Рекомендуется избегать их.
        cloudru.containers.mk8s.v3.ListAddonReleasesResponse:
            type: object
            properties:
                releases:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.AddonRelease'
                    description: Список доступных версий плагина.
                nextPageToken:
                    example: token17d9f...01cf4bd36c
                    type: string
                    description: Токен следующей страницы.
            description: Список доступных версий плагина.
        cloudru.containers.mk8s.v3.ListAddonsResponse:
            type: object
            properties:
                addons:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Addon'
                    description: Список доступных плагинов.
                nextPageToken:
                    example: token17d9f...01cf4bd36c
                    type: string
                    description: Токен следующей страницы.
            description: Список доступных плагинов.
        cloudru.containers.mk8s.v3.ListClusterAddonsResponse:
            type: object
            properties:
                clusterAddons:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ClusterAddon'
                    description: Информация о плагинах.
                nextPageToken:
                    example: token17d9f...01cf4bd36c
                    type: string
                    description: Токен следующей страницы.
            description: Список плагинов кластера.
        cloudru.containers.mk8s.v3.ListClustersResponse:
            type: object
            properties:
                clusters:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Cluster'
                    description: Список кластеров.
                nextPageToken:
                    example: token17d9f...01cf4bd36c
                    type: string
                    description: Токен следующей страницы.
            description: Ответ со списком кластеров.
        cloudru.containers.mk8s.v3.ListNodePoolsResponse:
            type: object
            properties:
                nodePools:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodePool'
                    description: Список групп узлов.
                nextPageToken:
                    example: token17d9f...01cf4bd36c
                    type: string
                    description: Токен следующей страницы.
            description: Список групп узлов.
        cloudru.containers.mk8s.v3.ListNodesResponse:
            type: object
            properties:
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Node'
                    description: Список узлов в группе и информация по ним.
                nextPageToken:
                    example: token17d9f...01cf4bd36c
                    type: string
                    description: Токен следующей страницы.
            description: Список узлов.
        cloudru.containers.mk8s.v3.LoggingService:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    default: true
                    description: |-
                        Включение/выключение логирования событий компонентов кластера.
                         Возможные значения: true — логирование включено, false — логирование выключено.
                         По умолчанию логирование включено.
                         Если установлен параметр false, настройки лог-группы игнорируются.
                logGroupId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: |-
                        Идентификатор лог-группы.
                         Если не указывается, используется значение по умолчанию.
            description: Логирование событий компонентов кластера.
        cloudru.containers.mk8s.v3.MachineAddress:
            type: object
            properties:
                type:
                    readOnly: true
                    example: MACHINE_ADDRESS_TYPE_INTERNAL_IP
                    enum:
                        - MACHINE_ADDRESS_TYPE_INTERNAL_IP
                        - MACHINE_ADDRESS_TYPE_EXTERNAL_IP
                        - MACHINE_ADDRESS_TYPE_HOSTNAME
                        - MACHINE_ADDRESS_TYPE_INTERNAL_DNS
                        - MACHINE_ADDRESS_TYPE_EXTERNAL_DNS
                    type: string
                    description: |-
                        Тип адреса.

                         Возможные значения:

                         * `MACHINE_ADDRESS_TYPE_INTERNAL_IP` — внутренний IP-адрес.
                         * `MACHINE_ADDRESS_TYPE_EXTERNAL_IP` — внешний IP-адрес.
                         * `MACHINE_ADDRESS_TYPE_HOSTNAME` — сетевое имя узла.
                         * `MACHINE_ADDRESS_TYPE_INTERNAL_DNS` — внутреннее DNS-имя.
                         * `MACHINE_ADDRESS_TYPE_EXTERNAL_DNS` — внешнее DNS-имя.
                    format: enum
                address:
                    readOnly: true
                    example: 10.2.0.2
                    type: string
                    description: Значение адреса.
            description: Адрес узла.
        cloudru.containers.mk8s.v3.MachineConfiguration:
            type: object
            properties:
                disk:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Disk'
                    description: Конфигурация диска.
                flavor:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Flavor'
                    description: Шаблон конфигурации для виртуальной машины (ВМ).
            description: Описание инфраструктуры узлов кластера.
        cloudru.containers.mk8s.v3.MachineConfigurationRequest:
            required:
                - flavorId
            type: object
            properties:
                flavorId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор шаблона конфигурации.
                disk:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.DiskRequest'
                    description: Конфигурация диска.
            description: Конфигурация виртуальной машины.
        cloudru.containers.mk8s.v3.MachineDisk:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор диска у поставщика инфраструктуры.
                name:
                    readOnly: true
                    example: mk8s-worker-13c2183e-7454-4bf1-9019-de7f1e23e861-82682-root
                    type: string
                    description: Название диска.
                role:
                    readOnly: true
                    example: MACHINE_DISK_ROLE_ROOT
                    enum:
                        - MACHINE_DISK_ROLE_ROOT
                        - MACHINE_DISK_ROLE_PV
                        - MACHINE_DISK_ROLE_SECONDARY
                    type: string
                    description: |-
                        Роль диска.

                         Возможные значения:

                         * `MACHINE_DISK_ROLE_ROOT` — корневой диск узла.
                         * `MACHINE_DISK_ROLE_PV` — диск постоянного тома (PersistentVolume).
                         * `MACHINE_DISK_ROLE_SECONDARY` — дополнительный диск узла.
                    format: enum
            description: Диск, подключенный к виртуальной машине узла.
        cloudru.containers.mk8s.v3.MonitoringService:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    default: true
                    description: |-
                        Включение/выключение мониторинга компонентов кластера.
                         Возможные значения: true — мониторинг включен, false — мониторинг выключен.
                         По умолчанию мониторинг включен.
            description: Мониторинг компонентов кластера.
        cloudru.containers.mk8s.v3.NetworkConfiguration:
            type: object
            properties:
                servicesSubnetCidr:
                    readOnly: true
                    example: 10.96.0.0/12
                    type: string
                    description: Адрес подсети сервисов.
                podsSubnetCidr:
                    readOnly: true
                    example: 10.1.0.0/16
                    type: string
                    description: Адрес подсети подов.
                nodesSubnetCidr:
                    readOnly: true
                    example: 10.2.0.0/24
                    deprecated: true
                    type: string
                    description: Адрес подсети узлов плоскости управления.
                nodesSubnetId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    deprecated: true
                    type: string
                    description: Идентификатор подсети узлов плоскости управления.
                kubeApiInternet:
                    readOnly: true
                    example: true
                    type: boolean
                    description: Признак публикации kube-apiserver в интернет.
                cpEndpoints:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ControlPlaneEndpoint'
                    description: Адреса плоскости управления.
                vpcId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор VPC.
                privateVipSubnetId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор подсети, из которой выделен внутренний IP-адрес.
                magicRouterAnnouncement:
                    readOnly: true
                    example: true
                    type: boolean
                    description: Признак анонсирования внутреннего адреса балансировщаки нагрузки в Magic Router.
            description: Описание актуальной сетевой инфраструктуры кластера.
        cloudru.containers.mk8s.v3.NetworkConfigurationRequest:
            required:
                - networkPlugin
                - privateVipSubnetId
            type: object
            properties:
                servicesSubnetCidr:
                    example: 10.96.0.0/20
                    type: string
                    description: |-
                        Адрес подсети сервисов в формате RFC1918.
                         Не должен пересекаться с подовой подсетью или подсетью,
                         из которой будет выделен внутренний IP-адрес для балансировщика нагрузки плоскости управления.
                         Если не указано, то будет выбрана случайная подсеть из доступных с маской /20.
                podsSubnetCidr:
                    example: 10.1.0.0/16
                    type: string
                    description: |-
                        Адрес подсети подов в формате RFC1918.
                         Не должен пересекаться с подсетью сервисов или подсетью,
                         из которой будет выделен внутренний IP-адрес для балансировщика нагрузки плоскости управления.
                         Если не указано, то будет выбрана случайная подсеть из доступных с маской /16.
                kubeApiInternet:
                    example: true
                    type: boolean
                    description: Признак публикации kube-apiserver в интернет.
                networkPlugin:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NetworkPluginRequest'
                    description: Плагин CNI для обеспечения сетевой связности и сетевых политик в кластере.
                privateVipSubnetId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: |-
                        Идентификатор подсети, из которой будет выделен внутренний IP-адрес
                         для балансировщика нагрузки плоскости управления.
                magicRouterAnnouncement:
                    example: true
                    type: boolean
                    description: Опция включения анонса внутреннего адреса балансировщика нагрузки в Magic Router.
            description: Описание сетевой инфраструктуры кластера.
        cloudru.containers.mk8s.v3.NetworkPluginRequest:
            type: object
            properties:
                cilium:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Cilium'
                    description: Настройки для использования Cilium в качестве CNI-плагина.
                calico:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Calico'
                    description: Настройки для использования Calico в качестве CNI-плагина.
            description: Конфигурация CNI-плагина при создании кластера.
        cloudru.containers.mk8s.v3.Node:
            type: object
            properties:
                id:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    deprecated: true
                    type: string
                    description: |-
                        Идентификатор виртуальной машины, на которой работает узел.
                         Используйте `machine.id`.
                hostname:
                    readOnly: true
                    example: vm-00000000-0000-0000-0000-000000000000
                    deprecated: true
                    type: string
                    description: 'Название узла. Используйте `name`.'
                createdAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время создания узла.
                    format: date-time
                ipAddress:
                    readOnly: true
                    example: 10.2.0.2
                    deprecated: true
                    type: string
                    description: |-
                        IP-адрес узла.
                         Используйте `addresses` с типом `MACHINE_ADDRESS_TYPE_INTERNAL_IP`.
                status:
                    readOnly: true
                    deprecated: true
                    enum:
                        - OBJECT_STATUS_PENDING
                        - OBJECT_STATUS_PROVISIONING
                        - OBJECT_STATUS_RUNNING
                        - OBJECT_STATUS_RESUMING
                        - OBJECT_STATUS_DELETING
                        - OBJECT_STATUS_ERROR
                        - OBJECT_STATUS_SCALING_UP
                        - OBJECT_STATUS_SCALING_DOWN
                        - OBJECT_STATUS_STOPPING
                        - OBJECT_STATUS_STOPPED
                        - OBJECT_STATUS_SUSPENDING
                        - OBJECT_STATUS_SUSPENDED
                        - OBJECT_STATUS_UPGRADING
                        - OBJECT_STATUS_EDITING
                        - OBJECT_STATUS_ADDING
                        - OBJECT_STATUS_DELETED
                    type: string
                    description: 'Статус узла. Используйте `node_status`.'
                    format: enum
                vmName:
                    readOnly: true
                    example: mk8s-worker-13c2183e-7454-4bf1-9019-de7f1e23e861-82682
                    deprecated: true
                    type: string
                    description: 'Название виртуальной машины. Используйте `machine.name`.'
                updateAt:
                    readOnly: true
                    deprecated: true
                    type: string
                    description: 'Дата и время обновления узла. Используйте `updated_at`.'
                    format: date-time
                projectId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор проекта, к которому принадлежит узел.
                clusterId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера, к которому принадлежит узел.
                nodePoolId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор группы узлов, к которой принадлежит узел.
                zoneId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор зоны доступности, в которой размещен узел.
                name:
                    readOnly: true
                    example: vm-00000000-0000-0000-0000-000000000000
                    type: string
                    description: Название узла в Kubernetes.
                providerId:
                    readOnly: true
                    example: cloudru://00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор узла у поставщика инфраструктуры.
                kubernetesVersion:
                    readOnly: true
                    example: v1.34.1
                    type: string
                    description: Целевая версия Kubernetes.
                nodeInfo:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodeInfo'
                    description: Системная информация об узле.
                nodeStatus:
                    readOnly: true
                    example: NODE_STATUS_RUNNING
                    enum:
                        - NODE_STATUS_PENDING
                        - NODE_STATUS_PROVISIONING
                        - NODE_STATUS_PROVISIONED
                        - NODE_STATUS_RUNNING
                        - NODE_STATUS_DELETING
                        - NODE_STATUS_FAILED
                        - NODE_STATUS_UNKNOWN
                        - NODE_STATUS_SUSPENDED
                        - NODE_STATUS_SUSPENDING
                        - NODE_STATUS_RESUMING
                    type: string
                    description: |-
                        Статус жизненного цикла узла.

                         Возможные значения:

                         * `NODE_STATUS_PENDING` — ожидание создания машины узла.
                         * `NODE_STATUS_PROVISIONING` — машина узла создается.
                         * `NODE_STATUS_PROVISIONED` — машина узла создана, узел еще не добавлен в кластер.
                         * `NODE_STATUS_RUNNING` — узел работает в кластере.
                         * `NODE_STATUS_DELETING` — узел удаляется.
                         * `NODE_STATUS_FAILED` — узел не удалось создать или он вышел из строя.
                         * `NODE_STATUS_UNKNOWN` — статус узла неизвестен.
                         * `NODE_STATUS_SUSPENDED` — узел приостановлен.
                         * `NODE_STATUS_SUSPENDING` — узел приостанавливается.
                         * `NODE_STATUS_RESUMING` — работа узла возобновляется.
                    format: enum
                health:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodeHealth'
                    description: Сводное состояние здоровья узла.
                addresses:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.MachineAddress'
                    description: Адреса узла.
                machine:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.InfraMachine'
                    description: Инфраструктурная машина, на которой работает узел.
                updatedAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время последнего обновления данных об узле.
                    format: date-time
            description: Информация об узле в группе.
        cloudru.containers.mk8s.v3.NodeHealth:
            type: object
            properties:
                state:
                    readOnly: true
                    example: HEALTH_STATE_HEALTHY
                    enum:
                        - HEALTH_STATE_HEALTHY
                        - HEALTH_STATE_UNHEALTHY
                        - HEALTH_STATE_NOT_READY
                        - HEALTH_STATE_UNKNOWN
                    type: string
                    description: |-
                        Состояние здоровья.

                         Возможные значения:

                         * `HEALTH_STATE_HEALTHY` — узел работает и выполняет свою задачу.
                         * `HEALTH_STATE_UNHEALTHY` — узел должен работать, но свою задачу не выполняет.
                         * `HEALTH_STATE_NOT_READY` — узел еще не готов к работе или уже выведен из нее.
                         * `HEALTH_STATE_UNKNOWN` — данных о состоянии узла нет.
                    format: enum
                lastTransitionTime:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время последнего изменения состояния.
                    format: date-time
            description: Сводное состояние здоровья узла.
        cloudru.containers.mk8s.v3.NodeInfo:
            type: object
            properties:
                architecture:
                    readOnly: true
                    example: amd64
                    type: string
                    description: Архитектура операционной системы узла.
                containerRuntimeVersion:
                    readOnly: true
                    example: containerd://1.7.27
                    type: string
                    description: Название и версия Container Runtime.
                kernelVersion:
                    readOnly: true
                    example: 5.15.0-153-generic
                    type: string
                    description: Версия ядра операционной системы узла.
                operatingSystem:
                    readOnly: true
                    example: linux
                    type: string
                    description: Операционная система узла.
                osImage:
                    readOnly: true
                    example: Ubuntu 22.04.5 LTS
                    type: string
                    description: Образ операционной системы узла.
                kubeletVersion:
                    readOnly: true
                    example: v1.34.1
                    type: string
                    description: Фактическая версия kubelet на узле.
            description: Системная информация об узле, полученная от kubelet.
        cloudru.containers.mk8s.v3.NodePool:
            required:
                - clusterId
                - name
                - version
                - updateConfiguration
                - scalePolicy
            type: object
            properties:
                id:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор группы узлов.
                clusterId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера, в котором развернута группа узлов.
                zone:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Зона доступности, в которой размещены узлы группы.
                name:
                    example: cloudru-example-nodepool
                    type: string
                    description: Название группы узлов.
                version:
                    example: v1.34.1
                    type: string
                    description: Версия Kubernetes, которая используется на узлах группы.
                machineConfiguration:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.MachineConfiguration'
                    description: Описание инфраструктуры узлов группы.
                networkConfiguration:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodePoolNetworkConfiguration'
                    description: Конфигурация сети узлов.
                updateConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodePoolUpdateConfiguration'
                    description: Политика обновления группы узлов.
                scalePolicy:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ScalePolicy'
                    description: Политика масштабирования группы узлов в кластере.
                taints:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Taints'
                    description: Список ограничений (taints), применяемых к узлам в группе.
                labels:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Labels'
                    description: Набор меток (labels), применяемых к узлам в группе.
                remoteAccess:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.RemoteAccess'
                    description: Конфигурация удаленного доступа к виртуальной машине в группе.
                createdBy:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор пользователя, создавшего группу узлов.
                updatedBy:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор пользователя, обновившего группу узлов.
                createdAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время создания группы узлов.
                    format: date-time
                updatedAt:
                    readOnly: true
                    example: 2026-01-15T16:02:01.000000Z
                    type: string
                    description: Дата и время последнего обновления группы узлов.
                    format: date-time
                status:
                    readOnly: true
                    example: OBJECT_STATUS_RUNNING
                    enum:
                        - OBJECT_STATUS_PENDING
                        - OBJECT_STATUS_PROVISIONING
                        - OBJECT_STATUS_RUNNING
                        - OBJECT_STATUS_RESUMING
                        - OBJECT_STATUS_DELETING
                        - OBJECT_STATUS_ERROR
                        - OBJECT_STATUS_SCALING_UP
                        - OBJECT_STATUS_SCALING_DOWN
                        - OBJECT_STATUS_STOPPING
                        - OBJECT_STATUS_STOPPED
                        - OBJECT_STATUS_SUSPENDING
                        - OBJECT_STATUS_SUSPENDED
                        - OBJECT_STATUS_UPGRADING
                        - OBJECT_STATUS_EDITING
                        - OBJECT_STATUS_ADDING
                        - OBJECT_STATUS_DELETED
                    type: string
                    description: |-
                        Состояние группы узлов.

                         Возможные значения:

                         * `OBJECT_STATUS_PENDING` — группа узлов в ожидании подготовки к запуску.
                         * `OBJECT_STATUS_PROVISIONING` — подготовка группы узлов к запуску.
                         * `OBJECT_STATUS_RUNNING` — группа узлов запущена.
                         * `OBJECT_STATUS_RESUMING` — работа группы узлов возобновляется.
                         * `OBJECT_STATUS_DELETING` — группа узлов удаляется.
                         * `OBJECT_STATUS_ERROR` — операция с группой узлов закончилась ошибкой.
                         * `OBJECT_STATUS_SCALING_UP` — размер группы узлов увеличивается.
                         * `OBJECT_STATUS_SCALING_DOWN` — размер группы узлов уменьшается.
                         * `OBJECT_STATUS_STOPPING` — работа группы узлов останавливается.
                         * `OBJECT_STATUS_STOPPED` — работа группы узлов остановлена.
                         * `OBJECT_STATUS_SUSPENDING` — работа группы узлов приостанавливается из-за отсутствия средств.
                         * `OBJECT_STATUS_SUSPENDED` — работа группы узлов приостановлена из-за отсутствия средств.
                         * `OBJECT_STATUS_UPGRADING` — версия группы узлов обновляется.
                         * `OBJECT_STATUS_EDITING` — параметры группы узлов редактируются.
                    format: enum
                versionUpgrade:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.VersionUpgrade'
                    description: Информация о доступных версиях Kubernetes для обновления группы узлов.
                upgradeInfo:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.UpgradeInfo'
                    description: Информация о процессе обновления группы узлов.
                autoRepair:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.AutoRepair'
                    description: Параметры автоматического восстановления узлов.
            description: Информация о группе узлов.
        cloudru.containers.mk8s.v3.NodePoolNetworkConfiguration:
            type: object
            properties:
                nodesSubnetCidr:
                    readOnly: true
                    example: 10.2.0.0/16
                    type: string
                    description: Адрес сети узлов группы.
                nodesSubnetId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор сети узлов группы.
                securityGroupId:
                    readOnly: true
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор группы безопасности.
            description: Описание актуальной сетевой инфраструктуры группы узлов.
        cloudru.containers.mk8s.v3.NodePoolNetworkConfigurationRequest:
            required:
                - nodesSubnetId
            type: object
            properties:
                nodesSubnetId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: |-
                        Идентификатор существующей сети узлов.
                         Не должен пересекаться с сетью сервисов или сетью подов кластера.
                securityGroupId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор группы безопасности.
            description: Описание желаемой сетевой инфраструктуры группы узлов.
        cloudru.containers.mk8s.v3.NodePoolUpdateConfiguration:
            required:
                - strategy
            type: object
            properties:
                strategy:
                    example: NODE_POOL_UPDATE_STRATEGY_ROLLING_UPDATE
                    enum:
                        - NODE_POOL_UPDATE_STRATEGY_ROLLING_UPDATE
                    type: string
                    description: |-
                        Стратегия обновления.

                         Возможные значения:

                         * `NODE_POOL_UPDATE_STRATEGY_ROLLING_UPDATE` — политика обновления группы узлов путем пересоздания машин.
                    format: enum
                rollingUpdatePolicy:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.RollingUpdatePolicy'
                    description: Параметры политики обновления RollingUpdate.
            description: Конфигурация обновления группы узлов.
        cloudru.containers.mk8s.v3.NodePoolsInfo:
            type: object
            properties:
                count:
                    readOnly: true
                    example: 1
                    type: integer
                    description: Количество групп узлов.
                    format: int32
                cpu:
                    readOnly: true
                    example: 2
                    type: integer
                    description: Количество ядер процессора виртуальных машин.
                    format: int32
                ram:
                    readOnly: true
                    example: 4
                    type: integer
                    description: Оперативная память виртуальных машин в ГБ.
                    format: int32
                diskSize:
                    readOnly: true
                    example: 40
                    type: integer
                    description: Размер подключаемых дисков в ГБ.
                    format: int32
                gpu:
                    readOnly: true
                    example: 0
                    type: integer
                    description: Количество графических процессоров.
                    format: int32
            description: Информация о группах узлов.
        cloudru.containers.mk8s.v3.PersistentDiskCSIDriver:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: |-
                        Опция подключения плагина
                         По умолчанию плагин включен.
            description: |-
                Конфигурация плагина CSI Driver для работы
                 с постоянными томами для хранения данных.
        cloudru.containers.mk8s.v3.ProductConfiguration:
            type: object
            properties:
                channels:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ReleaseChannelConfiguration'
                    description: Список конфигураций релизных каналов.
                zones:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.AvailabilityZoneConfiguration'
                    description: Список конфигураций зон доступности.
                flavors:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.FlavorConfiguration'
                    description: Список конфигураций шаблонов виртуальной машины.
                defaultZone:
                    readOnly: true
                    example: ru.AZ-2
                    type: string
                    description: Зона доступности по умолчанию, которая будет выбрана при создании кластера, если не указано иное.
                defaultChannel:
                    readOnly: true
                    example: RELEASE_CHANNEL_STABLE
                    enum:
                        - RELEASE_CHANNEL_RAPID
                        - RELEASE_CHANNEL_REGULAR
                        - RELEASE_CHANNEL_STABLE
                    type: string
                    description: Релизный канал по умолчанию.
                    format: enum
                defaultDiskType:
                    readOnly: true
                    example: SSD
                    type: string
                    description: Название типа диска по умолчанию.
                diskTypes:
                    readOnly: true
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.DiskTypeConfiguration'
                    description: Список конфигураций типов дисков.
            description: Конфигурация продукта Managed Kubernetes.
        cloudru.containers.mk8s.v3.ReleaseChannelConfiguration:
            type: object
            properties:
                channel:
                    readOnly: true
                    example: RELEASE_CHANNEL_STABLE
                    enum:
                        - RELEASE_CHANNEL_RAPID
                        - RELEASE_CHANNEL_REGULAR
                        - RELEASE_CHANNEL_STABLE
                    type: string
                    description: Релизный канал версии Kubernetes.
                    format: enum
                availableVersions:
                    readOnly: true
                    example: [v1.34.1, v1.34.2]
                    type: array
                    items:
                        type: string
                    description: Список доступных версий Kubernetes в релизном канале.
            description: Конфигурация релизных каналов.
        cloudru.containers.mk8s.v3.RemoteAccess:
            required:
                - sshKeyId
                - username
            type: object
            properties:
                sshKeyId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор SSH-ключа из сервиса "SSH-ключи".
                username:
                    example: cloudru
                    type: string
                    description: Имя пользователя.
            description: Конфигурация удаленного доступа к виртуальной машине в группе.
        cloudru.containers.mk8s.v3.Requirements:
            type: object
            properties:
                kubeVersions:
                    readOnly: true
                    example:
                    type: string
                    description: Диапазон поддерживаемых версий Kubernetes в формате semver.
                readyWorkers:
                    readOnly: true
                    example: 1
                    type: integer
                    description: Минимальное количество доступных рабочих узлов в кластере.
                    format: int32
            description: Требования к кластеру для установки плагина.
        cloudru.containers.mk8s.v3.ResumeClusterRequest:
            required:
                - clusterId
            type: object
            properties:
                clusterId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
            description: Запрос на возобновление работы кластера.
        cloudru.containers.mk8s.v3.RollingUpdatePolicy:
            type: object
            properties:
                maxSurge:
                    example: 25
                    type: integer
                    description: |-
                        Максимальное количество дополнительных узлов в процентах от общего числа узлов в группе,
                         которые могут быть добавлены в группу временно при обновлении.
                    format: int32
                maxUnavailable:
                    example: 25
                    type: integer
                    description: |-
                        Максимальное количество одновременно недоступных узлов
                         при обновлении в процентах от общего числа узлов в группе.
                    format: int32
            description: |-
                Параметры политики обновления RollingUpdate.
                 (maxUnavailable + maxSurge) определяет уровень параллелизма (количество обновляемых узлов одновременно).
        cloudru.containers.mk8s.v3.ScalePolicy:
            type: object
            properties:
                fixedScale:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.FixedScale'
                    description: Фиксированное число узлов.
                autoScale:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.AutoScale'
                    description: Автоматически масштабируемое число узлов.
            description: Политика масштабирования группы узлов в кластере.
        cloudru.containers.mk8s.v3.StopClusterRequest:
            required:
                - clusterId
            type: object
            properties:
                clusterId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
            description: Запрос на приостановку кластера.
        cloudru.containers.mk8s.v3.Taint:
            required:
                - key
                - value
            type: object
            properties:
                key:
                    example: cloudru_taint_key
                    type: string
                    description: Ключ.
                value:
                    example: cloudru_taint_value
                    type: string
                    description: Значение.
                effect:
                    example: EFFECT_NO_EXECUTE
                    enum:
                        - EFFECT_NO_SCHEDULE
                        - EFFECT_PREFER_NO_SCHEDULE
                        - EFFECT_NO_EXECUTE
                    type: string
                    description: |-
                        Применяемый эффект.

                         Возможные значения:

                         * `EFFECT_NO_EXECUTE` — запрещается планирование новых подов без соответствующих tolerations на узлах группы. Запущенные поды перемещаются на узлы других групп.
                         * `EFFECT_NO_SCHEDULE` — запрещается планирование новых подов без соответствующих tolerations на узлах группы. Запущенные поды продолжат работу.
                         * `EFFECT_PREFER_NO_SCHEDULE` — планирование подов без соответствующих tolerations на узлах в группе разрешается только, если на узлах других групп нет свободных ресурсов.
                    format: enum
            description: Ограничение, накладываемое на узел.
        cloudru.containers.mk8s.v3.Taints:
            required:
                - taints
            type: object
            properties:
                taints:
                    type: array
                    items:
                        $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Taint'
                    description: Список ограничений (taints), применяемых к узлам в группе.
            description: Список ограничений ([taints](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/)), применяемых к узлам в группе.
        cloudru.containers.mk8s.v3.UpdateClusterAddonRequest:
            required:
                - clusterAddonId
            type: object
            properties:
                clusterAddonId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор плагина.
                appVersion:
                    example: v0.0.7
                    type: string
                    description: Версия приложения в формате SemVer, на которую нужно обновиться.
                addonConfiguration:
                    example: {}
                    type: string
                    description: |-
                        Пользовательская конфигурация плагина в JSON-формате согласно схеме в виде экранированной строки.
                         Например, `{\"config\": {\"logaas\": {\"logGroupId\": \"a1s8***sd7t\"}}}`.

                         Поддерживает переменные автоподстановки, заключенные в {{ }}:

                         * `{{clusterID}}` — уникальный идентификатор кластера.
                         * `{{clusterName}}` — программное имя кластера.
                         * `{{productInstanceID}}` — идентификатор экземпляра продукта.
                         * `{{nodeCIDR}}` — CIDR сети узлов.
                         * `{{serviceCIDR}}` — CIDR сервисной сети.

                         Если поле не указано, то переиспользуется последняя конфигурация.
                resolveMode:
                    example: RESOLVE_CONFLICTS_MODE_OVERWRITE
                    enum:
                        - RESOLVE_CONFLICTS_MODE_NONE
                        - RESOLVE_CONFLICTS_MODE_OVERWRITE
                        - RESOLVE_CONFLICTS_MODE_PRESERVE
                    type: string
                    description: |-
                        Режим разрешения конфликтов.

                         Возможные значения:

                         * `RESOLVE_CONFLICTS_MODE_NONE` — если пользователь ранее самостоятельно установил плагин в кластере, то существующие манифесты не перезапишутся.
                           Добавление плагина может завершиться неудачно.
                         * `RESOLVE_CONFLICTS_MODE_OVERWRITE` — если пользователь самостоятельно установил плагин в кластере или внес изменения в его конфигурацию, то все пользовательские изменения откатятся до рекомендуемых значений.
                         * `RESOLVE_CONFLICTS_MODE_PRESERVE` — выполнится сохранение пользовательских изменений при обновлении плагина.
                           Для операции добавления плагина значение неприменимо.
                    format: enum
            description: Обновление плагина на новую версию или применение новой конфигурации.
        cloudru.containers.mk8s.v3.UpdateClusterRequest:
            required:
                - clusterId
            type: object
            properties:
                clusterId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                name:
                    example: cloudru-example-cluster
                    type: string
                    description: |-
                        Название кластера.
                         Может содержать буквы, цифры, дефис, подчеркивание.
                         Допустимое количество символов от 3 до 60.
                sizingConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ControlPlaneSizingConfigurationRequest'
                    description: Конфигурация размерности плоскости управления кластера и мастер-узлов.
                releaseChannel:
                    example: RELEASE_CHANNEL_STABLE
                    enum:
                        - RELEASE_CHANNEL_RAPID
                        - RELEASE_CHANNEL_REGULAR
                        - RELEASE_CHANNEL_STABLE
                    type: string
                    description: Релизный канал, на который подписан кластер.
                    format: enum
                magicRouterAnnouncement:
                    example: true
                    type: boolean
                    description: Опция включения анонса внутреннего адреса балансировщика нагрузки в Magic Router.
            description: Запрос на редактирование существующего кластера.
        cloudru.containers.mk8s.v3.UpdateNodePoolRequest:
            required:
                - nodePoolId
            type: object
            properties:
                nodePoolId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор группы узлов.
                name:
                    example: cloudru-example-nodepool
                    type: string
                    description: Название группы узлов.
                scalePolicy:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.ScalePolicy'
                    description: Политика масштабирования группы узлов.
                updateConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.NodePoolUpdateConfiguration'
                    description: Политика обновления группы узлов.
                machineConfiguration:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.MachineConfigurationRequest'
                    description: Параметры конфигурации рабочих узлов в группе, например vCPU, RAM и размер диска.
                taints:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Taints'
                    description: |-
                        Список ограничений (taints), которые будут применены к узлам в группе.
                         Если объект создан, но не содержит данных, то все имеющиеся ограничения (taints) будут удалены.
                labels:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.Labels'
                    description: |-
                        Набор меток (labels), которые будут применены к узлам в группе.
                         Если объект создан, но не содержит данных, то все имеющиеся метки (labels) будут удалены.
                autoRepair:
                    allOf:
                        - $ref: '#/components/schemas/cloudru.containers.mk8s.v3.AutoRepair'
                    description: Параметры автоматического восстановления узлов.
            description: Редактирование группы узлов.
        cloudru.containers.mk8s.v3.UpgradeControlPlaneRequest:
            required:
                - clusterId
            type: object
            properties:
                clusterId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор кластера.
                version:
                    example: v1.34.2
                    type: string
                    description: |-
                        Версия Kubernetes, на которую выполняется обновление.

                         Пользователь может указать определенную версию или специальную метку:

                         - "latest": выбор наиболее актуальной версии Kubernetes.
                         - "1.X": выбор наивысшей патчевой версии среди 1.X версий.
                         - "1.X.Y": выбор конкретной версии Kubernetes.

                         Если версия не указана, то будет выполнено обновление
                         системных компонентов платформы Managed Kubernetes в кластере без обновления версии Kubernetes.
            description: Запрос на обновление версии Kubernetes и компонентов плоскости управления кластера.
        cloudru.containers.mk8s.v3.UpgradeInfo:
            type: object
            properties:
                desiredVersion:
                    readOnly: true
                    example: v1.34.2
                    type: string
                    description: |-
                        Версия Kubernetes, на которую выполняется обновление.
                         Если версия не указана, то выполняется обновление системных компонентов
                         платформы Managed Kubernetes в группе узлов без обновления версии Kubernetes.
                phase:
                    readOnly: true
                    example: NODE_POOL_UPGRADE_PHASE_RUNNING
                    enum:
                        - NODE_POOL_UPGRADE_PHASE_RUNNING
                        - NODE_POOL_UPGRADE_PHASE_CANCELLED
                        - NODE_POOL_UPGRADE_PHASE_ROLLBACK
                    type: string
                    description: |-
                        Стадия обновления.

                         Возможные значения:

                         * `NODE_POOL_UPGRADE_PHASE_RUNNING` — обновление выполняется.
                         * `NODE_POOL_UPGRADE_PHASE_CANCELLED` — обновление отменено.
                         * `NODE_POOL_UPGRADE_PHASE_ROLLBACK` — откат обновления.
                    format: enum
            description: Информация об обновлении.
        cloudru.containers.mk8s.v3.UpgradeNodePoolRequest:
            required:
                - nodePoolId
            type: object
            properties:
                nodePoolId:
                    example: 00000000-0000-0000-0000-000000000000
                    type: string
                    description: Идентификатор группы узлов.
                version:
                    example: v1.34.2
                    type: string
                    description: |-
                        Версия Kubernetes, на которую выполняется обновление.

                         Пользователь может указать определенную версию или специальную метку:

                         - "latest": выбор наиболее актуальной версии Kubernetes.
                         - "1.X": выбор наивысшей патчевой версии среди 1.X версий.
                         - "1.X.Y": выбор конкретной версии Kubernetes.

                         Если версия не указана, то будет выполнено обновление
                         системных компонентов платформы Managed Kubernetes в группе узлов без обновления версии Kubernetes.
            description: Обновление группы узлов.
        cloudru.containers.mk8s.v3.VersionUpgrade:
            type: object
            properties:
                availableVersions:
                    readOnly: true
                    example: [v1.34.2]
                    type: array
                    items:
                        type: string
                    description: |-
                        Список доступных версий Kubernetes для обновления кластера.
                         Версии отсортированы в порядке убывания,
                         начиная с самой старшей версии.
                upgradeAvailable:
                    readOnly: true
                    example: true
                    type: boolean
                    description: Признак доступности новой версии Kubernetes.
            description: Информация о доступных версиях Kubernetes для обновления кластера.
        cloudru.operation.Operation:
            type: object
            properties:
                id:
                    readOnly: true
                    type: string
                    description: Идентификатор операции.
                resourceName:
                    readOnly: true
                    type: string
                    description: |-
                        Информация о ресурсе, над которым выполняется операция.
                         Строится следующим образом: urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT.
                         Пример: urn:cloud:mk8s::54295782-7aef-43e6-b33b-c9735938677a:cluster.
                resourceId:
                    readOnly: true
                    type: string
                    description: |-
                        Уникальный идентификатор ресурса, над которым выполняется операция.
                         Пример: 54295782-7aef-43e6-b33b-c9735938677a.
                createdAt:
                    readOnly: true
                    type: string
                    description: Дата и время создания операции.
                    format: date-time
                updatedAt:
                    readOnly: true
                    type: string
                    description: Дата и время последнего изменения операции.
                    format: date-time
                done:
                    readOnly: true
                    type: boolean
                    description: |-
                        Признак завершенности операции.
                         Если значение `false`, то операция в процессе выполнения.
                         Если значение `true`, то операция завершена и поле `error` может быть заполнено.
                description:
                    readOnly: true
                    type: string
                    description: Описание операции. От 0 до 255 символов.
                error:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/google.rpc.Status'
                    description: Результат операции в случае ошибки.
        google.protobuf.Any:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        google.rpc.Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/google.protobuf.Any'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
