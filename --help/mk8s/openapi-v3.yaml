                    type: integer
                    description: Количество ядер процессора виртуальной машины.
                    format: int32
                ram:
                    readOnly: true
                    example: 4
                    type: integer
                    description: Оперативная память виртуальной машины в ГБ.
                    format: int32
                oversubscription:
                    readOnly: true
                    example: 1:10
                    type: string
                    description: Коэффициент переподписки, например "1:3".
