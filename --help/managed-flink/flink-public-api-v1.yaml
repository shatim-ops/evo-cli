swagger: '2.0'
info:
  title: Cloud.ru Managed Flink
  description: '[Документация Managed Flink](https://cloud.ru/docs/managed-flink/ug/index.html)'
  version: "1.0"
servers:
  - url: https://dataplatform.api.cloud.ru
tags:
  - name: FlinkService
  - name: VersionService
  - name: FlavorService
  - name: FlinkJobService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/flinkFlavors:
    get:
      summary: Список флейворов
      description: Возвращает список флейворов по заданным параметрам.
      operationId: FlavorService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFlavorsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.


            Если значение больше [page_size], сервис возвращает
            [next_page_token], который используется в

            [ListFlavorsResponse]. Значение [page_size] по умолчанию: 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами.


            Чтобы получить результаты следующей страницы для [page_token],
            используем значение

            [ListFlavorsResponse.next_page_token], полученное из прошлого
            запроса.
          in: query
          required: false
          type: string
      tags:
        - FlavorService
  /v1/flinks:
    get:
      summary: Список объектов Flink
      description: Возвращает список объектов Flink по заданным параметрам.
      operationId: FlinkService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruDataplatformFlinkV1ListFlinksResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: clusterId
          description: Идентификатор кластера.
          in: query
          required: true
          type: string
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListFlinksResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListFlinksResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
        - name: filter
          description: Фильтр для списка кластеров.
          in: query
          required: false
          type: string
      tags:
        - FlinkService
    post:
      summary: Создание объекта Flink
      description: |-
        Запускает операцию по созданию объекта Flink.
        Возвращает объект Operation.
      operationId: FlinkService_Create
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruOperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: Описание параметров запроса для создания Flink.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateFlinkRequest'
      tags:
        - FlinkService
  /v1/flinks/{flinkId}:
    get:
      summary: Получение информации об объекте Flink
      description: Возвращает объект Flink по заданному идентификатору.
      operationId: FlinkService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Flink'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
      tags:
        - FlinkService
    delete:
      summary: Удаление объекта Flink
      description: |-
        Запускает процесс удаления объекта Flink по заданному идентификатору.
        Возвращает объект Operation.
      operationId: FlinkService_Delete
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruOperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
      tags:
        - FlinkService
    put:
      summary: Обновление объекта Flink
      description: |-
        Запускает операцию по обновлению объекта Flink.
        Возвращает объект Operation.
      operationId: FlinkService_Update
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruOperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FlinkServiceUpdateBody'
      tags:
        - FlinkService
  /v1/flinks/{flinkId}/jobs:
    get:
      summary: Список задач Flink
      description: Возвращает список задач Flink по заданным параметрам.
      operationId: FlinkJobService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruDataplatformFlinkV1ListFlinkJobsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListFlinkJobsResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListFlinkJobsResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
        - name: filter
          description: Фильтр для списка кластеров.
          in: query
          required: false
          type: string
      tags:
        - FlinkJobService
    post:
      summary: Создание задачи Flink
      description: |-
        Запускает операцию по созданию объекта FlinkJob.
        Возвращает объект Operation.
      operationId: FlinkJobService_Create
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruOperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1FlinkJobServiceCreateBody'
      tags:
        - FlinkJobService
  /v1/flinks/{flinkId}/jobs/{flinkJobId}:
    get:
      summary: Получение информации о задаче Flink
      description: Возвращает объект FlinkJob по заданному идентификатору.
      operationId: FlinkJobService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1FlinkJob'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: flinkJobId
          description: Идентификатор FlinkJob.
          in: path
          required: true
          type: string
      tags:
        - FlinkJobService
    delete:
      summary: Удаление задачи Flink
      description: |-
        Запускает процесс удаления объекта FlinkJob по заданному идентификатору.
        Возвращает объект Operation.
      operationId: FlinkJobService_Delete
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruOperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: flinkJobId
          description: Идентификатор FlinkJob.
          in: path
          required: true
          type: string
      tags:
        - FlinkJobService
  /v1/flinks/{flinkId}/jobs/{flinkJobId}/operations:
    get:
      summary: Получение списка объектов Operation с задачами Flink
      description: >-
        Этот метод позволяет получить список FlinkJob операций. Метод
        возвращает список объектов Operation.
      operationId: FlinkJobService_ListOperations
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFlinkJobOperationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: flinkJobId
          description: Идентификатор FlinkJob.
          in: path
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListFlinkJobOperationsRequest]. Значение [page_size]
            по умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListFlinkJobOperationsResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - FlinkJobService
  /v1/flinks/{flinkId}/operations:
    get:
      summary: Получение списка объектов Operation
      description: Возвращает список объектов Operation по заданным параметрам.
      operationId: FlinkService_ListOperations
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFlinkOperationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListFlinkOperationsResponse]. Значение [page_size]
            по умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListFlinkOperationsResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - FlinkService
  /v1/flinks/{flinkId}/resume:
    post:
      summary: Возобновление работы объекта Flink
      description: Запускает приостановленный объект Flink.
      operationId: FlinkService_Resume
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruOperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FlinkServiceResumeBody'
      tags:
        - FlinkService
  /v1/flinks/{flinkId}/stop:
    post:
      summary: Приостановка объекта Flink
      description: Останавливает работающий объект Flink.
      operationId: FlinkService_Stop
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruOperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: flinkId
          description: Идентификатор Flink.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FlinkServiceStopBody'
      tags:
        - FlinkService
  /v1/versions:
    get:
      summary: Список версий
      description: Возвращает список версий по заданным параметрам.
      operationId: VersionService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListVersionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListVersionsRequest]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token] используем значение
            [ListVersionsRequest.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - VersionService
definitions:
  FlinkServiceResumeBody:
    type: object
    description: Описание параметров для возобновления объекта Flink.
  FlinkServiceStopBody:
    type: object
    description: Описание параметров для приостановки объекта Flink.
  FlinkServiceUpdateBody:
    type: object
    properties:
      name:
        type: string
        description: Название Flink.
      description:
        type: string
        description: Описание Flink.
      enablePublicHost:
        type: boolean
    description: Описание параметров запроса для обновления Flink.
  cloudruDataplatformFlinkV1ListFlinkJobsResponse:
    type: object
    properties:
      flinkJobs:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1FlinkJob'
        description: Список FlinkJob.
      nextPageToken:
        type: string
        description: Токен следующей страницы с результатами.
    description: Описание параметров ответа при получении ответа на запрос списка FlinkJob.
  cloudruDataplatformFlinkV1ListFlinksResponse:
    type: object
    properties:
      flinks:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Flink'
        description: Список Flink.
      nextPageToken:
        type: string
        description: Токен следующей страницы с результатами.
    description: Описание параметров ответа при получении ответа на запрос списка Flink.
  cloudruOperationOperation:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор операции.
      resourceName:
        type: string
        title: >-
          Информация о ресурсе, над которым производится операция.

          Строится следующим образом:
          urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT.

          Пример:
          urn:cloud:dataplatform::54295782-7aef-43e6-b33b-c9735938677a:metastore_server
        readOnly: true
      resourceId:
        type: string
        title: |-
          Уникальный идентификатор ресурса, над которым производится операция.
          Пример: 54295782-7aef-43e6-b33b-c9735938677a
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: Время создания операции.
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        description: Время последнего изменения операции.
        readOnly: true
      done:
        type: boolean
        description: >-
          Завершенность операции.

          Если значение `false`, то операция в процессе выполнения.

          Если значение `true`, то операция завершена и поле `error` может быть
          заполнено.
        readOnly: true
      description:
        type: string
        description: Описание операции. От 0 до 255 символов.
        readOnly: true
      error:
        $ref: '#/definitions/rpcStatus'
        description: Результат операции в случае ошибки.
        readOnly: true
    required:
      - id
  protobufAny:
    type: object
    properties:
      '@type':
        type: string

    additionalProperties: {}
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: |-
          The status code, which should be an enum value of
          [google.rpc.Code][google.rpc.Code].
      message:
        type: string

      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1CreateFlinkRequest:
    type: object
    properties:
      clusterId:
        type: string
        description: Идентификатор кластера.
      projectId:
        type: string
        description: Идентификатор проекта.
      name:
        type: string
        description: Название Flink.
      description:
        type: string
        description: Описание Flink.
      logGroupId:
        type: string
        description: Идентификатор группы логирования.
      flinkConf:
        $ref: '#/definitions/v1FlinkConfiguration'
        title: Конфигурация Flink
      secretId:
        type: string
        title: ID модуля с секретами
      env:
        type: object
        additionalProperties:
          type: string
        description: Переменные окружения.
      s3Conf:
        $ref: '#/definitions/v1S3Conf'
        title: Конфигурация S3
      customImageUri:
        type: string
        title: URL кастомного Flink
      flinkVersion:
        type: string
        description: Версии Flink.
      networkConfiguration:
        $ref: '#/definitions/v1NetworkConfigurationRequest'
        description: Конфигурация сети.
      resourcesConfiguration:
        $ref: '#/definitions/v1ResourcesConfiguration'
        description: Конфигурация ресурсов.
      user:
        $ref: '#/definitions/v1User'
        description: Пользователь Spark для доступа к Spark History.
    description: Описание параметров запроса для создания Flink.
    required:
      - clusterId
      - projectId
      - name
      - logGroupId
      - flinkConf
      - s3Conf
      - flinkVersion
      - networkConfiguration
      - resourcesConfiguration
      - user
  v1Flavor:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор флейвора.
        readOnly: true
      cpu:
        type: string
        format: int64
        description: Количество ядер CPU для данного флейвора.
        readOnly: true
      memory:
        type: string
        format: int64
        description: Объем памяти для данного флейвора.
        readOnly: true
    description: Флейвор.
  v1Flink:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор Flink.
      clusterId:
        type: string
        description: Идентификатор кластера.
      projectId:
        type: string
        description: Идентификатор проекта.
      name:
        type: string
        description: Название Flink.
      description:
        type: string
        description: Описание Flink.
      secretId:
        type: string
        title: ID модуля с секретами
      status:
        $ref: '#/definitions/v1FlinkStatus'
        description: Текущий статус состояния Flink.
        readOnly: true
      logGroupId:
        type: string
        description: Идентификатор группы логирования.
      flinkConfiguration:
        $ref: '#/definitions/v1FlinkConfiguration'
        title: Конфигурация Flink
      env:
        type: object
        additionalProperties:
          type: string
        description: Переменные окружения.
      s3Conf:
        $ref: '#/definitions/v1S3Conf'
        title: Конфигурация S3
      customImageUri:
        type: string
        title: URL кастомного flink
      flinkVersion:
        $ref: '#/definitions/v1FlinkVersion'
        description: Версия Flink.
      createdBy:
        type: string
        description: Идентификатор пользователя, создавшего Flink.
        readOnly: true
      updatedBy:
        type: string
        description: Идентификатор пользователя, обновившего Flink последним.
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: Время создания Flink.
        readOnly: true
      updatedAt:
