swagger: '2.0'
info:
  title: Cloud.ru Managed Airflow
  description: '[Документация Managed Airflow](https://cloud.ru/docs/managed-airflow/ug/index.html)'
  version: "1.0"
servers:
  - url: https://dataplatform.api.cloud.ru
tags:
  - name: FlavorService
  - name: AirflowService
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/airflowFlavors:
    get:
      summary: Список флейворов
      description: Возвращает список флейворов по заданным параметрам.
      operationId: FlavorService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFlavorsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListFlavorsResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token], используйте значение
            [ListFlavorsResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - FlavorService
  /v1/airflows:
    get:
      summary: Список объектов Airflow
      description: Возвращает список объектов Airflow по заданым параметрам.
      operationId: AirflowService_List
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudrudataplatformairflowv1ListAirflowResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: clusterId
          description: Идентификатор кластера.
          in: query
          required: true
          type: string
        - name: projectId
          description: Идентификатор проекта.
          in: query
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListAirflowResponse]. Значение [page_size] по
            умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token], используйте значение
            [ListAirflowResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
        - name: filter
          description: |-
            Фильтр для фильтриции списка кластеров.
            Фильтрацию можно произвести по полю [Airflow.name].
            Пример: name=some-airflow-name.
          in: query
          required: false
          type: string
      tags:
        - AirflowService
    post:
      summary: Создание объекта Airflow
      description: |-
        Запускает операцию по созданию объекта Airflow.
        Возвращает объект Operation.
      operationId: AirflowService_Create
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: Описание параметров запроса для создания Airflow.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateAirflowRequest'
      tags:
        - AirflowService
  /v1/airflows/{airflowId}:
    get:
      summary: Получение объекта Airflow
      description: Возвращает объект Airflow по заданному идентификатору.
      operationId: AirflowService_Get
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1Airflow'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: airflowId
          description: Идентификатор Airflow.
          in: path
          required: true
          type: string
      tags:
        - AirflowService
    delete:
      summary: Удаление объекта Airflow
      description: |-
        Запускает процесс удаления объекта Airflow по заданному идентификатору.
        Возвращает объект Operation.
      operationId: AirflowService_Delete
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: airflowId
          description: Идентификатор Airflow.
          in: path
          required: true
          type: string
      tags:
        - AirflowService
    put:
      summary: Обновление объекта Airflow
      description: |-
        Запускает операцию по обновлению объекта Airflow.
        Возвращает объект Operation.
      operationId: AirflowService_Update
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cloudruoperationOperation'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: airflowId
          description: Идентификатор Airflow.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/cloudrudataplatformairflowv1AirflowServiceUpdateBody'
      tags:
        - AirflowService
  /v1/airflows/{airflowId}/operations:
    get:
      summary: Список объектов Operation
      description: Возвращает список объектов Operation по заданым параметрам.
      operationId: AirflowService_ListOperations
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAirflowOperationsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: airflowId
          description: Идентификатор Airflow.
          in: path
          required: true
          type: string
        - name: pageSize
          description: >-
            Максимальное количество результатов на странице ответа.

            Если значение больше [page_size], сервис возвращает
            [next_page_token], который

            используется в [ListAirflowOperationsResponse]. Значение [page_size]
            по умолчанию 1000.
          in: query
          required: false
          type: string
          format: int64
        - name: pageToken
          description: >-
            Токен запрашиваемой страницы с результатами. Чтобы получить
            результаты следующей

            страницы для [page_token], используйте значение
            [ListAirflowOperationsResponse.next_page_token],

            полученное из прошлого запроса.
          in: query
          required: false
          type: string
      tags:
        - AirflowService
definitions:
  cloudrudataplatformairflowv1AirflowServiceUpdateBody:
    type: object
    properties:
      name:
        type: string
        description: Название Airflow.
      description:
        type: string
        description: Описание Airflow.
      enableExternalHost:
        type: boolean
        description: >-
          Флаг, указывающий на необходимость публичного IP-адреса для доступа из
          внешней сети.
    description: Описание параметров запроса для обновления Airflow.
  cloudrudataplatformairflowv1ListAirflowResponse:
    type: object
    properties:
      airflows:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Airflow'
        description: Список Airflow.
      nextPageToken:
        type: string
        description: Токен следующей страницы с результатами.
    description: Описание параметров ответа при получении ответа на запрос списка Airflow.
  cloudruoperationOperation:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор операции.
      resourceName:
        type: string
        title: >-
          Информация о ресурсе, над которым производится операция.

          Строится следующим образом:
          urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT.

          Пример 1:
          urn:cloud:dataplatform::54295782-7aef-43e6-b33b-c9735938677a:metastore_server
        readOnly: true
      resourceId:
        type: string
        title: |-
          Уникальный идентификатор ресурса, над которым производится операция.
          Пример: 54295782-7aef-43e6-b33b-c9735938677a
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: Время создания операции.
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        description: Время последнего изменения операции.
        readOnly: true
      done:
        type: boolean
        description: >-
          Флаг завершенности операции.

          Если значение `false`, то операция в процессе выполнения.

          Если значение `true`, то операция завершена и поле `error` может быть
          заполнено.
        readOnly: true
      description:
        type: string
        description: Описание операции. От 0 до 255 символов.
        readOnly: true
      error:
        $ref: '#/definitions/rpcStatus'
        description: Результат операции в случае ошибки.
        readOnly: true
    required:
      - id
  dataplatformprivateairflowv1ListAirflowResponse:
    type: object
    properties:
      airflows:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Airflow'
      nextPageToken:
        type: string
      total:
        type: integer
        format: int64
  operationv1Operation:
    type: object
    properties:
      id:
        type: string
        description: ID of the operation.
      description:
        type: string
        description: |-
          Description of the operation. 0-256 characters long.

          ex: Create VM, Stop VM, Delete Disk, Snapshot Disk, etc
      createdAt:
        type: string
        format: date-time
        description: Creation timestamp.
      createdBy:
        type: string
        description: ID of the user or service account who initiated the operation.
      modifiedAt:
        type: string
        format: date-time
        description: The time when the Operation resource was last modified.
      done:
        type: boolean
        description: >-
          If the value is `false`, it means the operation is still in progress.

          If `true`, the operation is completed, and either `error` or
          `response` is available.
      metadata:
        $ref: '#/definitions/protobufAny'
        description: >-
          Service-specific metadata associated with the operation.

          It typically contains the ID of the target resource that the operation
          is performed on.

          Any method that returns a long-running operation should document the
          metadata type, if any.
      error:
        $ref: '#/definitions/rpcStatus'
        description: The error result of the operation in case of failure or cancellation.
      response:
        $ref: '#/definitions/protobufAny'
        description: >-
          The normal response of the operation in case of success.

          If the original method returns no data on success, such as Delete,

          the response is [google.protobuf.Empty].

          If the original method is the standard Create/Update,

          the response should be the target resource of the operation.

          Any method that returns a long-running operation should document the
          response type, if any.
      percent:
        type: integer
        format: int32
        title: Percent for check progress of operation
      objectId:
        type: string
        title: Specify object id for data platform values
      objectType:
        type: string
        title: Object type for data platform objects
      workflow:
        $ref: '#/definitions/v1TemporalWorkflow'
        title: Special temporal workflow optional field
    description: >-
      An Operation resource. For more information, see
      [Operation](/docs/api-design-guide/concepts/operation).
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
        description: >-
          A URL/resource name that uniquely identifies the type of the
          serialized

          protocol buffer message. This string must contain at least

          one "/" character. The last segment of the URL's path must represent

          the fully qualified name of the type (as in

          `path/google.protobuf.Duration`). The name should be in a canonical
          form

          (e.g., leading "." is not accepted).


          In practice, teams usually precompile into the binary all types that
          they

          expect it to use in the context of Any. However, for URLs which use
          the

          scheme `http`, `https`, or no scheme, one can optionally set up a type

          server that maps type URLs to message definitions as follows:


          * If no scheme is provided, `https` is assumed.

          * An HTTP GET on the URL must yield a [google.protobuf.Type][]
            value in binary format, or produce an error.
          * Applications are allowed to cache lookup results based on the
            URL, or have them precompiled into a binary to avoid any
            lookup. Therefore, binary compatibility needs to be preserved
            on changes to types. (Use versioned type names to manage
            breaking changes.)

          Note: this functionality is not currently available in the official

          protobuf release, and it is not used for type URLs beginning with

          type.googleapis.com. As of May 2023, there are no widely used type
          server

          implementations and no plans to implement one.


          Schemes other than `http`, `https` (or the empty scheme) might be

          used with implementation specific semantics.
    additionalProperties: {}
    description: >-
      `Any` contains an arbitrary serialized protocol buffer message along with
      a

      URL that describes the type of the serialized message.


      Protobuf library provides support to pack/unpack Any values in the form

      of utility functions or additional generated methods of the Any type.


      Example 1: Pack and unpack a message in C++.

          Foo foo = ...;
          Any any;
          any.PackFrom(foo);
          ...
          if (any.UnpackTo(&foo)) {
            ...
          }

      Example 2: Pack and unpack a message in Java.

          Foo foo = ...;
          Any any = Any.pack(foo);
          ...
          if (any.is(Foo.class)) {
            foo = any.unpack(Foo.class);
          }
          // or ...
          if (any.isSameTypeAs(Foo.getDefaultInstance())) {
            foo = any.unpack(Foo.getDefaultInstance());
          }

       Example 3: Pack and unpack a message in Python.

          foo = Foo(...)
          any = Any()
          any.Pack(foo)
          ...
          if any.Is(Foo.DESCRIPTOR):
            any.Unpack(foo)
            ...

       Example 4: Pack and unpack a message in Go

           foo := &pb.Foo{...}
           any, err := anypb.New(foo)
           if err != nil {
             ...
           }
           ...
           foo := &pb.Foo{}
           if err := any.UnmarshalTo(foo); err != nil {
             ...
           }

      The pack methods provided by protobuf library will by default use

      'type.googleapis.com/full.type.name' as the type URL and the unpack

      methods only use the fully qualified type name after the last '/'

      in the type URL, for example "foo.bar.com/x/y.z" will yield type

      name "y.z".


      JSON

      ====

      The JSON representation of an `Any` value uses the regular

      representation of the deserialized, embedded message, with an

      additional field `@type` which contains the type URL. Example:

          package google.profile;
          message Person {
            string first_name = 1;
            string last_name = 2;
          }

          {
            "@type": "type.googleapis.com/google.profile.Person",
            "firstName": <string>,
            "lastName": <string>
          }

      If the embedded message type is well-known and has a custom JSON

      representation, that representation will be embedded adding a field

      `value` which holds the custom JSON in addition to the `@type`

      field. Example (for message [google.protobuf.Duration][]):

          {
            "@type": "type.googleapis.com/google.protobuf.Duration",
            "value": "1.212s"
          }
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
        description: |-
          The status code, which should be an enum value of
          [google.rpc.Code][google.rpc.Code].
      message:
        type: string
        description: >-
          A developer-facing error message, which should be in English. Any

          user-facing error message should be localized and sent in the

          [google.rpc.Status.details][google.rpc.Status.details] field, or
          localized

          by the client.
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
        description: >-
          A list of messages that carry the error details.  There is a common
          set of

          message types for APIs to use.
    description: >-
      The `Status` type defines a logical error model that is suitable for

      different programming environments, including REST APIs and RPC APIs. It
      is

      used by [gRPC](https://github.com/grpc). Each `Status` message contains

      three pieces of data: error code, error message, and error details.


      You can find out more about this error model and how to work with it in
      the

      [API Design Guide](https://cloud.google.com/apis/design/errors).
  v1Airflow:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор Airflow.
      clusterId:
        type: string
        description: Идентификатор кластера.
      projectId:
        type: string
        description: Идентификатор проекта.
      name:
        type: string
        description: Название Airflow.
      description:
        type: string
        description: Описание Airflow.
      status:
        $ref: '#/definitions/v1AirflowStatus'
        description: Текущий статус состояния Airflow.
        readOnly: true
      pipPackages:
        type: array
        items:
          type: string
        description: Список pip-пакетов.
      s3Conf:
        $ref: '#/definitions/v1S3Conf'
        description: Конфигурация S3.
      logGroupId:
        type: string
        description: Идентификатор группы логирования.
      createdBy:
        type: string
        description: Идентификатор пользователя, создавшего Airflow.
        readOnly: true
      updatedBy:
        type: string
        description: Идентификатор пользователя, обновившего Airflow последним.
        readOnly: true
      createdAt:
        type: string
        format: date-time
        description: Время создания Airflow.
        readOnly: true
      updatedAt:
        type: string
        format: date-time
        description: Время последнего обновления Airflow.
        readOnly: true
      networkConfiguration:
        $ref: '#/definitions/v1NetworkConfiguration'
        description: Конфигурация сети.
      resourcesConfiguration:
        $ref: '#/definitions/v1ResourcesConfiguration'
        description: Конфигурация ресурсов.
    description: Airflow.
    required:
      - clusterId
      - projectId
      - name
      - s3Conf
      - logGroupId
      - networkConfiguration
      - resourcesConfiguration
  v1AirflowResponse:
    type: object
    properties:
      airflow:
        $ref: '#/definitions/v1Airflow'
      operation:
        $ref: '#/definitions/operationv1Operation'
  v1AirflowStatus:
    type: string
    enum:
      - AIRFLOW_STATUS_UNSPECIFIED
      - AIRFLOW_STATUS_PENDING
      - AIRFLOW_STATUS_CREATING
      - AIRFLOW_STATUS_RUNNING
      - AIRFLOW_STATUS_RESUMING
      - AIRFLOW_STATUS_UPDATING
      - AIRFLOW_STATUS_DELETED
      - AIRFLOW_STATUS_DELETING
      - AIRFLOW_STATUS_ERROR
      - AIRFLOW_STATUS_SUSPENDING
      - AIRFLOW_STATUS_SUSPENDED
      - AIRFLOW_STATUS_FAILED
    default: AIRFLOW_STATUS_UNSPECIFIED
    description: |-
      Доступные статусы Airflow.

       - AIRFLOW_STATUS_UNSPECIFIED: Не указано.
       - AIRFLOW_STATUS_PENDING: Ожидание.
       - AIRFLOW_STATUS_CREATING: Создание.
       - AIRFLOW_STATUS_RUNNING: Выполнение.
       - AIRFLOW_STATUS_RESUMING: Возобновление.
       - AIRFLOW_STATUS_UPDATING: Обновление.
       - AIRFLOW_STATUS_DELETED: Удалено.
       - AIRFLOW_STATUS_DELETING: Удаление.
       - AIRFLOW_STATUS_ERROR: Ошибка.
       - AIRFLOW_STATUS_SUSPENDING: Приостановка.
       - AIRFLOW_STATUS_SUSPENDED: Приостановлено.
       - AIRFLOW_STATUS_FAILED: Неудача.
  v1CreateAirflowRequest:
    type: object
    properties:
      clusterId:
        type: string
        description: Идентификатор кластера.
      projectId:
        type: string
        description: Идентификатор проекта.
      name:
        type: string
        description: Название Airflow.
      description:
        type: string
        description: Описание Airflow.
      pipPackages:
        type: array
        items:
          type: string
        description: Список pip-пакетов.
      s3Conf:
        $ref: '#/definitions/v1S3Conf'
        description: Конфигурация S3.
      logGroupId:
        type: string
        description: Идентификатор группы логирования.
      networkConfiguration:
        $ref: '#/definitions/v1NetworkConfigurationRequest'
        description: Конфигурация сети.
      resourcesConfiguration:
        $ref: '#/definitions/v1ResourcesConfiguration'
        description: Конфигурация ресурсов.
    description: Описание параметров запроса для создания Airflow.
    required:
      - clusterId
      - projectId
      - name
      - s3Conf
      - logGroupId
      - networkConfiguration
      - resourcesConfiguration
  v1CursorPagination:
    type: object
    properties:
      pageSize:
        type: integer
        format: int64
      pageToken:
        type: string
  v1Flavor:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор флейвора.
        readOnly: true
      cpu:
        type: string
        format: int64
        description: Количество ядер CPU для данного флейвора.
        readOnly: true
      memory:
        type: string
        format: int64
        description: Объем памяти для данного флейвора.
        readOnly: true
    description: Флейвор.
  v1ListAirflowOperationsResponse:
    type: object
    properties:
      operations:
        type: array
        items:
          type: object
          $ref: '#/definitions/cloudruoperationOperation'
        description: Список операций.
      nextPageToken:
        type: string
        description: Токен следующей страницы с результатами.
    description: Описание параметров ответа при получении ответа на запрос списка операций.
  v1ListFlavorsResponse:
    type: object
    properties:
      flavors:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Flavor'
        description: Список флейворов.
      nextPageToken:
        type: string
        description: Токен следующей страницы с результатами.
    description: >-
      Описание параметров ответа при получении ответа на запрос списка
      флейворов.
  v1NetworkConfiguration:
    type: object
    properties:
      subnetId:
        type: string
        description: Идентификатор подсети.
      zoneId:
        type: string
        description: Идентификатор зоны доступности.
      enableExternalHost:
        type: boolean
        description: >-
