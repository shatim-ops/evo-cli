openapi: 3.0.3
info:
    title: Cloud.ru Container Services OpenAPI 3.0
    description: |-
        [Документация Container Apps](https://cloud.ru/docs/container-apps-evolution/ug/index.html).

        При каждом запросе к сервису в query необходимо передавать [идентификатор проекта](https://cloud.ru/docs/container-apps-evolution/ug/topics/guides__project-id).

        Для аутентификации в заголовке Authorization используйте [токен](https://cloud.ru/docs/container-apps-evolution/ug/topics/api-ref__authentication).
    version: v2
servers:
    - url: https://containers.api.cloud.ru
paths:
    /v2/containers:
        get:
            tags:
                - ContainerService
            description: Получить список доступных контейнеров.
            operationId: ContainerService_List
            parameters:
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: Количество контейнеров, которое вернется в ответе на запрос.
                  schema:
                    type: string
                - name: pageToken
                  in: query
                  description: Строковый идентификатор, который указывает с какого места нужно начать выборку данных для следующей страницы.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Выражение, фильтрующее ответ.
                    Например, ``count[gt]5;created_at[gte]2025-02-20``.
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Название поля по которому производится сортировка.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListContainersResponse'
            security:
                - IAM: []
        post:
            tags:
                - ContainerService
            description: Создание и запуск контейнера.
            operationId: ContainerService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateContainerRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncOperation'
            security:
                - IAM: []
    /v2/containers/{containerId}/operations:
        get:
            tags:
                - ContainerService
            description: Получение списка операций с контейнером по ``container_id``.
            operationId: ContainerService_ListOperations
            parameters:
                - name: containerId
                  in: path
                  description: Идентификатор контейнера.
                  required: true
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: Количество операций, которое вернется в ответе на запрос.
                  schema:
                    type: string
                - name: pageToken
                  in: query
                  description: Строковый идентификатор, который указывает с какого места нужно начать выборку данных для следующей страницы.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListContainerOperationsResponse'
            security:
                - IAM: []
    /v2/containers/{containerName}/revisions:
        get:
            tags:
                - ContainerService
            description: Список версий контейнера.
            operationId: ContainerService_ListRevisions
            parameters:
                - name: containerName
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: Количество версий, которое вернется в ответе на запрос.
                  schema:
                    type: string
                - name: pageToken
                  in: query
                  description: Строковый идентификатор, который указывает с какого места нужно начать выборку данных для следующей страницы.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Выражение, фильтрующее ответ.
                    Например, ``count[gt]5;created_at[gte]2025-02-20``.
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Название поля по которому производится сортировка.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RevisionListResponse'
            security:
                - IAM: []
    /v2/containers/{containerName}/revisions/{revisionId}:
        get:
            tags:
                - ContainerService
            description: Получение информации о версии контейнера.
            operationId: ContainerService_GetRevision
            parameters:
                - name: containerName
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: revisionId
                  in: path
                  description: Идентификатор версии.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ContainerRevision'
            security:
                - IAM: []
    /v2/containers/{name}:
        get:
            tags:
                - ContainerService
            description: Получение информации о контейнере по названию.
            operationId: ContainerService_Get
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ContainerResponse'
            security:
                - IAM: []
        delete:
            tags:
                - ContainerService
            description: Удаление контейнера.
            operationId: ContainerService_Delete
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncOperation'
            security:
                - IAM: []
        patch:
            tags:
                - ContainerService
            description: Обновление и публикация новой версии контейнера.
            operationId: ContainerService_Patch
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PatchContainerRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncOperation'
            security:
                - IAM: []
    /v2/containers/{name}/logs:
        get:
            tags:
                - ContainerService
            description: Получение пользовательских логов контейнера по названию и ``project_id``.
            operationId: ContainerService_ListLogs
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: Количество логов, которое вернется в ответе на запрос.
                  schema:
                    type: string
                - name: pageToken
                  in: query
                  description: Строковый идентификатор, который указывает с какого места нужно начать выборку данных для следующей страницы.
                  schema:
                    type: string
                - name: filter
                  in: query
                  description: |-
                    Выражение, фильтрующее ответ.
                    Например, ``count[gt]5;created_at[gte]2025-02-20``.
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: Название поля по которому производится сортировка.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListContainerLogsResponse'
            security:
                - IAM: []
    /v2/containers/{name}/start:
        post:
            tags:
                - ContainerService
            description: Запуск контейнера по названию и ``project_id``.
            operationId: ContainerService_Start
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncOperation'
            security:
                - IAM: []
    /v2/containers/{name}/stop:
        post:
            tags:
                - ContainerService
            description: Остановка контейнера по названию и ``project_id``.
            operationId: ContainerService_Stop
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncOperation'
            security:
                - IAM: []
    /v2/containers/{name}/systemLogs:
        get:
            tags:
                - ContainerService
            description: Получение системных логов контейнера по названию и ``project_id``.
            operationId: ContainerService_ListSystemLogs
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
                - name: serverlessId
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListContainerSystemLogsResponse'
            security:
                - IAM: []
    /v2/containers/{name}/testCall:
        post:
            tags:
                - ContainerService
            description: Тестовый HTTP-вызов контейнера по названию и ``project_id``.
            operationId: ContainerService_TestCall
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
                - name: projectId
                  in: query
                  description: Идентификатор проекта (UUID) в Cloud.ru.
                  schema:
                    type: string
                - name: method
                  in: query
                  schema:
                    type: string
                - name: path
                  in: query
                  schema:
                    type: string
                - name: body
                  in: query
                  schema:
                    type: string
                - name: isBase64Encoded
                  in: query
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TestCallResponse'
            security:
                - IAM: []
    /v2/containers/{name}:start:
        post:
            tags:
                - ContainerService
            description: Запуск контейнера по названию и ``project_id``.
            operationId: ContainerService_Start_v1
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StartRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncOperation'
            security:
                - IAM: []
    /v2/containers/{name}:stop:
        post:
            tags:
                - ContainerService
            description: Остановка контейнера по названию и ``project_id``.
            operationId: ContainerService_Stop_v1
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StopRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AsyncOperation'
            security:
                - IAM: []
    /v2/containers/{name}:testCall:
        post:
            tags:
                - ContainerService
            description: Тестовый HTTP-вызов контейнера по названию и ``project_id``.
            operationId: ContainerService_TestCall_v1
            parameters:
                - name: name
                  in: path
                  description: Название контейнера.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TestCallRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TestCallResponse'
            security:
                - IAM: []
    /v2/containers:check_name:
        post:
            tags:
                - ContainerService
            description: Проверка доступности названия контейнера.
            operationId: ContainerService_CheckName
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckContainerNameRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckContainerNameResponse'
            security:
                - IAM: []
components:
    schemas:
        AccessSettings:
            type: object
            properties:
                enableAuth:
                    type: boolean
                    description: Включить авторизацию.
            description: Включение авторизации для ContainerApp
        AdditionalPortMappingRequest:
            type: object
            properties:
                protocol:
                    example: http
                    type: string
                    description: Протокол маппинга порта.
                targetPort:
                    example: 8080
                    type: number
                    description: Открываемый порт.
                    format: uint32
        AdditionalPortMappingResponse:
            type: object
            properties:
                protocol:
                    example: http
                    type: string
                    description: Протокол маппинга порта.
                targetPort:
                    example: 8080
                    type: number
                    description: Открываемый порт.
                    format: uint32
                url:
                    example: my-app-8080.forwarded.containers.cloud.ru
                    type: string
                    description: URL-адрес для доступа.
        AsyncOperation:
            type: object
            properties:
                id:
                    example: 00000000-0000-0000-0000-000000000001
                    title: Operation ID (UUID)
                    type: string
                    description: Идентификатор операции.
                resourceName:
                    example: urn:cloud:container_apps::{project_id}:container_app
                    title: Resource name
                    type: string
                    description: |-
                         Информация о ресурсе, над которым производится операция.
                         Отображается в формате: ``urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT``.
                         Пример: ``urn:cloud:lbaas::496e40f7-cc4b-4fa4-b42a-8cd2c9360716:backend``
                resourceId:
                    example: 00000000-0000-0000-0000-000000000002
                    title: Resource ID
                    type: string
                    description: |-
                        Уникальный идентификатор ресурса, над которым производится операция.
                        Пример: ``496e40f7-cc4b-4fa4-b42a-8cd2c9360716``.
                createdAt:
                    type: string
                    description: Дата и время создания ресурса.
                    format: date-time
                updatedAt:
                    type: string
                    description: Дата и время обновления ресурса.
                    format: date-time
                done:
                    example: true
                    title: 'Operation completion flag: false if operation is still in process.'
                    type: boolean
                    description: |-
                        Флаг завершенности операции.
                         Если значение `false`, то операция в процессе выполнения.
                         Если значение `true`, то операция завершена и поле `error` может быть заполнено.
                description:
                    example: Описание операции
                    title: Описание операции
                    type: string
                    description: Описание операции. От 0 до 255 символов.
                error:
                    $ref: '#/components/schemas/Status'
        AutoDeployments:
            type: object
            properties:
                enabled:
                    example: true
                    type: boolean
                    description: Включить функцию автодеплоя.
                pattern:
                    example: latest
                    type: string
                    description: Шаблон тега образа.
        CheckContainerNameRequest:
            type: object
            properties:
                name:
                    type: string
                    description: Название контейнера.
                projectId:
                    type: string
                    description: Идентификатор проекта (UUID) в Cloud.ru.
        CheckContainerNameResponse:
            type: object
            properties:
                isExist:
                    type: boolean
        Container:
            type: object
            properties:
                name:
                    example: my-container-app
                    type: string
                    description: Название контейнера.
                image:
                    example: helloworld.cr.cloud.ru/react-hello-world:latest
                    type: string
                    description: URI образа контейнера.
                resources:
                    $ref: '#/components/schemas/ContainerResources'
                containerPort:
                    example: 8000
                    type: number
                    description: Порт контейнера.
                    format: uint32
                env:
                    type: array
                    items:
                        $ref: '#/components/schemas/ContainerEnv'
                command:
                    type: array
                    items:
                        type: string
                    description: Команда.
                args:
                    type: array
                    items:
                        type: string
                    description: Аргументы.
                volumeMounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/VolumeMount'
                livenessProbe:
                    $ref: '#/components/schemas/ContainerLivenessProbe'
                readinessProbe:
                    $ref: '#/components/schemas/ContainerReadinessProbe'
        ContainerConfigurationResponse:
            type: object
            properties:
                ingress:
                    $ref: '#/components/schemas/ContainerIngress'
                autoDeployments:
                    $ref: '#/components/schemas/AutoDeployments'
                privileged:
                    example: true
                    type: boolean
                    description: Включить привилегированный режим для контейнера.
                ssh:
                    $ref: '#/components/schemas/SSH'
                loggingService:
                    $ref: '#/components/schemas/ContainerLoggingService'
        ContainerEnv:
            type: object
            properties:
                name:
                    example: MY_ENV_VAR
                    type: string
                    description: Имя переменной.
                value:
                    example: value
                    type: string
                    description: Значение переменной.
                type:
                    example: secret
                    type: string
                    description: |-
                        Тип переменной.
                        Укажите ``secret``, чтобы использовать значение из Secret Management.
                        В этом случае в поле ``value`` укажите название секрета из Secret Management.
        ContainerExecProbe:
            type: object
            properties:
                command:
                    type: string
                    items:
                        type: string
                    description: Команда.
        ContainerHttpProbe:
            type: object
            properties:
                host:
                    type: string
                    description: Хост.
                path:
                    type: string
                    description: Путь.
                scheme:
                    title: Схема
                    type: string
                    description: 'Протокол для подключения к контейнеру. Допустимое значение: ``HTTP``'
                port:
                    example: 8000
                    type: number
                    description: Порт контейнера.
                    format: int32
        ContainerIngress:
            type: object
            properties:
                publiclyAccessible:
                    example: true
                    type: boolean
                    description: Включить публичный URL для контейнера.
                corsPolicy:
                    $ref: '#/components/schemas/CorsPolicy'
                publicUri:
                    readOnly: true
                    type: string
                internalUri:
                    readOnly: true
                    type: string
                additionalPortMappings:
                    type: array
                    items:
                        $ref: '#/components/schemas/AdditionalPortMappingResponse'
                accessSettings:
                    $ref: '#/components/schemas/AccessSettings'
                customDomains:
                    type: array
                    items:
                        $ref: '#/components/schemas/CustomDomainBinding'
        ContainerLivenessProbe:
            type: object
            properties:
                httpProbe:
                    $ref: '#/components/schemas/ContainerHttpProbe'
                execProbe:
                    $ref: '#/components/schemas/ContainerExecProbe'
                initialDelaySeconds:
                    type: integer
                    description: Задержка перед первым зондированием.
                    format: int32
                periodSeconds:
                    type: integer
                    description: Период зондирования.
                    format: int32
                timeoutSeconds:
                    type: integer
                    description: Таймаут зондирования.
                    format: int32
                failureThreshold:
                    type: integer
                    description: Порог отказов.
                    format: int32
        ContainerLog:
            type: object
            properties:
                timestamp:
                    type: string
                    description: Дата и время.
                    format: date-time
                message:
                    type: string
                    description: Запись лога.
                versionId:
                    type: string
                    description: Идентификатор версии.
                podName:
                    type: string
                    description: Название пода.
                level:
                    type: string
                    description: Уровень логирования.
                containerName:
                    type: string
                    description: Название контейнера.
        ContainerLoggingService:
            type: object
            properties:
                isEnabled:
                    example: true
                    type: boolean
                    description: Включить сервис логирования.
                groupId:
                    example: e3f74a23-9d44-11f0-8161-b63d362515df
                    type: string
                    description: Идентификатор группы логов.
        ContainerReadinessProbe:
            type: object
            properties:
                httpProbe:
                    $ref: '#/components/schemas/ContainerHttpProbe'
                execProbe:
                    $ref: '#/components/schemas/ContainerExecProbe'
                initialDelaySeconds:
                    type: integer
                    description: Задержка перед первым зондированием.
                    format: int32
                periodSeconds:
                    type: integer
                    description: Период зондирования.
                    format: int32
                timeoutSeconds:
                    type: integer
                    description: Таймаут зондирования.
                    format: int32
                successThreshold:
                    type: integer
                    description: Порог успешности.
                    format: int32
                failureThreshold:
                    type: integer
                    description: Порог отказов.
                    format: int32
        ContainerResources:
