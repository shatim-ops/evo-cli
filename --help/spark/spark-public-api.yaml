                    readOnly: true
                    type: boolean
                    description: |-
                        Завершенность операции:
                         * `false` — операция в процессе выполнения.
                         * `true` — операция завершена и поле `error` может быть заполнено.
                description:
                    readOnly: true
                    type: string
                    description: Описание операции. От 0 до 255 символов.
                error:
                    readOnly: true
                    allOf:
                        - $ref: '#/components/schemas/google.rpc.Status'
