                    description: Параметры запускаемой задачи типа Scala.
                r:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.JobRConfiguration'
                    description: Параметры запускаемой задачи типа R.
                driver:
                    type: object
                    allOf:
