                name:
                    example: spark-instance
                    type: string
                    description: Название.
                description:
                    example: Spark cluster description
                    type: string
                    description: Описание.
                status:
                    readOnly: true
                    example: SPARK_STATUS_RUNNING
                    enum:
                        - "SPARK_STATUS_PENDING"
                        - "SPARK_STATUS_CREATING"
                        - "SPARK_STATUS_RUNNING"
                        - "SPARK_STATUS_RESUMING"
                        - "SPARK_STATUS_UPDATING"
                        - "SPARK_STATUS_DELETED"
                        - "SPARK_STATUS_DELETING"
                        - "SPARK_STATUS_ERROR"
                        - "SPARK_STATUS_SUSPENDING"
                        - "SPARK_STATUS_SUSPENDED"
                        - "SPARK_STATUS_FAILED"
                        - "SPARK_STATUS_STOPPING"
                        - "SPARK_STATUS_STOPPED"
                    type: string
                    description: |-
                     Статус инстанса Managed Spark:

                     * `SPARK_STATUS_PENDING` — инстанс находится в ожидании.
                     * `SPARK_STATUS_CREATING` — инстанс создается.
                     * `SPARK_STATUS_RUNNING` — инстанс готов к работе.
                     * `SPARK_STATUS_RESUMING` — инстанс возобновляет работу.
                     * `SPARK_STATUS_UPDATING` — инстанс обновляется.
                     * `SPARK_STATUS_DELETED` — инстанс удален.
                     * `SPARK_STATUS_DELETING` — инстанс удаляется.
                     * `SPARK_STATUS_ERROR` — инстанс находится в состоянии ошибки.
                     * `SPARK_STATUS_SUSPENDING` — инстанс приостанавливается.
                     * `SPARK_STATUS_SUSPENDED` — инстанс приостановлен.
                     * `SPARK_STATUS_FAILED` — ошибка в работе инстанса.
                     * `SPARK_STATUS_STOPPING` — инстанс останавливается.
                     * `SPARK_STATUS_STOPPED` — инстанс остановлен.

                    format: enum
                enabledExternalHost:
                    example: true
                    type: boolean
                    description: |-
                     Подключение через внешний хост:
