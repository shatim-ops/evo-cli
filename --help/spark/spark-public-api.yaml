                      * `false` — подключение через внешний хост запрещено.
                internalS3Config:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.InternalS3Conf'
                    description: Конфигурация параметров Object Storage.
