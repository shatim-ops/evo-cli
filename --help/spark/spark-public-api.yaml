                name:
                    example: spark-instance
                    type: string
                    description: Название.
                description:
                    example: Spark description
                    type: string
                    description: Описание.
                enabledExternalHost:
                    example: true
                    type: boolean
                    description: |-
                     Подключение через внешний хост:
