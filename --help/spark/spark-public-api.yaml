                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.ExternalS3Conf'
                    description: Конфигурация параметров внешнего хранилища S3.
                logGroupId:
                    example: 0000-0000-0000-0000-0000
                    type: string
                    description: Идентификатор группы логирования.
                networkConfiguration:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.NetworkConfiguration'
                    description: Конфигурация сети.
                user:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.User'
                    description: Пользователь Managed Spark для доступа к Spark History.
                versionId:
                    example: 0000-0000-0000-0000-0000
                    type: string
                    description: Идентификатор версии Managed Spark.
            description: Описание параметров запроса для создания инстанса Managed Spark.
