        cloudru.dataplatform.spark.v1.CreateSparkJobRequest:
            required:
                - name
                - jobType
                - driver
                - executor
            type: object
            properties:
                name:
                    example: spark-job-1
                    type: string
                    description: Название.
                description:
                    example: Spark job description
                    type: string
                    description: Описание.
                baseImage:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.BaseImageRequest'
                    description: Параметры базового образа.
                customImage:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.CustomImage'
                    description: Параметры пользовательского образа.
                jobType:
                    example: JOB_TYPE_PYTHON
                    enum:
                        - "JOB_TYPE_JAVA"
                        - "JOB_TYPE_PYTHON"
                        - "JOB_TYPE_SCALA"
                        - "JOB_TYPE_R"
                    type: string
                    description: |- 
                     Типы задач:

                     * `JOB_TYPE_JAVA` — задача типа Java.
                     * `JOB_TYPE_PYTHON` — задача типа Python.
                     * `JOB_TYPE_SCALA` — задача типа Scala.
                     * `JOB_TYPE_R` — задача типа R.
                    format: enum
                java:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.JobJavaConfiguration'
                    description: Параметры запускаемой задачи типа Java.
                python:
                    type: object
