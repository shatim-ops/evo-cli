        cloudru.operation.Operation:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: Идентификатор операции.
                resourceName:
                    readOnly: true
                    type: string
                    description: |-
                        Информация о ресурсе, над которым производится операция.
                         Строится следующим образом: `urn:cloud:SERVICE:ZONE_OPT:PROJECT_OPT:RESOURCE_TYPE_OPT`.
                         Пример: `urn:cloud:dataplatform::54295782-7aef-43e6-b33b-c9735938677a:metastore_server`
                resourceId:
                    readOnly: true
                    type: string
                    description: |-
                        Уникальный идентификатор ресурса, над которым производится операция.
                         Пример: `54295782-7aef-43e6-b33b-c9735938677a`
                createdAt:
                    readOnly: true
                    type: string
                    description: Время создания операции.
                    format: date-time
                updatedAt:
                    readOnly: true
                    type: string
                    description: Время последнего изменения операции.
                    format: date-time
