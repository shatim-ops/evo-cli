                    description: Конфигурация driver.
                executor:
                    type: object
                    allOf:
                        - $ref: '#/components/schemas/cloudru.dataplatform.spark.v1.ExecutorConfiguration'
                    description: Конфигурация executor.
            description: Описание параметров запроса для создания задачи Spark.
        cloudru.dataplatform.spark.v1.CreateSparkRequest:
            required:
                - clusterId
                - projectId
                - computeConfiguration
                - name
                - enabledExternalHost
                - logGroupId
                - networkConfiguration
                - user
            type: object
            properties:
                clusterId:
                    example: 0000-0000-0000-0000-0000
                    type: string
                    description: Идентификатор кластера.
                projectId:
                    example: 0000-0000-0000-0000-0000
