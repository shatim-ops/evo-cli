components:
    schemas:
        v3Agreement:
            description: Договор.
            properties:
                credit_scheme:
                    $ref: '#/components/schemas/v3AgreementCreditScheme'
                id:
                    description: Идентификатор договора.
                    readOnly: true
                    type: string
                status:
                    $ref: '#/components/schemas/v3AgreementStatus'
                type:
                    $ref: '#/components/schemas/v3AgreementType'
            type: object
        v3AgreementCreditScheme:
            default: AGREEMENT_CREDIT_SCHEME_UNSPECIFIED
            description: |-
                Схема оплаты:

                 - AGREEMENT_CREDIT_SCHEME_UNSPECIFIED: Не определен.
                 - AGREEMENT_CREDIT_SCHEME_PREPAID: Предоплата.
                 - AGREEMENT_CREDIT_SCHEME_POSTPAID: Постоплата.
            enum:
                - AGREEMENT_CREDIT_SCHEME_UNSPECIFIED
                - AGREEMENT_CREDIT_SCHEME_PREPAID
                - AGREEMENT_CREDIT_SCHEME_POSTPAID
            type: string
        v3AgreementStatus:
            default: AGREEMENT_STATUS_UNSPECIFIED
            description: |-
                Статус договора:

                 - AGREEMENT_STATUS_UNSPECIFIED: Не определен.
                 - AGREEMENT_STATUS_SUSPEND: Приостановленный.
                 - AGREEMENT_STATUS_ACTIVE: Активный.
                 - AGREEMENT_STATUS_TERMINATED: Завершенный.
            enum:
                - AGREEMENT_STATUS_UNSPECIFIED
                - AGREEMENT_STATUS_SUSPEND
                - AGREEMENT_STATUS_ACTIVE
                - AGREEMENT_STATUS_TERMINATED
            type: string
        v3AgreementType:
            default: AGREEMENT_TYPE_UNSPECIFIED
            description: |-
                Тип договора:

                 - AGREEMENT_TYPE_UNSPECIFIED: Не определен.
                 - AGREEMENT_TYPE_TEST: Тестовый.
                 - AGREEMENT_TYPE_COMMERCIAL: Коммерческий.
            enum:
                - AGREEMENT_TYPE_UNSPECIFIED
                - AGREEMENT_TYPE_TEST
                - AGREEMENT_TYPE_COMMERCIAL
            type: string
        v3CreateOrganizationUnitRequest:
            description: Запрос на создание каталога.
            properties:
                customer_id:
                    description: Идентификатор пользователя.
                    type: string
                description:
                    description: Описание каталога.
                    type: string
                name:
                    description: Название каталога.
                    type: string
            required:
                - customer_id
                - name
            type: object
        v3CreateProjectRequest:
            description: Запрос на создание проекта.
            properties:
                description:
                    description: Описание проекта.
                    type: string
                name:
                    description: Название проекта.
                    type: string
                organization_unit_id:
                    description: Идентификатор каталога.
                    type: string
            required:
                - name
                - description
                - organization_unit_id
            type: object
        v3Customer:
            properties:
                full_name:
                    description: Полное имя пользователя.
                    readOnly: true
                    type: string
                id:
                    description: Идентификатор пользователя.
                    readOnly: true
                    type: string
                name:
                    description: Имя пользователя.
                    readOnly: true
                    type: string
                owner_id:
                    description: Идентификатор владельца.
                    readOnly: true
                    type: string
                type:
                    $ref: '#/components/schemas/v3CustomerType'
            type: object
        v3CustomerType:
            default: CUSTOMER_TYPE_UNSPECIFIED
            description: |-
                Тип пользователя:

                 - CUSTOMER_TYPE_UNSPECIFIED: Не определен.
                 - CUSTOMER_TYPE_LEGAL: Юридическое лицо.
                 - CUSTOMER_TYPE_INDIVIDUAL: Физическое лицо.
                 - CUSTOMER_TYPE_INDIVIDUAL_ENTREPRENEUR: Индивидуальный предприниматель.
                 - CUSTOMER_TYPE_NON_RESIDENT: Не резидент РФ.
            enum:
                - CUSTOMER_TYPE_UNSPECIFIED
                - CUSTOMER_TYPE_LEGAL
                - CUSTOMER_TYPE_INDIVIDUAL
                - CUSTOMER_TYPE_INDIVIDUAL_ENTREPRENEUR
                - CUSTOMER_TYPE_NON_RESIDENT
            type: string
        v3DeleteOrganizationUnitResponse:
            description: Ответ на запрос на удаление каталога.
            type: object
        v3DeleteProjectResponse:
            description: Ответ на запрос на удаление проекта.
            type: object
        v3ListAgreementsResponse:
            description: Ответ на запрос на получение списка договоров.
            properties:
                agreements:
                    description: Список договоров.
                    items:
                        $ref: '#/components/schemas/v3Agreement'
                    readOnly: true
                    type: array
            type: object
        v3ListCustomersResponse:
            description: Ответ на запрос на получение списка пользователей.
            properties:
                customers:
                    description: Список пользователей.
                    items:
                        $ref: '#/components/schemas/v3Customer'
                    readOnly: true
                    type: array
                next_page_token:
                    description: Токен следующей страницы с результатами.
                    readOnly: true
                    type: string
            type: object
        v3ListOrganizationUnitsResponse:
            description: Ответ на запрос получения списка каталогов.
            properties:
                next_page_token:
                    description: Токен следующей страницы с результатами.
                    type: string
                organization_units:
                    description: Список каталогов.
                    items:
                        $ref: '#/components/schemas/v3OrganizationUnit'
                    type: array
            type: object
        v3ListProjectsResponse:
            description: Ответ на запрос получения списка проектов, удовлетворяющих фильтру.
            properties:
                next_page_token:
                    description: Токен следующей страницы с результатами.
                    readOnly: true
                    type: string
                projects:
                    description: Список проектов.
                    items:
                        $ref: '#/components/schemas/v3Project'
                    readOnly: true
                    type: array
            type: object
        v3ListQuotaResourceTypesResponse:
            description: Ответ на запрос на получение списка типов квотируемых ресурсов.
            properties:
                resource_types:
                    description: Список типов квотируемых ресурсов.
                    items:
                        $ref: '#/components/schemas/v3QuotaResourceType'
                    readOnly: true
                    type: array
            type: object
        v3ListQuotaUsagesResponse:
            description: Ответ на запрос на получения списка потреблений квот.
            properties:
                next_page_token:
                    description: Токен следующей страницы с результатами.
                    readOnly: true
                    type: string
                usages:
                    description: Список потреблений квот.
                    items:
                        $ref: '#/components/schemas/v3QuotaUsage'
                    readOnly: true
                    type: array
            type: object
        v3OrganizationUnit:
            description: Каталог.
            properties:
                created_at:
                    description: Дата создания каталога.
                    format: date-time
                    readOnly: true
                    type: string
                customer_id:
                    description: Идентификатор пользователя.
                    type: string
                description:
                    description: Описание каталога.
                    type: string
                id:
                    description: Идентификатор каталога.
                    type: string
                name:
                    description: Название каталога.
                    type: string
                updated_at:
                    description: Дата последнего обновления каталога.
                    format: date-time
                    readOnly: true
                    type: string
            required:
                - customer_id
                - name
            type: object
        v3OrganizationUnitServiceUpdateBody:
            description: Запрос на обновление каталога по ID.
            properties:
                description:
                    description: Описание каталога.
                    type: string
                name:
                    description: Название каталога.
                    type: string
            required:
                - name
            type: object
        v3Project:
            description: Объект проекта.
            properties:
                created_at:
                    description: Дата создания проекта.
                    format: date-time
                    readOnly: true
                    type: string
                customer_id:
                    description: Идентификатор пользователя.
                    readOnly: true
                    type: string
                description:
                    description: Описание проекта.
                    type: string
                id:
                    description: Идентификатор проекта.
                    type: string
                name:
                    description: Название проекта.
                    type: string
                organization_unit_id:
                    description: Идентификатор каталога.
                    type: string
                status:
                    $ref: '#/components/schemas/v3ProjectStatus'
                updated_at:
                    description: Дата обновления проекта.
                    format: date-time
                    readOnly: true
                    type: string
            required:
                - name
                - description
                - organization_unit_id
            type: object
        v3ProjectServiceUpdateBody:
            description: Запрос на обновление проекта по ID.
            properties:
                description:
                    description: Описание проекта.
                    type: string
                name:
                    description: Название проекта.
                    type: string
            type: object
        v3ProjectStatus:
            default: PROJECT_STATUS_UNSPECIFIED
            description: |-
                Статус проекта:

                 - PROJECT_STATUS_UNSPECIFIED: Неизвестный статус проекта.
                 - PROJECT_STATUS_ENABLED: Проект активен.
            enum:
                - PROJECT_STATUS_UNSPECIFIED
                - PROJECT_STATUS_ENABLED
            type: string
        v3QuotaResourceType:
            description: Тип квотируемого ресурса.
            properties:
                code:
                    description: Код типа.
                    readOnly: true
                    type: string
                name:
                    description: Название типа.
                    readOnly: true
                    type: string
                product_name:
                    description: Название продукта.
                    readOnly: true
                    type: string
                unit:
                    description: Единица измерения.
                    readOnly: true
                    type: string
            type: object
        v3QuotaSubjectType:
            default: QUOTA_SUBJECT_TYPE_UNSPECIFIED
            description: |-
                Тип субъекта квоты:

                 - QUOTA_SUBJECT_TYPE_UNSPECIFIED: Не определен.
                 - QUOTA_SUBJECT_TYPE_CUSTOMER: Квоты клиента.
                 - QUOTA_SUBJECT_TYPE_ORGANIZATION_UNIT: Квоты каталога.
                 - QUOTA_SUBJECT_TYPE_PROJECT: Квоты проекта.
            enum:
                - QUOTA_SUBJECT_TYPE_UNSPECIFIED
                - QUOTA_SUBJECT_TYPE_CUSTOMER
                - QUOTA_SUBJECT_TYPE_ORGANIZATION_UNIT
                - QUOTA_SUBJECT_TYPE_PROJECT
            type: string
        v3QuotaUsage:
            description: |-
                Структура для представления потребления квоты
                по конкретному ресурсу конкретным субъектом.
            properties:
                aggregated_usage:
                    description: Потребление текущей квоты и потребление дочерних квот.
                    readOnly: true
                    type: string
                created_at:
                    description: Дата создания потребления.
                    format: date-time
                    readOnly: true
                    type: string
                customer_id:
                    description: Идентификатор пользователя.
                    readOnly: true
                    type: string
                individual_limit:
                    description: Лимит квоты.
                    readOnly: true
                    type: string
                individual_usage:
                    description: Потребление квоты.
                    readOnly: true
                    type: string
                resource_type_code:
                    description: Тип ресурса.
                    readOnly: true
                    type: string
                subject_id:
                    description: Идентификатор субъекта.
                    readOnly: true
                    type: string
                subject_type_code:
                    $ref: '#/components/schemas/v3QuotaSubjectType'
                updated_at:
                    description: Дата последнего обновления потребления.
                    format: date-time
                    readOnly: true
                    type: string
            type: object
        v3QuotaUsageServiceUpdateBody:
            description: Запрос на обновление лимита потребления квоты.
            properties:
                individual_limit:
                    description: Лимит потребления.
                    type: string
            required:
                - individual_limit
            type: object
info:
    contact:
        email: support@cloud.ru
    description: '[Документация Настройки и администрирование](https://cloud.ru/docs/administration/ug/index.html)'
    license:
        name: unknown
        url: unknown
    title: Администрирование каталогов, проектов и квот (API v3)
    version: 3.0.0
servers:
  - url: https://organization.api.cloud.ru    
openapi: 3.0.0
paths:
    /v3/agreements:
        get:
            operationId: AgreementService_List
            parameters:
                - description: Список идентификаторов пользователей.
                  in: query
                  name: customer_ids
                  schema:
                    items:
                        type: string
                    type: array
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3ListAgreementsResponse'
                    description: Успешное выполнение запроса.
            summary: Получение списка договоров, к которым пользователь имеет доступ
            tags:
                - AgreementService
    /v3/customers:
        get:
            operationId: CustomerService_List
            parameters:
                - description: Максимальное количество результатов на странице ответа.
                  in: query
                  name: page_size
                  schema:
                    format: int64
                    type: string
                - description: Токен запрашиваемой страницы с результатами.
                  in: query
                  name: page_token
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3ListCustomersResponse'
                    description: Успешное выполнение запроса.
            summary: Получение списка клиентов, к которым пользователь имеет доступ
            tags:
                - CustomerService
    /v3/customers/{id}:
        get:
            operationId: CustomerService_Get
            parameters:
                - description: Идентификатор клиента.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3Customer'
                    description: Успешное выполнение запроса.
            summary: Получение информации о клиенте
            tags:
                - CustomerService
    /v3/organizationUnits:
        get:
            operationId: OrganizationUnitService_List
            parameters:
                - description: Фильтр поиска по идентификаторам пользователей.
                  in: query
                  name: customer_ids
                  schema:
                    items:
                        type: string
                    type: array
                - description: Фильтр поиска по идентификаторам каталогов.
                  in: query
                  name: organization_unit_ids
                  schema:
                    items:
                        type: string
                    type: array
                - description: Максимальное количество результатов на странице ответа.
                  in: query
                  name: page_size
                  schema:
                    format: int64
                    type: string
                - description: Токен запрашиваемой страницы с результатами.
                  in: query
                  name: page_token
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3ListOrganizationUnitsResponse'
                    description: Успешное выполнение запроса.
            summary: Получение списка каталогов
            tags:
                - OrganizationUnitService
        post:
            operationId: OrganizationUnitService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v3CreateOrganizationUnitRequest'
                description: Запрос на создание каталога.
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3OrganizationUnit'
                    description: Успешное выполнение запроса.
            summary: Создание каталога
            tags:
                - OrganizationUnitService
    /v3/organizationUnits/{id}:
        delete:
            operationId: OrganizationUnitService_Delete
            parameters:
                - description: Идентификатор каталога.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3DeleteOrganizationUnitResponse'
                    description: Успешное выполнение запроса.
            summary: Удаление каталога
            tags:
                - OrganizationUnitService
        get:
            operationId: OrganizationUnitService_Get
            parameters:
                - description: Идентификатор каталога.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3OrganizationUnit'
                    description: Успешное выполнение запроса.
            summary: Получение каталога по ID
            tags:
                - OrganizationUnitService
        put:
            operationId: OrganizationUnitService_Update
            parameters:
                - description: Идентификатор каталога.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v3OrganizationUnitServiceUpdateBody'
                required: false
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3OrganizationUnit'
                    description: Успешное выполнение запроса.
            summary: Обновление каталога по ID
            tags:
                - OrganizationUnitService
    /v3/projects:
        get:
            operationId: ProjectService_List
            parameters:
                - description: |-
                    Фильтр по статусу проекта:

                     - PROJECT_STATUS_UNSPECIFIED: Неизвестный статус проекта.
                     - PROJECT_STATUS_ENABLED: Проект активен.
                  in: query
                  name: status
                  schema:
                    default: PROJECT_STATUS_UNSPECIFIED
                    enum:
                        - PROJECT_STATUS_UNSPECIFIED
                        - PROJECT_STATUS_ENABLED
                    type: string
                - description: Фильтр по списку проектов.
                  in: query
                  name: project_ids
                  schema:
                    items:
                        type: string
                    type: array
                - description: Фильтр по списку пользователей.
                  in: query
                  name: customer_ids
                  schema:
                    items:
                        type: string
                    type: array
                - description: Фильтр по списку каталогов.
                  in: query
                  name: organization_unit_ids
                  schema:
                    items:
                        type: string
                    type: array
                - description: Максимальное количество результатов на странице ответа.
                  in: query
                  name: page_size
                  schema:
                    format: int64
                    type: string
                - description: Токен запрашиваемой страницы с результатами.
                  in: query
                  name: page_token
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3ListProjectsResponse'
                    description: Успешное выполнение запроса.
            summary: Получение списка проектов, удовлетворяющих фильтру
            tags:
                - ProjectService
        post:
            operationId: ProjectService_Create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v3CreateProjectRequest'
                description: Запрос на создание проекта.
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3Project'
                    description: Успешное выполнение запроса.
            summary: Создание проекта
            tags:
                - ProjectService
    /v3/projects/{id}:
        delete:
            operationId: ProjectService_Delete
            parameters:
                - description: Идентификатор проекта.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3DeleteProjectResponse'
                    description: Успешное выполнение запроса.
            summary: Удаление проекта по ID
            tags:
                - ProjectService
        get:
            operationId: ProjectService_Get
            parameters:
                - description: Идентификатор проекта.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3Project'
                    description: Успешное выполнение запроса.
            summary: Получение проекта по ID
            tags:
                - ProjectService
        put:
            operationId: ProjectService_Update
            parameters:
                - description: Идентификатор проекта.
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v3ProjectServiceUpdateBody'
                required: false
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3Project'
                    description: Успешное выполнение запроса.
            summary: Обновление проекта по ID
            tags:
                - ProjectService
    /v3/quotas/resourceTypes:
        get:
            operationId: QuotaResourceTypeService_List
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3ListQuotaResourceTypesResponse'
                    description: Успешное выполнение запроса.
            summary: Получение списка квотируемых ресурсов
            tags:
                - QuotaResourceTypeService
    /v3/quotas/usages:
        get:
            operationId: QuotaUsageService_List
            parameters:
                - description: Список кодов ресурсных типов.
                  in: query
                  name: resource_type_codes
                  schema:
                    items:
                        type: string
                    type: array
                - description: |-
                    Список кодов субъектных типов:

                     - QUOTA_SUBJECT_TYPE_UNSPECIFIED: Не определен.
                     - QUOTA_SUBJECT_TYPE_CUSTOMER: Квоты клиента.
                     - QUOTA_SUBJECT_TYPE_ORGANIZATION_UNIT: Квоты каталога.
                     - QUOTA_SUBJECT_TYPE_PROJECT: Квоты проекта.
                  in: query
                  name: subject_type_codes
                  schema:
                    items:
                        enum:
                            - QUOTA_SUBJECT_TYPE_UNSPECIFIED
                            - QUOTA_SUBJECT_TYPE_CUSTOMER
                            - QUOTA_SUBJECT_TYPE_ORGANIZATION_UNIT
                            - QUOTA_SUBJECT_TYPE_PROJECT
                        type: string
                    type: array
                - description: Список идентификаторов субъектов.
                  in: query
                  name: subject_ids
                  schema:
                    items:
                        type: string
                    type: array
                - description: Максимальное количество результатов на странице ответа.
                  in: query
                  name: page_size
                  schema:
                    format: int64
                    type: string
                - description: Токен запрашиваемой страницы с результатами.
                  in: query
                  name: page_token
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v3ListQuotaUsagesResponse'
                    description: Успешное выполнение запроса.
            summary: Получение списка потреблений квот
            tags:
                - QuotaUsageService
