swagger: "2.0"
info:
  title: Администрирование каталогов, проектов и квот (API v1, v2)
  description: '[Документация Настройки и администрирование](https://cloud.ru/docs/administration/ug/index.html)'
  contact:
    email: support@cloud.ru
  version: '1.0'
servers:
    - url: https://organization.api.cloud.ru/  
tags:
  - name: AgreementService
  - name: ConsumptionService
  - name: CustomerService
  - name: EndpointService
  - name: OrganizationUnitService
  - name: ProjectService
  - name: QuotaUsageService
host: organization.api.cloud.ru
basePath: /
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/agreements:
    get:
      summary: Список договоров, к которым имеет доступ пользователь.
      operationId: AgreementService_ListAgreements
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListAgreementsResponse'
        "400":
          description: Некорректный запрос
          schema: {}
        "401":
          description: Необходима авторизация
          schema: {}
        "403":
          description: Доступ запрещен
          schema: {}
        "404":
          description: Ресурс не найден
          schema: {}
        "500":
          description: Внутренняя ошибка сервера
          schema: {}
      parameters:
        - name: customer_ids
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - AgreementService
  /v1/consumption:
    get:
      summary: Получение потребления по ресурсам
      operationId: ConsumptionService_GetConsumption
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetConsumptionResponse'
        "400":
          description: Некорректный запрос
          schema: {}
        "401":
          description: Необходима авторизация
          schema: {}
        "403":
          description: Доступ запрещен
          schema: {}
        "404":
          description: Ресурс не найден
          schema: {}
        "500":
          description: Внутренняя ошибка сервера
          schema: {}
      parameters:
        - name: agreement_id
          description: Фильтр по идентификатору договора облачной платформы.
          in: query
          required: false
          type: string
        - name: project_ids
          description: Фильтр по идентификаторам проектов.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: service_names
          description: Фильтр по названиям облачных сервисов в продуктовом каталоге.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: start_date
          description: Фильтр по дате начала периода потребления.
          in: query
          required: true
          type: string
          format: date-time
        - name: end_date
          description: Фильтр по дате окончания периода потребления.
          in: query
          required: true
          type: string
          format: date-time
        - name: page_filter.limit
          description: Количество сущностей на странице.
          in: query
          required: false
          type: integer
          format: int64
        - name: page_filter.page
          description: |-
            Номер страницы.
            Нумерация начинается с 1.
          in: query
          required: false
          type: integer
          format: int64
        - name: start_updated_dt
          description: Фильтр по времени обновления записи.
          in: query
          required: false
          type: string
          format: date-time
        - name: end_updated_dt
          description: Фильтр по времени обновления записи.
          in: query
          required: false
          type: string
          format: date-time
        - name: sku_ids
          description: Фильтр по идентификаторам SKU.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      tags:
        - ConsumptionService
  /v1/consumption/resource_tags:
