        - name: id
          description: Идентификатор каталога.
          in: path
          required: true
          type: string
      tags:
        - OrganizationUnitService
    patch:
      summary: Обновление каталога по id.
      description: |-
        Обновляет каталог по id.
        Незаполненные поля не обновляются.
      operationId: OrganizationUnitService_PatchOrganizationUnit
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1OrganizationUnit'
        "400":
          description: Некорректный запрос
          schema: {}
        "401":
          description: Необходима авторизация
          schema: {}
        "403":
          description: Доступ запрещен
          schema: {}
        "404":
          description: Ресурс не найден
          schema: {}
        "500":
          description: Внутренняя ошибка сервера
          schema: {}
