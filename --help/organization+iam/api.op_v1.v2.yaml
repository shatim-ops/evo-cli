          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: customer_ids
          description: Фильтр по id клиента.
          in: query
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: organization_unit_ids
