  /v1/projects:
    get:
      summary: Получение списка проектов, удовлетворяющих фильтру.
      operationId: ProjectService_ListProjects
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListProjectsResponse'
        "400":
          description: Некорректный запрос
          schema: {}
        "401":
          description: Необходима авторизация
          schema: {}
        "403":
          description: Доступ запрещен
          schema: {}
        "404":
          description: Ресурс не найден
          schema: {}
        "500":
          description: Внутренняя ошибка сервера
          schema: {}
      parameters:
        - name: status
          description: |-
            Фильтр по статусу проекта.

             - PROJECT_STATUS_UNSPECIFIED: Неизвестный статус проекта.
             - PROJECT_STATUS_ENABLED: Проект активен.
             - PROJECT_STATUS_DISABLED: Проект неактивен.
             - PROJECT_STATUS_TERMINATING: Проект отключается.
             - PROJECT_STATUS_TERMINATED: Проект отключен.
          in: query
          required: false
          type: string
          enum:
            - PROJECT_STATUS_UNSPECIFIED
            - PROJECT_STATUS_ENABLED
            - PROJECT_STATUS_DISABLED
            - PROJECT_STATUS_TERMINATING
            - PROJECT_STATUS_TERMINATED
          default: PROJECT_STATUS_UNSPECIFIED
        - name: page_filter.limit
          description: Количество сущностей на странице.
          in: query
          required: false
          type: integer
          format: int64
        - name: page_filter.page
