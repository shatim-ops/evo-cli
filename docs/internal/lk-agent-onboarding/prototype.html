<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Агенты в ЛК Cloud.ru — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Токены — Snack UIKit (@snack-uikit/figma-tokens 19.0.5, тема brand). */
:root{
  --p-bg:#f1f9f4; --p-bg1:#f5fdf8; --p-decor:#caeadb; --p-decor-h:#b3deca; --p-text:#1b5840; --p-text-s:#358561; --p-accent:#389f74; --p-accent-h:#37946e; --p-on:#fbfffc;
  --n-bg:#eeeff3; --n-bg1:#fdfdfd; --n-bg2:#ffffff; --n-decor:#dde0ea; --n-decor-h:#cfd2dc; --n-decor-a:#b6bac7; --n-text:#41424e; --n-text-s:#6d707f; --n-text-l:#8b8e9b; --n-text-d:#aaaebd;
  --v-bg:#f9f5ff; --v-decor:#e6dcf3; --v-decor-h:#e1d0f7; --v-text:#59446a; --v-text-s:#8c639b; --v-accent:#aa6cc1; --v-accent-h:#9a66ae; --v-on:#fdfdfd;
  --b-bg:#eef8ff; --b-decor:#d6e2f4; --b-text:#2b537e; --b-accent:#5388d1;
  --r-bg:#fdf1ef; --r-decor:#fdd6cd; --r-text:#7a2d2d; --r-text-s:#ae514c; --r-accent:#cb3f3e;
  --g-bg:#f1fbee; --g-decor:#d2ead0; --g-text:#3d6035; --g-accent:#57b762;
  --y-bg:#fef7e1; --y-decor:#f0dfb1; --y-text:#815f19;
  --o-accent:#fb8e42;
  --page:#f4f5f8; --hero:#3a3b45; --code-bg:#24242e; --code-text:#e6e8ef;
  --sh1:0 0 4px 0 #0000000a,0 2px 4px 0 #0000000a; --sh3:0 0 8px 0 #00000014,0 8px 16px 0 #00000014; --sh5:0 0 16px 0 #00000014,0 24px 16px 0 #00000014;
  --font:"SB Sans Interface","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"SB Sans Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --p-bg:#1b2422; --p-bg1:#1b2924; --p-decor:#184a37; --p-decor-h:#1b5840; --p-text:#e4f3eb; --p-text-s:#84c4a5; --p-accent:#6aaf90; --p-accent-h:#389f74; --p-on:#1b2924;
  --n-bg:#1c1c24; --n-bg1:#242430; --n-bg2:#2a2a36; --n-decor:#393a46; --n-decor-h:#41424e; --n-decor-a:#565866; --n-text:#e6e8ef; --n-text-s:#aaaebd; --n-text-l:#8b8e9b; --n-text-d:#656774;
  --v-bg:#231e2c; --v-decor:#4c3d5f; --v-decor-h:#59446a; --v-text:#f4effd; --v-text-s:#c5a5e4; --v-accent:#b68bd5; --v-accent-h:#aa6cc1; --v-on:#2b2535;
  --b-bg:#1e222b; --b-decor:#25466b; --b-text:#e6f0fd; --b-accent:#749eda;
  --r-bg:#292020; --r-decor:#6a2729; --r-text:#fee8e3; --r-text-s:#ee9285; --r-accent:#e7756a;
  --g-bg:#1e211e; --g-decor:#37502e; --g-text:#e3f6e1; --g-accent:#69b56f;
  --y-bg:#29221c; --y-decor:#71521a; --y-text:#fcf0cc;
  --page:#1c1c24; --hero:#2f303b; --code-bg:#15151c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--n-text);font:13px/18px var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--p-text-s);text-decoration:none}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}

/* ---------- панель прототипа (не часть ЛК) ---------- */
.pbar{position:sticky;top:0;z-index:50;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#15151c;color:#e6e8ef;font-size:12px}
.pbar b{font-weight:600;white-space:nowrap}
.pbar .sep{width:1px;height:20px;background:#393a46}
.pbar select,.pbar button{background:#2a2a36;border:1px solid #393a46;color:#e6e8ef;border-radius:4px;height:28px;padding:0 8px;font-size:12px}
.pbar select{max-width:340px}
.pbar button.on{background:var(--o-accent);border-color:var(--o-accent);color:#2a1a0c}
.pbar .grow{flex:1}
.pbar .hint{color:#8b8e9b;white-space:nowrap}
@media (max-width:900px){.pbar .hint,.pbar .lbl{display:none}}

/* ---------- каркас ЛК ---------- */
.shell{display:flex;min-height:calc(100vh - 44px)}
.lk{flex:1;min-width:0;position:relative}
.notes{width:340px;flex:none;background:var(--n-bg2);border-left:1px solid var(--n-decor);padding:16px 16px 40px;position:sticky;top:44px;height:calc(100vh - 44px);overflow:auto}
body.no-anno .notes,body.no-anno .mk{display:none}
.hdr{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--n-bg2);border-bottom:1px solid var(--n-decor);position:relative;z-index:5}
.hdr .ib{width:28px;height:28px;display:grid;place-items:center;border-radius:4px;border:0;background:transparent;color:var(--n-text-s);position:relative}
.hdr .ib:hover{background:var(--n-bg)}
.logo{width:20px;height:20px;border-radius:5px;background:var(--p-accent);display:grid;place-items:center}
.logo i{width:8px;height:12px;border:2.5px solid #fff;border-right:0;border-radius:6px 0 0 6px;display:block}
.prj{display:flex;align-items:center;gap:18px;padding:0 8px;height:32px;border-radius:4px;border:0;background:transparent;text-align:left}
.prj:hover{background:var(--n-bg)}
.prj small{display:block;color:var(--n-text-l);font-size:10px;line-height:12px}
.prj span{font-size:12px;line-height:14px}
.vsep{width:1px;height:24px;background:var(--n-decor)}
.hdr .plat{font-size:12px;color:var(--n-text-s)}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:4px}
.bal{font-size:12px;color:var(--n-text-s);margin-right:2px}
.bchip{font-size:10px;line-height:14px;padding:1px 5px;border-radius:4px;background:var(--g-bg);color:var(--g-text);border:1px solid var(--g-decor);margin-right:6px}
.dot99{position:absolute;top:0;right:-4px;font-size:8px;line-height:11px;padding:0 3px;border-radius:6px;background:var(--g-accent);color:#fff}
.ava{width:22px;height:22px;border-radius:50%;background:#f3c9c4;color:#7a2d2d;font-size:9px;font-weight:600;display:grid;place-items:center;margin-left:4px}
.agent-pill{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--v-decor);background:var(--v-bg);color:var(--v-text);font-size:12px;margin-right:6px}
.agent-pill:hover{border-color:var(--v-accent)}
.agent-pill .live{width:7px;height:7px;border-radius:50%;background:var(--g-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--g-accent) 25%,transparent)}
.giga-fab{position:fixed;right:22px;bottom:18px;width:40px;height:40px;border-radius:50%;background:conic-gradient(from 200deg,#2fb873,#21a0d2,#2fb873);box-shadow:var(--sh3);display:grid;place-items:center;z-index:20;border:0}
body:not(.no-anno) .giga-fab{right:362px}
.giga-fab i{width:18px;height:18px;border-radius:50%;border:3px solid #fff;border-left-color:transparent;display:block}

.page{max-width:1010px;margin:0 auto;padding:16px 20px 80px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}

.card{background:var(--n-bg2);border-radius:8px;box-shadow:var(--sh1);padding:14px 14px;position:relative}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-height:28px}
.ch h3{margin:0;font-size:14px;line-height:20px;font-weight:600;color:var(--n-text)}
.ch .chev{color:var(--n-text-l)}
.ch .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.muted{color:var(--n-text-s)}
.light{color:var(--n-text-l)}
.small{font-size:11px;line-height:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border-radius:4px;border:1px solid transparent;font-size:12px;font-weight:500;white-space:nowrap;background:transparent}
.btn-p{background:var(--p-accent);color:var(--p-on)}
.btn-p:hover{background:var(--p-accent-h)}
.btn-o{border-color:var(--n-decor);background:var(--n-bg2);color:var(--n-text)}
.btn-o:hover{border-color:var(--n-decor-a)}
.btn-po{border-color:var(--p-decor);color:var(--p-text-s);background:var(--n-bg2)}
.btn-v{background:var(--v-accent);color:var(--v-on)}
.btn-v:hover{background:var(--v-accent-h)}
.btn-vo{border-color:var(--v-decor);color:var(--v-text);background:var(--v-bg)}
.btn-vo:hover{border-color:var(--v-accent)}
.btn-l{height:36px;padding:0 14px;font-size:13px}
.btn-w{width:100%}
.lnk{border:0;background:none;padding:0;color:var(--p-text-s);font-size:12px}
.lnk-v{border:0;background:none;padding:0;color:var(--v-text-s);font-size:12px;font-weight:500}

.badge{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:3px;font-size:10px;line-height:16px;font-weight:500;white-space:nowrap}
.b-v{background:var(--v-decor);color:var(--v-text)}
.b-b{background:var(--b-accent);color:#fff}
.b-g{background:var(--g-bg);color:var(--g-text);border:1px solid var(--g-decor)}
.b-new{background:var(--v-accent);color:var(--v-on)}
.b-pre{background:var(--b-bg);color:var(--b-text);border:1px solid var(--b-decor)}
.b-n{background:var(--n-bg);color:var(--n-text-s)}
.b-r{background:var(--r-bg);color:var(--r-text-s);border:1px solid var(--r-decor)}
.b-y{background:var(--y-bg);color:var(--y-text);border:1px solid var(--y-decor)}

.seg{display:inline-flex;background:var(--n-bg);border-radius:4px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;height:22px;padding:0 10px;border-radius:3px;font-size:11px;color:var(--n-text-s)}
.seg button.on{background:var(--n-bg2);color:var(--n-text);box-shadow:var(--sh1);font-weight:500}
.seg.full{display:flex}
.seg.full button{flex:1;height:auto;min-height:22px;padding:3px 6px;line-height:14px}
.seg.v button.on{color:var(--v-text)}

.inp{display:flex;align-items:center;gap:8px;height:30px;border:1px solid var(--n-decor);border-radius:4px;padding:0 8px;background:var(--n-bg2);color:var(--n-text-l);font-size:12px}
.inp.focus{border-color:var(--p-accent);box-shadow:0 0 0 3px var(--p-bg)}
.kbd{font-size:10px;line-height:14px;padding:0 4px;border:1px solid var(--n-decor);border-radius:3px;color:var(--n-text-l);background:var(--n-bg1)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tile{background:var(--n-bg);border-radius:4px;padding:10px;min-height:62px;font-size:11px;line-height:14px;color:var(--n-text);display:flex;flex-direction:column;gap:8px;border:1px solid transparent;text-align:left}
.tile:hover{border-color:var(--n-decor-h)}
.tile .i{color:var(--n-text-s)}
.tile.v{background:var(--v-bg)}
.tile.v .i{color:var(--v-accent)}
.tile.v:hover{border-color:var(--v-decor-h)}

.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px}
.svc a{display:flex;align-items:center;gap:8px;height:24px;color:var(--n-text);font-size:12px}
.svc a .i{color:var(--n-text-s)}

.hero{background:var(--hero);border-radius:8px 8px 0 0;color:#fff;padding:14px;position:relative;overflow:hidden;min-height:60px}
.hero h2{margin:0 0 3px;font-size:17px;line-height:22px;font-weight:600}
.hero .sub{font-size:10px;letter-spacing:.02em;opacity:.8;text-transform:uppercase}
.hero .grid-deco{position:absolute;inset:0 0 0 auto;width:52%;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:14px 14px;mask-image:linear-gradient(90deg,transparent,#000 40%,#000 70%,transparent)}
.hero .btn{position:absolute;right:12px;top:12px;background:transparent;color:#fff;border-color:#ffffff40}
.qlinks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--n-bg2);padding:6px;border-radius:0 0 8px 8px;box-shadow:var(--sh1)}
.qlinks a{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px;color:var(--n-text);font-size:12px;border-radius:4px}
.qlinks a:hover{background:var(--n-bg)}
.qlinks a .chev{margin-left:auto;color:var(--n-text-l)}

.vmtile{background:var(--n-bg);border-radius:6px;padding:10px;width:150px}
.spark{height:22px;width:100%}
.bucket{background:var(--n-bg);border-radius:6px;padding:8px 10px;width:150px;font-size:11px}

.bars{display:flex;align-items:flex-end;gap:4px;height:96px;padding:8px 8px 0 36px;border:1px solid var(--n-decor);border-radius:6px;position:relative}
.bars i{flex:1;background:#a43ea0;border-radius:2px 2px 0 0;display:block}
.bars i.s{background:#e267b7}

.promo{background:#2f3039;color:#fff;border-radius:8px;padding:12px;font-size:12px;line-height:16px;font-weight:500;min-height:58px;position:relative;overflow:hidden}
.promo:after{content:"";position:absolute;right:-12px;top:-6px;width:70px;height:70px;background:linear-gradient(135deg,#57b762,#c8f05a);transform:rotate(28deg);border-radius:6px;opacity:.9}
.bigsum{font-size:20px;line-height:26px;font-weight:600;color:var(--n-text);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.center{text-align:center}
.okico{width:26px;height:26px;border-radius:50%;background:var(--g-bg);color:var(--g-accent);display:grid;place-items:center;margin:4px auto 8px;border:1px solid var(--g-decor)}

/* аннотации */
.mk{position:absolute;z-index:6;width:20px;height:20px;border-radius:50%;background:var(--o-accent);color:#2a1a0c;font:600 11px/20px var(--font);text-align:center;box-shadow:0 0 0 3px #fb8e4240;cursor:pointer;border:0;padding:0}
.mk.static{position:static;display:inline-block;flex:none}
.notes h4{margin:0 0 2px;font-size:15px;line-height:20px;font-weight:600}
.notes .scr{color:var(--n-text-l);font-size:11px;margin-bottom:14px}
.note{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--n-decor)}
.note.hl{background:#fb8e4214;margin:0 -16px;padding:10px 16px}
.note b{display:block;font-size:13px;line-height:18px;margin-bottom:4px;font-weight:600}
.note p{margin:0 0 6px;color:var(--n-text-s);font-size:12px;line-height:17px}
.note .job{font-size:12px;line-height:17px;color:var(--n-text);background:var(--n-bg);border-radius:4px;padding:6px 8px;margin-bottom:6px}
.note .job em{font-style:normal;color:var(--n-text-l);font-size:10px;text-transform:uppercase;letter-spacing:.04em;display:block}
.note .tag{font-size:10px;color:var(--n-text-l);text-transform:uppercase;letter-spacing:.04em}

/* агентный слой */
.ag-mark{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--v-bg);color:var(--v-accent);border:1px solid var(--v-decor)}
.ag-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.ag{display:flex;align-items:center;gap:8px;height:40px;padding:0 8px;border-radius:6px;border:1px solid var(--n-decor);background:var(--n-bg2);text-align:left;font-size:12px;line-height:14px}
.ag:hover{border-color:var(--v-decor-h)}
.ag.on{border-color:var(--v-accent);box-shadow:0 0 0 3px var(--v-bg)}
.ag .mono-ico{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.ag small{display:block;font-size:10px;color:var(--n-text-l)}
.codebox{background:var(--code-bg);color:var(--code-text);border-radius:6px;padding:10px 12px;font:12px/18px var(--mono);white-space:pre-wrap;word-break:break-word;position:relative}
.codebox.prose{font:12.5px/19px var(--font)}
.codebox .c{color:#8b8e9b}
.codebox .k{color:#b3deca}
.codebox .v{color:#e1d0f7}
.codebox.clip{max-height:92px;overflow:hidden}
.codebox.clip:after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--code-bg));border-radius:0 0 6px 6px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.radio-card{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--n-decor);border-radius:6px;background:var(--n-bg2);text-align:left;width:100%}
.radio-card.on{border-color:var(--v-accent);background:var(--v-bg)}
.radio-card .r{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--n-decor-a);margin-top:2px;flex:none}
.radio-card.on .r{border:4px solid var(--v-accent)}
.radio-card b{display:block;font-size:12px;font-weight:600;line-height:16px}
.radio-card span{font-size:11px;line-height:15px;color:var(--n-text-s)}
.wait{display:flex;gap:10px;align-items:center;padding:10px;border-radius:6px;background:var(--v-bg);border:1px dashed var(--v-decor-h);color:var(--v-text);font-size:12px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--v-decor);border-top-color:var(--v-accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.chat{background:var(--code-bg);border-radius:6px;padding:10px 12px;font:11.5px/17px var(--mono);color:var(--code-text);min-height:118px;white-space:pre-wrap}
.chat .u{color:#e1d0f7}
.chat .a{color:#b3deca}
.chat .t{color:#8b8e9b}
.caret{display:inline-block;width:6px;height:12px;background:#e1d0f7;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.prompt-chip{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--v-decor);background:var(--v-bg);color:var(--v-text);font-size:12px;line-height:16px;text-align:left}
.prompt-chip:hover{border-color:var(--v-accent)}
.prompt-chip .i{color:var(--v-accent)}
.prompt-chip .end{margin-left:auto;color:var(--v-text-s);font-size:11px;white-space:nowrap}

/* мега-меню */
.dim{position:absolute;inset:0;background:#1c1c2466;z-index:8}
.mega{position:absolute;left:0;top:0;bottom:0;z-index:9;display:flex;background:var(--n-bg1);box-shadow:var(--sh5);min-height:100%}
.mega .left{width:180px;padding:8px;border-right:1px solid var(--n-decor);display:flex;flex-direction:column;gap:2px;font-size:12px}
.mega .left a{display:flex;align-items:center;gap:8px;color:var(--n-text);height:26px;padding:0 6px;border-radius:4px}
.mega .left a:hover{background:var(--n-bg)}
.mega .platsel{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--n-decor);border-radius:6px;background:var(--n-bg2);margin-bottom:8px}
.mega .platsel small{display:block;font-size:10px;color:var(--n-text-l);line-height:12px}
.mega .main{width:600px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--n-bg)}
.msec{background:var(--n-bg2);border-radius:6px;padding:10px 12px;position:relative;border:1px solid transparent}
.msec h5{margin:0 0 8px;font-size:12px;font-weight:600}
.msec.hl{border-color:var(--v-decor-h);background:var(--v-bg)}
.mpromo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mpromo div{background:var(--n-bg2);border-radius:6px;padding:8px 10px;font-size:11px;line-height:14px;color:var(--n-text-s);position:relative}
.mpromo b{display:block;color:var(--n-text);font-weight:500;font-size:12px;margin-bottom:2px}

/* формы и таблицы */
.crumbs{font-size:11px;color:var(--n-text-l);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.ptitle{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ptitle h1{margin:0;font-size:20px;line-height:28px;font-weight:600}
.ptitle .end{margin-left:auto;display:flex;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--n-text-s);margin-bottom:4px}
.field input[type=text],.field input[type=number],.field select{width:100%;height:32px;border:1px solid var(--n-decor);border-radius:4px;padding:0 8px;background:var(--n-bg2);color:var(--n-text);font:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--p-accent)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{border:1px solid var(--n-decor);border-radius:6px;padding:8px 10px;background:var(--n-bg2);text-align:left;font-size:12px;line-height:16px}
.opt small{display:block;color:var(--n-text-l);font-size:11px}
.opt.on{border-color:var(--p-accent);background:var(--p-bg1);box-shadow:0 0 0 3px var(--p-bg)}
.chk{display:flex;gap:8px;align-items:center;font-size:12px;border:0;background:none;padding:0}
.chk i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--n-decor-a);display:grid;place-items:center}
.chk.on i{background:var(--p-accent);border-color:var(--p-accent)}
.chk.on i:after{content:"";width:6px;height:3px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.ports{display:flex;gap:6px;flex-wrap:wrap}
.port{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--n-decor);background:var(--n-bg2);font-size:12px}
.port.on{border-color:var(--p-accent);background:var(--p-bg);color:var(--p-text)}
.formcols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
@media (max-width:900px){.formcols{grid-template-columns:1fr}}
.sticky{position:sticky;top:60px}
.sumrow{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--n-text-s)}
.sumrow b{color:var(--n-text);font-weight:500}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--n-decor);margin-top:8px;padding-top:10px}
.total b{font-size:18px;font-weight:600}
.eq{border-top:1px solid var(--n-decor);margin-top:14px;padding-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-weight:500;color:var(--n-text-l);font-size:11px;padding:8px;border-bottom:1px solid var(--n-decor);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--n-decor);vertical-align:middle}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--n-decor);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 0;font-size:13px;color:var(--n-text-s);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tabs button.on{color:var(--n-text);border-color:var(--p-accent);font-weight:500}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;font-size:12px;line-height:17px}
.alert.r{background:var(--r-bg);border:1px solid var(--r-decor);color:var(--r-text)}
.alert.i{background:var(--b-bg);border:1px solid var(--b-decor);color:var(--b-text)}
.alert .end{margin-left:auto;display:flex;gap:6px;flex:none}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:12px}
.kv dt{color:var(--n-text-l)}
.kv dd{margin:0}
.tl{display:flex;flex-direction:column}
.tl div{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--n-decor);font-size:12px;line-height:16px}
.tl time{color:var(--n-text-l);font-size:11px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 10px 8px}
.empty .ill{width:64px;height:64px;border-radius:14px;background:var(--n-bg);display:grid;place-items:center;color:var(--n-text-l);margin-bottom:12px}
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;width:100%;text-align:left}
@media (max-width:760px){.ways,.opts,.tiles,.svc,.qlinks{grid-template-columns:1fr}}
.way{border:1px solid var(--n-decor);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--n-bg2);position:relative}
.way.v{border-color:var(--v-decor-h);background:var(--v-bg)}
.way h4{margin:0;font-size:13px;font-weight:600}
.way p{margin:0;font-size:12px;line-height:16px;color:var(--n-text-s)}
.way .ex{font:12px/17px var(--font);background:var(--n-bg2);border:1px solid var(--v-decor);border-radius:4px;padding:6px 8px;color:var(--v-text)}
.way .ex.n{font:11.5px/16px var(--mono);border-color:var(--n-decor);color:var(--n-text);background:var(--n-bg1)}
.way .btn{margin-top:auto;align-self:flex-start}
.consent{max-width:600px;margin:10px auto 0}
.code-big{font:600 26px/32px var(--mono);letter-spacing:.12em;color:var(--v-text);background:var(--v-bg);border:1px solid var(--v-decor);border-radius:8px;padding:10px 16px;text-align:center}
.mkt-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
@media (max-width:760px){.mkt-hero{grid-template-columns:1fr}}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.pcards{grid-template-columns:1fr}}
.pcard{border:1px solid var(--n-decor);border-radius:8px;padding:12px;background:var(--n-bg2);display:flex;flex-direction:column;gap:8px}
.pcard .top{display:flex;gap:10px;align-items:center}
.pcard .lg{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px}
.pcard p{margin:0;font-size:12px;line-height:16px;color:var(--n-text-s)}
.pcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chipf{height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--n-decor);background:var(--n-bg2);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chipf.on{background:var(--n-text);color:var(--n-bg2);border-color:var(--n-text)}
.chipf.v{border-color:var(--v-decor-h);color:var(--v-text);background:var(--v-bg)}
.chipf.v.on{background:var(--v-accent);color:var(--v-on);border-color:var(--v-accent)}

/* концепция */
.doc{max-width:1060px;margin:0 auto;padding:28px 24px 80px}
.doc h1{font-size:28px;line-height:36px;margin:0 0 6px;font-weight:600;letter-spacing:-.3px}
.doc h2{font-size:18px;line-height:24px;margin:34px 0 12px;font-weight:600}
.doc .lead{font-size:15px;line-height:23px;color:var(--n-text-s);max-width:780px;margin:0}
.thesis{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-top:22px}
@media (max-width:760px){.thesis{grid-template-columns:1fr}}
.th{border-radius:10px;padding:16px;background:var(--n-bg2);box-shadow:var(--sh1)}
.th h3{margin:6px 0 6px;font-size:15px}
.th p{margin:0;font-size:13px;line-height:19px;color:var(--n-text-s)}
.th.v{background:var(--v-bg);box-shadow:none;border:1px solid var(--v-decor)}
.th .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--n-text-l)}
.plus{display:grid;place-items:center;font-size:22px;color:var(--n-text-l)}
.princ{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:860px){.princ{grid-template-columns:1fr}}
.pr{background:var(--n-bg2);border-radius:8px;padding:14px;box-shadow:var(--sh1)}
.pr b{display:block;font-size:13px;margin-bottom:4px}
.pr p{margin:0;font-size:12px;line-height:17px;color:var(--n-text-s)}
.pr .num{font:600 11px var(--mono);color:var(--v-accent)}
.cjm{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--n-bg2);border-radius:8px;box-shadow:var(--sh1);overflow:hidden}
@media (max-width:860px){.cjm{grid-template-columns:1fr}}
.cjm>div{padding:12px;border-right:1px solid var(--n-decor);font-size:12px;line-height:16px}
.cjm>div:last-child{border-right:0}
.cjm b{display:block;font-size:12px;margin-bottom:4px}
.cjm .who{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--v-text-s);margin-bottom:4px}
.cjm span{color:var(--n-text-s)}
.dt{width:100%;border-collapse:collapse;background:var(--n-bg2);border-radius:8px;box-shadow:var(--sh1);overflow:hidden;font-size:12px;line-height:17px}
.dt th{text-align:left;font-weight:500;color:var(--n-text-l);font-size:11px;padding:9px 10px;border-bottom:1px solid var(--n-decor);background:var(--n-bg1)}
.dt td{padding:9px 10px;border-bottom:1px solid var(--n-decor);vertical-align:top}
.dt tr:last-child td{border-bottom:0}
.dt .go{border:0;background:none;color:var(--p-text-s);padding:0;font-size:12px;text-align:left}
.prio{display:inline-block;font:600 10px/16px var(--mono);padding:0 5px;border-radius:3px}
.p0{background:var(--v-accent);color:#fff}.p1{background:var(--v-decor);color:var(--v-text)}.p2{background:var(--n-bg);color:var(--n-text-s)}
.caveat{background:var(--y-bg);border:1px solid var(--y-decor);color:var(--y-text);border-radius:8px;padding:12px 14px;font-size:12px;line-height:18px}
.caveat ul{margin:4px 0 0;padding-left:18px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#2a2a36;color:#fff;padding:9px 14px;border-radius:6px;font-size:12px;box-shadow:var(--sh3);transition:.2s;z-index:60;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--n-bg2);box-shadow:var(--sh5);z-index:9;padding:16px;overflow:auto}
</style>
</head>
<body>
<div class="pbar">
  <b>Прототип · агенты в ЛК Cloud.ru</b>
  <span class="sep"></span>
  <span class="lbl hint">Экран</span>
  <select id="scrSel" aria-label="Экран"></select>
  <button id="prev" aria-label="Предыдущий экран">←</button>
  <button id="next" aria-label="Следующий экран">→</button>
  <span class="grow"></span>
  <span class="hint">демо-данные · каркас по скриншотам ЛК</span>
  <button id="connTgl" title="Показать состояние «агент подключён»">Агент: не подключён</button>
  <button id="annoTgl" class="on">Аннотации</button>
  <button id="themeTgl">Тема</button>
</div>
<div class="shell">
  <div class="lk" id="lk"></div>
  <aside class="notes" id="notes"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- иконки ---------- */
const P={
grid:'<circle cx="5" cy="5" r="1.2"/><circle cx="12" cy="5" r="1.2"/><circle cx="19" cy="5" r="1.2"/><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/><circle cx="5" cy="19" r="1.2"/><circle cx="12" cy="19" r="1.2"/><circle cx="19" cy="19" r="1.2"/>',
chev:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',
wallet:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14h2"/>',
org:'<path d="M4 20V8l8-4 8 4v12"/><path d="M9 20v-5h6v5M8 11h.01M12 11h.01M16 11h.01"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/>',
bell:'<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
gauge:'<path d="M4 16a8 8 0 1 1 16 0"/><path d="m12 16 4-5"/>',
chart:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 15v-3M12 15V9M16 15v-5"/>',
folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
vm:'<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12 4 7.5M12 12l8-4.5M12 12v9"/>',
disk:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M8 8h.01M8 16h.01"/>',
cfg:'<path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="9" r="2"/><circle cx="12" cy="15" r="2"/><circle cx="18" cy="8" r="2"/>',
pg:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
bucket:'<path d="M4 7h16l-2 13H6z"/><ellipse cx="12" cy="7" rx="8" ry="2.5"/>',
k8s:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
apps:'<path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/>',
rag:'<path d="M4 20h16M6 20V10M12 20V4M18 20v-7"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
bot:'<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01M9.5 16h5"/>',
term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>',
check:'<path d="m5 12 5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
shield:'<path d="M12 3 5 6v5c0 4.5 3 8.3 7 10 4-1.7 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>',

alert:'<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>',
store:'<path d="M4 9h16l-1-5H5zM5 9v11h14V9M9 20v-6h6v6"/>',
book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
headset:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/>',
status:'<path d="M5 20a9 9 0 1 1 14 0"/><path d="M12 12v.01"/>',
iam:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3 6"/>',
ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>',
plug:'<path d="M9 3v5M15 3v5M6 8h12v4a6 6 0 0 1-12 0zM12 18v3"/>',
filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
star:'<path d="m12 4 2.5 5 5.5.8-4 3.9.9 5.5L12 16.6 7.1 19.2 8 13.7 4 9.8 9.5 9z"/>',
};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${P[n]||''}</svg>`;

/* ---------- данные ---------- */
const AGENTS=[
 {id:'cursor',name:'Cursor',mono:'Cu',c:'#2b2b33'},
 {id:'claude',name:'Claude Code',mono:'CC',c:'#c96a43'},
 {id:'giga',name:'GigaCode',mono:'GC',c:'#21a038'},
 {id:'codex',name:'Codex CLI',mono:'Cx',c:'#4a4a55'},
 {id:'vscode',name:'VS Code',mono:'VS',c:'#3277c8'},
 {id:'aia',name:'AI Agents',sub:'Cloud.ru',mono:'AI',c:'#aa6cc1'},
 {id:'other',name:'Другой',sub:'MCP-клиент',mono:'···',c:'#787b8a'},
];
const S={screen:0,anno:true,connected:false,agent:'cursor',access:'ro',copied:false,aiMode:'giga',consent:'ask',term:'30',
 vm:{name:'web-1',zone:'ru.AZ-1',image:'Ubuntu 24.04',flavor:'lowcost10-2-4',disk:20,pub:true,ports:['80','443']},eqTab:'prompt',mktCat:'mcp',drawer:false};
const agent=()=>AGENTS.find(a=>a.id===S.agent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function promptText(){
  const a=agent(), ro=S.access==='ro';
  return `Подключи этого агента к моему облаку Cloud.ru.
1. Установи evo CLI и MCP-сервер Cloud.ru по инструкции https://cloud.ru/agents (сверь подпись релиза).
2. Подключи MCP-сервер в ${a.id==='other'?'своём клиенте':a.name}: evo mcp${ro?' --read-only':''}.
3. Запусти вход и покажи мне ссылку и код — я подтвержу доступ в личном кабинете console.cloud.ru.
4. Когда доступ появится, коротко расскажи, что есть в проекте «Shopfront».
Права: ${ro?'только чтение':'чтение и изменения — перед каждым платным или необратимым действием покажи превью и дождись моего «да»'}.
Доступ к облаку запрашивай только через console.cloud.ru.`;
}
function manualText(){
  const ro=S.access==='ro'?' "--read-only"':'';
  const inst='<span class="c"># 1. evo CLI</span>\ncurl -fsSL https://cloud.ru/agents/install.sh | sh\n\n';
  if(S.agent==='claude') return inst+`<span class="c"># 2. MCP в Claude Code</span>\nclaude mcp add evo -- evo mcp${S.access==='ro'?' --read-only':''}\n\n<span class="c"># 3. вход</span>\nevo login`;
  if(S.agent==='aia') return `<span class="c"># AI Agents (Cloud.ru): установка не нужна</span>\nНастройки агента → Инструменты → MCP-сервер Cloud.ru\n<span class="c"># доступ выдаётся тем же экраном подтверждения</span>`;
  const path=S.agent==='cursor'?'~/.cursor/mcp.json':'mcp.json вашего клиента';
  return inst+`<span class="c"># 2. MCP: ${path}</span>\n{ <span class="k">"mcpServers"</span>: { <span class="k">"evo"</span>: {\n    <span class="k">"command"</span>: <span class="v">"evo"</span>, <span class="k">"args"</span>: [<span class="v">"mcp"</span>${ro?`, <span class="v">"--read-only"</span>`:''}] } } }\n\n<span class="c"># 3. вход</span>\nevo login`;
}

/* ---------- общие куски ЛК ---------- */
function header(){
  const a=agent();
  const pill=S.connected
    ? `<button class="agent-pill" data-go="8" title="Подключённые агенты"><span class="live"></span>${esc(a.name)} · ${S.access==='ro'?'чтение':'чтение и изменения'}</button>`
    : `<button class="agent-pill" data-act="openDrawer">${ic('bot',14)}Подключить агента</button>`;
  return `<div class="hdr">
    <button class="ib" data-go="3" title="Все сервисы">${ic('grid')}</button>
    <span class="logo"><i></i></span>
    <button class="prj"><span><span>Shopfront</span><small>Проект</small></span>${ic('down',12)}</button>
    <span class="vsep"></span><span class="plat">Evolution</span>
    <div class="right" style="position:relative">
      <span style="position:relative">${pill}${S.screen===1?'<i class="mk" data-n="1" style="top:-8px;left:-10px">1</i>':''}</span>
      <span class="bal">12 480,00 ₽</span><span class="bchip">5 000 Б</span>
      <button class="ib">${ic('wallet')}</button><button class="ib">${ic('org')}</button><button class="ib">${ic('help')}</button>
      <button class="ib">${ic('bell')}<span class="dot99">12</span></button>
      <span class="ava">АС</span>
    </div></div>`;
}

function vmPrompt(){
  const v=S.vm, f={'lowcost10-2-4':'2 vCPU / 4 ГБ','gen-4-8':'4 vCPU / 8 ГБ','gen-8-16':'8 vCPU / 16 ГБ'}[v.flavor];

  return `Создай в проекте «Shopfront» ВМ «${v.name}» в зоне ${v.zone}: ${v.image}, ${f} (${v.flavor}), диск ${v.disk} ГБ, ${v.pub?'с публичным IP':'без публичного IP'}${ports}. Перед созданием покажи превью с ценой и дождись моего подтверждения.`;

}

/* ---------- маршрутизация ---------- */
const SCREENS=[
 {t:'0 · Концепция',r:concept},
 {t:'1 · Главная: блок AI и шапка',r:()=>{S.aiMode=S.aiMode||'giga';return dashboard();}},
 {t:'2 · Главная: «В моём агенте»',r:()=>dashboard()},
 {t:'3 · Меню сервисов и поиск',r:()=>dashboard()+megaMenu()},
 {t:'4 · ВМ: пустой проект',r:vmEmpty},
 {t:'5 · Создание ВМ: «Повторить без консоли»',r:vmCreate},
 {t:'6 · Карточка ВМ: день 2',r:vmCard},
 {t:'7 · Подтверждение доступа агента',r:consent},
 {t:'8 · IAM → Агенты',r:iamAgents},
 {t:'9 · Маркетплейс: MCP-серверы',r:marketplace},
];
const sel=document.getElementById('scrSel');
SCREENS.forEach((s,i)=>sel.insertAdjacentHTML('beforeend',`<option value="${i}">${s.t}</option>`));

function go(i){
  i=Math.max(0,Math.min(SCREENS.length-1,i));
  if(i===1) S.aiMode='giga';
  if(i===2) S.aiMode='agent';
  if(i===7 && S.screen!==7) S.consent=S.connected?'done':'ask';
  S.screen=i; S.drawer=false; render(); window.scrollTo(0,0);
}
function render(){
  const lk=document.getElementById('lk');
  const scr=SCREENS[S.screen];
  lk.innerHTML=(S.screen===0?'':header())+scr.r()+drawer()+(S.screen===0?'':fab);
  sel.value=S.screen;
  document.getElementById('connTgl').textContent='Агент: '+(S.connected?'подключён':'не подключён');
  document.getElementById('connTgl').classList.toggle('on',S.connected);
  const notes=N[S.screen];
  document.getElementById('notes').innerHTML=S.screen===0
    ? `<h4>Как смотреть</h4><div class="scr">Панель «Почему так» объясняет решения на каждом экране</div>
       <div class="note"><span class="mk static">1</span><div><p>Оранжевые номера на экране — решения. Клик по номеру подсвечивает пояснение здесь.</p></div></div>
       <div class="note"><span class="mk static">⇄</span><div><p>«Агент: не подключён / подключён» в панели сверху переключает весь ЛК между состояниями до и после подключения.</p></div></div>
       <div class="note"><span class="mk static">◐</span><div><p>Кнопка «Аннотации» прячет номера и эту панель — для показа «чистого» интерфейса.</p></div></div>
       <div class="note"><span class="mk static">→</span><div><p>Рекомендуемый маршрут для показа: 1 → 2 → «Скопировать промпт» → 7 → «Разрешить» → 6 → 8 → 5 → 9.</p></div></div>`
    : `<h4>Почему так</h4><div class="scr">${scr.t}</div>`+(notes||[]).map((n,i)=>`<div class="note" id="note${i+1}"><span class="mk static">${i+1}</span><div><b>${n.t}</b>${n.job?`<div class="job"><em>Джоба</em>${n.job}</div>`:''}<p>${n.p}</p></div></div>`).join('');
}
function toast(t){const el=document.getElementById('toast');el.innerHTML=ic('check',14)+t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);}
function copy(t){try{navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{})}catch(e){} }

document.addEventListener('click',e=>{
  const mkEl=e.target.closest('.mk:not(.static)');
  if(mkEl){const n=document.getElementById('note'+mkEl.dataset.n);document.querySelectorAll('.note.hl').forEach(x=>x.classList.remove('hl'));if(n){n.classList.add('hl');n.scrollIntoView({block:'nearest',behavior:'smooth'});}return;}
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);return;}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const v=a.dataset.v;
  switch(a.dataset.act){
   case 'aiMode': S.aiMode=v; if(S.screen===1&&v==='agent'){go(2);return;} if(S.screen===2&&v==='giga'){go(1);return;} break;
   case 'agent': S.agent=v; S.copied=false; break;
   case 'access': S.access=v; break;
   case 'term': S.term=v; break;
   case 'copy': copy(promptText()); S.copied=true; toast('Промпт скопирован — вставьте его агенту'); break;
   case 'manual': {const m=document.getElementById('manual'); if(m) m.style.display=m.style.display==='none'?'block':'none'; return;}
   case 'copyText': copy(a.dataset.t); toast('Промпт скопирован'); return;
   case 'openDrawer': if(S.screen===1||S.screen===2){go(2);return;} S.drawer=true; break;
   case 'closeDrawer': S.drawer=false; break;
   case 'allow': S.consent='done'; S.connected=true; S.copied=false; toast('Доступ выдан · агент подключён'); break;
   case 'eq': S.eqTab=v; break;
   case 'copyEq': copy(document.getElementById('eqBox').textContent); toast('Скопировано'); return;
   case 'vmf': S.vm[a.dataset.k]=v; break;
   case 'vmpub': S.vm.pub=!S.vm.pub; break;
   case 'vmport': S.vm.ports=S.vm.ports.includes(v)?S.vm.ports.filter(p=>p!==v):[...S.vm.ports,v].sort((x,y)=>x-y); break;
  }
  render();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in; if(!k) return;
  S.vm[k]=k==='disk'?Math.max(10,+e.target.value||10):e.target.value;
  const box=document.getElementById('eqBox'); if(box) box.textContent=S.eqTab==='prompt'?vmPrompt():S.eqTab==='cli'?vmCmd():box.textContent;
  const tot=document.querySelector('.total b'); if(tot) tot.textContent=price().toLocaleString('ru-RU')+' ₽';
});
document.addEventListener('change',e=>{ if(e.target.dataset.in) render(); });
document.addEventListener('keydown',e=>{ if(e.target.matches('input,select,textarea')) return; if(e.key==='ArrowRight') go(S.screen+1); if(e.key==='ArrowLeft') go(S.screen-1); });
sel.onchange=()=>go(+sel.value);
document.getElementById('prev').onclick=()=>go(S.screen-1);
document.getElementById('next').onclick=()=>go(S.screen+1);
document.getElementById('connTgl').onclick=()=>{S.connected=!S.connected;S.copied=false;if(S.screen===7)S.consent=S.connected?'done':'ask';render();};
document.getElementById('annoTgl').onclick=e=>{S.anno=!S.anno;document.body.classList.toggle('no-anno',!S.anno);e.target.classList.toggle('on',S.anno);};
document.getElementById('themeTgl').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';};
render();
</script>
